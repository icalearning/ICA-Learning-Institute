ways this feeling of otherness': exploring the lived experiences of visually impaired immigrant women in Canada.</em> Disability &amp; Society, 32 (8): 1121-1141.</p></li>\n<li><p>Khanlou, N., Mustafa, N., Vazquez, L.M., Haque, N., &amp; Yoshida, K. (2015). <em>Stressors and barriers to services for immigrant fathers raising children with developmental disabilities.</em> International Journal of Mental Health and Addiction, 13: 659-674.</p></li>\n<li><p>Khanlou, N., Haque, N., Mustafa, N., Vazquez, L.M., Mantini, A., &amp; Weiss, J. (2017). <em>Access barriers to services by immigrant mothers of children with autism in Canada.</em> International Journal of Mental Health and Addiction, 15 (2): 239-259.</p></li>\n<li><p>Lindsay, S., King, G., Klassen, A.F., Esses, V., &amp; Stachel, M. (2012). <em>Working with immigrant families raising a child with a disability: challenges and recommendations for healthcare and community service providers.</em> Disability &amp; Rehabilitation, 34 (23): 2007-2017.</p></li>\n<li><p>Luce, A. (2018). <em>Asylum seekers and refugees with intellectual disabilities in Europe: The need for increased awareness and inclusion of migrants with intellectual disabilities during the recent migrant crisis.</em> Samuel Centre for Social Connectedness, Oakville: Canada. Retrieved from: <a href=\"https://www.socialconnectedness.org/wp-content/uploads/2019/10/Asylum-Seekers-and-Refugees-with-Intellectual-Disabilities-in-Europe-1-1.pdf\" class=\"uri\">https://www.socialconnectedness.org/wp-content/uploads/2019/10/Asylum-Seekers-and-Refugees-with-Intellectual-Disabilities-in-Europe-1-1.pdf</a></p></li>\n<li><p>Mirza, M. &amp; Heinemann, A.W. (2012). <em>Service needs and service gaps among refugees with disabilities resettled in the United States.</em> Disability and Rehabilitation, 34 (7): 542-552. DOI: 10.3109/09638288.2011.611211</p></li>\n<li><p>Statistics Canada. (2018). <em>Table 13-10-0381-01 Immigrant status and period of immigration for persons with and without disabilities aged 15 years and over, by sex, Canada.</em> Retrieved from: <a href=\"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1310038101\" class=\"uri\">https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1310038101</a></p></li>\n<li><p>United Nations General Assembly (UNGA). (2006). <em>Convention on the Rights of Persons with Disabilities (A/RES/61/106).</em> Retrieved from: <a href=\"https://www.un.org/development/desa/disabilities/convention-on-the-rights-of-persons-with-disabilities.html\" class=\"uri\">https://www.un.org/development/desa/disabilities/convention-on-the-rights-of-persons-with-disabilities.html</a></p></li>\n<li><p>United Nations High Commissioner for Refugees (UNHCR). (2019). <em>Working with Persons with disabilities in forced displacement.</em> Retrieved from: <a href=\"https://www.refworld.org/docid/5ce271164.html\" class=\"uri\">https://www.refworld.org/docid/5ce271164.html</a></p></li>\n<li><p>Women's Commission for Refugee Women and Children. (2008). <em>Disabilities among refugees and conflict-affected populations.</em> Retrieved from: <a href=\"http://reliefweb.int/node/280071\" class=\"uri\">http://reliefweb.int/node/280071</a></p></li>\n</ul>\n\n","words":1409},{"id":"s69","mod":5,"title":"Module Overview and Learning Focus","html":"<p>Settlement and social service providers require a range of skills and knowledge to appropriately and effectively support immigrant and refugee clients. Module 7 reviews the nature of settlement and counselling skills to ensure optimal communication and a collaborative client relationship. It then reviews case-management skills to assess, plan and work toward agreed-upon goals with the client. The module also outlines strategies for providing trauma-informed services. Service providers will learn how to respond to specific client situations, such as how to maintain professional boundaries, when to refer a client to specialized services and how to support a client in crisis.</p>\n<h5 id=\"this-module-has-three-sections\">This module has three sections:</h5>\n<ol type=\"1\">\n<li><p>Settlement counselling and beyond</p></li>\n<li><p>Communication skills</p></li>\n<li><p>Case management</p></li></ol>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to</h5>\n<ul>\n<li><p>Describe active listening, empathy and collaborative relationships.</p></li>\n<li><p>Define professional boundaries, emotional expressiveness and countertransference.</p></li>\n<li><p>Identify key principles in trauma-informed care and counselling.</p></li>\n<li><p>Describe crisis-management skills.</p></li>\n<li><p>Explain how to assess and manage the potential risk of client self-harm.</p></li>\n<li><p>Review best practices in settlement counselling and case management.</p></li>\n</ul>\n","words":172},{"id":"s70","mod":5,"title":"Settlement Counselling: Scope and Purpose","html":"<p>Settlement counselling involves providing a range of services to newly-arrived immigrants and refugees to facilitate their participation in and contribution to life in Canadian society (IRCC, 2017). Settlement services are direct and indirect services, including “specialized interventions or activities designed to achieve the goals of immigrant and refugee settlement through orientation, adaptation and integration” (Tam, 2003, p. 14). Settlement counsellors meet with newcomer clients to provide assessment, case management, support, and information and referrals (OCASI, 2017).</p>\n<p>Newcomer needs vary depending on a vast array of factors suggesting the need for flexible services that can be tailored to the unique needs of individual clients (IRCC, 2017). About 40 per cent of newcomers use at least one settlement service within the first two years of being in Canada. Some groups are more likely to need and use settlement services, such as resettled refugees (72 per cent), while economic immigrants are less likely to use these services (31 per cent) (IRCC, 2017). The most common need identified by clients is to increase their “knowledge of community and government services and life in Canada” (IRCC, 2017, p. 23).</p>\n<h5 id=\"settlement-services-provided-directly-to-clients-generally-fall-within-the-following-six-areas-funded-by-immigration-refugees-and-citizenship-canada\">Settlement services provided directly to clients generally fall within the following six areas funded by Immigration, Refugees and Citizenship Canada :</h5>\n<ul>\n<li><p>Needs Assessments and Referrals</p></li>\n<li><p>Information and Orientation</p></li>\n<li><p>Language Assessments</p></li>\n<li><p>Language Training</p></li>\n<li><p>Employment-Related Services</p></li>\n<li><p>Community Connections.</p></li></ul>\n<p>(IRCC, 2017)</p>\n<h5 id=\"the-ircc-settlement-program-also-funds-the-following-six-support-services-that-facilitate-access-to-settlement-programming-or-that-indirectly-support-the-partnerships-capacity-building-and-sharing-of-best-practices-among-service-providers\">The IRCC Settlement Program also funds the following six support services that facilitate access to settlement programming or that indirectly support the partnerships, capacity-building and sharing of best practices among service providers:</h5>\n<ul>\n<li><p>Care for Newcomer Children</p></li>\n<li><p>Transportation</p></li>\n<li><p>Translation</p></li>\n<li><p>Interpretation</p></li>\n<li><p>Disability Support</p></li>\n<li><p>Crisis Counselling.</p></li></ul>\n<p>(IRCC, 2017)</p>\n","words":267},{"id":"s71","mod":5,"title":"Good Practice in Settlement Services","html":"<h5 id=\"the-value-of-sharing-experiences-of-success-and-innovation-is-recognized-in-the-field-of-settlement-services-and-forms-the-basis-of-best-practice-guidelines-ccr-1998.\">The value of sharing experiences of success and innovation is recognized in the field of settlement services and forms the basis of best practice guidelines <strong>(CCR, 1998)</strong>.</h5>\n<h5 id=\"one-such-guideline-states-that-practices-programs-and-services-should\">One such guideline states that practices, programs and services should:</h5>\n<ul>\n<li><p>Be accessible to their specific target (client) populations as much as possible.</p></li>\n<li><p>Get clients involved in both conception and delivery stages.</p></li>\n<li><p>Build on, and cultivate, collaboration between their stakeholders (service provider and various third parties) during both design and implementation.</p></li>\n<li><p>Be accountable to their funders and target populations as well as to the general public.</p></li>\n<li><p>Have a measurable positive outcome for the newcomer populations targeted.</p></li>\n<li><p>Be transferable to other geographical and jurisdictional contexts, with the necessary adaptation resulting from the particularities of each context.</p></li></ul>\n<p>(Turegun, 2011, 13)</p>\n<p>Settlement agencies can measure the outcomes of their programs and services by examining the degree to which immigrants and refugee clients are settled (Government of Canada, 2023).</p>\n<p><a href=\"https://www.canada.ca/en/immigration-refugees-citizenship/corporate/partners-service-providers/funding/outcome-guidance.html#s10\"><strong>View an outcomes evaluation framework for this purpose</strong></a></p>\n<h2 id=\"examples-of-best-practices-initiatives\">Examples of best practices initiatives</h2>\n<h3 id=\"featured-resource\">Featured resource</h3>\n<p>The Canadian Government maintains an index of best practices in settlement services that covers newcomer orientation, language and skills, labour market access, welcoming communities, and policy and program development. These Canadian as well as international initiatives aim to promote innovative ways to help immigrants integrate into their new communities.</p>\n<p><a href=\"https://www.canada.ca/en/immigration-refugees-citizenship/corporate/partners-service-providers/immigrant-serving-organizations/best-practices.html\"><strong>Best practices in settlement services</strong></a></p>\n<h3 id=\"promising-practices\">Promising practices</h3>\n<p>The Community Airport Newcomers Network (C.A.N.N.) has been facilitating the pre-settlement of immigrants arriving at the Vancouver International Airport since 1992. It offers individualized reception, orientation, information, and referrals for immigrants and offers specialized services as needed for government-assisted and privately sponsored refugees. This one-time service helps newcomers take the first steps in settling in Canada by providing them with information and referrals to other organizations.</p>\n<p><a href=\"https://www.cannyvr.ca/\"><strong>Learn more about C.A.N.N.</strong></a></p>\n<p>The Early Years Refugee Program serves newly-arrived refugee children ages birth to five along with their caregivers in the Lower Mainland area of BC. The program aims to reduce the impact of trauma on the development of children, ease integration and provide parenting information in the Canadian context. The program also helps clients navigate the Canadian systems of health and wellness, and supports children in their preparation for success in school.</p>\n<p><a href=\"https://www.dcrs.ca/our-services/programs-for-children-and-families/first-steps-early-years-refugee-program/\"><strong>Learn more about the Early Years Refugee Program</strong></a></p>\n<p>The Gateway Project is a volunteer program that trains medical students in cross-cultural medicine by engaging them in community action. The program also focuses on improving access to health care for refugees arriving in Newfoundland. Client information from interviews is used anonymously to improve the health outcomes for new Canadians</p>\n<p><a href=\"https://www.cfms.org/news/student-spotlight/the-gateway-program\"><strong>Learn more about the Gateway Project</strong></a></p>\n","words":428},{"id":"s72","mod":5,"title":"Connecting Settlement Counselling with Mental Health Support","html":"<h4 id=\"at-times-addressing-clients-mental-health-needs-and-concerns-requires-exploring-of-other-issues-that-may-be-affecting-their-lives-such-as-the-following\">At times, addressing clients' mental health needs and concerns requires exploring of other issues that may be affecting their lives, such as the following:</h4>\n<h4 id=\"practical-issues\">Practical issues</h4>\n<blockquote>\n<p>Employment, access to income support, housing and referrals to health clinics to address physical health problems are key sources of concern for many newcomers and often require follow-up or support.</p>\n</blockquote>\n<h4 id=\"social-and-cultural-issues\">Social and cultural issues</h4>\n<blockquote>\n<p>Stigma, cultural identity and language barriers often affect the newcomer experience.</p>\n</blockquote>\n<h4 id=\"family-issues\">Family issues</h4>\n<blockquote>\n<p>Family separation, reunification or relationships with partners or children are common stressors for newcomers.</p>\n</blockquote>\n<h5 id=\"an-appropriate-referral-to-specialized-mental-health-resources-is-required-in-the-following-situations\">An appropriate referral to specialized mental health resources is required in the following situations:</h5>\n<ul>\n<li><p>Diagnosis of severe mental illness such as schizophrenia, clinical depression or bipolar disorder.</p></li>\n<li><p>Evidence that a client is at a high risk of suicide.</p></li>\n<li><p>Evidence that a substance use problem or disorder is affecting a client’s behaviour and habits or poses a threat to the service provider.</p></li>\n</ul>\n<p>A study of Canada’s settlement services revealed a high level and growing need for mental health support for newcomers (IRCC, 2017). The study also showed that service provider organizations are often not equipped to deal with the mental health issues that immigrants and refugees may present with (IRCC, 2017). Besides referrals to mental health resources, organizations providing settlement services can also seek partnerships or collaborations across sectors, allowing clients to access both settlement and mental health services where one is informed by the other. Some organizations offer both services.</p>\n<p>Integrated settlement and mental health services allow service providers to more easily coordinate services, while allowing clients to seamlessly access them as needed. <strong>In supporting clients' immediate settlement needs, service providers have the potential to build strong client relationships.</strong> This can lead to the additional benefit of clients being more open to accessing mental health services when the need arises.</p>\n<h5 id=\"timely-access-to-effective-mental-health-care-and-support-is-important-for-recent-newcomers-as-social-risk-factors-or-determinants-as-discussed-in-module-1-shortly-after-migration-can-have-a-significant-effect-on-mental-health.-one-report-for-example-found-that-risk-factors-such-as-family-separation-a-drop-in-socio-economic-status-or-an-unfriendly-reception-by-the-host-society-can-impact-immigrants-mental-health-especially-between-three-to-18-months-after-arrival-social-planning-council-of-peel-2000-.\">Timely access to effective mental health care and support is important for recent newcomers as social risk factors (or determinants, as discussed in Module 1) shortly after migration, can have a significant effect on mental health. One report for example, found that risk factors such as family separation, a drop in socio-economic status, or an unfriendly reception by the host society can impact immigrants' mental health, especially between three to 18 months after arrival <strong>(Social Planning Council of Peel, 2000)</strong> .</h5>\n<h5 id=\"the-following-are-examples-of-agencies-that-provide-both-settlement-and-mental-health-services\">The following are examples of agencies that provide both settlement and mental health services:</h5>\n<p>Vancouver Association for Survivors of Torture (VAST) provides services such as a trauma counselling, and psychosocial education to help refugees in their settlement process. VAST also provides a psychosocial support group for refugees working through their refugee claims. Through a partnership, it also provides an integrated approach to addressing refugee clients’ mental health and settlement needs during their first few months in Canada.</p>\n<p><a href=\"https://www.vastbc.ca/\"><strong>Learn more about VAST</strong></a></p>\n<p>Madison Community Services offers a range of community-based, holistic services through its Recovery during Immigration and Settlement (RISE) program. The program addresses the mental health and settlement challenges of immigrants and refugees who experience substantial stress during their settlement process. RISE provides one-on-one case management, group orientation sessions and peer support to newcomers in Toronto.</p>\n<p><strong>Learn more about RISE</strong></p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"A study of settlement services found that organizations are often not equipped to deal with the mental health issues newcomers present.\"><h4>In general, service provider organizations are equipped to deal with mental health issues that immigrants and refugees may present</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div></div>\n<div class=\"wide\"><h2>Check your understanding</h2><div class=\"mcq\" data-fb=\"Each of these situations calls for referral to specialized mental health services.\"><h4>When is a referral to specialized mental health services appropriate?</h4><button class=\"opt\">Diagnosis of a severe mental illness</button><button class=\"opt\">Evidence that a client is at high risk of suicide</button><button class=\"opt\">Evidence that a substance use problem or disorder is affecting a client's behaviour or poses a threat to a service provider</button><button class=\"opt\" data-ok=\"1\">All of the above</button><div class=\"fb\"></div></div></div><h2 id=\"activity-sarahs-story\">Activity: Sarah's story</h2>\n<p>This activity presents a scenario involving a client. You will choose a series of questions to ask the client based on the scenario. To start the activity, select the right arrow at the bottom right corner of the page. You may proceed by selecting the arrows or using your left and right arrow keys to view the information you may solicit based on the types of questions you ask. The purpose of this activity is to draw your attention to how we ask certain questions and the kinds of assumptions we make based on the responses we receive. It emphasizes the importance of asking specific, relevant questions during intake or the first meeting with the client in order to obtain more thorough information with respect to migration, pre-migration experiences and post-migration realities. In this way, you can provide help and support that is relevant to the client and that effectively meets the client's needs.</p>\n","words":755},{"id":"s73","mod":5,"title":"Communicating Across Languages and Cultures","html":"<h4 id=\"how-settlement-or-social-service-providers-talk-to-clients-is-just-as-important-as-what-they-say.-even-more-important-is-how-they-listen.-active-listening-is-a-foundational-skill-that-allows-service-providers-to-offer-a-safe-space-for-clients-it-is-a-skill-that-takes-practice.\">How settlement or social service providers talk to clients is just as important as what they say. Even more important is how they listen. Active listening is a foundational skill that allows service providers to offer a safe space for clients; it is a skill that takes practice.</h4>\n<h2 id=\"active-listening\">Active listening</h2>\n<p>In conversations, people often think about what to say next rather than fully paying attention to what the other person is saying. Instead of using a break in the conversation to further explore the thoughts of the other person, they may use the break as an excuse to express a point of view. People have a tendency to listen selectively, making assumptions about what the other party is trying to communicate, and sometimes interrupting or finishing their statements (IOM, 2009).</p>\n<h5 id=\"the-following-skills-are-integral-to-active-listening\">The following skills are integral to active listening:</h5>\n<ul>\n<li><p><strong>Attending</strong></p></li>\n<li><p><strong>Following</strong></p></li>\n<li><p><strong>Reflecting</strong></p></li>\n<li><p><strong>Paraphrasing</strong></p></li>\n<li><p><strong>Focusing</strong></p></li>\n</ul>\n<p>(IOM, 2009)</p>\n<h2 id=\"empathy\">Empathy</h2>\n<p>The ability to show empathy is a critical skill for those involved in counselling. Empathy is different from sympathy. Sympathy means agreeing with another person’s position or sharing their perspective, whereas empathy means accepting another person’s position or belief and being genuinely interested in it, even if their perspective or belief is not shared. Empathy is sometimes referred to as “walking in another person’s shoes” or “seeing through another person’s eyes.”</p>\n<p>The first exchange with new clients is important. Service providers could consider opening with a warm greeting and explanation of their role to help start the conversation and demonstrate respect toward clients. Service providers also need to remain aware of body language and the client’s emotional reactions. Remaining calm and poised helps clients remain calm, and inspires confidence in the service provider’s abilities (IOM, 2009). The goal is to understand the client’s point of view and avoid judgmental attitudes in order to more deeply understand their concerns.</p>\n","words":304},{"id":"s74","mod":5,"title":"Building a Strong Working Alliance","html":"<h4 id=\"collaborative-relationships-are-a-vital-part-of-the-development-of-counsellor-client-rapport.-strategies-for-building-a-collaborative-relationship-include\">Collaborative relationships are a vital part of the development of counsellor-client rapport. Strategies for building a collaborative relationship include:</h4>\n<ul>\n<li><p>Working with clients to meet their needs (as identified by the client).</p></li>\n<li><p>Being aware of personal beliefs, attitudes, prejudices and emotions that may affect the relationship.</p></li>\n<li><p>Maintaining clear and consistent professional boundaries (i.e., ensuring that clients know what they can and cannot expect from you).</p></li>\n<li><p>Showing empathy (not pity).</p></li>\n<li><p>Creating a warm and safe environment.</p></li>\n<li><p>Ensuring that interactions are respectful.</p></li>\n<li><p>Offering non-confrontational support.</p></li>\n<li><p>Instilling hope.</p></li>\n<li><p>Maintaining a non-judgmental attitude.</p></li>\n<li><p>Asking for feedback.</p></li></ul>\n<h2 id=\"skills-for-client-interactions\">Skills for client interactions</h2>\n<h4 id=\"in-addition-to-building-collaborative-client-relationships-the-following-counselling-skills-and-strategies-may-be-helpful-for-a-variety-of-client-interactions\">In addition to building collaborative client relationships, the following counselling skills and strategies may be helpful for a variety of client interactions:</h4>\n<h4 id=\"maintain-a-needs-based-focus\">Maintain a needs-based focus</h4>\n<blockquote>\n<p>Focus on the client's problem(s) but remember that they can't all be solved in one session. Be aware of the client's priorities.</p>\n</blockquote>\n<h4 id=\"maintain-confidentiality-and-safety\">Maintain confidentiality and safety</h4>\n<blockquote>\n<p>Talk to the client in a comfortable place and maintain a safe environment. Start by discussing confidentiality. Do not share information about the client with co-workers, family and community members or authorities without the client's permission.</p>\n</blockquote>\n<h4 id=\"respect-clients-self-determination\">Respect clients' self-determination</h4>\n<blockquote>\n<p>Counselling is based on respecting personal freedom and promoting personal determination and choice. Remember that the client's choices and decisions should prevail at all times. (Exceptions to this principle include when a client's actions are putting themselves or someone else at risk of harm.)</p>\n</blockquote>\n<h4 id=\"empower-clients\">Empower clients</h4>\n<blockquote>\n<p>The service provider's goal should be to enable the client to acquire the skills they need to deal with difficult situations. Focus on the client's strengths. Start small and encourage and acknowledge small “victories” to enhance the client's sense of power and control over their life.</p>\n</blockquote>\n<h4 id=\"keep-expectations-realistic\">Keep expectations realistic</h4>\n<blockquote>\n<p>Clients come with a range of complex issues, such as economic, employment, educational, immigration and family difficulties. It is unrealistic for service providers to expect to solve all their problems, and unfair to give the false hope that they can. Service providers and their clients should discuss the expectations they have of each other's roles and of the things that can and cannot be realistically accomplished in their working relationship. Although telling clients that particular things cannot be done may disappoint and frustrate them, the majority of them will appreciate the service provider's honesty, which in turn will help to build strong relationships.</p>\n</blockquote>\n","words":384},{"id":"s75","mod":5,"title":"Essential Case Management Skills","html":"<h4 id=\"working-with-immigrant-and-refugee-clients-on-goals-and-linking-them-to-appropriate-resources-involves-service-providers-being-culturally-competent-to-ensure-they-are-effective-in-working-with-diverse-populations.\">Working with immigrant and refugee clients on goals and linking them to appropriate resources involves service providers being culturally competent to ensure they are effective in working with diverse populations.</h4>\n<p>As will be discussed in the cross-cultural counselling section later in this module, client goals, and the strategies to achieve them, will not apply universally to cultural groups (Sue &amp; Sue, 2008). In addition to culture, many other factors may affect clients' goals and priorities, the level of support they need and the most effective ways to assist them.</p>\n<h2 id=\"functions-of-case-management-for-immigrants-and-refugees\">Functions of case management for immigrants and refugees</h2>\n<h5 id=\"case-management-with-refugee-and-immigrant-clients-involves-a-range-of-functions-including-the-following\">Case management with refugee and immigrant clients involves a range of functions, including the following:</h5>\n<ul>\n<li><p>Identify major client needs and problems, both immediate and long-term. This includes noting whether the client may have any mental health problems and, if needed, referring them for a comprehensive assessment.</p></li>\n<li><p>Identify the client's major strengths and existing resources.</p></li>\n<li><p>Collaborate with the client to develop a plan of action, the goal of which is to generate the information necessary to refer the client to the support or treatment services that are most appropriate.</p></li>\n<li><p>Intervene on behalf of the client as necessary to help get access to the needed resources and support.</p></li>\n\n<li>Connect the client to these services—typically housing, ESL classes, income support, mental and physical health services, employment services, etc.—in the formal and informal support systems. The level of support the client needs and their capabilities and resources will determine the steps involved in each referral.</li>\n\n<li><p>Monitor and evaluate the plan of action, adjusting the goals and/or referrals as necessary, and taking action as required to accommodate the adjusted plan.</p></li>\n<li><p>Assist with common tasks required of Canadian citizens, such as filing an income tax return, school registration, financial literacy (e.g., opening bank accounts, setting up RRSPs, etc).</p></li>\n</ul>\n","words":299},{"id":"s76","mod":5,"title":"Maintaining Professional Boundaries","html":"<h4 id=\"service-providers-need-to-maintain-professional-boundaries-with-clients.-boundaries-refer-to-the-legal-ethical-and-professional-frameworks-that-create-invisible-structures-to-respect-the-rights-of-service-providers-and-clients.\">Service providers need to maintain professional boundaries with clients. Boundaries refer to the legal, ethical and professional frameworks that create invisible structures to respect the rights of service providers and clients.</h4>\n<p>Boundaries set parameters within which services are delivered and can refer to “the line between the self of the client” (and the) “self of the service provider” (College of Psychologists of Ontario, n.d., p.1). Service providers may seek guidance on professional boundaries for their role by consulting trained supervisors or managers, or through the standards set by the organization or professional regulatory body.</p>\n<p>An inherent power imbalance exists in professional relationships as a result of the client's trust that the service provider has the expertise to help with their problems and from the client's disclosure of personal information (College of Psychologists of Ontario, n.d.). As such, service providers have a duty to act in the best interests of their clients, and they are responsible for maintaining boundaries and handling any boundary issues (College of Psychologists of Ontario, n.d.).</p>\n<h5 id=\"to-maintain-professional-boundaries-service-providers-should-be-aware-of-the-following\">To maintain professional boundaries, service providers should be aware of the following:</h5>\n<ul>\n<li><p>Clients' cultural norms and beliefs surrounding showing emotions and sharing personal information.</p></li>\n<li><p>Their feelings and behaviours toward their clients.</p></li>\n<li><p>Self-disclosure to clients.</p></li>\n<li><p>Situations where boundary violations may occur.</p></li></ul>\n<h4 id=\"the-following-concepts-build-on-the-above-principles\">The following concepts build on the above principles:</h4>\n<ul>\n<li><p><strong>Cultural responsiveness</strong></p></li>\n<li><p><strong>Countertransference</strong></p></li>\n<li><p><strong>Self disclosure</strong></p></li>\n<li><p><strong>Blurred professional boundaries</strong></p></li>\n</ul>\n<p>As professional boundaries set the tone of the working relationship, it is important that service providers be aware of the factors and circumstances that may result in crossed boundaries. Efforts should be made to maintain professional boundaries so that the best interests of the client are served.</p>\n","words":272},{"id":"s77","mod":5,"title":"Trauma-Informed Practice","html":"<h4 id=\"although-different-people-respond-to-traumatic-experiences-in-different-ways-most-people-who-have-been-exposed-to-organized-violence-do-not-require-trauma-treatment.-nevertheless-trauma-is-an-experience-that-can-overwhelm-an-individuals-emotional-and-psychological-ability-to-cope.\">Although different people respond to traumatic experiences in different ways, most people who have been exposed to organized violence do not require trauma treatment. Nevertheless, trauma is an experience that can overwhelm an individual's emotional and psychological ability to cope.</h4>\n<p>It often results in lasting mental and physical effects. It is important to acknowledge clients' feelings and the courage it takes to disclose trauma. As trauma counselling falls outside the scope of the settlement and social service provider's role, they should refer clients to appropriate services. This section merely provides a brief introduction to the concept of trauma-informed care and counselling.</p>\n<p>Trauma can be a very sensitive topic; many trauma survivors are reluctant or emotionally unable to share their traumatic experiences (HPRT, 2011). Probing into trauma can cause survivors to feel overwhelmed and can sometimes lead to re-traumatization. Settlement and social service providers are not in a position to address traumatic experiences through counselling and therapy and should not attempt to deliver trauma interventions.</p>\n<p>If trauma becomes an issue in client interactions, the appropriate response is to listen and validate the client's feelings in a way that feels genuine and comfortable. It may be helpful to try to guide the conversation in a way that does not lead the trauma survivor to feel overwhelmed. Service providers should encourage the client to share only what they feel safe sharing at the moment and that they will still feel safe about when they go home and recall the discussion. Sharing too much in the spirit of the moment may become a barrier to the client coming back.</p>\n\n<h4 id=\"it-is-important-to-distinguish-between-trauma-specific-services-and-trauma-informed-services\">It is important to distinguish between trauma-specific services and trauma-informed services:</h4>\n<h5 id=\"trauma-specific-services\">Trauma-specific services</h5>\n<blockquote>\n<p>are designed to address the effect of trauma and facilitate recovery.</p>\n</blockquote>\n<h5 id=\"trauma-informed-services\">Trauma-informed services</h5>\n<blockquote>\n<p>aim to create an environment that acknowledges the effect of trauma and tries to create a sense of safety.</p>\n</blockquote>\n<p>(Blanch, 2008)</p>\n<p>A trauma-informed approach emphasizes the understanding of the whole individual and appreciates the context in which that person is living their life. Rather than asking, “How do I understand this problem or symptom?,” the service provider asks, “How do I understand this person?”</p>\n<p>“In a trauma-informed system, trauma is viewed not as a single, discrete event, but rather as a defining and organizing experience that forms the core of an individual's identity. The far-reaching impact, and the attempts to cope with the aftermath of the traumatic experience, come to define who the survivor is.” (Fallot &amp; Harris, 2001).</p>\n<h2 id=\"key-principles-of-trauma-informed-care\">Key principles of trauma-informed care</h2>\n<h4 id=\"ensuring-trauma-awareness\">Ensuring trauma awareness</h4>\n<blockquote>\n<p>Understand the effect of traumatic pre-migration experiences on newcomer health and well-being, and recognize the contribution of resettlement difficulties to mental health problems.</p>\n</blockquote>\n<h4 id=\"emphasizing-safety\">Emphasizing safety</h4>\n<blockquote>\n<p>Ensure clients’ physical and emotional safety by working to prevent their re-traumatization (e.g., by providing sufficient space for comfort and privacy, preventing exposure to trauma triggers and adhering to the organizational confidentiality policy), and respecting the wishes of clients who do not want to discuss trauma (Gardiner &amp; Walker, 2010).</p>\n</blockquote>\n<h4 id=\"promoting-resilience\">Promoting resilience</h4>\n<blockquote>\n<p>Focus on natural resilience by prioritizing skill building (e.g., learning English), improving understanding of the effects of trauma, encouraging meaningful activities (e.g., work or volunteering), and helping clients connect with community resources (e.g., housing, income support).</p>\n</blockquote>\n<h4 id=\"encouraging-choice\">Encouraging choice</h4>\n<blockquote>\n<p>Involve clients in setting priorities (e.g., referrals to services that assist in documentation for the refugee determination decision, language classes, help in finding housing), and work with clients to develop action plans and evaluate their progress.</p>\n</blockquote>\n<h4 id=\"supporting-collaboration\">Supporting collaboration</h4>\n<blockquote>\n<p>Demonstrate respect; provide information; be explicit about the client’s right to refuse to answer a question, to refuse a recommended program or service, or request an alternative option; and maintain awareness of the inherent power imbalance in the helper-helped relationship and work to flatten the hierarchy (Elliot et al., 2005).</p>\n</blockquote>\n<h4 id=\"demonstrating-cultural-competence\">Demonstrating cultural competence</h4>\n<blockquote>\n<p>Understand that the perception of violence and safety, and people’s responses to trauma, are culturally determined.</p>\n</blockquote>\n<p>(Blanch, 2008; Elliot et al., 2005)</p>\n<div class=\"wide\"><h2>Review questions</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"A trauma-informed environment focuses on physical and emotional safety and does not require anyone to disclose trauma.\"><h4>Creating an environment that acknowledges the effect of trauma and tries to create a sense of physical and emotional safety can be done without requiring a person to disclose their experience of trauma.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Clients should not be required to discuss trauma. Let them share if and when they choose.\"><h4>It is important to not require refugees or immigrants to discuss trauma.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n<h2 id=\"promoting-resilience-1\">Promoting resilience</h2>\n<p>While there are many definitions of resilience, researchers generally agree that resilience refers to “patterns of desirable behaviour in situations where adaptive functioning or development have been significantly threatened by adverse experiences” (Masten et al., 1995, p.283). </p>\n<p>In the past, resilience has been described as an individual attribute, but emerging literature emphasizes the importance of contextual and cultural factors (Simich et al., 2012). This is coined the “social-ecological” definition of resilience, whereby resilience is dependent on the ability of the individual and their environments to interact in ways that optimize outcomes (Ungar, 2013). Thus, resilience is not only the outcome of individual psychological processes, but also involves the “social process that reside in relationships among people, systems and institutions at the level of families, neighborhoods, communities, and organizations, governments and transitional networks” (Kirmayer, 2014, p.vii).</p>\n<p>Preliminary research has identified formal and informal methods for promoting resilience. Informally, personal networks have been identified as the key contributors to successful resettlement and integration. Formally, it is recognized that there is needs to be more service delivery options to promote resilience. Specific to the health services sector, the nature of service delivery is of utmost importance, characterized by ongoing outreach and cultural competence (Simich et al., 2012).</p>\n<p>A social-ecological perspective of resilience emphasizes cultural sensitivity – the importance of culture in understanding resilience. Certain actions that immigrants or refugees display may differ from what North American culture may define as necessary or typical of resilient behaviour. Service providers should recognize that methods for fostering the resilience of an immigrant or refugee client must be congruent with that client's culture and context (Ungar, 2008).</p>\n<p>Resilience represents a shift away from vulnerability and pathology, and instead focuses on the strengths and solutions that migrants bring with them (Simich, 2014).Service providersare encouraged to “move away from diagnosing and treating traumatic wounds and losses to fostering individual and collective adaptation and flourishing” (Kirmayer, 2014, p.vii).</p>\n<h2 id=\"trauma-informed-services-1\">Trauma-informed services</h2>\n<p>Organizations that provide services to newcomers should be aware of trauma-informed services. Service providers should be sensitive to the effects of organized violence and plan programs in a way that recognizes there are many paths to recovery.</p>\n<ul>\n<li><p>When service providers are trauma-informed, they do not automatically assume, for example, that every client seeking services has a biological mental illness or needs psychiatric services.</p></li>\n<li><p>When programs are trauma-informed, clients are not inadvertently re-traumatized by policies or procedures that recreate or resemble previous traumatic events. As such, all clients can benefit from services, whether or not they choose to identify themselves as trauma survivors (Blanch, 2008).</p></li>\n</ul>\n<h3 id=\"featured-resource\">Featured resource</h3>\n<p>The Trauma-Informed Toolkit outlines recommended practices that will help service providers and organizations increase their capacity to deliver trauma-informed services.</p>\n<p><a href=\"https://trauma-informed.ca/\"><strong>Read the Trauma-Informed Toolkit</strong></a></p>\n","words":1207},{"id":"s78","mod":5,"title":"Counselling Across Cultures","html":"<h5 id=\"the-psychotherapy-and-counselling-tradition-on-which-settlement-counselling-is-based-has-its-origins-in-western-euro-american-culture.-as-a-result-it-may-exclude-the-values-and-philosophical-assumptions-of-other-cultures.-it-is-important-to-recognize-therefore-that-counselling-goals-and-techniques-may-not-apply-to-all-groups-sue-sue-2008.-cultural-competence-discussed-in-module-7-is-necessary-to-be-culturally-relevant-and-to-work-with-a-diverse-population.-in-addition-it-may-be-helpful-to-implement-principles-of-cross-cultural-or-multicultural-counselling.\">The psychotherapy and counselling tradition, on which settlement counselling is based, has its origins in Western, Euro-American culture. As a result, it may exclude the values and philosophical assumptions of other cultures. It is important to recognize, therefore, that counselling goals and techniques may not apply to all groups <strong>(Sue &amp; Sue, 2008)</strong>. Cultural competence (discussed in Module 3) is necessary to be culturally relevant and to work with a diverse population. In addition, it may be helpful to implement principles of cross-cultural or multicultural counselling.</h5>\n<h4 id=\"cross-cultural-counselling-is-defined-as-an-approach-that\">Cross-cultural counselling is defined as an approach that:</h4>\n<p>“uses modalities and defines goals consistent with the life experiences and cultural values of clients, utilizes universal and culture-specific helping strategies and roles, recognizes client identities to include individual, group, and universal dimensions, and balances the importance of individualism and collectivism” (Sue &amp; Torino, 2005, p. 6).</p>\n<h4 id=\"elaboration-of-these-principles-includes-the-following-practice-implications\">Elaboration of these principles includes the following practice implications:</h4>\n<ul>\n<li><p>Consistency with clients' life experiences. Cross-cultural counselling involves defining goals and using modalities that are relevant to clients' gender, ethnic, racial, cultural, sexual orientation or other relevant backgrounds.</p></li>\n<li><p>Multiple dimensions of existence. Cross-cultural counselling acknowledges that personal identity is made up of three levels: individual uniqueness, such as individual childhood experiences that shape psychological characteristics; group-level membership such as those based on race, gender, education or culture; and universal-level membership in which individuals are viewed, in some respects, to be like all others. To be effective, the totality of the three dimensions should be recognized as aspects of a client's identity.</p></li>\n<li><p>Universal and culture-specific strategies. Certain groups may be more responsive to culture-specific strategies. For example, members of some ethnocultural groups may be more responsive to directive approaches of support.</p></li>\n<li><p>Individualism and collectivism. Cross-cultural counselling also incorporates a collectivist approach to support by acknowledging people's embeddedness in families, cultures and communities, and also acknowledges individuals as products of their social and cultural contexts.</p></li>\n<li><p>Client systems. Support may include advocacy and other work on the part of service providers when it becomes apparent that client systems need to be the focus of change. This happens when clients encounter prejudice, discrimination and racism, for example, in their communities, neighborhoods, workplaces, or via organizational policies or practices within institutions.</p></li>\n</ul>\n<h2 id=\"competencies-for-cross-cultural-counselling\">Competencies for cross-cultural counselling</h2>\n<h4 id=\"to-effectively-undertake-cross-cultural-counselling-service-providers-should-strive-toward-three-sets-of-competencies\">To effectively undertake cross-cultural counselling service providers should strive toward three sets of competencies:</h4>\n<h4 id=\"awareness-of-ones-own-cultural-values-and-biases\">Awareness of one's own cultural values and biases</h4>\n<blockquote>\n<p>Being aware of attitudes, biases and faulty beliefs about other groups allows service providers to recognize when their culture is contradictory to that of the client's. Without recognition of a potentially biased view of other groups, service providers may be less effective in providing support, which may lead to client dropout.</p>\n</blockquote>\n<h4 id=\"awareness-of-clients-worldview.\">Awareness of client's worldview.</h4>\n<blockquote>\n<p>Having an understanding about other cultural groups' norms, beliefs, attitudes and behaviours can allow service providers to more easily make appropriate decisions about how to support clients and use interventions that take clients' cultures into account. When service providers lack knowledge of other cultural groups, they may use stereotypes, which are often negative, invalid, or based on faulty perceptions, creating a barrier to an effective counselling relationship.</p>\n</blockquote>\n<h4 id=\"using-culturally-appropriate-counselling-skills.\">Using culturally appropriate counselling skills.</h4>\n<blockquote>\n<p>Skills important for working with clients of differing cultural backgrounds  may involve finding ways to communicate with clients using different styles of thinking or information processing, or using external resources such as traditional healers. Cross-cultural counselling involves determining the most effective strategies and interventions for clients of varying cultural backgrounds. Culturally appropriate counselling skills are different from general counselling skills.</p>\n</blockquote>\n<p>(iResearchNet, n.d.):</p>\n<h2 id=\"client-centred-care\">Client-centred care</h2>\n<p>The concept of client-centred care promotes the idea that clients have an active role in the approach to their concerns and emphasizes the quality of the provider–client relationship. It includes aspects such as ensuring clients have autonomy and choice in achieving their goals, and that they are listened to and provided with information to facilitate their decision-making (Law et al, 1995). However, client-centred care has been debated in terms of its definition and implementation in practice (Whalley Hammell, 2013).</p>\n<p>Some conceptions of client-centred practice may be less applicable to clients “whose cultures differ from dominant ’norm'” (Ibid., p. 142). The idea of clients independently making decisions about their lives promotes a Western value of autonomy and individualism rather than one of reciprocity and interdependence, which may be more in line with many cultures (Whalley Hammell, 2013). The expectation that clients will identify and verbalize their needs can also be a biased view of how clients should behave.</p>\n<p>Instead, it may be more useful to use a definition of client-centred care that includes being cross-culturally relevant and that promotes cultural humility on the part of service providers, to respect clients' culturally-based understanding of their lives. Such a definition would also recognize the effect of relative advantages or disadvantages, and the power and privilege clients experience due to social position (Ibid.).</p>\n<p>There are aspects of client-centred care that may be relevant to newcomer clients. In providing services in a culturally sensitive manner, service providers “…should respect and value the client's expert knowledge of him or herself and recognize the importance of understanding the client's life experiences, expectations and goals” (Corring &amp; Cook, 1999, p. 79). Rather than the service providers being viewed as the expert in the professional relationship, a client-centred relationship sees the client as the best source of information.</p>\n","words":883},{"id":"s79","mod":5,"title":"Responding to Crisis Situations","html":"<h4 id=\"in-crisis-management-situations-the-focus-is-on-the-clients-immediate-needs.-in-some-cases-these-needs-may-be-caused-by-mental-health-problems-or-illnesses-such-as-anxiety-depression-or-suicidal-thoughts.\">In crisis management situations, the focus is on the client’s immediate needs. In some cases, these needs may be caused by mental health problems or illnesses such as anxiety, depression or suicidal thoughts.</h4>\n<h4 id=\"other-concerns-that-might-call-for-crisis-management-include\">Other concerns that might call for crisis management include:</h4>\n<ul>\n<li><p>Acute physical and mental health concerns</p></li>\n<li><p>Domestic violence</p></li>\n<li><p>Homelessness</p></li>\n<li><p>Urgent child welfare issues</p></li>\n<li><p>Loss of welfare or other financial support</p></li>\n<li><p>Arrest or other legal problems</p></li>\n<li><p>Bereavement (including not just the loss of people from the client’s life, but other losses such as giving up on dreams and aspirations)</p></li></ul>\n<h4 id=\"crisis-situations-that-require-immediate-attention-include\">Crisis situations that require immediate attention include:</h4>\n<ul>\n<li><p>Homelessness</p></li>\n<li><p>Concerns about suicide</p></li>\n<li><p>Domestic violence</p></li>\n<li><p>Mental health crises</p></li>\n<li><p>Other emergency situations</p></li></ul>\n<p>No matter how frequently crisis situations may or may not occur in settlement and social services work, it is important for service providers to be prepared and know how to respond.</p>\n<p>Settlement and social service providers should not attempt to take the place of a trained counsellor, but should instead refer the client to more appropriate support. In such situations, it is also important to respond in some way to the client's immediate distress by reducing their level of distress. Simply offering the client a glass of water may provide them with some comfort. It may also be helpful for service providers to offer to support the client with a number of relaxation techniques, such as breathing or visualization, if they have appropriate training or tools to use these techniques. The most accessible and most commonly-used technique is grounding, which is a set of strategies used to detach from emotional pain.</p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Settlement and social service providers should not take on the role of a trained mental health counsellor. Refer when needed.\"><h4>As a settlement of social service provider, oneshould not attempt to take on the role of a trained mental health counsellor.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n<h2 id=\"grounding\">Grounding</h2>\n<p>Grounding helps people in an emotional crisis detach from their emotional pain (e.g., anger, sadness, agitation, anxiety, etc.) by focusing outward on the external world rather than inward on the self (Najavits, 2002). The same technique or similar techniques are referred to as “distraction,” “centering,” “safe place” or “healthy detachment.” The rationale behind the technique is to “step out” during times of feeling overwhelmed, to regain control over feelings or to “ground” oneself in the present reality.</p>\n<p>Using or teaching grounding techniques is not a substitute for specialized assessment and support. A benefit of grounding techniques is that they can be used in a variety of places with anyone in distress. They can also be taught to clients as a “take-home” technique.</p>\n<h4 id=\"the-three-main-ways-of-grounding-are\">The three main ways of grounding are:</h4>\n<h4 id=\"mental\">Mental</h4>\n<blockquote>\n<p>Focus on your mind; for example, describe your environment in detail, taking care to avoid judgments; count backwards; play a category game such as naming types of cars, TV shows, etc.; read out loud; describe something other than your environment in detail.</p>\n</blockquote>\n<h4 id=\"physical\">Physical</h4>\n<blockquote>\n<p>Focus on your senses, especially touch and hearing; for example, run cool or warm water over your hands; touch various objects around you; dig your heels into the floor; stretch; walk slowly; focus on your breathing.</p>\n</blockquote>\n<h4 id=\"soothing\">Soothing</h4>\n<blockquote>\n<p>Talk to yourself in a very kind way (e.g., say kind statements); think of your favourite things; picture people or places you care about; think positive thoughts; visualize a safe place where you feel good and describe it in detail.</p>\n</blockquote>\n<p>Clients may gravitate toward a particular type of grounding, so be aware of their preferences. Note that using a grounding technique is advised only if the client grants permission to proceed.</p>\n<h3 id=\"imagine-this-scenario\">Imagine this scenario</h3>\n<p>You’re having a conversation with a client about his recent struggles with job-hunting. As he recounts his difficulties, he shifts to talking about his earlier experiences in his country, where he was persecuted, imprisoned and physically and sexually abused. He becomes visibly distressed and starts breathing heavily and irregularly. His speech becomes inconsistent and his voice grows louder. He jumps out of his chair and starts pacing around the room.</p>\n<h5 id=\"possible-response\">Possible response</h5>\n<p>\"I can see that you’re very upset. I’m concerned about you. I’d like to offer you some techniques that can be helpful in dealing with stress. Would you like to try them out?\"\"</p>\n<p>[The client gives permission.]</p>\n<p>\"Keep your eyes open and look around. Please find and describe 10 red [or any other colour] objects.\"\"</p>\n<h5 id=\"or\">Or</h5>\n<p>\"Describe a place that you find soothing. What is that place? Where is it? Focus on everything about the place—sounds, colours, shapes, objects, textures. Tell me about this place.\"\"</p>\n<p>(Najavits, 2002)</p>\n<h2 id=\"suicide\">Suicide</h2>\n<p>Suicide is often a taboo subject that is rarely talked about in some cultures. It is important to recognize clients who are at risk of suicide. It is also important for service providers to acknowledge their own discomfort regarding suicide and consider how they might overcome those feelings.</p>\n<p>Research shows that immigrants are less likely to take their own life than the Canadian-born population (Malenfant, 2004). In contrast, refugees (and asylum seekers), especially those who are survivors of torture and those who are detained, are at an increased risk of suicidal ideation, suicide attempts, self-harm and suicide as compared to both native-born and immigrant groups (Cohen, 2008; Ferrada-Noli et al., 1998a, 1998b; Hedrick, 2017).</p>\n<p>Other stressors also contribute to an increased risk of suicide. The inability to speak an official language may contribute to difficulties finding a job, which could lead to social isolation and a sense of hopelessness. The fact that many refugees experience high levels of stress and loss following resettlement may be one reason that some refugee groups have higher rates of suicide.</p>\n<h3 id=\"risk-and-protective-factors\">Risk and Protective Factors</h3>\n<h5 id=\"factors-that-increase-the-risk-that-a-person-will-attempt-suicide-include-in-no-particular-order\">Factors that increase the risk that a person will attempt suicide include (in no particular order):</h5>\n<ul>\n<li><p>Physical illness</p></li>\n<li><p>Exhaustion</p></li>\n<li><p>Feelings of hopelessness</p></li>\n<li><p>Mental health problems</p></li>\n<li><p>Inability to speak an official language</p></li>\n<li><p>Lack of social support</p></li>\n<li><p>Substance use</p></li>\n<li><p>History of depression or current depression</p></li>\n<li><p>History of suicide attempts</p></li>\n<li><p>Unresolved grief</p></li></ul>\n<h5 id=\"it-is-important-to-keep-in-mind-that-there-may-also-be-culture-specific-warning-signs-that-someone-is-considering-suicide.-building-protective-factors-can-help-prevent-suicide-refugee-health-technical-assistance-center-2011.\">It is important to keep in mind that there may also be culture-specific warning signs that someone is considering suicide. Building protective factors can help prevent suicide <strong>(Refugee Health Technical Assistance Center, 2011)</strong>.</h5>\n<h5 id=\"when-assessing-risk-protective-factors-need-to-be-considered-as-well-including...\">When assessing risk, protective factors need to be considered as well, including...</h5>\n<ul>\n<li><p>Strong religious beliefs against suicide</p></li>\n<li><p>Support network (e.g., family, community, faith)</p></li>\n<li><p>Sense of purpose (e.g., children, work, important social activities)</p></li>\n<li><p>Absence of a plan for committing suicide</p></li>\n<li><p>No previous history of suicide attempts</p></li></ul>\n<h2 id=\"discussing-suicide\">Discussing suicide</h2>\n<p>Service providers should approach the issue of suicide with clients in a sensitive manner, starting with more general questions and progressing gently toward more specific ones. Use active listening and validate the client’s feelings, showing empathy and support and avoiding any implication of judgment. Offer hope that alternatives are available, but do not offer glib reassurance.</p>\n<p>The service provider’s words and actions can have a significant effect on a person considering self-harm.</p>\n<h5 id=\"do-not-do-the-following\">Do not do the following:</h5>\n<ul>\n<li><p>Debate the person on whether suicide is morally right or wrong, or whether the person’s feelings are good or bad.</p></li>\n<li><p>Lecture the person on the value of life.</p></li>\n<li><p>Act shocked (this will put distance between the service provider and the client).</p></li>\n<li><p>Dare the person to do it.</p></li>\n<li><p>Imply or state that you will keep the person’s actions a secret.</p></li>\n</ul>\n<div class=\"wide\"><h2>Review questions</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Suicide attempts signal serious distress and should always be taken seriously.\"><h4>A person who attempts suicide is only looking for attention</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Asking about suicide does not plant the idea. It can open the door to help.\"><h4>Talking about suicide may give someone the idea to commit it.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Most people who die by suicide showed warning signs that they were thinking of killing themselves.\"><h4>Most people who die by suicide showed warning signs that they were thinking of killing themselves</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n<h2 id=\"clients-in-immediate-risk\">Clients in immediate risk</h2>\n<p>The skills needed to deal effectively with clients in immediate risk are developed through a process of practice and evaluation with support and feedback from appropriate supervision.</p>\n<p>Generally, if service providers have any concerns that a client may commit suicide, it is best to refer them to help. In most communities, this means taking one of the following actions:</p>\n<ul>\n<li><p>Accompanying the client to the nearest emergency department of a hospital.</p></li>\n<li><p>Calling 911.</p></li>\n<li><p>Contacting a mobile crisis team if one exists in the community.</p></li>\n</ul>\n<p>If the client does not co-operate and the service provider has immediate concerns, the local police may be contacted for assistance. Clients who are at an immediate and substantial risk of harming themselves or others may need to be hospitalized, either voluntarily or involuntarily. Admission to a psychiatric facility is mandated under the Mental Health Act if a person is suffering from a mental illness and is deemed to be at an imminent and substantial risk of harming themselves. Involuntary admission was discussed in Module 1.</p>\n<h2 id=\"the-forensic-mental-health-system\">The Forensic Mental Health System</h2>\n<p>This is the point at which the legal and mental health systems interact. When someone with a mental health problem comes in contact with the law as a result of committing a crime, they may be assessed by the mental health system to help determine their understanding and level of responsibility for the crime which they are being accused.</p>\n<h3 id=\"featured-resource-the-forensic-mental-health-system-in-ontario-an-information-guide\">Featured resource: The Forensic Mental Health System in Ontario: An Information Guide</h3>\n<p>This guide provides detailed information about the system in Ontario, the process and how to access help for clients</p>\n<p><a href=\"https://www.camh.ca/-/media/files/guides-and-publications/forensic-guide-en.pdf\"><strong>Read the guide</strong></a></p>\n\n","words":1500},{"id":"s80","mod":5,"title":"Module Recap and Key Takeaways","html":"<p>Module 7 focused on the basic counselling and case-management skills necessary for facilitating daily encounters with immigrant and refugee clients. The module reviewed counselling skills, the principles of trauma-informed care and how to deal with crisis situations and clients in distress. The module also explored basic case-management priorities and requirements.</p>\n<p>With these counselling and case-management skills in place, the next module looks at how newcomers find and use mental health services, and how to work effectively with interpreters.</p>\n","words":105},{"id":"s81","mod":5,"title":"References and Further Reading","html":"<ul>\n<li><p>Blanch, A. (2008). Transcending Violence: Emerging Models for Trauma Healing in Refugee Communities. Alexandria, VA: National Center of Trauma-Informed Care. Available: http://www.theannainstitute.org/RefugeeTraumaPaperJuly212008.pdf. Accessed April 25, 2018.</p></li>\n<li><p>Canadian Council for Refugees (CCR). (1998). Best settlement practices: Settlement services for refugees and immigrants in Canada. Available: http://ccrweb.ca/sites/ccrweb.ca/files/static-files/bpfina1.htm. Accessed May 9, 2018.</p></li>\n<li><p>Cohen, J. (2008). Safe in our hands? A study of suicide and self-harm in asylum seekers. Journal of Forensic and Legal Medicine, 15 (4), 235-244.</p></li>\n<li><p>College of Psychologists of Ontario. (n.d.). Professional boundaries in health-care relationships. Available: http://www.cpo.on.ca/Resources.aspx?m=86. Accessed May 8, 2018.</p></li>\n<li><p>Corring, D., &amp; Cook, J. (1999). Client-centred care means that I am a valued human being. Canadian Journal of Occupational Therapy, 66 (2), 71-82.</p></li>\n<li><p>Elliot, D.E., Bjelajac, P., Fallot, R.D., Markoff, L.S. &amp; Glover Reed, B. (2005). Trauma-informed or trauma-denied: Principles and implementation of trauma-informed services for women. Journal of Community Psychology, 33 (4), 461-477.</p></li>\n<li><p>Ferrada-Noli, M., Ashberg, M., Ormstad, K., Lundin, T., &amp; Sundbom, E. (1998a). Suicidal behavior after severe trauma. Part 1: PTSD diagnosis, psychiatric comorbidity, and assessments of suicidal behavior. Journal of Traumatic Stress, 11 (1), 103-112.</p></li>\n<li><p>Ferrad-Noli, M. Ashberg, M., &amp; Ormstad, K. (1998b). Suicidal behavior after severe trauma. Part 2: The association between methods of torture and of suicidal ideation of posttraumatic stress disorder. The Journal of Traumatic Stress, 11 (1), 113-124.</p></li>\n<li><p>Gajardo, C. (2007) Case Management in Settlement: New Workers.</p></li>\n<li><p>OCASI Professional Development Conference OCASI Professional Development Conference October 18, 2007, Toronto. OCASI, 2007. Available: http://atwork.settlement.org/downloads/atwork/E1_Case_Management_in_Settlement_for_New_Workers.pdf. Accessed April 25, 2018.</p></li>\n<li><p>Gardiner, J. &amp; Walker, K. (2010). Compassionate listening: Managing psychological trauma in refugees. Australian Family Physician, 39 (4), 198–203. Available: http://www.racgp.org.au/afp/201004/201004gardiner.pdf</p></li>\n<li><p>Harris, M. &amp; Fallot, R.D. (2001). Envisioning a Trauma-informed service system: A vital paradigm shift. New Directions in Mental Health Services, 89, 3-22.</p></li>\n<li><p>Harvard Program in Refugee Trauma (HPRT). (2011). Treatment Plan. Available: http://hprt-cambridge.org/?page_id=69. Accessed April 25, 2018.</p></li>\n<li><p>Hedrick, K. (2017). Getting out of (self-) harm’s way: A study of factors associated with self-harm among asylum seekers in Australian immigration detention. Journal of Forensic and Legal Medicine, 49, 89-93.</p></li>\n<li><p>Immigration, Refugees and Citizenship Canada (IRCC). (2017). Evaluation of the settlement program. Available: https://www.canada.ca/content/dam/ircc/documents/pdf/english/evaluation/e2-2016-settlement-en.pdf. Accessed May 18, 2018.</p></li>\n<li><p>International Organization for Migration (IOM). (2009). Introduction to Basic Counselling and Communication Skills: IOM Training Manual For Migrant Community Leaders and Community Workers. Available: http://www.iom.int/jahia/webdav/site/myjahiasite/shared/shared/mainsite/activities/health/pandemic_manual.pdf. Accessed April 25, 2018.</p></li>\n<li><p>iResearchNet. (n.d.). Barriers to cross-cultural counseling [webpage]. Available: http://psychology.iresearchnet.com/counseling-psychology/multicultural-counseling/barriers-to-cross-cultural-counseling/. Accessed May 16, 2018.</p></li>\n<li><p>Kirmayer, L. (2014). Forward. In L. Simich &amp; L. Andermann (Eds), Refuge and resilience: Promoting resilience and mental health among resettled refugees and forced migrants. New York, NY: Springer. Lussier, M. T. &amp; Richard, C. (2007). Self-disclosures during medical encounters. Canadian Family Physician, 53: 421-422.</p></li>\n<li><p>Law, M., Baptiste, S., &amp; Mills, J. (1995). Client-centred practice: What does it mean and does it make a difference? Canadian Journal of Occupational Therapy, 62 (5), 250-257.</p></li>\n<li><p>Malenfant, E. (2004). Suicide in Canada’s immigrant population. Health Reports, 15 (2), 9-17. Available: http://www.statcan.gc.ca/pub/82-003-x/2003002/article/6807-eng.pdf. Accessed April 25, 2018.</p></li>\n<li><p>Masten, A.S., Coatsworth, J.D., Neemann, J., Gest, S.D., Tellegen, A., &amp; Garmezy, N. (1995). The structure and coherence of competence from childhood through adolescence. Child Development, 66, 1635-1659.</p></li>\n<li><p>Najavits, L.M. (2002). Seeking Safety: A Treatment Manual for PTSD and Substance Abuse. New York, N.Y.: Guilford.</p></li>\n<li><p>National VSI Working Group IV on Settlement Standards, Professionalization, and Accountability. (2003). National settlement service and standards framework. Available: http://dev.orgwise.ca/sites/osi.ocasi.org.stage/files/resources/National%20Settlement%20Service%20and%20Standards%20Framework.pdf. Accessed May 9, 2018.</p></li>\n<li><p>Ontario Council of Agencies Serving Immigrants (OCASI). (2017). Settlement worker. Available: https://settlement.org/alternative-jobs/social-worker/settlement-worker/. Accessed May 9, 2018.</p></li>\n<li><p>Refugee Health Technical Assistance Center. (2011). Suicide. John Snow, Inc. (JSI) Available: http://refugeehealthta.org/physical-mental-health/mental-health/suicide/ Accessed July 12, 2018</p></li>\n<li><p>Simich, L. (2014). Editor’s introduction. In L. Simich &amp; L. Andermann (Eds), Refuge and resilience: Promoting resilience and mental health among resettled refugees and forced migrants. New York, NY: Springer.</p></li>\n<li><p>Simich, L.., Roche, B., &amp; Ayton, L. (2012). Defining resiliency, constructing equity. Wellesley Institute. Available: http://www.wellesleyinstitute.com/wp-content/uploads/2012/03/Defining-Resiliency-Constructing-Equity1.pdf Accessed April 25, 2018.</p></li>\n<li><p>Social Planning Council of Peel (2000). Setting the course: A framework for coordinating services for immigrants and refugees in Peel Region. Available: http://www.portraitsofpeel.ca/pdf/TGP/1996/SETTING%20THE%20COURSE%202000.pdf. Accessed May 9, 2018.</p></li>\n<li><p>Srivastava, R. (2006). The Healthcare Professional’s Guide to Clinical Cultural Competence. Toronto, ON: Mosby Canada.</p></li>\n<li><p>Sue, D.W., &amp; Sue, D. (2008). Counseling the culturally diverse: Theory and practice, 5th ed., John Wiley and Sons: New Jersey.</p></li>\n<li><p>Sue, D.W. &amp; Torino, G.C. (2005). Racial-cultural competence: Awareness, knowledge, and skills. In R.T. Carter (Ed.), Handbook of racial-cultural psychology and counseling, Vol. 2 (p.3-18). Hoboken: NJ: Wiley.</p></li>\n<li><p>Tam, M.W. (2003). National Settlement Service and Standards Framework: Discussion paper developed for National Settlement Conference II. Available: http://dev.orgwise.ca/sites/osi.ocasi.org.stage/files/resources/National%20Settlement%20Service%20and%20Standards%20Framework.pdf Accessed July 12, 2018</p></li>\n<li><p>Turegun, A. (2011). Developing criteria for best practices in settlement services: A report. Available: http://www.soics.ca/wp-content/uploads/2014/07/Meyers-Report-on-Best-Practices-Criteria-Final.pdf. Accessed May 9, 2018.</p></li>\n<li><p>Ungar, M. (2013). Resilience, trauma, context, and culture. Trauma, Violence, &amp; Abuse. 14 (3), 255-266.</p></li>\n<li><p>Ungar, M. (2008). Resilience across cultures. The British Journal of Social Work, 38 (2), 218-235.</p></li>\n<li><p>Whalley Hammell, K.R. (2013). Client-centred occupational therapy in Canada: Refocusing on core values. Canadian Journal of Occupational Therapy, 80(3), 141-149.</p></li>\n</ul>\n\n","words":826},{"id":"s99","mod":4,"title":"Module Overview and Learning Focus","html":"<p>Seeking support and interventions for mental health problems and illnesses can be complex. This is especially so for newcomers, who may be unfamiliar with what services exist and how to access them. Various factors can help or hinder whether and how refugees and immigrants seek services. This module identifies these factors and the various ways (“pathways”) clients seek support. The module also considers how services for newcomers can be better facilitated, including a review of cultural considerations and a thorough discussion of language and working with interpreters. This discussion involves the types of interpretation available, and the steps and procedures within different stages of an interpretation session. This section concludes with an exploration of interpretation in a mental health setting.</p>\n<h5 id=\"this-module-has-three-sections\">This module has three sections:</h5>\n<ol type=\"1\">\n<li><p>Pathways to care</p></li>\n<li><p>Facilitating effective service use</p></li>\n<li><p>Working with interpreters</p></li></ol>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to</h5>\n<ul>\n<li><p>Describe service use and how to approach navigating mental health services in Canada.</p></li>\n<li><p>Explain the key pathways to mental health care and recovery for newcomers.</p></li>\n<li><p>Describe how cultural considerations can affect service use by immigrants and refugees.</p></li>\n<li><p>Recognize the effects of language barriers on access to mental health care.</p></li>\n<li><p>Describe the key considerations for working with interpreters in mental health care.</p></li>\n</ul>\n\n","words":215},{"id":"s100","mod":4,"title":"Navigating Mental Health Services in Canada","html":"<p>Accessing appropriate mental health care may not be a simple or straightforward process, especially for immigrants and refugees who may not understand how various services are structured. Sometimes even health and social service providers can have difficulty navigating the system and the pathways of care. As a result, primary care is often used as the entryway to the health care and mental health system. Access to care is further complicated by local or regional differences in service availability and the process through which services are accessed. In some provinces/territories, for example, separate mental health services may not be connected to each other or set up systematically.</p>\n<h5 id=\"the-pathways-for-accessing-mental-health-services-or-getting-referred-include\">The pathways for accessing mental health services or getting referred include:</h5>\n<ul>\n<li><p>Primary care providers (e.g., walk-in clinic, assigned family physician)</p></li>\n<li><p>Community-based care (e.g., mental health and addiction clinics, residential services)</p></li>\n<li><p>Emergency services when in crisis (e.g., emergency departments)</p></li>\n<li><p>Private care (e.g., private psychotherapists)</p></li>\n<li><p>Collaborative provincial programs. For example:</p>\n<ul>\n<li><p>The <a href=\"https://mdabc.net/\">Mood Disorders Association of British Columbia (MDABC)</a> model of care offers a “one-stop shop” for psychiatric assessment and follow-up services for family physicians; this improves efficiency and reduces costs per client visit.</p></li>\n<li><p>The <a href=\"https://www.camh.ca/-/media/education-files/community-resource-sheets/raam-resource-sheet-pdf.pdf\">Rapid Access Addiction Medicine (RAAM)</a> is an integrated care model in Ontario that is led by a psychologist and family physician in consultation with community partners; this eliminates wait times (same-day treatment), reduces alcohol-related emergency department visits and increases client connections to additional community services.</p></li>\n<li><p>The <a href=\"https://novascotia.ca/mental-health-and-wellbeing/\">Queens Family Health Team in Nova Scotia</a> offers co-location of mental health and primary care services; this improves the ability to deal with complex cases and client encounters and provides access to mental health counselling services for clients in a familiar environment.</p></li>\n</ul></li>\n</ul>\n<p>Research on accessing mental health services provides some insight into how many people, and who, are accessing services. For example, in 2018, the number of who reported needing some help for their mental health in the previous year was estimated to be 5.3 million (17.8%), of which 1.2 million (22%) reported that their needs were only partially met and 1.1 million (21%) declared their needs were fully unmet (Statistics Canada, 2018). The need for counselling was the need most likely to be unmet (34%). A similar study found that 19.2% of the respondents cited features of the health care system itself as a barrier to an unmet mental health care need (Sunderland &amp; Findlay, 2013).</p>\n<p>Immigrants and refugees are less likely than the general population to access mental health services (Durbin et al., 2014, 2015; MHCC 2016; Ng &amp; Zhang, 2022). Providers need to be familiar with the different parts and functions of the mental health system in order to provide effective assistance. The resources available for immigrant and refugee populations vary by province or territory and can also change year to year depending on government support. Health care providers therefore need to stay up to date on the current availability of mental health supports.</p>\n<h5 id=\"the-following-resources-can-help-health-care-providers-andor-clients-connect-with-the-services-that-best-meet-their-needs\">The following resources can help health care providers and/or clients connect with the services that best meet their needs:</h5>\n<ul>\n<li><p><a href=\"https://www.ementalhealth.ca/Toronto/Immigrants-and-Newcomers/index.php?m=heading&amp;ID=278\">Navigating Mental Health Services in Toronto. A Guide for Newcomer Communities</a>, developed by the Community Resource Connections of Toronto, is intended both for people dealing with mental health problems and illnesses and for their friends and families. It provides information to help them understand the mental health system.</p></li>\n<li><p>The Alberta Health website <a href=\"https://www.albertahealthservices.ca/amh/amh.aspx\">Addiction and mental health information and services</a> provides links to information and resources on mental health, substances and addiction in Alberta.</p></li>\n<li><p>The British Columbia <a href=\"https://www2.gov.bc.ca/gov/content/health/managing-your-health/mental-health-substance-use\">Mental Health &amp; Substance Use</a> website provides information on mental health services and resources offered across the province, including educational resources, prevention programs, early intervention initiatives and recovery and treatment options.</p></li>\n<li><p>An overview of mental health services in Nova Scotia is available from the <a href=\"https://novascotia.ca/dhw/mental-health/\">Government of Nova Scotia</a> website.</p></li>\n</ul>\n<p>Newcomers who need mental health care often face a number of difficulties accessing care. Even when they do receive care, the quality and type of care might not be what they expect, what they want or appropriate to their needs and understandings (Thomson et al., 2015).</p>\n<p>To improve access to, and the quality of, mental health care, the Mental Health Commission of Canada published a Mental Health Strategy that outlines the key recommendations for improving care for immigrants, refugees and ethno-cultural and racialized groups.</p>\n<h5 id=\"this-canada-wide-initiative-provides-six-strategic-directions\">This Canada-wide initiative provides six strategic directions:</h5>\n<ol type=\"1\">\n<li><p>Promote mental health across the lifespan in homes, schools and workplaces, and prevent mental illness and suicide wherever possible.</p></li>\n<li><p>Foster recovery and well-being for people of all ages living with mental health problems and illnesses, and uphold their rights.</p></li>\n<li><p>Provide access to the right combination of services, treatments and supports, when and where people need them.</p></li>\n<li><p>Reduce disparities in risk factors and access to mental health services, and strengthen the response to the needs of diverse communities and Northerners.</p></li>\n<li><p>Work with Indigenous communities to address their mental health needs, acknowledging their distinct circumstances, rights and cultures.</p></li>\n<li><p>Mobilize leadership, improve knowledge and foster collaboration at all levels.</p>\n<p>(MHCC, 2012)</p></li></ol>\n<p>All health systems need to use the recommendations and best practices from the Mental Health Strategy to ensure collaborative care, reduce fragmentation and reduce isolation for both providers and clients. For optimal results, efforts have to come from beyond the health sector, including education, justice, corrections, social services and finance (MHCC, 2012).</p>\n\n<h2 id=\"pathways-to-care-1\">Pathways to care</h2>\n<p>The paths that people take to find help for physic
