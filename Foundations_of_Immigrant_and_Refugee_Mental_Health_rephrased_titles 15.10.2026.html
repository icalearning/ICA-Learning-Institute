ng early recognition of mental health problems and illnesses, adopting a variety of treatment modalities (e.g., drug treatment, talk therapy, art therapy) and improving the retention of clients in treatment</strong> (Castillo et al, 2019; Wallcraft et al, 2011; Rogers &amp; Robinson, 2004;).</p>\n<p>Establishing strong partnerships can promote mental health wellness and prevent illness among immigrant and refugee groups in Canada. A number of factors need to be considered when deciding whether to contribute expertise to an already-established community partnership or to develop new partnerships.</p>\n<h3 id=\"promising-practice\">Promising practice</h3>\n<p>The social entrepreneurship model at the <a href=\"https://ccvt.org/\">Canadian Centre for Victims of Torture</a> has been serving refugees and victims of torture and war for the past 40 years. It sees itself “as a community which can provide a bridge for an individual to move from isolation to contact with others, a place in which network relationships can develop and in which families can find support in re-establishing themselves. It is also a community which is connected with other communities, both exile communities and the host community\"(Kidd et al., 2014, pp 160-161).</p>\n<p>By providing a safe place for newcomers in the community, “CCVT tries to establish opportunities for clients to establish a common ground with others in which they can experience a common personhood and humanity, and recover and build upon their sense of history and continuity. In this way the traumatic experience is not only approached slowly, but is also set within a larger story of an individual in a family, a network, and a community. The violence and torture are then events within a story, terrible events to be sure, and events which threaten to fracture the story completely, but they are not the whole story or the only story” (Kidd et al., 2014, p 161).</p>\n\n","words":664},{"id":"s116","mod":9,"title":"Building on Community Strengths and Assets","html":"<p>Several community capacity-building approaches are available, each with a number of common domains (Castillo et al, 2019). Developing the community involves changing the way people view the system. In traditional service systems, clients are taught about their problems and how to value services as the answer to those problems (Kretzmann &amp; McKnight, 1996). The individual uses services and often consumes energy and creativity to outwit or bypass the system, rather than creating solutions within the system (Kretzmann &amp; McKnight, 1996). When working with a community, changing the focus to an approach that uses the community's assets acknowledges and recognizes that the community already has strengths.</p>\n<p>An asset-based development approach supports and builds on the work of the community and embraces the strong neighbourhood-rooted traditions of organizing, economic development and planning (Kretzmann &amp; McKnight, 1993, 1996). It involves using resources more effectively, both internally and externally, which is done best when the community is itself fully mobilized and invested in the service (Kretzmann &amp; McKnight, 1993, 1996).</p>\n<h4 id=\"asset-based-community-development-has-three-interrelated-characteristics\">Asset-based community development has three interrelated characteristics:</h4>\n<h4 id=\"asset-based\">Asset-based</h4>\n<blockquote>\n<p>It focuses not on what is absent from a community, but rather on what is present in the community.</p>\n</blockquote>\n<h4 id=\"internally-focused\">Internally focused</h4>\n<blockquote>\n<p>It finds solutions internally by concentrating on building the agenda and the problem-solving capabilities of local parties, and stresses the importance of a local definition, investment, creativity, hope and control.</p>\n</blockquote>\n<h4 id=\"relationship-driven\">Relationship-driven</h4>\n<blockquote>\n<p>It makes an ongoing effort to build and rebuild relationships between all parties—health care providers/settlement sector providers, local residents, local institutions and local associations.</p>\n<p>(Kretzmann &amp; McKnight, 1993, 1996)</p>\n</blockquote>\n<p>Approaching community development with an asset-based approach emphasizes the community's ability to jointly identify problems and activate solutions, which can help protect against negative health outcomes and promote health status (Morgan &amp; Ziglio, 2007).</p>\n<p>Asset-based approaches to mental health add value by identifying the range of protective and health-promoting factors that act together to support health and well-being. They promote the population within the community as co-producers of health rather than simply as consumers of services. As a result, this strengthens the capacity of individuals and communities to realize their potential for contributing to their own health development (Morgan &amp; Ziglio, 2007).</p>\n\n<h2 id=\"asset-based-community-development-in-practice\">Asset-based community development in practice</h2>\n<h5 id=\"this-section-discusses-two-canadian-initiatives-that-build-on-existing-assets-and-are-examples-of-an-asset-based-approach-to-community-development.\">This section discusses two Canadian initiatives that build on existing assets and are examples of an asset-based approach to community development.</h5>\n<h3 id=\"abundant-community-edmonton\">Abundant Community Edmonton</h3>\n<p>The Abundant Community Edmonton project successfully uses an asset-based approach. The project, initiated by Howard Lawrence, uses neighbourhood leaders, neighbourhood connectors and block connectors to better engage neighbours to build relationships, reduce social isolation, share their vision for the neighbourhood and increase safety in the neighbourhood.</p>\n<p>Neighbourhood connectors identify, mobilize, encourage and support block connectors while meeting with other neighbourhood connectors from across the city to share resources, stories and new information. Neighbourhood connectors are responsible for supporting the block connectors, who spend time listening and connecting with people in their neighbourhood. Block connectors talk to their neighbours to discuss ways to make their community great, activities they would like to participate in, and skills or experiences they have that may help others (City of Edmonton, n.d.; Hopes, McKnight &amp; Lawrence, 2015).</p>\n<p>More information about the Abundant Community Edmonton project is available in <a href=\"https://www.youtube.com/watch?time_continue=10&amp;v=yP510mlXNjg\">this video</a> and <a href=\"https://transforming.edmonton.ca/making-strangers-into-neighbours/\">this article</a>.</p>\n<h3 id=\"action-for-neighbourhood-change\">Action for Neighbourhood Change</h3>\n<p><a href=\"https://maytree.com/wp-content/uploads/534ENG.pdf\">Action for Neighbourhood Change (ANC)</a> was a partnership that took place across Canada between 2005 and 2007. It worked to build and strengthen the assets of five communities to address issues such as substance abuse, health, sustainable housing and personal security.</p>\n<p>ANC used locally-driven revitalization strategies in Surrey, Regina, Thunder Bay, Toronto and Halifax. The program had a number of successes and supported individuals by reducing isolation, reconnecting them with others and supporting engagement and future opportunities.</p>\n<p>Working with local residents, not-for-profit agencies, and public and private sector partners, ANC combined local resources in new ways to develop creative, locally-based solutions for sustainable community development and neighbourhood revitalization. While no longer active, the successes are still supporting change and strengthening neighbourhoods today.</p>\n<p>Below are links to videos and a report with background information about and the achievements of the ANC program</p>\n<ul>\n<li><p><a href=\"https://vimeo.com/287671087\">About the ANC in Surrey, BC</a></p></li>\n<li><p><a href=\"https://maytree.com/wp-content/uploads/629ENG.pdf\">About the ANC in Regina, SK</a></p></li>\n<li><p><a href=\"https://vimeo.com/287672495\">About the ANC in Scarborough, ON</a></p></li>\n</ul>\n\n","words":710},{"id":"s117","mod":9,"title":"Working in Partnership Across Sectors","html":"<h2 id=\"establishing-partnerships\">Establishing partnerships</h2>\n<p>Mental health problems and illnesses are complex; as a result, they require complex interventions that cut across sectors to include the broader social, cultural, economic, political and physical environments (Blair, 2021). A number of guidelines outline how best to develop partnerships, what good community engagement looks like, how to effectively engage community partners and what partnerships should involve. Engaging in a partnership with communities is done locally, therefore the process for determining the best method or best guideline to follow should also consider the local context, especially institutional expectations.</p>\n<p>It is important to recognize that community engagement is a process, not a program (Centre for Addiction and Mental Health [CAMH], 2015; National Collaborating Centre for Determinants of Health [NCCDH], 2013). The participation of program developers and community members in assessing, planning, implementing and evaluating solutions affects the community itself (CAMH, 2015; National Institute for Health and Care Excellence [NICE], 2016; Winnipeg Regional Health Authority [WRHA], 2017).</p>\n<h5 id=\"when-establishing-community-partnerships-consider-the-following-key-recommendations-and-resources-to-initiate-the-process\">When establishing community partnerships, consider the following key recommendations and resources to initiate the process:</h5>\n<ul>\n<li><p>Take the time to build relationships, trust, commitment, leadership and capacity.</p></li>\n<li><p>Support and promote sustainable community engagement by encouraging local communities to get involved in all stages of the project.</p></li>\n<li><p>Ensure decision-making groups include community members who reflect the local immigrant or refugee population.</p></li>\n<li><p>Provide local communities and agencies with feedback on the results of the engagement.</p></li>\n<li><p>Develop collaborations and partnerships to meet local needs and priorities.</p></li>\n<li><p>Support the development of alliances between community members to encourage local communities to participate in improving their health.</p></li>\n<li><p>Use local knowledge and experience to identify and recruit people who can be involved in peer and lay roles to represent local needs and priorities.</p></li>\n<li><p>Use a local approach to make community engagement an integral part of health initiatives.</p></li>\n<li><p>Make it as easy as possible for people to get involved.</p></li>\n<li><p>Realize that it may take time—things do not always run smoothly and timelines may need to reflect the realities of the community.</p></li></ul>\n<p>(CAMH, 2015; NICE, 2016; WHRA, 2017)</p>\n<h5 id=\"potential-collaborating-community-partners-should-consider-the-following-questions\">Potential collaborating community partners should consider the following questions:</h5>\n<ul>\n<li><p>Why are we engaging? What are our goals and objectives?</p></li>\n<li><p>Who are we going to engage with and why?</p></li>\n<li><p>What is non-negotiable? (e.g., core mandate, funder requirement)</p></li>\n<li><p>How long will this take?</p></li>\n<li><p>How will we communicate information?</p></li>\n<li><p>What resources do we need and how will we get them? (if required)</p></li>\n<li><p>How will the process end?</p></li>\n<li><p>How will we evaluate the process?</p></li>\n<li><p>How can we ensure that we consistently apply an equity lens?</p></li>\n<li><p>Where are the gaps?</p></li>\n<li><p>Which voices or communities are underrepresented in the engagement and/or in the partnership?</p></li>\n<li><p>How does this shape the process, strategy and outcomes?</p>\n<p>(CAMH, 2015; WRHA, 2017)</p></li></ul>\n<h2 id=\"evaluation-and-outcomes\">Evaluation and outcomes</h2>\n<p>Evaluations should be done with all partners and should be conducted throughout the life of the partnership, even after concluding the partnership. It is important to involve community members in the planning, design and implementation of an evaluation framework (NICE, 2016). Whether the evaluation is simple or complex, it should be proportionate to the engagement, meaning that a simple engagement should not require an elaborate evaluation and vice versa (CAMH, 2015).</p>\n<p>Consider evaluating both the success of the partnership(s) and the success of the program/initiative being undertaken. The evaluation strategy should be based on the needs of the collaborative and use the most appropriate tool (either developed or obtained) for those needs (CAMH, 2015; NICE, 2016). While some useful tools for evaluating partnerships are available, it is important to develop a concept and process that is best suited to the needs of the community partners. Regardless of what is evaluated or how, it is important to share feedback with the community partners and the larger community regarding the successes and problems within the collaborative.</p>\n<p>The following assessment tools can be used to initiate the conversation about an evaluation:</p>\n<p>Partnership Self-assessment tool (Center for the Advancement of Collaborative Strategies in Health, 2002)</p>\n<p>Impact-MPI Assessment Tool (Pehar &amp; Taneja, 2016)</p>\n\n<h2 id=\"considering-faith\">Considering faith</h2>\n<p>Religion and faith are an important part of many immigrants' and refugees' lives. While a quarter of Canadian-born individuals are not affiliated with a religion, among recent immigrants only 19.5% report no affiliation with a religion (Statistics Canada, 2013).</p>\n<p>Although religious affiliation in Canada is declining, immigrants tend to have higher levels of religiosity than the Canadian-born population (Angus Reid Institute, 2018; Clark &amp; Schellenberg, 2006). In addition, religion may be more important for some groups than others. However, there are existing variations based on immigration groups. For example, immigrants from South Asia and South-East Asia are more likely to report being religious than Canadian-born individuals, while fewer immigrants from East Asia and Western Europe report being religious than Canadian-born individuals (Clark &amp; Schellenberg, 2006).</p>\n<p>It may be helpful to consider partnerships that include faith leaders when working with individuals and groups for whom religion is important. Partnering with religious and faith leaders can help establish connections with hard-to-reach immigrant and refugee communities. Places of worship are trusted, easily accessible and often prominent in the lives of immigrant and refugee groups (Chaze et al., 2015; Williams et al., 2014).</p>\n<p>Places of worship can provide protective spaces for people living with mental health problems and illnesses as they are seen as sacred and offer physical, social and spiritual/emotional support (Agyekum &amp; Newbold, 2016; Griffith et al., 2016; Agyekum et al, 2018; Williams et al., 2014).</p>\n<p>While many spiritual leaders are experienced in supporting people through spiritual and life issues, few are trained to recognize and deal with mental health problems and illnesses (Griffith et al., 2016; Lee et al., 2008). Further, mental health may not be seen as a priority among immigrants and refugees. Partnerships with faith leaders and staff may require mental health promotion and psychoeducation, flexibility and accommodation for schedules, and resources on places of worship (2008; Williams et al., 2014) (American Psychiatric Association Foundation, 2018).</p>\n<p>Partnerships between settlement and health care providers and faith leaders increase faith leaders' awareness of the complexity of issues that immigrants and refugees face (Janzen et al., 2016; Stobbe &amp; Janzen, 2014).</p>\n<p>Many religious denominations have budgets and positions within their organizations to encourage responsiveness to immigrants and/or refugees (Janzen et al., 2016; Stobbe &amp; Janzen, 2014). This offers opportunities for proactive partnerships, which can provide settlement, social service and health care providers with access to a potential key pathway for immigrant and refugee mental health care. In addition, these partnerships can support and educate faith leaders and provide better services for immigrants and refugees (Janzen et al., 2016).</p>\n<h2 id=\"engaging-faith-leaders\">Engaging faith leaders</h2>\n\n<p>Conferences provide opportunities for these conversations and partnerships to be formed and discussed among faith leaders, community members and health professionals.</p>\n\n<h2 id=\"partnerships-in-practice\">Partnerships in practice</h2>\n<p>Partnerships are effective, and a number of examples from across the country illustrate collaborative success. The following promising partnerships support the mental health and well-being of immigrants and/or refugees:</p>\n<h3 id=\"service-collaboratives\">Service collaboratives</h3>\n<p>The Provincial Systems Support Program (PSSP) at the Centre for Addiction and Mental Health works with partners from a variety of sectors in communities across Ontario to transform and improve the mental health system. PSSP supports local agencies and governmental departments by focusing on change management and moving communities through the stages of planning, trying, studying and normalizing to make large-scale, sustainable improvements. Through <a href=\"http://improvingsystems.ca/projects\">the service collaboratives</a>, PSSP and local partners have established networks and created real change that improves the lives of people in a number of communities.</p>\n<p>For example, the City of Toronto launched mobile crisis response services to better support the community in responding to mental health crises. These units are being piloted and are available 24/7 with multilingual and multidisciplinary teams (e.g., community health nurses, crisis counsellors, harm reduction workers, peer workers). The <a href=\"https://www.toronto.ca/community-people/public-safety-alerts/community-safety-programs/toronto-community-crisis-service/\">Toronto Community Crisis Service</a> can be reached by calling 211 or 911.</p>\n<h3 id=\"promising-practice\">Promising practice</h3>\n<p>The <a href=\"http://www.peelcollaborative.com/\">Peel Collaborative</a> recognized that young people from racialized and immigrant backgrounds were not reflected in the people who were seeking mental health care in their region. The collaborative decided on a few initiatives to address this issue, including <a href=\"https://kmb.camh.ca/eenet/resources/holistic-crisis-planning-in-peel-region\">Holistic Crisis Planning [anglais]</a>, which uses a strength-based and person-/family-centred personalized crisis planning process that meaningfully engages children, youth and their families. The process is specifically designed for guidance counsellors in the emergency department and at children's mental health agencies. Faith-based leaders from multiple organizations participated in an inaugural breakfast event was held by the Peel Service Collaborative and recommended a family-centered approach that takes into account generational differences. Faith leaders also determined that they require more training in mental health to better equip them with the necessary tools and knowledge when dealing with individuals facing mental health. They also recommended working on a common understandable mental health language to better promote mental health and push against stigmatization.</p>\n<h3 id=\"local-immigration-partnerships-lips\">Local immigration partnerships (LIPs)</h3>\n<p>LIPs are multi-sectoral planning tables that are located regionally or municipally across the country. They are designed to strengthen local capacity to support settlement and integration of immigrants into communities. LIPS are funded by Immigration, Refugees and Citizenship Canada and operate through formal agreements. They provide a number of services to newcomers in their communities, including knowledge and material on access to employment, settlement services and health services. In some instances, LIPs have successfully worked across sectors to conduct research and implement mental health support programs.</p>\n<h3 id=\"promising-practice-1\">Promising practice</h3>\n<p>The <a href=\"http://olip-plio.ca/fr/le-centre-de-sante-pour-nouveaux-arrivants-dottawa-sagrandit-pour-repondre-aux-besoins-en-sante-du-nombre-croissant-de-refugies/\">Ottawa LIP</a> played a key role in the creation of the Ottawa Newcomer Health Centre (ONHC), a community-based health centre that provides culturally relevant health and mental health services to Government Assisted Refugees (GARs). The <a href=\"https://onhc.ca/\">ONHC</a> recently expanded services to Privately Sponsored Refugees (PSRs) and claimants, and is operated under a partnership between Somerset West Community Health Centre and the Catholic Centre for Immigrants.</p>\n\n<h2 id=\"learning-opportunities-and-conferences\">Learning opportunities and conferences</h2>\n<p>Three unique Canadian conferences serve as examples of networking, collaboration and learning opportunities for advocacy, partnerships and mental health promotion. These conferences focus on underserved and marginalized populations, including immigrants and refugees.</p>\n<h3 id=\"canadian-muslim-mental-health-conference\">Canadian Muslim Mental Health Conference</h3>\n<p>This <a href=\"https://multiculturalmentalhealth.ca/canadian-muslim-mental-health-conference/\">national Muslim mental health conference</a> has been organized annually since 2016 by the Department of Psychiatry at the University of Toronto, the Muslim Medical Association of Canada and Naseeha - Muslim Youth Helpline. National and international presenters and experts participate in the conference, along with a range of attendees including physicians, allied health service professionals and religious scholars.</p>\n<h5 id=\"the-conference-has-four-main-objectives\">The conference has four main objectives:</h5>\n<ol type=\"1\">\n<li><p>Bring together and strengthen connections among health care providers, organizations, individuals with lived experience, students, spiritual leaders and researchers working with Muslim mental health issues in Canada.</p></li>\n<li><p>Provide psychoeducation to the general public on mental health topics in the context of spirituality and Islam.</p></li>\n<li><p>Decrease the stigma of mental illness within the Muslim community.</p></li>\n<li><p>Increase access to mental health resources to the Muslim community.</p></li></ol>\n<h3 id=\"diversity-and-equity-in-mental-health-and-addictions-conference\">Diversity and Equity in Mental Health and Addictions Conference</h3>\n<p>Since 2007, this biannual conference has been presented and co-organized by several partners: Hong Fook, University Health Network (Toronto Western Hospital), Loft Community Services, Mount Sinai Hospital, Across Boundaries, Centre for Addiction and Mental Health (CAMH), Canadian Mental Health Association (CMHA) and other collaborating hospitals and community mental health agencies. This exemplary academic-community partnership has brought together a wide range of academics, frontline service providers, managers, policy makers, consumers and other stakeholders. Participants critically reflect, dialogue, and learn about equity, diversity and inclusion issues to improve the mental health and well-being of diverse communities. The conference is accredited through the University of Toronto and has received excellent feedback from participants, drawing about 200 participants for each conference.</p>\n<h3 id=\"pegasus-conference\">Pegasus Conference</h3>\n<p><a href=\"https://pegasusinstitute.ca/pegasus-conference/\">PEGASUS</a> is an acronym built from the first letters of the themes of <strong>PE</strong>eace, <strong>G</strong>lobal Health <strong>A</strong>nd <strong>S</strong>ustainability. This bi-annual conference organized by the Pegasus Institute explores global health issues including climate change, environmental health, Indigenous health, nuclear disarmament, war and others. The goal is to advance awareness and knowledge of global health issues, both locally and abroad, framed through a lens of peace and sustainability. The conference brings together physicians, health care providers, students, health-related organizations and community members to share innovative ideas and concepts on the dynamics of global health and the socio-ecological determinants that affect health worldwide. A key outcome of the conference is the development and refinement of new ideas for advocacy and participation in global change toward peace, health and sustainable solutions. It is expected the conference also fosters a growing commitment toward global health service, as well as an appreciation for diversity, interdisciplinary learning and interprofessionalism within the field.</p>\n<h2 id=\"summary-and-references\">Summary and references</h2>\n\n","words":2123},{"id":"s118","mod":9,"title":"Module Recap and Key Takeaways","html":"<p>By promoting the mental health of immigrants and refugees, Service providers can help prevent mental health illness and promote mental well-being. Service providers should do this for all clients, regardless of whether or not they have mental health problems or illnesses.</p>\n<p>This module explored strategies for promoting mental health, including the use of advocacy and policy and creating supportive environments that tackle stigma. The module outlined the roles of formal and informal social supports in maintaining good mental health. It also examined the relevance of community partnerships to mental health, and how promotion and prevention efforts should consider individuals within the context of their community and social environment.</p>\n<p>Module 10 explores the issue of accessing professional and personal support and reflects on the dynamics of the client relationship from the perspective of the health care provider, including self-awareness and self-care.</p>\n","words":150},{"id":"s119","mod":9,"title":"References and Further Reading","html":"<h4 id=\"section\">9.1 —</h4>\n<ul>\n<li><p>Im, H., &amp; Rodriguez, C. j. (2019). <em>A Multitier Model of Refugee Mental Health and Psychosocial Support in Resettlement: Toward Trauma-Informed and Culture-Informed Systems of Care.</em> Psychological Services.</p></li>\n<li><p>UNHCR. (n.d). <em>Promoting welcoming and inclusive societies.</em> Retrieved from <a href=\"https://www.unhcr.org/handbooks/ih/welcoming-inclusive-societies/promoting-welcoming-and-inclusive-societies\" class=\"uri\">https://www.unhcr.org/handbooks/ih/welcoming-inclusive-societies/promoting-welcoming-and-inclusive-societies</a></p></li>\n</ul>\n<h4 id=\"section-1\">9.2 —</h4>\n<ul>\n<li><p>Agyekum et al. (2018). <em>Religion/spirituality, therapeutic landscape and immigrant mental well-being amongst African immigrants to Canada.</em> Mental Health, Religion &amp; Culture.</p></li>\n<li><p>American Psychiatric Association Foundation. (2018). <em>Mental Health: A Guide for Faith Leaders.</em> Arlington, VA: American Psychiatric Association Foundation.</p></li>\n<li><p>Angus Reid Institute. (2018). <em>Faith and Immigration: New Canadians rely on religious communities for material, spiritual support.</em> Retrieved from <a href=\"http://angusreid.org/wp-content/uploads/2018/07/2018.06.22_CardusWave1_2018.pdf\" class=\"uri\">http://angusreid.org/wp-content/uploads/2018/07/2018.06.22_CardusWave1_2018.pdf</a></p></li>\n<li><p>Bharmal, et al. (2015). <em>Understanding the upstream social determinants of health.</em> RAND, 1-18.</p></li>\n<li><p>Blair. (2021). <em>Community partnerships key to improving access to mental health care.</em> Retrieved from <a href=\"https://www.aha.org/news/blog/2021-02-05-community-partnerships-key-improving-access-mental-health-care\" class=\"uri\">https://www.aha.org/news/blog/2021-02-05-community-partnerships-key-improving-access-mental-health-care</a></p></li>\n<li><p>Castillo et al. (2019). <em>Community Interventions to Promote Mental Health and Social Equity.</em> Current Psychiatry Report, 21 (5) - 35.</p></li>\n<li><p>Centers for Disease Control and Prevention. (2022, January 18). <em>The Social-Ecological Model: A Framework for Prevention.</em> Retrieved from Centers for Disease Control and Prevention:</p></li>\n<li><p>Wallcraft et al. (2011). <em>Partnerships for better mental health worldwide: WPA recommendations on best practices in working with service users and family carers.</em> World psychiatry, 10(3), 229.</p></li>\n</ul>\n<h4 id=\"section-2\">9.3</h4>\n<ul>\n<li><p>CMHA BC and Anxiety Canada. (2016). <em>Wellness Module 3: Social Support.</em> Retrieved from HeretoHelp: <a href=\"https://www.heretohelp.bc.ca/sites/default/files/social-support.pdf\" class=\"uri\">https://www.heretohelp.bc.ca/sites/default/files/social-support.pdf</a></p></li>\n<li><p>Harandi et al. (2017). <em>The correlation of social support with mental health: A meta-analysis.</em> Electron Physician.</p></li>\n<li><p>Hynie. (2017). <em>The Social Determinants of Refugee Mental Health in the Post-Migration Context: A Critical Review.</em> The Canadian Journal of Psychiatry .</p></li>\n<li><p>Salami. (2017). <em>Mental Health of Immigrants and Non-Immigrants in Canada: Evidence from the Canadian Health Measures Survey and Service Provider Interviews in Alberta.</em> Mental Health of Immigrants.</p></li>\n<li><p>Villalonga-Olives, E., &amp; Kawachi, I. (2015). <em>The measurement of social capital.</em> Gaceta sanitaria, 29(1), 62-64.</p></li>\n</ul>\n<h2 id=\"introduction\">Introduction</h2>\n\n","words":299},{"id":"s120","mod":10,"title":"Module Overview and Learning Focus","html":"<p>Settlement and social service providers' work can be emotionally demanding and highly stressful. To be effective, service providers must consider how this work affects their mental health and well-being. Module 10 focuses on these effects.</p>\n<p>This module discusses ways to improve the quality of care and the mental health outcomes of service users from racialized and marginalized populations, and mitigate negative effects on service providers' well-being. It also examines how service providers can experience exhaustion or trauma, and how these can lead to burnout. It explores how boundary issues can occur when service providers face possible conflicts of interest, which can also negatively affect their well-being. The module outlines self-awareness and self-care strategies that can help service providers prevent and manage burnout, compassion fatigue and secondary trauma.</p>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to</h5>\n<ul>\n<li><p>Describe the importance of self-care when working with immigrants and refugees.</p></li>\n<li><p>Define compassion fatigue, burnout and secondary trauma, as well as their common risk factors, signs and symptoms.</p></li>\n<li><p>Explain the importance of boundary issues in working with immigrants and refugees.</p></li>\n<li><p>Describe self-awareness and self-care strategies as they relate to working with immigrants and refugees.</p></li>\n<li><p>Describe the importance of continuing education, lifelong learning and collegial support in working with immigrants and refugees.</p></li>\n</ul>\n\n","words":214},{"id":"s121","mod":10,"title":"Why Practitioner Self-Care and Well-Being Matter","html":"<p>Service providers should be aware of the conditions that may affect their mental health and well-being, and how to avoid these conditions and/or mitigate their effects. This module provides an overview of compassion fatigue, secondary trauma and burnout, describing their impact and risk factors or warning signs. It then concludes with a discussion about how boundary issues relate to self-care and strategies to help service providers manage their mental health and well-being.</p>\n<h3 id=\"pandemic-related-mental-health-resources-for-health-care-workers\">Pandemic-related mental health resources for health care workers</h3>\n<p>The COVID-19 pandemic has increased the feelings of stress and anxiety for health care workers and service providers. As a result, it is important to recognize the impact of these kinds of events and stressors on your well-being, and to learn how to develop coping strategies and skills that will help you stay healthy.</p>\n<p>In collaboration with other hospitals, CAMH provides access to <a href=\"https://www.camh.ca/en/health-info/mental-health-and-covid-19/information-for-professionals\">mental health and addiction supports</a> for health care workers impacted by the COVID-19 pandemic. This includes access to resources, psychotherapy and psychiatric services.</p>\n\n","words":171},{"id":"s122","mod":10,"title":"Understanding Compassion Fatigue","html":"<p>Compassion fatigue refers to profound emotional and physical exhaustion that can affect helping professionals over time; it has been described as an occupational hazard specific to clinical work-related severe emotional distress (Figley, 1995; 2002). Compassion fatigue is defined as the reduced capacity to be empathetic or bear the suffering of clients (Cetrano et al., 2017). It is characterized by physical, emotional, cognitive, spiritual and symptoms of mental health problems and illnesses. It is related to work stress and regular exposure to the trauma and suffering of the people settlement and social service providers work with.</p>\n<h3 id=\"imagine-this-scenario\">Imagine this scenario</h3>\n<p>Philippe had always been an energetic and dedicated counsellor. Now, at age 38, he's tired, cynical and lonely. He's angry at the organization for forcing him to see more clients in less time, and annoyed with his clients for what he perceives to be their increasingly demanding natures. Although his relationships with his clients once thrived, they no longer seem to give him the same satisfaction. Even talking to his wife, who has always been a supportive partner, has not relieved his feelings of intense isolation (Pifferling &amp; Gilley, 2000).</p>\n<p>Settlement and social service providers may experience physical, emotional and mental exhaustion from working in emotionally demanding and highly stressful situations. In addition, their commitment to clients may come with high personal expectations for their own performance (Este, 2010). The same empathy that allows workers to experience deep satisfaction in their work may lead them to be more vulnerable to compassion fatigue. Compassion fatigue and compassion satisfaction seem to be negatively correlated: higher levels of compassion fatigue may overwhelm the provider's sense of efficacy and prevent them from experiencing compassion satisfaction (Cetrano et al., 2017).</p>\n<h2 id=\"warning-signs\">Warning signs</h2>\n<h5 id=\"the-following-may-be-warning-signs-of-compassion-fatigue\">The following may be warning signs of compassion fatigue:</h5>\n<ul>\n<li><p>Frequent headaches</p></li>\n<li><p>Sleep problems</p></li>\n<li><p>Problems concentrating</p></li>\n<li><p>Stomache aches</p></li>\n<li><p>Irritability, anger, sadness and increased anxiety</p></li>\n<li><p>Chronic lateness</p></li>\n<li><p>Physical or emotional exhaustion</p></li>\n<li><p>Depression</p></li>\n<li><p>Inability to maintain balance of empathy and objectivity</p></li>\n<li><p>Diminished sense of personal accomplishment</p></li>\n<li><p>Abuse of alcohol or other substances</p></li>\n<li><p>Withdrawal and self-isolation</p></li></ul>\n<p>(Canadian Medical Association, 2020)</p>\n<h2 id=\"compassion-fatigue-versus-burnout\">Compassion fatigue versus burnout</h2>\n<p>Compassion fatigue is related to, but distinct from, burnout (Cetrano et al. 2017; Sprang et al., 2007). While providers with burnout become less empathetic and more withdrawn, those with compassion fatigue continue to give themselves fully to their clients, finding it difficult to maintain a healthy balance of empathy and objectivity.</p>\n<h3 id=\"compassion-fatigue\">Compassion fatigue</h3>\n<ul>\n<li><p>Related to service providers' interaction with clients' traumatic material.</p></li>\n<li><p>Faster onset—occurring with little warning—and faster recovery rate.</p></li>\n<li><p>Characterized by physical, emotional, cognitive, spiritual and symptoms of mental health problems and illnesses.</p></li>\n</ul>\n<h3 id=\"burnout\">Burnout</h3>\n<ul>\n<li><p>Related to work environment.</p></li>\n<li><p>Gradual process that gets progressively worse.</p></li>\n<li><p>Characterized by physical, emotional and mental exhaustion.</p></li>\n</ul>\n\n","words":452},{"id":"s123","mod":10,"title":"Understanding Vicarious (Secondary) Trauma","html":"<p>You can think of secondary trauma or vicarious trauma as the negative changes that happen to humanitarian workers over time as they witness other people's suffering and need (Pearlman &amp; McKay, 2008). It refers to the range of negative effects associated with cumulative exposure to clients' experiences of trauma.</p>\n<p>This type of trauma can affect a wide range of professionals. It is a process that unfolds over time and is the cumulative effect of contact with survivors of violence or disaster, or people who are struggling (Ibid.; Saakvitne &amp; Pearlman, 1996). Secondary trauma can be an occupational hazard for providers who are repeatedly exposed to clients' experiences of trauma.</p>\n<h5 id=\"when-providers-experience-secondary-trauma-it-can-change-their-assumptions-and-beliefs-about-themselves-and-the-world-in-a-number-of-ways.\">When providers experience secondary trauma, it can change their assumptions and beliefs about themselves and the world in a number of ways.</h5>\n<h5 id=\"frame-of-reference\">Frame of reference</h5>\n<p>Identifying too closely with clients' situations of helplessness, horror, sadness and cruelty disrupts providers' frame of reference, comfort zone and basic beliefs that people are good and the world is safe.</p>\n<h5 id=\"safety\">Safety</h5>\n<blockquote>\n<p>Service providers feel a loss of safety due to so much knowledge about how others take advantage of vulnerable people.</p>\n</blockquote>\n<h5 id=\"trust-and-dependency\">Trust and dependency</h5>\n<blockquote>\n<p>Service providers become aware of violations of trust and the way clients can become dependent on abusive people.</p>\n</blockquote>\n<h5 id=\"power\">Power</h5>\n<blockquote>\n<p>Service providers may identify with clients' feelings of helplessness and powerlessness, taking on those feelings—to the disadvantage of clients.</p>\n</blockquote>\n<h5 id=\"independence\">Independence</h5>\n<blockquote>\n<p>Service providers may feel their own freedom of movement is restricted by awareness or fear.</p>\n</blockquote>\n<h5 id=\"esteem\">Esteem</h5>\n<blockquote>\n<p>Service providers can develop the perception that people are “bad” because of exposure to the malicious and cruel behaviour of others.</p>\n</blockquote>\n<h5 id=\"intimacy\">Intimacy</h5>\n<blockquote>\n<p>Service providers can feel increasingly alienated and estranged from those who don't do the same kind of work.</p>\n</blockquote>\n<p>(Figley, 2002; Sprang et al. 2007)</p>\n<p>As seen earlier, the more aware providers are of the details of their clients' traumatic experiences, the greater their chances of developing secondary trauma.</p>\n<h2 id=\"risk-factors\">Risk factors</h2>\n<p>Why do some people who work with trauma survivors experience secondary trauma, while others do not? The risk factors for experiencing this type of trauma can be grouped into three categories—personal, work-related and other psychosocial factors—as outlined below.</p>\n<p> Each category is described below. </p>\n<ul>\n<li><p><strong>Personal</strong></p></li>\n<li><p><strong>Work-related</strong></p></li>\n<li><p><strong>Other</strong></p></li>\n</ul>\n<p>(Hensel et al, 2015; McCann &amp; Pearlman, 1990)</p>\n<h2 id=\"signs-and-symptoms\">Signs and symptoms</h2>\n<p>How do providers know if they or someone they know are experiencing secondary trauma? The signs and symptoms derive from a number of different domains, some of which may overlap.</p>\n<h5 id=\"the-most-important-ones-include-the-following\">The most important ones include the following:</h5>\n<ul>\n<li><p>Denial of clients' trauma</p></li>\n<li><p>Over-identification with clients</p></li>\n<li><p>No time and energy for oneself</p></li>\n<li><p>Feelings of great vulnerability</p></li>\n<li><p>Feelings of alienation</p></li>\n<li><p>Social withdrawal</p></li>\n<li><p>Disconnection from loved ones</p></li>\n<li><p>Cynicism</p></li>\n<li><p>Feelings of insecurity</p></li>\n<li><p>Increased sensitivity to violence</p></li>\n<li><p>Generalized despair and hopelessness</p></li>\n<li><p>Changes in identity, world view, spirituality</p></li>\n<li><p>Changes in sensory experiences (e.g., intrusive imagery, dissociation)</p></li></ul>\n<p>(Pross, 2006)</p>\n\n","words":478},{"id":"s124","mod":10,"title":"Burnout: Signs, Symptoms, and Effects","html":"<p>Burnout is recognized as an occupational hazard for various people-oriented professions, such as human services, education and health care (Maslach &amp; Leiter, 2016). Burnout is a prolonged response to chronic emotional and interpersonal stressors on the job. It involves three dimensions: exhaustion, cynicism and a sense of inefficiency at work due to work-related stress (Maslach, 2003). The significance of this three-dimensional model is that it clearly places the individual stress experience within a social context and involves the person's concept of both self and others (Maslach &amp; Leiter, 2016).</p>\n<p>Note that burnout is different from depression in that it is specific to work and not pervasive across all aspects of a person's life. For example, people experiencing burnout may still enjoy their weekends with their families or other non-work-related activities (Pross, 2006).</p>\n<p>Work-related stress that is left unresolved over a long period of time has the potential to develop into burnout. Poor psychosocial working conditions (job stressors) can significantly increase the risk for mental health problems and illnesses (Memish et al., 2017). A recent Canadian survey found that workplace stress is cyclical is a primary factor in the development of mental health problems and illness. In addition, it significantly impacts existing mental health problems and illnesses in working adults (Howatt et al., 2018). When work environments are not supportive of staff concerns and efforts, the resulting gap between expectations and reality can further contribute to frustration and stress.</p>\n<p>Most settlement agencies across Canada are facing higher caseloads with fewer resources. Managing workloads, while providing for clients' increasingly complex needs, has become a juggling act. Particularly high levels of burnout have been well-documented among health care providers (Maslach, 2003). Burnout levels among settlement agency staff—who are frequently exposed to details of their clients' traumatic experiences and are increasingly called upon to handle higher caseloads with fewer resources—may be as high as or higher than those of health care providers.</p>\n<h2 id=\"the-downward-spiral\">The downward spiral</h2>\n<h5 id=\"burnout-usually-does-not-happen-all-at-once-but-instead-occurs-in-several-stages-of-a-downward-spiral.\">Burnout usually does not happen all at once, but instead occurs in several stages of a “downward spiral.”</h5>\n<p>(Spinetta et al., 2000)</p>\n<h4 id=\"section\">● ○ ○ ○ ○</h4>\n<h4 id=\"stage-1\">Stage 1</h4>\n<h5 id=\"mental-physical-and-emotional-exhaustion\">Mental, physical and emotional exhaustion</h5>\n<ul>\n<li><p>Emotional emptiness</p></li>\n<li><p>Little or no desire to relate to clients</p></li>\n<li><p>Physical symptoms</p></li>\n</ul>\n<h4 id=\"section-1\">● ● ○ ○ ○</h4>\n<h4 id=\"stage-2\">Stage 2</h4>\n<h5 id=\"indifference-cynicism-and-callousness\">Indifference, cynicism and callousness</h5>\n<ul>\n<li><p>Loss of interest</p></li>\n<li><p>Bitterness</p></li>\n<li><p>Dehumanized view of clients and their families</p></li>\n</ul>\n<h4 id=\"section-2\">● ● ● ○ ○</h4>\n<h4 id=\"stage-3\">Stage 3</h4>\n<h5 id=\"personal-failure\">Personal failure</h5>\n<ul>\n<li><p>Diminished levels of capability, caring and competence</p></li>\n<li><p>Feelings of helplessness</p></li>\n<li><p>Alienation and despair</p></li>\n</ul>\n<h4 id=\"section-3\">● ● ● ● ○</h4>\n<h4 id=\"stage-4\">Stage 4</h4>\n<h5 id=\"personal-failure-1\">Personal failure</h5>\n<ul>\n<li><p>Self-hatred</p></li>\n<li><p>Isolation</p></li>\n<li><p>Major impact on family relationships</p></li>\n<li><p>Absenteeism from work</p></li>\n</ul>\n<h4 id=\"section-4\">● ● ● ● ●</h4>\n<h4 id=\"stage-5\">Stage 5</h4>\n<h5 id=\"complete-burnout\">Complete burnout</h5>\n<ul>\n<li><p>Lack of observable emotions</p></li>\n<li><p>Performance of responsibilities without commitment or enthusiasm</p></li>\n<li><p>Contemplation of leaving profession</p></li>\n</ul>\n\n<h2 id=\"risk-factors\">Risk factors</h2>\n<p>The source of burnout is the work environment; however, not everyone who works in the same environment will experience burnout. Individual risk factors related to demographics and personality traits contribute to making certain individuals more vulnerable to burnout than others.</p>\n<ul>\n<li><p><strong>Work environment</strong></p></li>\n<li><p><strong>Demographic variables</strong></p></li>\n<li><p><strong>Personality traits</strong></p></li>\n</ul>\n<h2 id=\"signs-and-symptoms\">Signs and symptoms</h2>\n<h5 id=\"some-common-symptoms-of-burnout-include-the-following\">Some common symptoms of burnout include the following:</h5>\n\n<p>Apathy (e.g., “I just don't care anymore.”)</p>\n\n<p>Irritability (e.g., “Everything annoys me.”)</p>\n\n<p>Feelings of hopelessness (e.g., “It's useless to try to help them.”)</p>\n\n<p>Rapid exhaustion (e.g., “Even simple tasks make me tired.”)</p>\n\n<p>Disillusionment (e.g., “My clients will never get better.”)</p>\n\n<p>Melancholy (e.g., “The world is a dark place.”)</p>\n\n<p>Forgetfulness (e.g., “I can't remember anything anymore!”)</p>\n\n<p>Experiencing work as a heavy burden (e.g., “Going to work is painful.”)</p>\n\n<p>Tendency to blame oneself (e.g., “It's my fault that my clients are not coping well.”)</p>\n\n<p>Feelings of failure (e.g., “I have let my clients down.”)</p>\n\n<p>Alienation from and cynicism toward clients (e.g., “My clients should just get over it already!”)</p>\n<p>(Lansen, 1996; Fineman &amp; Maslach, 2000, as cited in Pross, 2006)</p>\n<h3 id=\"burnout-as-opportunity\">Burnout as opportunity</h3>\n<p>Providers can adopt strategies to avoid burnout. If a burnout situation happens, it can sometimes be transformed into an opportunity to stop and reflect on some important questions (Bellafiore, 2011). It is an opportunity to step back and consider whether the current course of action is really a good idea. At certain times, providers must stop and care for themselves.</p>\n<h5 id=\"providers-can-consider-the-following-questions-when-experiencing-symptoms-of-burnout\">Providers can consider the following questions when experiencing symptoms of burnout:</h5>\n<ul>\n<li><p>What are you trying to accomplish with your work life?</p></li>\n<li><p>What are your core values? Is your work in synch with these?</p></li>\n<li><p>If you are overworking, why?</p></li>\n<li><p>What does work accomplish for you? What is it preventing you from accomplishing?</p></li>\n</ul>\n\n","words":755},{"id":"s125","mod":10,"title":"Maintaining Healthy Professional Boundaries","html":"<p>We discussed maintaining boundaries as a professional practice in Module 7. We discuss it here not only as a strategy to develop an effective working relationship, but also as a self-reflection and self-awareness strategy to prevent fatigue and exhaustion.</p>\n<p>Boundary issues happen when professional boundaries become blurred, and boundary crossings or violations may occur. Boundary issues may occur when providers face possible conflicts of interest in the form of what are known as dual or multiple relationships (Reamer, 2003). In a dual relationship, the provider has another relationship with their client in addition to the traditional client–service provider relationship (e.g., when the client is their neighbour), whereas multiple relationships refer to one or more additional relationships with a client in addition to the treatment relationship.</p>\n<p>It is important to add that not all boundary issues are problematic or unethical. For example, some service providers might have unavoidable encounters and contacts with clients in social events, libraries, stores where those encounters are short and do not cause ethical problems. Social work ethics and standards require social workers to be aware of dual relationships and boundary issues (Johner, 2006).</p>\n<p>It is important to recognize boundary issues. Frederic G. Reamer states that it is important for service professionals to understand what is meant by boundary crossings or boundary violations when attempting to understand dual relationship issues.</p>\n<h4 id=\"boundary-crossings\">Boundary crossings</h4>\n<blockquote>\n<p>are deviations from professional boundaries that may or may not have negative effects on clients.</p>\n</blockquote>\n<h4 id=\"boundary-violations\">Boundary violations</h4>\n<blockquote>\n<p>are harmful or potentially harmful to the client and the goals of the service-provider–client relationship.</p>\n</blockquote>\n<p>(Reamer 2003)</p>\n<h5 id=\"reamer-places-boundary-issues-into-five-themes-and-categories-illustrated-by-examples-of-ethical-violations-as-shown-in-the-table-below.\">Reamer places boundary issues into five themes and categories illustrated by examples of ethical violations as shown in the table below.</h5>\n<h4 id=\"themes-in-dual-relationships\">Themes in dual relationships</h4>\n<h4 id=\"associated-actions\">Associated actions</h4>\n<h4 id=\"intimate-relationships\">Intimate relationships</h4>\n<ul>\n<li><p>Having physical contact with a client</p></li>\n<li><p>Performing intimate gestures with a client</p></li>\n<li><p>Having a sexual relationship with a client</p></li>\n</ul>\n<h4 id=\"personal-benefits\">Personal benefits</h4>\n<ul>\n<li><p>Receiving monetary gain from a client</p></li>\n<li><p>Obtaining goods and services from a client</p></li>\n<li><p>Obtaining useful information from a client</p></li>\n</ul>\n<h4 id=\"emotional-and-dependency-needs\">Emotional and dependency needs</h4>\n<ul>\n<li><p>Extending a relationship with a client</p></li>\n<li><p>Promoting client dependence</p></li>\n<li><p>Confusing personal and professional lives</p></li>\n<li><p>Reversing roles with a client</p></li>\n</ul>\n<h4 id=\"altruistic-gesture\">Altruistic gesture</h4>\n<ul>\n<li><p>Performing favours for a client</p></li>\n<li><p>Providing nonprofessional services to a client</p></li>\n<li><p>Giving gifts to a client</p></li>\n<li><p>Being extraordinarily available to a client</p></li>\n</ul>\n<h4 id=\"unanticipated-circumstances\">Unanticipated circumstances</h4>\n<ul>\n<li><p>Attending social and community events with a client</p></li>\n<li><p>Having an affiliation or membership in an organization with a client</p></li>\n<li><p>Having mutual acquaintances and friends with a client</p></li>\n</ul>\n\n<h2 id=\"signs-and-symptoms\">Signs and symptoms</h2>\n<h5 id=\"signs-that-the-invisible-barriers-of-ethically-appropriate-interactions-have-been-crossed-include-when-providers\">Signs that the invisible barriers of ethically appropriate interactions have been crossed include when providers:</h5>\n<ul>\n<li><p>Begin referring to clients as friends</p></li>\n<li><p>Receive gifts from or give gifts to clients</p></li>\n<li><p>Share home phone numbers or other significant personal information with clients</p></li>\n<li><p>Ask clients to socialize outside of the professional setting</p></li>\n<li><p>Offer to provide assistance to clients outside of their role</p></li>\n<li><p>Vent with clients about other providers</p></li>\n<li><p>Dominate social interactions with friends and family with discussion of work and clients</p></li></ul>\n<h2 id=\"dealing-with-boundary-issues\">Dealing with boundary issues</h2>\n<ol type=\"1\">\n<li><p>How will this secondary relationship change the power differential or take advantage of a power differential in the therapeutic relationship?</p></li>\n<li><p>How long will this relationship last? Is it a one-time occurrence or is it expected to last indefinitely?</p></li>\n<li><p>How will ending one relationship affect the other relationship?</p></li>\n<li><p>How much will objectivity be impaired?</p></li>\n<li><p>What is the risk of exploitation?</p></li></ol>\n<p>Considering these questions and consulting with colleagues before crossing boundaries may serve the relationship between the provider and client. Thinking about boundaries will help establish a productive relationship and avoid fatigue and exhaustion.</p>\n<div class=\"wide\"><h2>Check your understanding</h2><div class=\"mcq\" data-fb=\"Venting to a client, accepting a ride and becoming the client&#x27;s landlord blur the professional relationship. A card or a shared thank-you for the team is generally acceptable, but check your organization&#x27;s policy.\" data-ms=\"1\"><h4>Consider the following scenarios. Which cross professional boundaries? Select all that apply.</h4><button class=\"opt\" data-ok=\"1\">A service provider is having a bad day after a fight with their spouse and vents to a client about it after the appointment.</button><button class=\"opt\">A client's parent sends chocolates to the team at Christmas in appreciation for the care their loved one received.</button><button class=\"opt\" data-ok=\"1\">A client offers a service provider a ride home, and the service provider accepts.</button><button class=\"opt\" data-ok=\"1\">A service provider who regularly works with a client rents out their basement apartment to that client, who needs housing.</button><button class=\"opt\">A client gives you a thank-you card in appreciation for the treatment received at your organization.</button><button class=\"chk\">Check answer</button><div class=\"fb\"></div></div></div>","words":724},{"id":"s126","mod":10,"title":"Recognizing When and How to Seek Support","html":"<p>If persistent and severe symptoms of distress are experienced to the degree that functioning is impaired, it may be time to seek help for burnout, secondary trauma or compassion fatigue. Examples of impaired functioning may include not sleeping or eating, crying uncontrollably or not performing at work.</p>\n<p>Many employers provide an employee assistance program (EAP) through which employees can obtain a confidential assessment and support. Organizational human resources or occupational health and safety departments may be able to provide information about how to access these programs. EAPs are usually free of charge and are completely confidential.</p>\n<p>Without access to an EAP, a family doctor could help employees access resources.</p>\n\n<h3 id=\"resource-self-rating-tool\">Resource: Self-rating tool</h3>\n<p>The <a href=\"https://proqol.org/proqol-measure\">Professional Quality of Life Measure</a> (ProQOL) is a validated, 30-item self-report tool designed for those in the helping professions. It provides ratings for compassion satisfaction/fatigue, burnout and secondary trauma (which the scale refers to as secondary traumatic stress).</p>\n<p>Note that the ProQOL assessment is a screening tool, not a diagnostic test. It presents a snapshot of the user's situation at a particular moment, and can be repeated over time to provide insight into how the user is coping with the psychological challenges of work.</p>\n<p>Service providers can take the assessment and find their score on each of the three scales.</p>\n<p><a href=\"https://img1.wsimg.com/blobby/go/dfc1e1a0-a1db-4456-9391-18746725179b/downloads/ProQOL_5_English.pdf?ver=1657301051771\"><strong>View the assessment</strong></a></p>\n<h2 id=\"self-awareness-and-self-care-strategies\">Self-awareness and self-care strategies</h2>\n<p>Self-awareness and self-care strategies are key to preventing and managing burnout, compassion fatigue and secondary trauma.</p>\n<h5 id=\"the-general-principles-include-the-following\">The general principles include the following:</h5>\n<ul>\n<li><p>Know your limits.</p></li>\n<li><p>Be aware of the warning signs.</p></li>\n<li><p>Make use of available support.</p></li></ul>\n<p>Service providers are responsible for helping to solve others' problems, however they can sometimes be incapable of seeing what might go wrong within themselves. Providers who feel they are experiencing, or are at risk of experiencing, any of these conditions should take steps in both their personal and professional lives to stop the conditions early in their progression.</p>\n<h5 id=\"the-following-strategies-have-proven-effective-for-minimizing-or-dealing-with-symptoms-of-burnout-compassion-fatigue-and-secondary-trauma\">The following strategies have proven effective for minimizing or dealing with symptoms of burnout, compassion fatigue and secondary trauma:</h5>\n<ul>\n<li><p>Practise self-care (e.g., avoid workaholism; make time for hobbies, leisure, family and friends).</p></li>\n<li><p>Establish a work–life balance.</p></li>\n<li><p>Acquire or improve professional training in diagnosis and (psycho)therapy.</p></li>\n<li><p>Practise therapeutic self-awareness.</p></li>\n<li><p>Learn mindfulness meditation.</p></li>\n<li><p>Limit caseload.</p></li>\n<li><p>Balance empathy for clients with professional distance.</p></li>\n<li><p>Continue obtaining professional education.</p></li>\n<li><p>Obtain support from colleagues and family.</p></li>\n<li><p>Have a better self-awareness through understanding and listening to your body.</p></li>\n<li><p>Talk to someone (in particular, someone who is a good listener, who understands compassion fatigue and with whom the provider feels a connection).</p></li></ul>\n<p>(Pross, 2006; Pfifferling &amp; Gilley, 2000)</p>\n\n<h2 id=\"the-abc-approach\">The ABC approach</h2>\n<h5 id=\"health-canada-2001-recommends-an-abc-approach-to-managing-secondary-trauma.\">Health Canada (2001) recommends an “ABC” approach to managing secondary trauma.</h5>\n<p>Awareness</p>\n<p>Balance</p>\n<p>Connection</p>\n<h3 id=\"activity-self-care\">Activity: Self-care</h3>\n<p>Take the time to create a self-care plan that helps you prevent or cope with difficult feelings. Your plan can include engaging in a particular activity, spending time with a particular friend or focusing on a way of thinking—anything that comforts you and gives you a sense of well-being and stability. Make sure to engage in an activity that is nurturing and that gives you pleasure and/or fulfilment every day.</p>\n<h5 id=\"consider-strategies-that-are-helpful-to-your-own-self-care.-follow-steps-1-and-2-to-complete-this-activity\">Consider strategies that are helpful to your own self-care. Follow steps 1 and 2 to complete this activity:</h5>\n<p><a href=\"https://moodlemedia.camhx.ca/Moodle6/Module7/IRMHP_selfcareplan_example.pdf\"><strong>Step 1: Read the sample template.</strong></a> <a href=\"https://moodlemedia.camhx.ca/Moodle6/Module7/IRMHP_selfcareplan_blanktemplate.pdf\"><strong>Step 2: Download the handout to prepare a self-care plan.</strong></a></p>\n<h2 id=\"summary-and-references\">Summary and references</h2>\n\n","words":581},{"id":"s127","mod":10,"title":"Module Recap and Key Takeaways","html":"<p>This module explored the personal toll on service providers from working with immigrants and refugees who experienced trauma. The module examined compassion fatigue, burnout and secondary trauma, and strategies for self-care.</p>\n<p><a href=\"https://www.camh.ca/en/professionals/professionals--projects/immigrant-and-refugee-mental-health-project/courses/course-resources#3\"><strong>Visit our Course Resources page to access the tools and resources featured in this module.</strong></a></p>\n<p>We also have a downloadable toolkit of resources, which is a repository of evidence-based research; it provides information on key models of care and frameworks; and an outline of components that are pertinent to service delivery.</p>\n<p><a href=\"https://www.camh.ca/en/professionals/professionals--projects/immigrant-and-refugee-mental-health-project/toolkit\"><strong>Find the toolkit here.</strong></a></p>\n","words":95},{"id":"s128","mod":10,"title":"References and Further Reading","html":"<ul>\n<li><p>Cetrano, G., Tedeschi, F., Rabbi, L., Gosetti, G., Lora, A., Lamonaca, D., Manthorpe, J., &amp; Amaddeo, F. 2017. How are compassion fatigue, burnout, and compassion satisfaction affected by quality of working life? Findings from a survey of mental health staff in Italy. BMC Health Services Research, 171. https://doi.org/10.1186/s12913-017-2726-x</p></li>\n<li><p>Compassion fatigue: Signs, symptoms, and how to cope. n.d.. Canadian Medical Association. https://www.cma.ca/physician-wellness-hub/content/compassion-fatigue</p></li>\n<li><p>Figley, C. R. 1995. Compassion Fatigue: Coping With Secondary Traumatic Stress Disorder In Those Who Treat The Traumatized.</p></li>\n<li><p>Figley, C. R. 2002. Compassion fatigue: Psychotherapists’ chronic lack of self care. Journal of Clinical Psychology, 5811, 1433–1441. https://doi.org/10.1002/jclp.10090</p></li>\n<li><p>Hensel, J. M., Ruiz, C., Finney, C., &amp; Dewa, C. S. 2015. Meta-Analysis of Risk Factors for Secondary Traumatic Stress in Therapeutic Work With Trauma Victims. Journal of Traumatic Stress, 282, 83–91. https://doi.org/10.1002/jts.21998</p></li>\n<li><p>Howatt, B. 2018. Building an effective, respectful workplace with the total health index. Canadian HR Reporter, 317, 15. Retrieved from http://myaccess.library.utoronto.ca/login?qurl=https%3A%2F%2Fwww.proquest.com%2Ftrade-journals%2Fbuilding-effective-respectful-workplace-with%2Fdocview%2F2092806411%2Fse-2%3Faccountid%3D14771</p></li>\n<li><p>Johner, R. 2006. Dual Relationship Legitimization and Client Self-Determination. Journal of Social Work Values and Ethics, 31.</p></li>\n<li><p>Maslach, C. 2003. Job Burnout. Current Directions in Psychological Science, 125, 189–192. https://doi.org/10.1111/1467-8721.01258</p></li>\n<li><p>Maslach, C., &amp; Leiter, M. P. 2016. Understanding the burnout experience: recent research and its implications for psychiatry. World Psychiatry, 152, 103–111. https://doi.org/10.1002/wps.20311</p></li>\n<li><p>Memish, K., Martin, A. J., Bartlett, L., Dawkins, S., &amp; Sanderson, K. 2017. Workplace mental health: An international review of guidelines. Preventive Medicine, 101, 213–222. https://doi.org/10.1016/j.ypmed.2017.03.017</p></li>\n<li><p>Pearlman, L.A. &amp; McKay, L. 2008. Understanding &amp; Addressing Vicarious Trauma. Headington Institute. https://www.headington-institute.org/resource/understanding-vt-reading-course/</p></li>\n<li><p>Pfifferling, J., &amp; Gilley, K. 2000. Overcoming Compassion Fatigue. Family Practice Management, 74, 39. https://www.aafp.org/fpm/2000/0400/p39.html</p></li>\n<li><p>Pross, C. 2006. Burnout, vicarious traumatization and its prevention. Torture, 161, 1–9.</p></li>\n<li><p>Reamer, F. 2001. Tangled Relationships: Boundary Issues and Dual Relationships in the Human Services. New York Chichester, West Sussex: Columbia University Press. https://doi-org.myaccess.library.utoronto.ca/10.7312/ream12116</p></li>\n<li><p>Saakvitne, K. W., &amp; Pearlman, L. A. 1996. Transforming the pain : a workbook on vicarious traumatization. W.W. Norton &amp; Company.</p></li>\n<li><p>Spinetta, J. J., Jankovic, M., Arush, M. W. B., Eden, T., Epelman, C., Greenberg, M. T., Martins, A. C. P., Mulhern, R. K., Oppenheim, D., &amp; Masera, G. 2000. Guidelines for the recognition, prevention, and remediation of burnout in health care professionals participating in the care of children with cancer: Report of the SIOP Working Committee on Psychosocial Issues in Pediatric Oncology. Medical and Pediatric Oncology, 352, 122–125. https://doi.org/10.1002/1096-911x20000835:2</p></li>\n<li><p>Sprang, G., Clark, J. H., &amp; Whitt-Woosley, A. 2007. Compassion Fatigue, Compassion Satisfaction, and Burnout: Factors Impacting a Professional’s Quality of Life. Journal of Loss &amp; Trauma, 123, 259–280. https://doi.org/10.1080/15325020701238093</p></li>\n</ul>\n<p>You have reached the end of the Immigrant and Refugee Mental Health Project's online course. This course built on your existing work with immigrants and refugees, and aimed to strengthen your knowledge and develop your skills and networks.</p>\n","words":453}],"gloss":[["Adjustment disorder","The presence of emotional or behavior symptoms that occur within three months of the onset of an identifiable stressor."],["Bisexual","A person who is emotionally, physically, spiritually and/or sexually attracted to people of more than one gender, though not necessarily at the same time."],["Cis/Cisgender","A person whose gender identity is the same as the sex they were assigned at birth. The term also includes the understanding that a person's gender identity, role, expectations and expression conform to society's expectations of the gender associated with their biological sex and anatomy."],["Client","The term \"client\" is used throughout this course (instead of \"patient\", \"consumer\" or other terms)."],["Ethnic Origin","Ethnic origin is generally used by the Government of Canada to refer to the ethnic or cultural origins of a person's ancestors. Ethnic origin does not refer to citizenship, nationality, language or place of birth."],["Gay","A person who is emotionally, physically, spiritually and/or sexually attracted to the same gender. The word can refer to men or women, although some women prefer \"lesbian.\" It is sometimes used as an umbrella term for the LBGTQ community."],["Gender Binary","A social system whereby people are thought to have either one of two genders: \"man\" or \"woman.\" These genders are expected to correspond to birth sex: male or female. In the gender binary system, there is no room for living between genders or for transcending the gender binary. The gender binary system is rigid and restrictive for many people whose sex assigned at birth does not match up with their gender, or whose gender is fluid and not fixed."],["Genderqueer","Individuals who do not follow gender stereotypes based on the sex they were assigned at birth. They may identify and express themselves as \"feminine men\" or \"masculine women\" or as androgynous, outside of the categories \"boy/man\" and \"girl/woman.\" People who are gender non-conforming may or may not identify as trans or transgender."],["Government Assisted Refugees (GARs)","GARs arerefugees, from the Convention Refugees Abroad Class, whose initial resettlement in Canada is supported by the Government of Canada or the Government of Quebec."],["High context culture","In high-context cultures, such as Chinese culture, other communicative cues such as body language, the understanding of unspoken rules and even silence have a more important role to play in communication. The message is not as much in the spoken word as it is embedded in the context. There is more emphasis on what is left unspoken and more responsibility on the listener to interpret the meaning."],["Immigrant","The Canadian government defines immigrants as \"persons residing in Canada, who were born outside of Canada, excluding temporary foreign workers, Canadian citizens born outside Canada and those with student or working visas\". There are times when the term \"immigrants\" is included in the \"refugee\" classification and vice versa. In this course, where possible, an effort has been made to clarify the above when referencing literature."],["Incidence risk ratio","Refers to the risk of a new event of psychosis occurring during the timeframe for the population in question, compared to the risk of a new case of psychosis occurring in the comparison group."],["Intersex","A person born with reproductive systems, chromosomes and/or hormones that are not easily characterized as male or female. This might include a woman with XY chromosomes or a man with ovaries instead of testes. Intersex characteristics occur in one out of every 1,500 births. Typically, intersex people are assigned one sex, male or female, at birth. Some intersex people identify with their assigned sex, while others do not, and some choose to identify as intersex. Intersex people may or may not identify as trans or transgender."],["Lesbian","A woman who is emotionally, physically, spiritually and/or sexually attracted to women."],["2SLGBTQ+","This course uses the term 2SLGBTQ+ (2-spirit, lesbian, gay, bisexual, transgender, queer, plus). The use of this term is not intended to be exclusive; it is recognized that terminology for sexual orientation or gender identity (SOGI) can vary by region and community, and across time and place (Hall & Sajnani, n.d.)."],["Low context culture","In low-context cultures, such as American culture, communication occurs predominantly through explicit statements. The message is in the spoken word. Silence and pauses are usually perceived as either signs of agreement or a lack of interest."],["Mental Disorder","Mental disorders (also called mental illnesses) are characterized by alterations in thinking, mood or behaviour (or some combination thereof) associated with significant distress and impaired functioning."],["Mental Health","The World Health Organization defines mental health as \"a state of well-being in which the individual realizes his or her own abilities, can cope with the normal stresses of life, can work productively and fruitfully, and is able to make a contribution to his or her community\"."],["Mental Illness","Mental illnesses (also called mental disorders) are characterized by alterations in thinking, mood or behaviour (or some combination thereof) associated with significant distress and impaired functioning."],["Migrant","A migrant is a person who is outside their country of origin."],["Newcomer","In this course, the phrase \"immigrant and refugee\" may be used interchangeably with the term \"newcomer,\" and both will refer to immigrants and refugees who have been in Canada for less than five years."],["People with disabilities","People with disabilities include \"those who have long-term physical, mental, intellectual or sensory impairments [by illness, injury or wounds] which in interaction with various barriers may hinder their full and effective participation in society on an equal basis with others\" (United Nations [UN], 2006)."],["Permanent Residents","A permanent resident is a person who has been granted permanent resident status in Canada, but is not a Canadian citizen."],["Queer","Formerly, a derogatory slang term used to identify 2SLGBTQ+ people. Some members of the 2SLGBTQ+ community have reclaimed queer as an identity and use it to describe their sexual orientation and/or gender identity."],["Racialized","The Ontario Human Rights Commission describes people as \"racialized person\" or \"racialized group\" instead of the terms \"racial minority,\" \"visible minority,\" \"person of colour\" or \"non-White,\" as \"racialized\" expresses race as a social construct rather than as a description based on perceived biological traits. The term \"racialized\" is used in this course, except when referring to sources which use different terminology (e.g., visible minority, South Asian, etc.). In those cases, the original terms from the literature are used."],["Refugee","The United Nations Convention relating to the Status of Refugees defines a refugee as someone who, \"owing to a well-founded fear or being persecuted for reasons of race, religion, nationality, membership of a particular social group, or political opinion, is outside the country of his nationality, and is unable to or, owing to such fear, is unwilling to avail himself of the protection of that country\". There are times when the term \"immigrants\" is included in the \"refugee\" classification and vice versa. In this course, where possible, an effort has been made to clarify the above when referencing literature."],["Temporary Resident","A temporary resident is a person who has permission to remain in Canada on a temporary basis. The three main types of temporary residence are: (1) visitors, (2) students, and (3) workers."],["Transgender","Umbrella terms that describe people with diverse gender identities and gender expressions that do not conform to stereotypical ideas about what it means to be a girl/woman or boy/man in society. \"Trans\" can mean transcending beyond, existing between, or crossing over the gender spectrum. It includes but is not limited to people who identify as transgender or gender non-conforming (gender variant or gender-queer). >  > Trans identities include people whose gender identity is different from the gender associated with their birth-assigned sex. Trans people may or may not undergo medically supportive treatments, such as hormone therapy and a range of surgical procedures, to align their bodies with their internally felt gender identity."],["Two-spirit","A term used by Indigenous Peoples to describe from a cultural perspective people who are gay, lesbian, bisexual, trans or intersex. It is used to capture a concept that exists in many different Indigenous cultures and languages. For some, the term two-spirit describes a societal and spiritual role that certain people played within traditional societies. They were often mediators, keepers of certain ceremonies and transcended accepted roles of men and women by filling a role as an established middle gender."],["Violence against women","The United Nations Declaration on the Elimination of Violence against Women (1993, Article 1) defines violence against women as \"any act of gender-based violence that results in, or is likely to result in, physical, sexual or psychological harm or suffering to women, including threats of such acts, coercion or arbitrary deprivations of liberty, whether occurring in public or in private life.\""],["Visible Minority","Visible minority refers to \"persons, other than Aboriginal peoples, who are non-Caucasian in race or non-white in colour\". This term is used by some researchers; however, the term \"racialized\" will be used throughout this course."]]}</script>
