tories before coming to Canada (pre-migration), their experiences in Canada (post-migration/integration) and their journey to Canada (migration), as well as other factors, create unique situations that may influence mental health problems and illnesses for some immigrants and refugees more than for others (MHCC, 2016).</p>\n<p>Although the experiences of mental health and mental illness can vary widely among newcomers, the “healthy immigrant effect,” discussed next, provides insight on some factors and how they can impact immigrant and refugee mental health.</p>\n","words":290},{"id":"s11","mod":1,"title":"The Healthy Immigrant Effect and Changes Over Time","html":"<p>A large body of evidence suggests that new immigrants and refugees are healthier, both physically and mentally, than the native-born population upon initial arrival to their new country (Vang et al., 2015; Ng &amp; Zhang, 2020).</p>\n<p>This phenomenon is known as the <strong>“healthy immigrant effect”</strong>.</p>\n<h4 id=\"this-effect-has-been-attributed-to-various-individual--and-state-level-factors\">This effect has been attributed to various individual- and state-level factors:</h4>\n<h4 id=\"at-the-individual-level\">At the individual level</h4>\n<blockquote>\n<p>The migration process tends to favour individuals who are healthy and can survive the journey.</p>\n</blockquote>\n<h4 id=\"at-the-state-level\">At the state level</h4>\n<blockquote>\n<p>Immigration policies implemented by the receiving country often favour human capital, which is often correlated with better health.</p>\n</blockquote>\n<p>(Vang et al., 2015)</p>\n<p>With more time spent in Canada, newcomers' health advantage tends to diminish, and the physical and mental health of immigrants and refugees begins to deteriorate.</p>\n<p>As mentioned earlier, immigrants and refugees are diverse populations and their rates of mental health problems and illnesses vary considerably between and within groups. They differ based on gender, race, country of origin, age at arrival, length of time in Canada, socioeconomic status, immigration status and circumstances surrounding migration (MHCC, 2016).</p>\n<p>Evidence suggests that some immigrant populations—in particular, immigrants from racialized groups, low-income immigrants and refugees—are at a higher risk of deteriorating health soon after arrival in Canada (Vang et al., 2015; Ng &amp; Zhang, 2020; Salami, 2017).</p>\n<p>Findings from the Longitudinal Survey of Immigrants to Canada showed that when asked to self-rate their health status, skilled principal applicants reported themselves to be generally healthy. In contrast, refugees reported their health status to be fair or poor (Zhao, Xue &amp; Gilkinson, 2010). And refugees continue to experience greater mental health risk relative to other immigrant subgroups (Ng &amp; Zhang, 2020).</p>\n<h3 id=\"self-reported-health-of-immigrants-and-refugees\">Self-reported health of immigrants and refugees</h3>\n<p>Self-reported health status among refugees also tended to decline more with time spent in Canada than among family-class and skilled-worker immigrants (Zhao, Xue &amp; Gilkinson, 2010).</p>\n<h3 id=\"emotional-problems-among-recent-immigrants-by-region-of-origin\">Emotional problems among recent immigrants by region of origin</h3>\n<p>Self-reported emotional problems among recent immigrants differ by region of origin.</p>\n<ul>\n<li><p>Recent immigrants from North America, the United Kingdom and Western Europe self-reported the lowest levels of emotional problems of all groups.</p></li>\n<li><p>Recent immigrants from Central and South America, Africa and the Middle East reported the highest levels of emotional problems (persistent feelings of sadness, depression, loneliness etc.).</p></li>\n</ul>\n<p>(Adapted from: Mental health and well-being of recent immigrants in Canada: Evidence from the longitudinal survey of immigrants to Canada, by Robert, AM. &amp; Gilkinson, T., 2012, p. 11. <a href=\"https://www.canada.ca/content/dam/ircc/migration/ircc/english/pdf/research-stats/mental-health.pdf\" class=\"uri\">https://www.canada.ca/content/dam/ircc/migration/ircc/english/pdf/research-stats/mental-health.pdf</a>. © Citizenship and Immigration Canada, Government of Canada)</p>\n<p>It is common for both immigrants and refugees to experience downward social mobility after migration, which is associated with an increased risk for mental health problems and illnesses</p>\n<h5 id=\"some-examples-of-post-migration-factors-that-increase-mental-health-problems-in-immigrants-and-refugees-include\">Some examples of post-migration factors that increase mental health problems in immigrants and refugees include:</h5>\n<div class=\"wide\"><div class=\"chips\"><div class=\"chip\"><small>01</small>Detention</div><div class=\"chip\"><small>02</small>Discrimination</div><div class=\"chip\"><small>03</small>Poor housing</div><div class=\"chip\"><small>04</small>Language proficiency</div><div class=\"chip\"><small>05</small>Low social support</div><div class=\"chip\"><small>06</small>Limited access to jobs and education</div><div class=\"chip\"><small>07</small>Limited recognition of education and certification</div></div></div>\n<p>Noting the importance of newcomers' migration histories and other factors affecting their mental health, the next section discusses the three types of mental health determinants, followed by a more detailed discussion of social determinants affecting mental health.</p>\n","words":603},{"id":"s12","mod":1,"title":"Biological, Psychological, and Social Determinants of Mental Health","html":"<p>The determinants of mental health are the factors that affect or determine a person's level of mental well-being. An individual's mental health is influenced by biological, psychological and social factors, which can be interrelated and can change according to life circumstances. This combination of determinants contributes to the complexity of mental health and mental illnesses (Government of Canada, n.d.). Understanding these factors and their potential impact on mental health is important for service providers who may be in a position to address such determinants when offering support to immigrant and refugee clients.</p>\n<p>Mental health “is a state of well-being in which the individual realizes his or her own potential, can cope with the normal stresses of life, can work productively and fruitfully, and is able to make a contribution to her or his own community” (WHO, 2016).</p>\n<h4 id=\"the-determinants-of-mental-health-are-often-discussed-in-terms-of-protective-and-risk-factors.\">The determinants of mental health are often discussed in terms of protective and risk factors.</h4>\n<div class=\"wide\"><div class=\"grid g2\"><div class=\"cd \"><h4>Protective factors</h4><p>Moderate the effect of stress and reduce the likelihood of a mental health problem or illness.</p></div><div class=\"cd br\"><h4>Risk factors</h4><p>Increase the probability that a person or group will develop a mental health problem or illness.</p></div></div></div>\n<p>Our health and well-being is significantly shaped by many things including, but not limited to, where we work, our work environment, our income and wealth, our ability to afford quality housing and food, as well as the physical environment that is built around us and the policies and structures that our governments put in place, including the health system (Compton &amp; Shim, 2015) (Alegría, NeMoyer, Falgas, Wang, &amp; Alvarez, 2018).</p>\n<p>Mental health problems and illnesses take many forms and cover a range of issues. They are determined by a number of biological, psychological and social factors, known as the determinants of health. The social determinants of health (e.g., income, education, race, gender, etc.) play the most important role in determining the health outcomes for Canadians. This topic will be discussed in relation to immigrant and refugee populations in greater detail later in this module and throughout the course.</p>\n<h3 id=\"the-determinants-of-mental-health\">The determinants of mental health</h3>\n<div class=\"wide\"><div class=\"grid g3\"><div class=\"cd \"><h4>Biological factors</h4><p>Genetics, brain chemistry, physical health and development.</p></div><div class=\"cd \"><h4>Psychological factors</h4><p>Coping skills, thinking patterns, past experiences, trauma and self-esteem.</p></div><div class=\"cd br\"><h4>Social factors</h4><p>Income, housing, relationships, work, community and discrimination.</p></div></div></div>\n<h2 id=\"what-makes-canadians-sick\">What makes Canadians Sick?</h2>\n<p>Social factors are very influential; they can account for about half the variation in a person's health status.</p>\n<p>These determinants affect all groups in Canada, both immigrant and non-immigrant. The factors commonly recognized as the social determinants that affect Canadians' lives are:</p>\n<div class=\"wide\"><h4>Your life circumstances</h4><div class=\"chips\"><div class=\"chip\"><small>01</small>Income</div><div class=\"chip\"><small>02</small>Early childhood development</div><div class=\"chip\"><small>03</small>Disability</div><div class=\"chip\"><small>04</small>Education</div><div class=\"chip\"><small>05</small>Social exclusion</div><div class=\"chip\"><small>06</small>Social safety net</div><div class=\"chip\"><small>07</small>Gender</div><div class=\"chip\"><small>08</small>Employment and working conditions</div><div class=\"chip\"><small>09</small>Race</div><div class=\"chip\"><small>10</small>Aboriginal status</div><div class=\"chip\"><small>11</small>Safe and nutritious food</div><div class=\"chip\"><small>12</small>Housing and homelessness</div><div class=\"chip\"><small>13</small>Community belonging</div></div><h4>Your health care</h4><div class=\"chips\"><div class=\"chip\"><small>01</small>Access to health care</div><div class=\"chip\"><small>02</small>Health care system</div><div class=\"chip\"><small>03</small>Wait times</div></div><h4>Your biology</h4><div class=\"chips\"><div class=\"chip\"><small>01</small>Biology</div><div class=\"chip\"><small>02</small>Genetics</div></div><h4>Your environment</h4><div class=\"chips\"><div class=\"chip\"><small>01</small>Air quality</div><div class=\"chip\"><small>02</small>Civic infrastructure</div></div></div>\n<p>(Government of Canada, 2020) Adapted from: “Health equity and the social determinants of health” by the Canadian Medical Association (CMA), 2013 (https://www.cma.ca/En/Pages/health-equity.aspx). © 2013 Canadian Medical Association (CMA). Reprinted with permission.</p>\n<h4 id=\"the-factors-commonly-recognized-as-the-social-determinants-that-affect-canadians-lives-are\">The factors commonly recognized as the social determinants that affect Canadians' lives are:</h4>\n<div class=\"wide\"><div class=\"chips\"><div class=\"chip\"><small>01</small>Income and social status</div><div class=\"chip\"><small>02</small>Education and literacy</div><div class=\"chip\"><small>03</small>Employment and working conditions</div><div class=\"chip\"><small>04</small>Childhood experiences</div><div class=\"chip\"><small>05</small>Physical environments</div><div class=\"chip\"><small>06</small>Social supports and coping skills</div><div class=\"chip\"><small>07</small>Healthy behaviours</div><div class=\"chip\"><small>08</small>Access to health services</div><div class=\"chip\"><small>09</small>Biology and genetic endowment</div><div class=\"chip\"><small>10</small>Gender</div><div class=\"chip\"><small>11</small>Culture</div><div class=\"chip\"><small>12</small>Race and racism</div></div></div>\n<p>(Government of Canada, 2020)</p>\n<p>Immigrant and refugees groups, however, are more likely than the Canadian-born population to be exposed to the social determinants that make them ill. Furthermore, compared to the Canadian-born population, immigrant and refugee groups more commonly experience specific factors such as those relating to pre- and post-migration, language difficulties and racism (Hansson et al., 2010; MHCC, 2016).</p>\n<p>As an illustration of the ways in which social determinants experienced by immigrants and refugees may lead to differential impacts on their mental health, the following pages elaborate on the determinants of migration, followed by a discussion of <strong>income and socioeconomic status, employment and education, housing, and discrimination and racism</strong> post-migration. Although these five social determinants are not the only ones affecting immigrants and refugees, they are discussed here as their effects have been well-documented, and they serve to show the wide range of circumstances newcomers may experience within any of the determinants.</p>\n<p><a href=\"https://www.thecanadianfacts.org/\"><strong>Learn more at Social Determinants of Health: The Canadian Facts</strong></a></p>\n<h2 id=\"review-questions\">Review questions</h2>\n<div class=\"mcq\" data-fb=\"Risk factors raise the likelihood of a disorder and can make an existing one harder to live with.\"><h4>Risk factors increase the probability that a person or group will develop a mental disorder. They can also worsen the burden of an existing disorder.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"This is the role of protective factors, such as strong social support.\"><h4>Protective factors moderate the impact of stress and reduce the likelihood of mental health problems.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div>\n\n\n","words":794},{"id":"s13","mod":1,"title":"Pre-Migration, Migration, and Post-Migration Experiences","html":"<p>The immigrant and refugee journey is divided into three phases: pre-migration, migration and post-migration. The prevalence of mental health problems and illnesses for immigrants and refugees is largely determined by the protective and risk factors that are experienced throughout each phase of the migration journey (Jaime Ballard, 2019; Farahani, Joubert, Anand, Toikko, &amp; Tavakol, 2021; Carroll, Luzes, Freier, &amp; Bird, 2020).</p>\n<p>For example, before and during the migration journey, many refugees experience hardships and traumatic life events that put them at risk for mental health problems and illnesses (WHO, 2021).</p>\n<h4 id=\"actions-can-be-taken-at-different-levels-to-improve-the-negative-effects-of-these-migration-related-experiences.-for-example\">Actions can be taken at different levels to improve the negative effects of these migration-related experiences. For example:</h4>\n<h5 id=\"pre-migration-and-migration\">Pre-migration and migration</h5>\n<p>Canadian policies on international relations or on admission policies for immigrants and refugees that minimize risk factors and emphasize protective factors of newcomers' mental health can affect immigrants' and refugees' experiences. For instance, policies that emphasize the importance of keeping families together throughout the migration process may act as protective factors for mental health.</p>\n<h5 id=\"post-migration\">Post migration</h5>\n<p>Directly addressing risk and protective factors, such as the social determinants of health, to support newcomers' mental health.</p>\n<p>The next section highlights specific social factors that can impact the mental health of immigrant and refugee populations in the post-migration context in Canada. It is important to note, however, that not all immigrant and refugee subpopulations face the same challenges during resettlement and experience the social determinants in the same way.</p>\n","words":259},{"id":"s14","mod":1,"title":"Social Determinants of Mental Health After Arrival in Canada","html":"<p>Pre-migration trauma predicts mental disorders and posttraumatic stress disorder; however, the post-migration context can equally determine the mental health of immigrants and refugees. For example, post-migration social determinants help moderate the immigrants ' or refugees ' ability to recover from pre-migration trauma (Hynie, 2017).</p>\n<p>In addition to the factors illustrated in the figure on the previous page, social determinants also include the way society is organized, which affects an individual's place within it, along with corresponding factors such as creating a sense of belonging and sense of purpose. These factors can then shape health and illness.</p>\n<p>Humans have evolved to respond automatically to perceived and real threats, which can be detrimental to survival in the short term. However, if this response is continuously activated, well-being and health may be negatively impacted. Health problems as the result of chronic stress, such as depression, increased vulnerability to infection, diabetes, high blood pressure, and increased cholesterol, are more prevalent in poorer populations in industrialized countries (Marmot &amp; Wilkinson, 2005). Three pathways link social structure with well-being and health.</p>\n<h2>Pathways between social determinants and well-being</h2><p>Social structure, early life, genes and culture shape three pathways to well-being and health:</p><ul><li><p><strong>Material:</strong> the social environment, working conditions and material factors.</p></li><li><p><strong>Behavioural:</strong> health behaviours.</p></li><li><p><strong>Psychosocial:</strong> psychological stress.</p></li></ul><p>Over time these pathways lead to pathophysiological changes in the body and brain, which affect well-being, illness and mortality.</p>\n<p>People who suffer from adverse social and economic conditions, such as low-income, poor-quality housing, food insecurity, inadequate working conditions, insecure employment and various forms of discrimination, tend to experience high levels of stress. Chronic stress weakens resistance to disease and disrupts the functioning of the hormonal and metabolic systems. This makes people more vulnerable to various illnesses, including cardiovascular and immune system diseases, adult-onset of diabetes, as well as depression and anxiety (American Psychological Association, 2017).</p>\n<p>People who experience high levels of stress often attempt to relieve these pressures by adopting unhealthy coping behaviours, such as the excessive use of alcohol, smoking and overeating carbohydrates (Ibid.). Mental health problems and illnesses are no different from physical health problems; there are a number of factors at play.</p>\n<h2 id=\"income-and-socioeconomic-status\">Income and socioeconomic status</h2>\n<h4 id=\"it-is-well-known-that-low-socioeconomic-status-negatively-affects-mental-healthkim-cho-2020.\">It is well known that low socioeconomic status negatively affects mental health<strong><em>(Kim &amp; Cho, 2020).</em></strong></h4>\n<p>Economic hardship is linked to health inequalities, with unemployment and lower household income being significant social determinants of mental health (Alegría, NeMoyer, Falgas, Wang, &amp; Alvarez, 2018) (Salami et al., 2017). Risk factors for common mental disorders (e.g., depression and anxiety) are also strongly associated with social inequities (WHO, 2014) (Alegría, NeMoyer, Falgas, Wang, &amp; Alvarez, 2018).</p>\n<p>Subpopulations of immigrants and refugees come to Canada with vast differences in financial resources and can experience vastly different financial conditions once settled. Although new immigrants are one of the groups most likely to experience poverty, there are, of course, differences within and between groups (Picot &amp; Lu, 2017). Income can also be influenced by immigrant class.</p>\n<h5 id=\"economic-class\">Economic class</h5>\n<blockquote>\n<p>Generally, applicants in the <strong>economic class</strong> come to Canada with capital. Obtaining employment in Canada is often not simple and can threaten the financial security of these individuals and their dependents. Immigrants may face financial hardship due to an inability to earn wages appropriate to their education and skills (this is discussed in greater detail in the next section).</p>\n</blockquote>\n<h5 id=\"family-class\">Family class</h5>\n<blockquote>\n<p>To sponsor <strong>family members</strong>, a sponsor must demonstrate a level of income that meets the <a href=\"https://www.canadavisa.com/necessary-income-levels-for-family-sponsorship.html\">minimum necessary income</a> or low-income cut-off (LICO) for a given family size, as established by Statistics Canada. The sponsor is freed from this requirement if either:</p>\n</blockquote>\n<ul>\n<li><p>The individual requiring sponsorship is the spouse, common-law partner or conjugal partner of the Canadian sponsor.</p></li>\n<li><p>The individual requiring sponsorship is the dependent child of the Canadian sponsor.</p></li>\n</ul>\n<h5 id=\"government-sponsored-refugees-gars\">Government sponsored refugees (GARs)</h5>\n<blockquote>\n<p><strong>Government sponsored refugees (GARs)</strong> are eligible to receive funding from the Government of Canada for up to one year, or, at times, until they are able to support themselves. The amount is approximately equivalent to that provided by provincial social assistance programs.</p>\n</blockquote>\n<h5 id=\"privately-sponsored-refugees-psrs\">Privately sponsored refugees (PSRs)</h5>\n<blockquote>\n<p>Those <strong>privately sponsoring refugees</strong> are expected to provide them with financial support for up to one year. The amount is at least equal to the average rates for social assistance.</p>\n</blockquote>\n<h2 id=\"some-facts\">Some facts</h2>\n<h5 id=\"the-differences-associated-with-the-channel-of-immigration-and-income-are-reflected-in-subpopulations-of-immigrants-and-refugees.\">The differences associated with the channel of immigration and income are reflected in subpopulations of immigrants and refugees.</h5>\n<ul>\n<li><p>Recent immigrants who are employed tend to earn less than the Canadian-born population, with principal applicants in the economic class earning the highest wages.(Statistics Canada, 2017l)</p></li>\n<li><p>Women are more likely than men to be admitted under the Family Class category.(Immigration, Refugees and Citizenship, 2018)</p></li>\n<li><p>In 2013, 54.1% of female permanent residents were admitted under the economic class (19.7% as principal applicants and 34.4% as the spouse or dependent of a principal applicant), and 34.3% were admitted under the family class.(Hudon, 2016)</p></li>\n<li><p>When comparing refugee categories, GARs generally earn the lowest income in the initial years, while PSRs fare slightly better. However, this difference disappears after a decade in the country.(Picot, Zhang, &amp; Hou, 2019)</p></li>\n<li><p>Wages increase with more time spent in Canada. This generally applies to all immigrants regardless of admission category.(Statistics Canada, 2017l)</p></li></ul>\n<h5 id=\"income-disparities-go-beyond-the-channels-of-immigration-and-there-are-differences-based-on-other-demographic-characteristics.-for-example\">Income disparities go beyond the channels of immigration, and there are differences based on other demographic characteristics. For example:</h5>\n<ul>\n<li><p>Immigrants from the United States or Europe earn higher incomes than immigrants from East Asia.(Statistics Canada, 2017)</p></li>\n<li><p>Immigrants from East and South Asia have approximately four times higher rates of chronic low income than immigrants from Northwestern Europe, the Philippines, Australia, New Zealand and the United States.(Picot &amp; Lu, 2017)</p></li>\n<li><p>Incomes are generally lower for immigrant women compared to immigrant men.(Statistics Canada, 2017l)</p></li>\n<li><p>Immigrants over the age of 65 experience the highest rates of chronic low income.(Picot &amp; Lu, 2017)</p></li>\n<li><p>The wages of immigrant children are generally not comparable to that of Canadian-born children (Statistics Canada, 2017l) The children of immigrants, among nearly all racialized groups, have lower earnings compared to children with Canadian-born parents, despite the fact that immigrant parents are more likely to have degrees. This gap is especially large for racialized categories of Black, Latin America, West Asian/Arab and South-East Asian children of immigrants.(Kiziltan, 2016)</p></li></ul>\n<div class=\"wide\"><h2>Review questions</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Credential recognition and underemployment are common reasons newcomers earn less than their skills would suggest.\"><h4>Immigrants may face financial hardship due to challenges in earning wages appropriate to their education and skills.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Private sponsors are expected to provide financial support for up to one year, not three.\"><h4>Private sponsors, through the Private Sponsorship of Refugees Program, are expected to provide refugees with financial support for up to three years.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"GARs can receive Government of Canada funding for up to one year (or until they can support themselves), not six months.\"><h4>Government sponsored refuges (GARs) are eligible to receive funding from the Government of Canada for up to six months, or, at times until they are able to support themselves.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Privately sponsored refugees tend to have higher employment rates and earnings than government-assisted refugees.\"><h4>Among resettled refugees, privately sponsored refugees tend to become self-supporting more quickly than government assisted refugees.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n\n<h2 id=\"employment-and-education\">Employment and education</h2>\n<p>Employment allows people to afford the basic necessities that are essential for good health. It also provides a sense of identity and purpose, social contacts and opportunities for personal growth (PHAC, 2003). Immigrants and refugees face barriers in accessing employment in Canada, including the recognition of foreign credentials and the lack of Canadian work experience (Salami et al., 2017).</p>\n<p>As a whole, immigrants and refugees have lower employment rates and higher unemployment rates compared to the Canadian-born population (Kiziltan, 2016). In addition, there are differences based on immigration class:</p>\n<ul>\n<li>In general, principal applicants in the economic immigrant class have higher participation rates in the labour force, higher employment rates and lower unemployment rates than all other immigrant classes and the Canadian-born population (Ibid.).</li>\n<li><p>This trend also extends to female spouses, where women who arrived as spouses of economic immigrant principal applicants had better labour market outcomes compared to women arriving in the Family Class (Bonikowska &amp; Hou, 2017).</p></li>\n<li>Immigrants without a university degree or diploma have unemployment rates that are on par or better than the unemployment rates of similarly educated Canadians.</li>\n<li><p>University-educated immigrants at all levels (i.e., long established, recent and very recent) have higher unemployment rates than the Canadian-born, with very recent immigrants facing an unemployment rate that is between 1.5 times to three times higher than similarly educated Canadians (Statistics Canada, 2018a).</p></li>\n<li>In 2017, the national unemployment rate for recent immigrants was 10.4%, about 1.7 times the rate of Canadian-born individuals. (Statistics Canada, 2018b)</li>\n<li><p>Recent immigrants who had been in Canada for five years or less, represented only 3.6% of the Canadian labour force in 2016 (Statistics Canada, 2017m).</p></li>\n<li>Refugees seem to have particular difficulty entering the labour market, so much so that their unemployment rates remain higher than other immigrant groups, even after five years in Canada (Wilkinson &amp; Garcea, 2017: 9).</li>\n</ul>\n<blockquote>\n<p>Among resettled refugees, privately sponsored refugees tend to have higher employment rates and earnings than government-assisted refugees (Kaida, Hou, &amp; Stick, 2020).</p>\n</blockquote>\n<h3 id=\"impact-of-covid-19\">Impact of COVID-19</h3>\n<p>The COVID-19 pandemic disruptions on the labour market impacted immigrants more severely than the native-born workers as they were more likely to work jobs that are not easy to perform remotely (Cassidy, 2022). Moreover, both immigrants and the native-born population experienced rapid employment recovery post-pandemic.</p>\n<h2 id=\"housing\">Housing</h2>\n<h5 id=\"the-successful-integration-of-immigrants-and-refugees-into-a-new-society-is-based-on-their-attainment-of-several-basic-needs-one-of-the-most-important-of-which-is-affordable-suitable-and-adequate-housing-teixeria-halliday-20101.\">“The successful integration of immigrants and refugees into a new society is based on their attainment of several basic needs, one of the most important of which is affordable, suitable and adequate housing” <strong>(Teixeria &amp; Halliday, 2010:1).</strong></h5>\n<p>The majority of immigrants and refugees settle in Canada's largest urban areas, with <strong>60%</strong> settling in <strong>Toronto, Vancouver, and Montreal</strong> (AMSSA, 2016). Given increasing housing prices in these cities, <strong>affordability</strong> remains the biggest barrier to housing for most immigrants and refugees.</p>\n<p>In Canada, a household is considered to have affordable housing if it spends less than 30% of its total income on shelter costs.</p>\n<h5 id=\"in-2018\">In 2018:</h5>\n<p><strong>31%</strong> of recent immigrants lived in households that spent more than <strong>30%</strong> of their total household income on shelter.</p>\n<p>Only <strong>18%</strong> of the total population spent that amount.</p>\n<p>(Randle, Hu, &amp; Thurston, 2021)</p>\n<p>Recent immigrants and refugees are <strong>half as likely</strong> as non-immigrants to obtain home ownership.</p>\n<p>However, those from Europe and Asia are <strong>up to twice as likely</strong> to own homes as those from Africa or Central and South America.(AMSSA, 2016; CMHC, 2014)</p>\n<ul>\n<li><p>Refugees and refugee claimants are <strong>at the highest risk of experiencing hidden homelessness</strong>, primarily in the inner suburbs (AMSSA, 2016; Murdie &amp; Logan, 2011).</p></li></ul>\n<h4 id=\"hidden-homelessness\">Hidden homelessness</h4>\n<p>describes populations who live temporarily with others, in a car or in a shelter without guarantee of continued residency or immediate prospects for assessing permanent housing. For every person who is living in absolute poverty, it is estimated that there are three people living in hidden homelessness (Tabibi &amp; Baker, 2017).</p>\n<ul>\n<li><p>In one Vancouver study, <strong>nearly 60%</strong> of refugees reported having to stay with family or friends or in non-residential locations because they could not afford the formal housing market (Francis &amp; Hiebert, 2014).</p></li>\n<li><p>In addition, <strong>50%</strong> of refugee claimants living in Montreal report moving two or more times in their first four years in Canada, compared to about 28% of immigrants and 23% of sponsored refugees (Rose &amp; Charette, 2011).</p></li>\n<li><p>Refugee claimants are particularly vulnerable until their claims are accepted and they receive permanent residency (Murdie &amp; Logan, 2011).</p></li></ul>\n<p>Research in Canada's largest gateway cities suggests that new immigrants and refugees are often at a disadvantage in the housing rental and ownership market. Affordable and adequate housing options can be limited due to biases and discriminatory practices that can limit where new immigrants are offered options to live. In turn, this can lead to the creation and continuation of segregated areas where racialized and ethnic minorities tend to live (Teixeria &amp; Drolet, 2016).</p>\n<ul>\n<li><p>Certain visible minority groups are also more likely to experience precarious housing upon arrival in Canada (Murdie, 2010). In a study conducted in Toronto, Vancouver and Montreal, <strong>more than 20%</strong> of participants reported discrimination as a barrier to obtaining adequate housing (Hiebert, 2011).</p></li></ul>\n<h4 id=\"the-risk-factors-for-experiencing-inadequate-housing-among-immigrants-and-refugees-include\">The risk factors for experiencing inadequate housing among immigrants and refugees include:</h4>\n<h4 id=\"initial-settlement-location\">Initial settlement location</h4>\n<blockquote>\n<p>Many individuals settle in marginalized areas with poor housing conditions because of a lack of affordable housing in areas where recent immigrants and refugees tend to live.</p>\n</blockquote>\n<h4 id=\"health-status\">Health status</h4>\n<blockquote>\n<p>Immigrants and refugees tend to experience declining physical and mental health after arrival in Canada, which may result in limited housing options.</p>\n</blockquote>\n<h4 id=\"social-support\">Social support</h4>\n<blockquote>\n<p>Certain groups of immigrants and refugees with limited social support may experience homelessness. Those with large networks may share accommodations as a coping strategy, resulting in hidden homelessness.</p>\n<p>(Newbold, 2010)</p>\n</blockquote>\n<h2 id=\"discrimination-and-racism\">Discrimination and racism</h2>\n<p>The concepts of discrimination and racism are complex and occur at the structural and individual levels. Discrimination refers to inequitable or unjust treatment of individuals or groups based on factors such as race/ethnicity, class, gender, sexuality, ability, age and/or health status that results in social inequalities (King, 1996; McKenzie &amp; Bhui, 2007; Pincus, 1996).</p>\n<p>The definition of discrimination includes “treatment” or “action” that is different for groups of people based on a status that has been socially constructed, which may cause harm or disadvantage (Ibid.).</p>\n<p>If individual discrimination is considered to be an action, then structural discrimination is considered to be the way the system operates. In other words, structural discrimination refers to inequitable outcomes for different social groups which are produced by social, institutional and organizational actions, procedures and practices that may act individually or together (King, 1996; Pincus, 1996).</p>\n<h4 id=\"mental-health-problems-and-illnesses-can-be-affected-by-various-forms-of-discrimination-including-but-not-limited-to\">Mental health problems and illnesses can be affected by various forms of discrimination, including but not limited to:</h4>\n<ul>\n<li><p>Race</p></li>\n<li><p>Ethnicity</p></li>\n<li><p>Sexual orientation and gender identity</p></li>\n<li><p>Religion</p></li>\n<li><p>Disability</p></li>\n<li><p>Country of origin</p></li></ul>\n<p>The definition of racism says that it is the belief that some races are inherently superior to others (be it physically, intellectually, or culturally) and therefore have a right to dominate them. Racism is of particular concern for some immigrant and refugee populations.</p>\n<p>A body of evidence highlights the experiences of race-based discrimination leading to poorer mental health status such as depression, anxiety, PTSD and psychosis (Beiser, 2005; Noh et al., 1999; Karelsen et al., 2015; Hyman, 2009; Hansson et al., 2010). This has significant implications for immigrants and refugees as an increasing number of people entering Canada are from racialized groups (Mental Health Commission of Canada, 2019).</p>\n<h4 id=\"race-based-discrimination-includes-both-overt-and-subtle-discrimination-the-effect-of-each-can-differ\">Race-based discrimination includes both overt and subtle discrimination; the effect of each can differ:</h4>\n<h4 id=\"covert-or-subtle-racism\">Covert (or subtle) racism</h4>\n<blockquote>\n<p>is defined as “cool,” “distant” and indirect in nature.</p>\n</blockquote>\n<h4 id=\"overt-or-blatant-racism\">Overt (or blatant) racism</h4>\n<blockquote>\n<p>is “hot,” “close” and direct.</p>\n</blockquote>\n<p>(Noh et al., 2007; Pettigrew &amp; Meertens, 1995)</p>\n<h4 id=\"covert-racism-is-usually-expressed-in-three-ways-that-are-thought-to-be-normative-and-acceptable\">Covert racism is usually expressed in three ways that are thought to be normative and acceptable:</h4>\n<ul>\n<li><p>In defence of traditional values: “others” are seen to act in unacceptable ways.</p></li>\n<li><p>The exaggeration of cultural differences: the use of gross stereotypes.</p></li>\n<li><p>Denial of positive emotions toward individuals who are not from your group.</p></li>\n</ul>\n<p>(Pettigrew &amp; Meertens, 1995: 58)</p>\n<p>Subtle racism causes significant stress by creating uncertainty in terms of one's social identity (Noh et al., 2007).</p>\n<h4 id=\"overt-racism-includes\">Overt racism includes:</h4>\n<ul>\n<li><p>The belief in racial superiority.</p></li>\n<li><p>Opposition to intimate contact with the other group(s).</p></li>\n</ul>\n<p>Research has found direct linkages between overt racism and the loss of positive feelings in immigrants.</p>\n<h3 id=\"discrimination-or-perceived-discrimination-negatively-affects-physical-and-mental-health.pascoe-richman-2009\">Discrimination, or perceived discrimination, negatively affects physical and mental health.<strong>(Pascoe &amp; Richman, 2009)</strong></h3>\n<h4 id=\"there-are-three-pathways-in-which-this-occurs\">There are three pathways in which this occurs:</h4>\n<ol type=\"1\">\n<li><p>Perceived discrimination can have a direct effect on mental and physical health.</p></li>\n<li><p>Perceived discrimination and mental and physical health can be mediated by psychological and physiological stress responses such as decreased positive emotion and increased negative emotion, or cardiovascular reactivity and cortisol responses, respectively. Continuous experiences of perceived discrimination can cause these responses to be activated on a more regular basis, which can impact mental and physical health.</p></li>\n<li><p>Perceived discrimination can lead to health risk behaviours that emerge as possible coping mechanisms, which can have detrimental effects on health.</p></li></ol>\n<p>Social support, stigma identification and coping style can moderate the relationship between perceived discrimination and health.</p><p>Although discrimination and racism involve discussion of unjust treatment, a related discussion could be the importance of having hope and a reason to exist, an idea from Indigenous wellness wheels. Indigenous wellness wheels acknowledge that societal structures should ensure that all individuals have a sense of belonging and a sense of purpose, which in turn acts as an important social determinant of health (Assembly of First Nations &amp; Health Canada, 2015)..</p>\n\n\n\n","words":2759},{"id":"s15","mod":1,"title":"Case Study: Ibraheem's First Winter in Canada","html":"<h3 id=\"imagine-this-scenario\">Imagine this scenario</h3>\n<p>Read the case scenario below, then reflect on the questions that follow.</p>\n<p>Ibraheem, his wife and two children arrived from Afghanistan via Peshawar, Pakistan this past winter after fleeing violence in Kabul due to the civil war. They arrived seeking asylum and made a refugee protection claim from within Canada's border. Ibraheem was fearful of persecution if he returned to Afghanistan as he worked as a translator for NATO forces in Kabul, and was seen as a traitor by some people close to his community for the work he was doing.</p>\n<p>Ibraheem and his family are currently awaiting their refugee hearing at the Immigration and Refugee Board to see if they are eligible for refugee status. It is a cold winter and they had never imagined the winter could be so brutal. They are currently living with another Afghan family but they will not be able to stay with this family permanently. Ibraheem is looking for work, but finding a job as a translator is not a skill needed here. Currently he is working in a warehouse in the evenings, but doesn't get to see his wife or kids very much. His wife is taking English classes during the day and hopes to find work once her classes are completed. He is very stressed about finding housing, and a job that will support his family. He has a pharmacy degree from Afghanistan but has difficulty finding a job here. In addition, he is feeling anxious about the upcoming refugee hearing. He is feeling very sad and hopeless about the future.</p>\n<h4>Reflect on these questions</h4><div class=\"reflect\"><p><b>1.</b> What are the risk and protective factors?</p></div><div class=\"reflect\"><p><b>2.</b> What is the impact of migration?</p></div><div class=\"reflect\"><p><b>3.</b> Do you think a diagnosed mental disorder exists? Or is this mental distress?</p></div><div class=\"reflect\"><p><b>4.</b> What types of supports do you think would be of benefit?</p></div><div class=\"reflect\"><p><b>5.</b> What kind of referrals would you make, if deemed necessary?</p></div>\n\n\n\n","words":513},{"id":"s16","mod":1,"title":"Module Recap and Key Takeaways","html":"<p>This module provided a brief overview of Canada's mental health system, including the prevalence of mental illness, its effects and the legislation that affects clients. This module also introduced information on mental illness among the general population compared to that of immigrants and refugees, and examined the effects of social determinants of health and migration on newcomer populations.</p>\n<p>Immigrants and refugees have higher incidence rates than the general population for some mental disorders, while for other disorders there is no significant difference in rates between newcomers and the general population. Deeper analysis showed that specific immigrant subgroups have higher incidence rates of certain disorders (e.g., schizophrenia) than both fellow migrants from other regions and the general population. Such variability demonstrates the need to consider the differences within the immigrant and refugee population and their experiences of mental illness. This further emphasizes how a one-size-fits-all approach to mental health care and support cannot work.</p>\n<h3 id=\"repository-of-resources\">Repository of Resources</h3>\n<p>Congratulations on finishing Module 1. Please note that, while you revisit this module over the six weeks of the course, course content will no longer be available once your course session has ended. We welcome you to visit the repository of online course resources at any point to access resources from Module 1: Migration, Settlement and the Social Determinants of Mental Health.</p>\n<p><a href=\"https://www.camh.ca/en/professionals/professionals--projects/immigrant-and-refugee-mental-health-project/courses/course-resources\"><strong>Access the Repository of Resources</strong></a></p>\n<p>The next module examines the most common mental disorders experienced by immigrants and refugees in Canada.</p>\n","words":243},{"id":"s17","mod":1,"title":"References and Further Reading","html":"<h4 id=\"understanding-mental-health-in-canada\">1.1 — Understanding mental health in Canada</h4>\n<ul>\n<li><p>Canadian Mental Health Association. (2014). <em>Stigma and Discrimination Around Mental Health and Substance Use Problems.</em> HeretoHelp.</p></li>\n<li><p>Angus Reid Institute. (2020, April 27). <em>Worry, Gratitude &amp; Boredom: As COVID-19 affects mental, financial health, who fares better; who is worse?</em> Retrieved from <a href=\"https://angusreid.org/covid19-mental-health/\" class=\"uri\">https://angusreid.org/covid19-mental-health/</a></p></li>\n<li><p>Assembly of First Nations &amp; Health Canada. (2015). <em>First Nations Mental Wellness Continuum Framework.</em> Retrieved from: <a href=\"https://thunderbirdpf.org/?resources=first-nations-mental-wellness-continuum-framework\">https://thunderbirdpf.org/wp-content/uploads/2015/01/24-14-1273-FN-MentalWellness-Framework-EN05_low.pdf</a></p></li>\n<li><p>Canadian Mental Health Association. (2021, July 19). <em>Fast Facts about Mental Health and Mental Illness.</em> Retrieved from CMHA: <a href=\"https://cmha.ca/brochure/fast-facts-about-mental-illness/\" class=\"uri\">https://cmha.ca/brochure/fast-facts-about-mental-illness/</a></p></li>\n<li><p>Mental Health Commission of Canada. (2017). <em>Strengthening the Case for Investing in Canada's Mental Health System: Economic Considerations.</em>Ottawa: Mental Health Commission of Canada. Statistics Canada. (2015, November 30).</p></li>\n<li><p>Statistics Canada. (2015, November 30). <em>Disability in Canada: Initial findings from the Canadian Survey on Disability.</em> Retrieved from Statistics Canada: <a href=\"https://www150.statcan.gc.ca/n1/pub/89-654-x/89-654-x2013002-eng.htm\" class=\"uri\">https://www150.statcan.gc.ca/n1/pub/89-654-x/89-654-x2013002-eng.htm</a></p></li>\n<li><p>Statistics Canada. (2019, July 18). <em>Suicide in Canada: Key statistics (infographic).</em> Retrieved from Government of Canada:</p></li>\n<li><p>Statistics Canada. 2021. <em>Survey on COVID-19 and Mental Health, February to May 2021.</em> Retrieved from: <a href=\"https://www150.statcan.gc.ca/n1/daily-quotidien/210927/dq210927a-eng.htm\" class=\"uri\">https://www150.statcan.gc.ca/n1/daily-quotidien/210927/dq210927a-eng.htm</a></p></li>\n<li><p>Statistics Canada. 2020. <em>Impacts on Mental Health.</em> Retrieved from: <a href=\"https://www150.statcan.gc.ca/n1/pub/11-631-x/2020004/s3-eng.htm\" class=\"uri\">https://www150.statcan.gc.ca/n1/pub/11-631-x/2020004/s3-eng.htm</a></p></li>\n<li><p>Mental Health Commission of Canada (2014). <em>Why investing in mental health will contribute to Canada's economic prosperity and to the sustainability of our health care system.</em> Retrieved from <a href=\"https://www.mentalhealthcommission.ca/wp-content/uploads/drupal/MHStrategy_CaseForInvestment_ENG_0_1.pdf\" class=\"uri\">https://www.mentalhealthcommission.ca/wp-content/uploads/drupal/MHStrategy_CaseForInvestment_ENG_0_1.pdf</a>.</p></li>\n</ul>\n<h4 id=\"understanding-immigration-in-canada\">1.2 — Understanding immigration in Canada</h4>\n<ul>\n<li><p>Mental Health Commission of Canada. (2017). <em>Strengthening the Case for Investing in Canada's Mental Health System: Economic Considerations.</em> Ottawa: Mental Health Commission of Canada. Statistics Canada. (2015, November 30).</p></li>\n<li><p><em>Disability in Canada: Initial findings from the Canadian Survey on Disability.</em> Retrieved from Statistics Canada: <a href=\"https://www150.statcan.gc.ca/n1/pub/89-654-x/89-654-x2013002-eng.htm\" class=\"uri\">https://www150.statcan.gc.ca/n1/pub/89-654-x/89-654-x2013002-eng.htm</a></p></li>\n<li><p>Canadian Mental Health Association. (2021, July 19). Fast Facts about Mental Health and Mental Illness. Retrieved from CMHA: <a href=\"https://cmha.ca/brochure/fast-facts-about-mental-illness/\" class=\"uri\">https://cmha.ca/brochure/fast-facts-about-mental-illness/</a></p></li>\n<li><p>Statistics Canada. (2019, July 18). <em>Suicide in Canada: Key statistics (infographic).</em> Retrieved from Government of Canada: <a href=\"https://www.canada.ca/en/public-health/services/publications/healthy-living/suicide-canada-key-statistics-infographic.html\" class=\"uri\">https://www.canada.ca/en/public-health/services/publications/healthy-living/suicide-canada-key-statistics-infographic.html</a></p></li>\n</ul>\n<h4 id=\"mental-health-of-immigrants-and-refugees\">1.3 — Mental health of immigrants and refugees</h4>\n<ul>\n<li><p>Alegría, M., NeMoyer, A., Falgas, I., Wang, Y., &amp; Alvarez, K. (2018). <em>Social Determinants of Mental Health: Where We Are and Where We Need to Go.</em> Current Psychiatry Reports, 20(11).</p></li>\n<li><p>American Psychological Association. (2017). <em>Stress and Health Disparities: Contexts, Mechanisms, and Interventions Among Racial/Ethnic Minority and Low Socioeconomic Status Populations.</em> Washington, DC. Retrieved from <a href=\"https://www.apa.org/pi/health-equity/resources/stress-report\" class=\"uri\">https://www.apa.org/pi/health-equity/resources/stress-report</a></p></li>\n<li><p>Carroll, H., Luzes, M., Freier, L. F., &amp; Bird, M. D. (2020). <em>The migration journey and mental health: Evidence from Venezuelan forced migration.</em> SSM - Population Health.</p></li>\n<li><p>Cassidy, H. (2022). <em>The labor market impact of Covid-19 on immigrants.</em> IZA World of Labor.</p></li>\n<li><p>Compton, M. T., &amp; Shim, R. S. (2015). <em>The Social Determinants of Mental Health.</em> Focus, 13(4), 419 - 425.</p></li>\n<li><p>Farahani, H., Joubert, N., Anand, J. C., Toikko, T., &amp; Tavakol, M. (2021). <em>A Systematic Review of the Protective and Risk Factors Influencing the Mental Health of Forced Migrants: Implications for Sustainable Intercultural Mental Health Practice.</em> Social Sciences, 334.</p></li>\n<li><p>Government of Canada. (2020, October 07). <em>Social determinants of health and health inequalities.</em> Retrieved from Government of Canada: <a href=\"https://www.canada.ca/en/public-health/services/health-promotion/population-health/what-determines-health.html\" class=\"uri\">https://www.canada.ca/en/public-health/services/health-promotion/population-health/what-determines-health.html</a></p></li>\n<li><p>Hynie, M. (2017). <em>The Social Determinants of Refugee Mental Health in the Post-Migration Context: A Critical Review.</em> The Canadian Journal of Psychiatry, 297 - 303.</p></li>\n<li><p>Immigration, Refugees and Citizenship. (2018). <em>2018 Annual Report to Parliament on Immigration.</em> Her Majesty the Queen in Right of Canada.</p></li>\n<li><p>Jaime Ballard, E. W. (2019). <em>Immigrant and Refugee Families, 2nd Ed.</em> Minneapolis, MN: University of Minneapolis Libraries Publishing.</p></li>\n<li><p>Kaida, L., Hou, F., &amp; Stick, M. (2020). <em>The Long-term Economic Outcomes of Refugee Private Sponsorship.</em> Statistics Canada.</p></li>\n<li><p>Kim, Y.-M., &amp; Cho, S.-i. (2020). <em>Socioeconomic status, work-life conflict, and mental health.</em> American Journal of Industrial Medicine, 703 - 712.</p></li>\n<li><p>Mental Health Commission of Canada. <em>(2019). Immigrant, refugee, ethnocultural and racialized populations and the social determinants of health: A Review of 2016 Census Data.</em> Mental Health Commission of Canada.</p></li>\n<li><p>Ng, E., &amp; Zhang, H. (2020, August 19). <em>The mental health of immigrants and refugees: Canadian evidence from a nationally linked database.</em> Retrieved from Statistic Canada: <a href=\"https://www150.statcan.gc.ca/n1/pub/82-003-x/2020008/article/00001-eng.htm\" class=\"uri\">https://www150.statcan.gc.ca/n1/pub/82-003-x/2020008/article/00001-eng.htm</a></p></li>\n<li><p>Picot, G., Zhang, Y., &amp; Hou, F. (2019). <em>Labour Market Outcomes Among Refugees to Canada.</em> Statistics Canada.</p></li>\n<li><p>Randle, J., Hu, Z., &amp; Thurston, Z. (2021). <em>Housing experiences in Canada: Recent Immigrants in 2018.</em> Statistics Canada.</p></li>\n<li><p>Reiss, F., Meyrose, A.-K., Otto, C., Lampert, T., Klasen, F., &amp; Ravens-Sieberer, U. (2019). <em>Socioeconomic status, stressful life situations and mental health problems in children and adolescents: Results of the German BELLA cohort-study.</em> PLoS One, 14(3).</p></li>\n<li><p>Salami, B. (2017). <em>“Mental health of immigrants and non-immigrants in Canada: Evidence from the Canadian Health Measures Survey and service provider interviews in Alberta.</em> Alberta. Retrieved from <a href=\"https://policywise.com/wp-content/uploads/resources/2017/04/2017-04APR-27-Scientific-Report-15SM-SalamiHegadoren.pdf\" class=\"uri\">https://policywise.com/wp-content/uploads/resources/2017/04/2017-04APR-27-Scientific-Report-15SM-SalamiHegadoren.pdf</a></p></li>\n<li><p>Statistics Canada. (2021). <em>Dictionary, Census of Population, 2021, Census year 2021.</em> Statistics Canada Catalogue no. 98-301-X2021001 Retrieved from: <a href=\"https://www12.statcan.gc.ca/census-recensement/2021/ref/dict/index-eng.cfm\" class=\"uri\">https://www12.statcan.gc.ca/census-recensement/2021/ref/dict/index-eng.cfm</a></p></li>\n<li><p>United Nations High Commissioner for Refugees (UNHCR, 2021b). <em>Master Glossary of Terms.</em> Retrieved from: <a href=\"https://www.unhcr.org/master-glossary.html\" class=\"uri\">https://www.unhcr.org/master-glossary.html</a></p></li>\n<li><p>WHO. (2021, August 31). <em>Mental health and forced displacement.</em> Retrieved from World Health Organization: <a href=\"https://www.who.int/news-room/fact-sheets/detail/mental-health-and-forced-displacement\" class=\"uri\">https://www.who.int/news-room/fact-sheets/detail/mental-health-and-forced-displacement</a></p></li>\n</ul>\n\n","words":783},{"id":"s18","mod":2,"title":"Module Overview and Learning Focus","html":"<p>Module 2 develops your knowledge of mental health problems and illnesses in Canada. It examines the most common mental disorders experienced by immigrants and refugees. It also explores the prevalence and effects of mental health problems and illnesses on immigrants and refugees.</p>\n<p>The module outlines the main symptoms for the six most common mental disorders and the similarities and differences in prevalence among key groups within the immigrant and refugee population. Note: This module aims to provide a brief introduction only and should not be substituted for professional clinical diagnoses.</p>\n<h5 id=\"this-module-contains-two-sections\">This module contains two sections:</h5>\n<ol type=\"1\">\n<li><p>Understanding mental health and mental illness</p></li>\n<li><p>Common mental disorders</p></li></ol>\n<h2 id=\"learning-objectives\">Learning objectives</h2>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to:</h5>\n<ul>\n<li><p>Describe the continuum of mental health and mental illness.</p></li>\n<li><p>Describe the prevalence of mental health problems and illness among immigrant and refugee populations.</p></li>\n<li><p>Recognize the effects of mental health problems and illness and common misconceptions about them.</p></li>\n<li><p>Identify the symptoms and effects of six common mental disorders experienced by immigrants and refugees in Canada.</p></li>\n<li><p>Describe the main similarities and differences in prevalence for each of the six common mental health disorders.</p></li>\n</ul>\n","words":190},{"id":"s19","mod":2,"title":"Understanding Distress and Mental Illness","html":"<p>Although mental disorders may have a negative effect on the aspects of life that are important to successful settlement and integration, the stressors associated with the migration experience do not necessarily result in newcomers developing a mental disorder. Like most individuals, newcomers will experience distress when faced with some of life's challenges, but that distress does not usually lead to a mental disorder.</p>\n\n","words":76},{"id":"s20","mod":2,"title":"The Mental Health and Mental Illness Continuums","html":"<h3 id=\"mental-health\">Mental health:</h3>\n<p>is a positive concept and is more than the absence of a mental disorder. It is “a state of well-being in which the individual realizes their own abilities, can cope with the normal stresses of life, can work productively and fruitfully, and is able to make a contribution to their community” (WHO, 2018). Mental health is about feeling good and functioning well (CMHA, 2020):</p>\n<ul>\n<li><p>Feeling good entails happiness, life satisfaction and other positive states.</p></li>\n<li><p>Functioning well entails being engaged in meaningful activities, positive relationships with others, self-acceptance, autonomy and having purpose in life.</p></li></ul>\n<h3 id=\"mental-illness-or-mental-disorder\">Mental illness (or mental disorder):</h3>\n<p>is a recognized, medically diagnosable illness that is characterized by alterations in thinking, mood or behaviour associated with significant distress and impaired functioning (Government of Canada, 2006: 2).</p>\n<p>Mental health is on a continuum from optimal to poor, while mental illness is on a continuum from extremely severe symptoms to no symptoms. Between these are a range of different situations where symptoms are present to various degrees. As a result, an individual can have optimal mental health with or without mental illness, or poor mental health with or without a mental illness.</p>\n<h5 id=\"mental-health-and-mental-illness-are-not-mutually-exclusive.-they-can-each-be-considered-as-separate-but-related-continuums-as-shown-below\">Mental health and mental illness are not mutually exclusive. They can each be considered as separate but related continuums, as shown below:</h5>\n<h5 id=\"optimal-mental-health\">Optimal mental health</h5>\n<p>Optimal mental health with no symptoms of mental illness</p>\n<p>Optimal mental health with presence of mental illness</p>\n<p>Serious mental illness with poor mental health</p>\n<p>Poor mental health with no symptoms of mental illness</p>\n<h5 id=\"poor-mental-health\">Poor mental health</h5>\n<h5 id=\"serious-mental-illness\">Serious mental illness</h5>\n<h5 id=\"no-symptoms-of-mental-illness\">No symptoms of mental illness</h5>\n<p>  Image 1-1: The continuums of mental health and mental illness (CMHA, 2018) (Adapted from “What is Mental Health and Mental Illness?” by the Canadian Mental Health Association, www.ontario.cmha.ca. © Canadian Mental Health Association, Ontario; 2018. Reprinted with permission.)</p>\n<h2 id=\"resilience-and-mental-health\">Resilience and mental health</h2>\n<p>Resilience is described as adaptation and coping as a response to adversity. Resilience has been shown to be linked to both individual characteristics (e.g., personality, cognitive ability) and external influences (e.g., family, school, peers) (Pashang et al., 2019). In terms of its relation to mental health, resilience is positively correlated with positive mental health outcomes (e.g., well-being, life satisfaction) (Satici, 2016); it is negatively correlated with, and partially correlated with, the relationship between mental illness, including depression and anxiety, among others (Shapiro et al, 2019).</p>\n<p>Resilience includes two main factors that influence the level of coping, those that challenge and that promote resilience.</p>\n\n<h5 id=\"resilience-challenging-factors-include\">Resilience-challenging factors include:</h5>\n<ul>\n<li><p>Shifts in immigration policies to defund settlement and social support services</p></li>\n<li><p>Lengthy and confusing refugee claim processes</p></li>\n<li><p>Family-level challenges such as parental coping difficulties (language, culture, immigration process)</p></li>\n<li><p>Education-level challenges such as disruption of school for refugee children</p></li>\n<li><p>Socioeconomic status</p></li>\n<li><p>Immigration status</p></li>\n<li><p>Gender</p></li>\n</ul>\n<blockquote>\n<p>(Pashang et al., 2019)</p>\n</blockquote>\n\n<h5 id=\"resilience-promoting-factors-include\">Resilience-promoting factors include:</h5>\n<ul>\n<li><p>Social support that is culturally sensitive and adapted</p></li>\n<li><p>Religious beliefs</p></li>\n<li><p>Community and family support</p></li>\n<li><p>Personal qualities that help individuals respond to highly adverse circumstances (e.g. emotional management, composure, self-control, self-compassion)</p></li>\n</ul>\n<blockquote>\n<p>(Ciaramella et al., 2021)</p>\n</blockquote>\n","words":493},{"id":"s21","mod":2,"title":"How Common Are Mental Health Conditions Among Newcomers?","html":"<p>Among the general Canadian population, the most common mental disorders are <strong>depression, anxiety, posttraumatic stress disorder, psychosis</strong> and <strong>substance use disorder.</strong></p>\n<p>A systematic review examining several studies found that the most common mental disorders in first-generation immigrants are depression, anxiety and posttraumatic stress disorder (Close et al., 2016). The prevalence of these mental disorders varies widely based on complex factors, including pre-immigration experiences.</p>\n<p>According to a recent systematic review on mental disorders among refugees, the prevalence rates of depression, anxiety and posttraumatic stress disorder were typically 20% and over (Ibid.). Some studies have also found higher rates of psychosis and substance use problems among immigrants and refugees than in the general population (Durbin , Lin, Taylor, &amp; Callaghan, 2011; Parrett &amp; Mason, 2010; Kirmayer et al., 2011a; Kroll et al., 2011; Anderson et al., 2015; Brandt, et al., 2019).</p>\n<p>Again, it is important to keep in mind that the prevalence of mental disorders varies greatly between and among immigrant and refugee subpopulations.</p>\n<div class=\"wide\"><h2>Review questions</h2><p>Select the answers you think are correct, then press Check answer.</p><div class=\"mcq\" data-fb=\"All of these areas can be affected, which is why a whole-person view matters.\" data-ms=\"1\"><h4>Mental health changes can affect many areas of a person's life. Select all that apply.</h4><button class=\"opt\" data-ok=\"1\">Appetite</button><button class=\"opt\" data-ok=\"1\">Energy levels</button><button class=\"opt\" data-ok=\"1\">Life satisfaction</button><button class=\"opt\" data-ok=\"1\">Physical health</button><button class=\"opt\" data-ok=\"1\">Relationships</button><button class=\"opt\" data-ok=\"1\">Sleep</button><button class=\"chk\">Check answer</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"A systematic review found depression, anxiety and posttraumatic stress disorder are the most common.\" data-ms=\"1\"><h4>The most common mental health problems in first-generation migrants are (select all that apply):</h4><button class=\"opt\">Anorexia</button><button class=\"opt\" data-ok=\"1\">Anxiety</button><button class=\"opt\" data-ok=\"1\">Depression</button><button class=\"opt\">Gambling problems</button><button class=\"opt\" data-ok=\"1\">Posttraumatic stress disorder</button><button class=\"chk\">Check answer</button><div class=\"fb\"></div></div></div>","words":221},{"id":"s22","mod":2,"title":"Understanding Depression","html":"<p>There are many forms of depressive disorders, including major depressive disorder and postpartum depression. The common feature of all of these disorders is the presence of a sad or irritable mood, which is accompanied by somatic and cognitive changes that significantly affect the individual's capacity to function. The types of depressive disorders differ in terms of the duration, timing and associated factors.</p>\n<h5 id=\"the-most-common-symptoms-of-depressive-disorders-include\">The most common symptoms of depressive disorders include:</h5>\n<ul>\n<li><p>Depressed mood or hopelessness most of the day</p></li>\n<li><p>Decreased interest or pleasure in most activities</p></li>\n<li><p>Significant weight change or change in appetite</p></li>\n<li><p>Change in sleep patterns</p></li>\n<li><p>Fatigue or loss of energy</p></li>\n<li><p>Feelings of guilt/worthlessness</p></li>\n<li><p>Diminished ability to think or concentrate</p></li>\n<li><p>Thoughts of suicide</p></li></ul>\n<p>When considering signs or symptoms of depression, it may be helpful to keep in mind the possibility of manifestations through cultural idioms. The table below outlines some common cultural idioms associated with depression as identified by the American Psychiatric Association's DSM-5. Of course, these somatic complaints are not universal to clients identifying with the ethnic groups noted; they are presented simply as examples.</p>\n<table><thead><tr><th>Culture</th><th>Common somatic complaints</th></tr></thead><tbody><tr><td>Chinese and Asian</td><td>Weakness, tiredness, “imbalance”</td></tr><tr><td>Latino and Mediterranean</td><td>“Nerves,” headaches</td></tr><tr><td>Middle Eastern</td><td>Problems of the “heart”</td></tr></tbody></table><p>(APA, 2000)</p>\n<p>Some cultural groups report higher rates of somatic symptoms than others, leading to discussion on whether North American or European-trained psychiatrists may miss diagnoses in groups less likely to report more classic symptoms of depression. It is important to keep in mind that the symptoms of depression can be quite variable. Although sadness may be clearly present, the possibility of depression should be considered when there is a change an individual's level of functioning for no apparent reason.</p>\n<h3 id=\"rates-similarities-and-differences\">Rates: Similarities and differences</h3>\n<p>Rates of reported depression differ widely across countries and ethnocultural groups. The rate of depression in an individual's country of origin is not a reliable predictor of whether an immigrant will suffer from depression in the host country. Rates vary significantly among immigrant groups. Immigrants generally have lower rates of depression than the general population; however, with a longer stay in Canada, the rate tends to match that of the general population.</p>\n<p>Refugees have higher rates of depression compared to the general population, although this can depend on the specific refugee group in question (Turrini et al., 2017; Blackmore et al., 2020).</p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Some people say plainly that they feel depressed, while others describe physical symptoms such as aches, tiredness or &quot;nerves&quot;.\"><h4>Culture influences how clients describe their symptoms, and people may present distress in different ways. Some people will say in a direct way, that they feel depressed. However, some people may use physical metaphors such as pain to present their distress.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n\n","words":428},{"id":"s23","mod":2,"title":"Understanding Anxiety","html":"<p>Anxiety disorders include several types of disorders that differ from more typical feelings of nervousness or worry. Anxiety disorder diagnoses encompass reports of excessive fear or anxiety that are out of proportion to the situation and that hinder daily functioning for specified periods of time (APA, 2017a).</p>\n<h4 id=\"these-disorders-include\">These disorders include:</h4>\n<h4 id=\"generalized-anxiety-disorder\">Generalized anxiety disorder</h4>\n<blockquote>\n<p>Excessive, uncontrollable and often irrational worry around a range of concerns, accompanied by other physical or cognitive symptoms.</p>\n</blockquote>\n<h4 id=\"specific-phobias\">Specific phobias</h4>\n<blockquote>\n<p>Excessive fear of a specific thing or situation, such as excessive fear of spiders or heights.</p>\n</blockquote>\n<h4 id=\"panic-disorder\">Panic disorder</h4>\n<blockquote>\n<p>sudden periods of intense fear characterized by recurrent unexpected panic attacks.</p>\n</blockquote>\n<h4 id=\"agoraphobia\">Agoraphobia</h4>\n<blockquote>\n<p>Excessive fear of being in an overcrowded space.</p>\n</blockquote>\n<h4 id=\"social-anxiety-disorder\">Social anxiety disorder</h4>\n<blockquote>\n<p>Excessive fear of social gatherings and being scrutinized by others.</p>\n<p>(APA, 2017)</p>\n</blockquote>\n<h5 id=\"the-physical-and-emotional-symptoms-that-can-accompany-anxiety-disorders-are-due-to-the-release-of-adrenaline-in-the-body.-they-include\">The physical and emotional symptoms that can accompany anxiety disorders are due to the release of adrenaline in the body. They include:</h5>\n<h4 id=\"physiological-symptoms\">Physiological symptoms</h4>\n<blockquote>\n<p>Such as heart palpitations, sweating, dizziness, muscle tension, nausea, numbness or tingling in the hands or feet, or shortness of breath.</p>\n</blockquote>\n<h4 id=\"emotional-symptoms\">Emotional symptoms</h4>\n<blockquote>\n<p>Such as restlessness, feelings of panic, fear, uneasiness or a sense of impending doom.</p>\n</blockquote>\n<h3 id=\"rates-similarities-and-differences\">Rates: Similarities and differences</h3>\n<p>Over 30% of the general adult population will experience an anxiety disorder during their lifetime (APA, 2017a). Anxiety disorders are highly comorbid with one another, as well as with other disorders such as depression and posttraumatic stress disorder (APA, 2013; Bogic et al., 2015; CMHA, 2016). Refugees and asylum seekers experience a higher prevalence of diagnosed and self-reported anxiety (13% and 2% respectively) (Henkelmann et al, 2020), as do immigrants in general (28%), compared to the non-war affected general population (Lindert et al., 2009).</p>\n<p>Although longer-term immigrants in Canada between the ages of 18 and 59 exhibit a lower risk of anxiety disorders, this protective effect is significantly less marked for recent immigrant categories (Aglipay et al., 2013). This remains the case in regards to the impacts of COVID-19 on immigrants' mental health, with recent immigrants reporting fair or poor mental health compared to established immigrants and the Canadian-born population (Evra &amp; Mongrain, 2020).</p>\n<p>There also appear to be differences between immigrant and non-immigrant groups within the same ethnic group. For instance, a study found that South Asian immigrants report statistically significantly higher rates of diagnosed anxiety disorders (3.44%) compared to the Canadian-born South Asian population (1.09%) (Islam et al., 2014)</p>\n<h3 id=\"assessment\">Assessment</h3>\n<h5 id=\"it-is-important-to-consider-both-culture-and-context-when-assessing-for-anxiety-disorders.\">It is important to consider both culture and context when assessing for anxiety disorders.</h5>\n\n<h3 id=\"culture\">Culture</h3>\n<blockquote>\n<p>There are considerable cultural variations in the expression of anxiety disorders. Different cultural groups express mental disorders, including anxiety disorders, according to their own understanding of the body's functioning.</p>\n</blockquote>\n<h5 id=\"for-example\">For example:</h5>\n<ul>\n<li><p>Cambodians may show anxiety-related symptoms that are based on fears of disturbed “inner wind” and blood flow. These events, called “wind attacks,” are characterized by a mix of panic attack symptoms, such as dizziness and culture-specific symptoms, such as tinnitus and neck soreness (Hofmann &amp; Hinton, 2014).</p></li>\n<li><p>Individuals of Latin American descent may show evidence of a cultural syndrome known as “ataque de nervios” (attack of nerves). These attacks are characterized by a sense of being out of control and frequently occur as a direct result of a stressful event relating to the family (APA, 2013c).</p></li>\n\n\n</ul>\n<h3 id=\"context\">Context</h3>\n<blockquote>\n<p>Social norms and expectations can influence fear of certain situations. An individual's sociocultural context should be considered during assessment.</p>\n</blockquote>\n<h5 id=\"for-example-1\">For example:</h5>\n<ul>\n<li><p>In cultures where women have limited access to public life and are confined to their homes, agoraphobia may not be an appropriate diagnosis.</p></li>\n<li><p>Fears of the dark may be reasonable in a context of ongoing violence, and may not indicate a phobia.</p></li>\n<li><p>Behaviours that appear socially anxious may be a sign of respect and may be appropriate in certain cultures.</p></li>\n</ul>\n<blockquote>\n<p>(Ryder &amp; Kirmayer, 2016)</p>\n</blockquote>\n<p><a href=\"https://www.refugeehealthta.org/physical-mental-health/health-assessments/\"><strong>Learn more at Refugee Health Technical Assistance Center</strong></a></p>\n","words":629},{"id":"s24","mod":2,"title":"Trauma and Post-Traumatic Stress Disorder (PTSD)","html":"<p>Posttraumatic stress disorder (PTSD) can develop when a person witnesses or experiences a traumatic event (APA, 2017b). Having such experiences does not necessarily lead to developing PTSD; it is important to note that the most common outcome for individuals who have experienced trauma is recovery.</p>\n<p>There is some level of subjectivity to the experience of trauma since what may be traumatic for some people may not be for others. The perceived stressfulness of an event is an important determinant of the psychological outcome for survivors of traumatic events.</p>\n<h4 id=\"the-symptoms-of-ptsd-include\">The symptoms of PTSD include:</h4>\n<ul>\n<li><p>Repeated reliving of the traumatic event(s) through intrusive memories, flashbacks or nightmares.</p></li>\n<li><p>Persistent avoidance of stimuli associated with the traumatic event(s).</p></li>\n<li><p>Symptoms of autonomic hyperarousal such as irritability and an accentuated startle response.</p></li>\n<li><p>Negative alterations in mood or cognitions.</p></li></ul>\n<h3 id=\"the-migration-process-and-risks-for-ptsd\">The migration process and risks for PTSD</h3>\n<p>Migration-related traumas are likely a common experience for both refugees and many other immigrant populations (Perreira &amp; Ornelas, 2013).</p>\n\n<h4 id=\"demographic-socio-cultural-background\">Demographic &amp; socio-cultural background</h4>\n\n<h4 id=\"stage-of-migration\">Stage of Migration</h4>\n<blockquote>\n<p><strong>Pre-migration: </strong>Poverty, previous travel, parent-child separation</p>\n<p><strong>Migration: </strong>Age at migration, family presence, entry without authorization</p>\n<p><strong>Post-migration: </strong>Family support, social support, neighbourhood safety, discrimination, acculturation</p>\n</blockquote>\n\n<h4 id=\"trauma-exposure\">Trauma exposure</h4>\n\n<h4 id=\"symptoms-of-posttraumatic-stress\">Symptoms of posttraumatic stress</h4>\n<p>(UNHCR 2021)</p>\n<p>The highest risk of PTSD in refugees is associated with the post migration experience in Canada. Inadequate support and ongoing stressors after the trauma(s) account for the main differences in rates of PTSD in this population. Refugees who have experienced torture or severe violence generally have higher rates of trauma-related disorders (Porter &amp; Haslam, 2005; Hansson et al., 2010; Kirmayer et al., 2011a; Close et al., 2016).</p>\n<p>Not all refugees who have experienced potentially traumatic events will develop PTSD, as is true of immigrants (Perreira &amp; Ornelas, 2013). In most cases, approximately 80% experience natural recovery in the months and years after the trauma. Many individuals experiencing traumatic events will experience normal distress that is proportionate to the event, with no mental disorder (Rousseau et al., 2011).</p>\n","words":344},{"id":"s25","mod":2,"title":"Psychotic Disorders","html":"<p>A number of disorders, including schizophrenia, are classified under “schizophrenia and psychotic disorders,” whereas bipolar disorder is classified under “bipolar and related disorders” (APA, 2013b). Psychotic symptoms are sometimes summarized as a person losing touch with reality. For instance, with some of the symptoms, such as hallucinations and delusions, a person may see, hear, smell or taste something that is not there and/or have a fixed, false belief about something, not consistent with the beliefs of their culture.</p>\n<h4 id=\"signs-and-symptoms-of-psychosis-can-vary-from-person-to-person-and-may-change-over-time.-common-symptoms-include\">Signs and symptoms of psychosis can vary from person to person and may change over time. Common symptoms include:</h4>\n<h4 id=\"delusions\">Delusions</h4>\n<blockquote>\n<p>Belief in something untrue or not based on reality</p>\n</blockquote>\n<h4 id=\"hallucinations\">Hallucinations</h4>\n<blockquote>\n<p>Sensations that appear real, but are created by the mind</p>\n</blockquote>\n<h4 id=\"disorganized-speech-andor-thinking\">Disorganized speech and/or thinking</h4>\n<blockquote>\n<p>Speaking incoherently, responding to questions with unrelated answers, saying illogical things.</p>\n</blockquote>\n<h4 id=\"disorganized-or-catatonic-behaviours\">Disorganized or catatonic behaviours</h4>\n<blockquote>\n<p>State close to unconsciousness, rigid body, waxy flexibility, lack of verbal response.</p>\n</blockquote>\n<h4 id=\"depression\">Depression</h4>\n<blockquote>\n<p>Diminished emotional expression, motivation, speech, ability to experience pleasure and/or interest in social interactions.</p>\n<p>(APA, 2013)</p>\n</blockquote>\n<h3 id=\"rates-similarities-and-differences\">Rates: Similarities and differences</h3>\n<p>The rates of psychosis among first-generation immigrants are similar to that of the general population (Anderson et al., 2015). There are, however, inter-group differences among the immigrant population:</p>\n<ul>\n<li><p>Higher rates of schizophrenia have been found among immigrants from the Caribbean and Bermuda and among refugees from East Africa and South Asia (Anderson et al., 2015).</p></li>\n<li><p>Immigrants from northern and southern Europe and from East Asia are not at an increased risk of having psychotic disorders (Anderson et al., 2015).</p></li>\n</ul>\n<p>In comparison to immigrants, refugees have consistently higher rates of psychotic disorders regardless of the country of origin, except for refugee and non-refugee immigrants from sub-Saharan Africa, who have relatively the same high rates (Hollander et al, 2016).</p>\n","words":287},{"id":"s26","mod":2,"title":"Substance Use and Related Concerns","html":"<p>Substance use disorder is described as a “problematic pattern of using alcohol or another substance that results in impairment in daily life or noticeable distress” (APA, 2013).</p>\n<h5 id=\"to-be-diagnosed-with-a-substance-use-disorder-a-person-must-display-at-least-two-of-the-following-symptoms-within-a-12-month-period\">To be diagnosed with a substance use disorder, a person must display at least two of the following symptoms within a 12-month period:</h5>\n<h4 id=\"impaired-control\">Impaired control</h4>\n<blockquote>\n<p>Using a substance for longer or in a larger amount than intended; unsuccessfully reducing the use; and an excessive amount of cravings.</p>\n</blockquote>\n<h4 id=\"social-impairment\">Social impairment</h4>\n<blockquote>\n<p>Issues with work, school or family/friends as a consequence of the repeated use of a substance.</p>\n</blockquote>\n<h4 id=\"risky-use\">Risky use</h4>\n<blockquote>\n<p>Failure to refrain from using the substance despite the harm it causes.</p>\n</blockquote>\n<h4 id=\"pharmacological-criteria\">Pharmacological criteria</h4>\n<blockquote>\n<p>Associated with the body's tolerance and need for increased dosage of a substance, and the body's unpleasant response to the abrupt cessation of a substance.</p>\n<p>(APA, 2013)</p>\n</blockquote>\n<h3 id=\"rates-similarities-and-differences\">Rates: Similarities and differences</h3>\n<p>Overall, newcomers are less likely to use substances (43%) compared to the Canadian-born population (64.3%) (Ru &amp; Li, 2021). Furthermore, refugees are less likely to have substance use disorder compared to non-refugee immigrants (Salas-Wright &amp; Vaughn, 2014). However, both refugees and non-refugee newcomers experience limited access to services, including prevention and treatment programs, which may in turn worsen outcomes (Edward &amp; Haozhen, 2020; Agic et al., 2016).</p>\n<p>Several studies have indicated ethnocultural differences in substance use, particularly among youth (Ellickson et al., 200
