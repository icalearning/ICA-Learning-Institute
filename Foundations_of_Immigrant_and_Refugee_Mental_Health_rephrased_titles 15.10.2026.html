al and mental health problems and illness are known as the pathways to care. These pathways are often complex and include a series of points of contact. An individual's pathway is influenced by a number of factors, such as social connections, income and employment, and history with health care professionals. These factors can act as either barriers or facilitators to seeking care, and they can also influence the type of care that is sought first (Anderson et al., 2014; Birnbaum et al., 2017; Kutcher &amp; Wei, 2012).</p>\n<h3 id=\"points-of-access-to-care\">Points of access to care</h3>\n<p> The main ways clients first access mental health services are described below. </p>\n<h5 id=\"family-doctors\">Family doctors</h5>\n<blockquote>\n<p>The staff in a family doctor's office or general practitioner's office tends to be the main access point for many on their pathway to care.</p>\n</blockquote>\n<h5 id=\"religious-or-lay-healers\">Religious or lay healers</h5>\n<blockquote>\n<p>Some communities and individuals may be more likely to turn to informal sources of alternative care, like clergy and traditional healers, as their first point of contact on their pathway to care. Other forms of alternative care includes traditional and herbal medicine, tai-chi and naturopathic medicine. This may be because it is what clients understand and believe in, or because mainstream mental health services do not reflect their values, expectations and patterns of help-seeking.</p>\n</blockquote>\n<h5 id=\"emergency-services\">Emergency services</h5>\n<blockquote>\n<p>As a result of beliefs, misunderstandings of their illness and/or lack of recognition of a problem, some individuals do not seek care until they are in crisis and severely ill. At this point, their first point of contact on their pathway to care could be the police, ambulatory services (EMS), Mobile Crisis Intervention Teams (MCIT) or community crisis services (not provided at all community centres).</p>\n</blockquote>\n<h5 id=\"social-media\">Social media</h5>\n\n","words":1188},{"id":"s101","mod":4,"title":"Factors That Support or Hinder Help-Seeking","html":"\n<h5 id=\"an-individuals-decision-to-seek-care-when-to-seek-it-and-from-where-is-influenced-by-a-number-of-factors.-some-of-the-key-elements-in-this-decision-making-process-for-immigrants-and-refugees-include\">An individual's decision to seek care, when to seek it and from where is influenced by a number of factors. Some of the key elements in this decision-making process for immigrants and refugees include:</h5>\n<ul>\n<li><p>Social connections/network</p></li>\n<li><p>Service accessibility</p></li>\n<li><p>Client-provider interactions</p></li>\n<li><p>Circumstantial challenges</p></li>\n<li><p>Language</p></li>\n<li><p>Culture and appropriateness of services</p></li>\n<li><p>Stigma</p></li>\n<li><p>Fear</p></li>\n<li><p>Official status</p></li></ul>\n<p>(Hansson et al., 2010; MHCC, 2016)</p>\n<h5 id=\"there-are-a-variety-of-ways-in-which-clients-first-access-mental-health-services\">There are a variety of ways in which clients first access mental health services:</h5>\n<p> Each category is described below. </p>\n<ul>\n<li><p><strong>Social connections/network</strong></p></li>\n<li><p><strong>Service accessibility</strong></p></li>\n<li><p><strong>Client-provider interactions</strong></p></li>\n<li><p><strong>Mental health and addiction services</strong></p></li>\n<li><p><strong>Circumstantial challenges</strong></p></li>\n<li><p><strong>Language</strong></p></li>\n<li><p><strong>Culture and appropriateness of services</strong></p></li>\n<li><p><strong>Stigma</strong></p></li>\n<li><p><strong>Fear</strong></p></li>\n<li><p><strong>Official status</strong></p></li>\n</ul>\n\n<h2 id=\"overview-of-health-care-coverage-for-refugees-and-immigrants\">Overview of health care coverage for refugees and immigrants</h2>\n<p>BCYKNWTSKMBABONNBNSNTPEINL</p>\n<p>A number of clinics across Canada focus on providing health care services to refugees and uninsured clients. Examples include the <a href=\"https://www.nshealth.ca/clinics-programs-and-services/newcomer-health-clinic#:~:text=The%20Newcomer%20Health%20Clinic%20provides,within%20a%20two%20year%20period.\">Transitional Health Clinic</a> for Refugees in Halifax, the Crossroads Clinic at <a href=\"https://www.womenscollegehospital.ca/care-programs/crossroads-clinic/\">Women's College Hospital</a> in Toronto and the <a href=\"https://mb.211.ca/detail/90826420/#:~:text=offers%20initial%20health%20assessment%20that%20consists%20of%20an%20intake%20appointment,\">BridgeCare Clinic</a> in Winnipeg. In Ontario, Community Health Centres (CHCs) typically also serve uninsured individuals. New free psychotherapy services also emerged as a response to the mental health crisis in the country (e.g., Ontario Structured Psychotherapy, Bounce Back Programs).</p>\n\n","words":255},{"id":"s102","mod":4,"title":"Making Services More Accessible and Easier to Use","html":"<p>Newcomers often have many of the same needs as other groups in Canada. As such, mental health treatment programs and services for immigrants and refugees should be based on models shown to be effective for the general population. Refugees, however, may need more of a focus on psychosocial needs, and some immigrants or refugees from certain cultural groups might prefer alternative or traditional methods of healing.</p>\n<h5 id=\"overall-improving-services-for-newcomers-requires-the-following\">Overall, improving services for newcomers requires the following:</h5>\n<ul>\n<li><p>Recognizing that service delivery models are based on a Western health philosophy.</p></li>\n<li><p>Making changes to programs, policies and institutions.</p></li>\n<li><p>Considering the impact of clients' cultural backgrounds.</p></li>\n<li><p>We discuss these factors in this section.</p></li></ul>\n\n","words":113},{"id":"s103","mod":4,"title":"Improving Programs, Policies, and Institutions","html":"<p>While there are a number of things that individual providers can do to improve interactions with immigrants and refugees, program, policy and institution changes are also required. These changes will support improved service use and outcomes.</p>\n<p>As a first step to increase access, health systems, institutions and/or individual providers can increase health literacy among immigrants and refugees. This refers to increasing accessibility and use of health information to make appropriate health decisions and maintain basic health. The development of comprehensive health promotion and prevention campaigns that are targeted, specific and culturally appropriate (WHO, 2010) (WHO, 2018) for immigrant and refugee groups can help increase use of services for mental health problems and illnesses. These types of campaigns could orient immigrants and refugees to mental health problems and illness and also to how the health system works (WHO, 2010) (WHO, 2018).</p>\n<h5 id=\"some-examples-of-these-types-of-campaigns-include\">Some examples of these types of campaigns include:</h5>\n<p>Caring for Kids New to Canada: Mental Health Promotion:<br />\n<a href=\"https://kidsnewtocanada.ca/mental-health/mental-health-promotion\">A Guide for Professionals Working With Immigrants &amp; Refugee Children &amp; Youth.</a></p>\n<p>Ontario Council of Agencies Serving Immigrants:<br />\n<a href=\"https://ocasi.org/mental-health-promotion\">Mental Health Promotion Integrated Service Model</a>.</p>\n<p>Another key change that health systems or institutions can make to improve access to care is to provide free interpretation services (WHO, 2010) (WHO, 2018). The use of qualified professional medical interpreters can improve the quality of treatment received by:</p>\n<ul>\n<li><p>Limiting communication errors</p></li>\n<li><p>Increasing patient comprehension</p></li>\n<li><p>Equalizing health care utilization</p></li>\n<li><p>Helping reduce misunderstandings that may lead to potentially serious medical consequences</p></li>\n<li><p>Increasing satisfaction with communication and clinical services for clients with limited English language proficiency</p></li></ul>\n<p>(Laher et al., 2018; Lindholm et al., 2012)</p>\n<p>In mental health care settings, individuals who need but do not get interpreters have poorer self-reported understanding of diagnosis and treatment plans (Bauer &amp; Alegria, 2010; Pandey et al., 2021). Clients also report greater satisfaction in trained professionals over ad hoc interpreters (untrained person called to interpret, for example, a family member)(Flores, 2005; Karliner et al., 2007).</p>\n<p>As stated in previous modules, properly treating immigrants and refugees with mental health problems can pose some difficulties for individual service providers due to differences in language, differences in culture, and the combined effect of stressors connected with migration and post-migration circumstances (Kirmayer et al., 2011).</p>\n<h5 id=\"for-these-reasons-to-improve-services-for-these-populations-we-recommend-the-following\">For these reasons, to improve services for these populations, we recommend the following:</h5>\n<ul>\n<li><p>Take an extended history, including asking questions about immigration history and related stress, their support system, their cultural context and their understanding and beliefs about health care. Focus on trying to understand how clients view the nature and causes of their particular issues.</p></li>\n<li><p>Do not make general assumptions about clients with similar ethnic backgrounds. Recognize the diversity within newcomer communities.</p></li>\n<li><p>Provide services in a language in which the client is fluent—work with a qualified interpreter, not a child or relative.</p></li>\n<li><p>Do not initially screen refugees for trauma, as doing so might cause unnecessary harm. Over-screening can result in an increase in false-positive reports.</p></li>\n<li><p>Provide empathy, reassurance and advocacy to support the recovery process. (Module 10 will provide more details on self-awareness &amp; self-care).</p>\n<p>(Pottie et al., 2011)</p></li></ul>\n<p>The above is only part of what is needed to improve services for newcomers. Overall, improving services for newcomers requires cultural humility, improving linguistic services, improving the diversity of treatments and an improved method of linking the needs of immigrants and refugees to the appropriate expertise and specialized treatment (Hansson et al., 2010) (WHO, 2018).</p>\n\n<h2 id=\"working-with-clients-cultures\">Working with clients' cultures</h2>\n<p>Sometimes culture is used to explain failures in communication or adherence to treatment, with the failure attributed to the client. Culture is seen as a barrier between health service providers and their efforts or ability to provide effective care to clients. When considered in this way, the client's culture can be devalued and seen as an obstacle, which can then result in a failure to provide necessary services to vulnerable populations (Kirmayer et al., 2014; Fernando &amp; Keating, 2009).</p>\n<p>When clients receive services, misunderstandings or differences in understanding between them and service providers based on lack of cultural understanding and competence, this can negatively affect client outcomes in terms of incomplete assessments, incorrect diagnoses, inadequate or inappropriate treatment and failed treatment alliances (Al Masri, 2018). Cultural differences can even occur when clients and service providers are from similar backgrounds, as there is wide variability within cultural groups (McGill University, n.d.).</p>\n<p>Staying attuned to potential impacts of culture, however, and using services such as cultural brokers, can help prevent cultural misunderstandings. Cultural brokers are trained intermediaries who can interpret cultural concepts or frameworks to either clients or service providers and can help advocate for clients when cultural differences are a barrier to mutual understanding (Kirmayer et al., 2011). They can simplify medical terminology, support discussion of next steps and negotiate or follow up on the implementation of therapeutic plans. Cultural brokers serve as guides to bridge cultural gaps in health care setting processes by communicating cultural similarities and differences (Rotich &amp; Kaya, 2014).</p>\n<p>Culture can affect people's familiarity with medications and their interpretation of possible side effects. When medications are prescribed, it may be helpful for health care providers to enquire about whether a home remedy or any alternative medicine is being used.</p>\n\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Individual clients differ. One client&#x27;s response to treatment should never be assumed to represent a whole cultural group.\"><h4>A client from Ghana who was treated for major depression did not want to take anti-depressants as part of his treatment. It is probable that the next Ghanaian client that presents Depression will not want to either.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div></div>\n<div class=\"wide\"><h2>Check your understanding</h2><div class=\"mcq\" data-fb=\"Culture shapes every step, from how problems are understood to how care is sought and received.\"><h4>One's culture plays a role in how people:</h4><button class=\"opt\">View mental health and mental illness</button><button class=\"opt\">Describe symptoms</button><button class=\"opt\">Seek care</button><button class=\"opt\">Respond to care</button><button class=\"opt\" data-ok=\"1\">All of the above</button><div class=\"fb\"></div></div></div>","words":974},{"id":"s104","mod":4,"title":"Language and Access to Mental Health Care","html":"<p>Communication is paramount when it comes to accessing mental health care services, talking about illness and emotional state of mind, and understanding overall treatments. In short, communication is a fundamental component of health care. The ability to speak French or English is a key determinant of health for immigrants and refugees. As a result, limited proficiency in either official language creates one of the greatest obstacles to accessing mental health care services.</p>\n<p>Compromised communication can have an impact on the client's mental health. The client may receive inappropriate treatment, may not have a clear understanding of their diagnosis, may use mental health services less often, and may be less satisfied with the care received.</p>\n<p>The issue of language is particularly important in mental health care as the dialogue between clients and service providers is central to both diagnostic assessment and treatment (Brisset et al., 2014).</p>\n\n","words":155},{"id":"s105","mod":4,"title":"Understanding Translation and Interpreting","html":"<h5 id=\"translation-and-interpreting-services-are-crucial-for-clients-who-do-not-speak-or-understand-english-or-french.-these-services\">Translation and interpreting services are crucial for clients who do not speak or understand English or French. These services:</h5>\n<ul>\n<li><p>Help clients access the health care system.</p></li>\n<li><p>Support the provision of better care.</p></li>\n<li><p>Reduce misunderstandings between clients and health service providers.</p></li></ul>\n<p>For both translation and interpreting, it is important to convey the meaning of the message as it is expressed. Verbatim, or word-for-word rendering, is a strategy employed only in specific circumstances, which will be explained later in this course.</p>\n<h3 id=\"the-difference-between-translating-and-interpreting\">The difference between “translating” and “interpreting”</h3>\n<p>The <strong>translator's</strong> responsibility is to translate a <strong>written</strong> text from the source language into the target language. Most often, immigrants and refugees need this service for official/original documents from their home countries. Translation is a regulated profession in Canada. When translating a document, it is important to hire certified translators or use the services of agencies employing certified translators in order to ensure the quality of the translated documents.</p>\n<p>The <strong>interpreter's</strong> role is to convey <strong>spoken messages</strong> from one language to another during an in-person appointment, over the phone or via videoconferencing. There are two categories of individuals who perform this task: <strong>professional interpreters</strong>, who have received formal training and have passed recognized testing in the field, and <strong>ad hoc interpreters</strong>, who are called upon to interpret but have no specific training or testing (e.g., bilingual employees, volunteers who speak a second language or family members).</p>\n<p>In health care settings, as studies support, the use of trained interpreters is the most effective approach because it entails a lower risk to client health and fewer ethical issues (Flores et al., 2012; Nápoles et al., 2015). There is evidence that use of interpreters in health care can improve access to care, the accuracy of diagnosis and treatment outcomes (Brisset et al., 2014). Hiring a trained interpreter ensures a quality of interpreting as well as an ethical positioning that adhere to a standard of practice for neutrality, confidentiality and impartiality in particular situations (Healthcare Interpretation Network, 2007).</p>\n\n<h2 id=\"requesting-an-interpreter\">Requesting an interpreter</h2>\n<p>An interpreter should be called upon if the client requests one, and/or in cases where a language barrier between the client and the health care provider interferes with effective communication. Language barriers include complete lack of proficiency in English of French and limited English or French proficiency, which is when the client self-assesses as speaking and understanding English or French less than very well (Institute of Medicine, 2009). If there are language barriers, it may be difficult to gather information and obtain a clear assessment of the client.</p>\n<p>A <strong>language barrier</strong> occurs when people are unable to effectively communicate because they do not share a common language.</p>\n<p>Some clients may refuse or prefer not to use interpreters, often because of concerns about confidentiality or for the stigma associated with mental illness within their cultural community. If this occurs and the health care provider considers it important to use a trained interpreter for better care, the health care provider should try to reassure the client and explain that professional interpreters are bound by a code of ethics and are required to respect privacy and confidentiality, and that the service is provided free of charge.</p>\n<h2 id=\"remote-interpreting\">Remote interpreting</h2>\n<p>Remote interpreting, by either telephone or videoconferencing, has been increasingly employed in health care over the past few years when on-site interpretation could not be provided, in emergency situations or in remote locations. The COVID-19 pandemic jumpstarted remote interpreting and the use of remote interpreting increased exponentially.</p>\n<p>Remote interpreting can be readily accessed and effectively used. Telephone interpreting can be arranged in advance or accessed on-demand, regardless of the location of the client or service provider. The service is easy-to-use and there are little to no time constraints to set up. Videoconferencing is similarly easy-to-use and readily accessible; it also offers a visual component that allows the client, the health care provider and the interpreter to all see one another. There is also an option to “mute” any visual feeds as appropriate for the encounter.</p>\n<h3 id=\"providing-care-in-language-vs.-interpreting\">Providing care “in language” vs. interpreting</h3>\n<p>There are two main ways in which language support can be provided for a client with limited English or French proficiency:</p>\n<p>Service is provided “in language,” meaning the provider is qualified to deliver care in the language shared with client.</p>\n<p>An interpreter is used during the encounter.</p>\n<p>Providing service “in language” does not involve interpreting as the client and health service provider are able to communicate directly with each other. Before providing care “in language,” both the provider and organization should be assured of the provider's ability to competently deliver care in the client's language. For example, an organization may arrange for third-party language proficiency assessments for settlement and social service providers</p>\n\n<h2 id=\"qualified-interpreters-vs.-ad-hoc-interpreters\">Qualified interpreters vs. ad hoc interpreters</h2>\n<p>The individuals who are called upon to interpret typically fall into two main categories:</p>\n<p>Qualified interpreters, who are trained and tested.</p>\n<p>Ad hoc interpreters, who are untrained, untested, self-assessed bilinguals such as friends or family members, and staff members.</p>\n<p>Since interpreting is a complex task and requires specific skills and training, it is always preferable to use a qualified professional interpreter in a mental health setting. They are bound by a standard of practice to interpret accurately, faithfully and transparently, and to adhere to the professional code of ethics to remain neutral and protect privacy and confidentiality. In general, it is best practice, from both a client safety and client-centred care perspective, to work with a qualified interpreter for medically-related discussions with clients with limited English proficiency. Another best practice guideline is to use qualified interpreters for high-risk medical scenarios, including emergency care, informed consent, surgical care, medication reconciliation and discharge (Betancourt et al., 2012).</p>\n<p>There is no single modality for working with qualified interpreting in professional settings. Instead, most organizations have adopted a multi-modality approach (e.g., in-person, telephonic and/or video conferencing) to ensure that clients can express themselves in the language of their choice, and to ensure full bilateral communication between clients and the providers.</p>\n<p>A current reality in some systems is that access to a qualified professional interpreter may be limited due to lack of funding. As a result, health service providers may turn to ad hoc interpreters. Service providers should be aware of the types of quality problems that may occur when working with an ad hoc interpreter to evaluate and treat clients (Bauer &amp; Alegria, 2010).</p>\n<p>An untrained interpreter's lack of understanding of mental health terminology and concepts may interfere with a provider's assessment process. In delicate situations, the interpreter may prevent or, on the other hand, facilitate the expression of certain elements of the client's history.</p>\n<p>For example:</p>\n<h4 id=\"health-service-provider\">Health service provider:</h4>\n<blockquote>\n<p>What kind of mood have you been in lately?</p>\n</blockquote>\n<h4 id=\"untrained-interpreter\">Untrained interpreter:</h4>\n<blockquote>\n<p>How have you been feeling?</p>\n</blockquote>\n<h4 id=\"client\">Client:</h4>\n<blockquote>\n<p>I have a headache all the time.</p>\n</blockquote>\n<p>In 2007, the Health Interpretation Network (HIN), representing a cross section of public and private sector organizations, published the <a href=\"https://industrie-langue.ca/en/certifications-and-standards/NSGCIS\">National Standards for Interpretation Services </a>(Healthcare Interpretation Network, 2007). This document outlines the core competencies and ethical principles for interpreters.</p>\n<p>No interpreter is perfect and errors can occur. In their study, Nápoles et al. (2015) found an average of 27 errors per visit. Most errors had potential clinical consequences, and those committed by ad hoc interpreters were significantly more likely to have potential consequences than those committed by qualified professional interpreters.</p>\n<h4 id=\"strengths-and-weaknesses-of-professional-interpreters\">Strengths and weaknesses of professional interpreters</h4>\n<h4 id=\"strengths\">Strengths</h4>\n<ul>\n<li><p>Specifically trained for interpreting</p></li>\n<li><p>Protect confidentiality and privacy</p></li>\n<li><p>Less likely to make linguistic and paralinguistic elements errors or misinterpret emotions</p></li>\n</ul>\n<h4 id=\"weaknesses\">Weaknesses</h4>\n<ul>\n<li><p>For on-site interpreting, lead time to book the interpreter</p></li>\n<li><p>Client may be uncomfortable with a third party</p></li>\n<li><p>If over the phone, additional time may be required for clarifications that may be necessary to convey message accurately</p></li>\n</ul>\n\n<h2 id=\"where-to-find-a-qualified-interpreter\">Where to find a qualified interpreter</h2>\n<p>Many health care facilities provide in-house interpreting services. If this is the case, service providers can request an interpreter when making an appointment with the client.</p>\n<p>If the health care facility does not provide in-house interpretation service, service providers can contact specialized agencies, community-based interpretation services or a remote interpretation service.</p>\n<p>Some provinces/territories and health regions provide interpreting services free of charge, whether it be in-person, over the phone or via videoconferencing. Service providers outside the region may be able to access the interpreting service for a fee. Examples of these services include the following:</p>\n<h4 id=\"british-columbia\">British Columbia</h4>\n<blockquote>\n<p>Provincial Language Service provides interpretation services in over 150 languages to all of BC's health authorities (on-site, telephone or via video conference, 24 hours a day, 7 days a week).</p>\n</blockquote>\n<h4 id=\"ontario\">Ontario</h4>\n<blockquote>\n<p>Languages Services Toronto (LST) provides real-time, over the phone interpretation (OPI) services in 170 languages, 24 hours a day, 7 days a week, to clients accessing health services at participating organizations.</p>\n</blockquote>\n<h4 id=\"alberta\">Alberta</h4>\n<blockquote>\n<p>Alberta Health Services offers interpretation for Covenant Health sites and certain hospitals.</p>\n</blockquote>\n<h4 id=\"prince-edward-island\">Prince Edward Island</h4>\n<blockquote>\n<p>Health PEI covers the cost of telephone language interpretation services.</p>\n</blockquote>\n<h4 id=\"nova-scotia\">Nova Scotia</h4>\n<blockquote>\n<p>Capital Health covers the cost of face-to-face and telephone interpretation services.</p>\n</blockquote>\n<h4 id=\"manitoba\">Manitoba</h4>\n<blockquote>\n<p>Manitoba Shared Health's Language Access provides interpretation services.</p>\n</blockquote>\n<h4 id=\"saskatchewan\">Saskatchewan</h4>\n<blockquote>\n<p>HealthLine 811 provides health information and mental health and addictions support to callers, with translation available in more than 100 language.</p>\n</blockquote>\n\n","words":1557},{"id":"s106","mod":4,"title":"Working Effectively with Interpreters","html":"<h5 id=\"when-requesting-an-interpreter-for-a-clients-appointment-consider-the-following\">When requesting an interpreter for a client's appointment, consider the following:</h5>\n<ul>\n<li><p>Explain to the client the reason for an interpreter and address any concerns the client may have about working with an interpreter.</p></li>\n<li><p>Screen the preferred language and the dialect where applicable (e.g., what language do you feel most comfortable using when speaking with your health service provider?).</p></li>\n<li><p>Identify the country of origin and specific cultural or ethnic background.</p></li>\n<li><p>As much as possible, respect the client's preferences in terms of gender, background and particular ethnicity of the interpreter (especially if otherwise the objectives of the encounter might be compromised).</p></li>\n<li><p>Make sure the interpreter is qualified and trained for mental health settings.</p></li>\n<li><p>If working on multiple sessions with the client, it may be beneficial to work with the same interpreter for all the sessions in order to establish consistency and trust.</p></li>\n</ul>\n<h3 id=\"different-stages-of-the-appointment\">Different stages of the appointment</h3>\n<p>In working with interpreters, there are different factors to consider at each stage: before, during, and after the appointment.</p>\n<ul>\n<li><p><strong>Before</strong></p></li>\n<li><p><strong>During</strong></p></li>\n<li><p><strong>After</strong></p></li>\n</ul>\n<h3 id=\"communication-tips\">Communication tips</h3>\n<h5 id=\"if-providers-have-not-worked-with-a-qualified-interpreter-before-or-if-they-find-it-challenging-working-with-interpreters-the-following-tips-will-help-ensure-the-process-is-as-seamless-as-possible.\">If providers have not worked with a qualified interpreter before, or if they find it challenging working with interpreters, the following tips will help ensure the process is as seamless as possible.</h5>\n<ul>\n<li><p>Allow more time than for a language-concordant appointment as everything that is said will have to be repeated in the target language.</p></li>\n<li><p>Guide and direct the interview just as in language-concordant appointments.</p></li>\n<li><p>Address the client directly (instead of telling the interpreter “Ask her how she's feeling,” ask the client directly: “How are you feeling?”);</p></li>\n<li><p>Maintain eye contact with the client to encourage speaking directly with the client.</p></li>\n<li><p>Leave time between questions to ensure the interpreter has time to fully relay what has been said.</p></li>\n<li><p>Use plain language, avoiding jargon and idioms as much as possible.</p></li>\n<li><p>Ask for or verify cultural precisions to ensure understanding of what has been said. Direct these questions to the client and not to the interpreter.</p></li>\n<li><p>Ensure the interpreter repeats everything that is said, even if the client speaks directly to the interpreter.</p></li>\n<li><p>Pay attention to body language and all non-verbal cues.</p></li>\n<li><p>Avoid leaving the interpreter alone with the client to preserve each other's framework of intervention.</p></li>\n</ul>\n<h3 id=\"interpreter-conduct-in-the-professional-environment\">Interpreter conduct in the professional environment</h3>\n<p>A professional interpreter is expected to adhere to the standards and ethics of the profession. If the interpreter engages in what is perceived to be unprofessional behaviour at any time during the appointment, the provider should interrupt and, if necessary, step outside the room to address the interpreter's conduct.</p>\n<h5 id=\"unprofessional-conduct-includes\">Unprofessional conduct includes:</h5>\n<ul>\n<li><p>Not interpreting everything said by all parties present.</p></li>\n<li><p>Having side conversations with the client.</p></li>\n<li><p>Answering a question rather than waiting for the client's answer and interpreting it.</p></li>\n<li><p>Providing comment on the client's cognition or mental health status.</p></li>\n<li><p>failing to turn off cell phone and/or being distracted during the encounter.</p></li>\n<li><p>Any behaviour toward the client that may be perceived as demeaning or discriminatory.</p></li>\n<li><p>Always report unprofessional behaviour to the interpreter's supervisor or agency.</p></li>\n</ul>\n\n","words":522},{"id":"s107","mod":4,"title":"Interpreting in Mental Health Settings","html":"<h3 id=\"imagine-this-scenario\">Imagine this scenario</h3>\n<p>It's 2:00 a.m. when a man walks into a B.C. emergency department. The man, of Ethiopian background, is obviously distraught and his hands are covered in blood. He is speaking so fast in broken English and Amharic that no one can understand him. A physician treats the serious knife wounds to the man's hands.</p>\n<p>The physician, seeing what he perceives to be the man's fear of whoever assaulted him, he decides to report the crime to the police.</p>\n<p>However, if an interpreter had been called, the physician would have learned that the wounds were self-inﬂicted and arranged for the man to see a psychiatrist to help him through the crisis.</p>\n<p>Language difficulties can also affect those who are ordinarily proficient in English. Mental health problems can make speaking a second language difficult, as can highly stressful situations (Miletic et al., 2006) (El-Gabalawi &amp; Khouzam, 2009).</p>\n<p>Situations that call for interpretation in a mental health setting include psychiatric assessments, counselling sessions, group and individual psychotherapy, psychological testing and more. Communication between health care providers and clients in such circumstances is of vital importance.</p>\n<h5 id=\"inadequate-communication-can-have-significant-clinical-consequences-including\">Inadequate communication can have significant clinical consequences, including:</h5>\n<ul>\n<li><p>Underestimation or overestimation of the severity of mental health problems</p></li>\n<li><p>Failure to correctly identify the type of mental health problems</p></li>\n<li><p>Diagnosis of mental health problems that are not present</p></li></ul>\n<p>(Miletic et al., 2006; Skammeritz, Sari, Jiménez-Solomon, &amp; Carlsson, 2019)</p>\n<h2 id=\"innovations-in-interpreting-in-mental-health-settings\">Innovations in interpreting in mental health settings</h2>\n<p>In British Columbia, the Interpreter's Lab has developed an innovative approach to interpreting in mental health settings. They use a collaborative model that increases the heath care provider's understanding of the interpreter's role and uses advanced interpreting strategies to ensure more transparency and collaboration during the interpreted encounter. In short, the model helps develop a stronger understanding between the health care provider and the interpreter and apply strategies for more effective interpreting, while maintaining the client and their well-being at the centre of the encounter.</p>\n<h5 id=\"the-model-includes\">The model includes:</h5>\n<ul>\n<li><p>A thorough briefing before the encounter to inform the interpreter about the goal of the meeting and any relevant information about the client.</p></li>\n<li><p>Strategies to apply during the appointment to denote changes in the client's speech.</p></li>\n<li><p>Discussion of specific cultural differences (always being mindful that sharing a language does not necessarily mean sharing a culture).</p></li>\n<li><p>Thoroughly debriefing with the interpreter after the encounter.</p></li>\n</ul>\n<h2 id=\"particular-challenges-of-interpreting-in-mental-health-assessment-and-therapy\">Particular challenges of interpreting in mental health assessment and therapy</h2>\n<h5 id=\"mental-health-assessments-can-be-particularly-challenging-for-interpreters.-consider-the-following-points-when-working-with-an-interpreter\">Mental health assessments can be particularly challenging for interpreters. Consider the following points when working with an interpreter:</h5>\n<ul>\n<li><p>Allow extra time, because everything said has to be said at least twice</p></li>\n<li><p>Use only qualified trained interpreters</p></li>\n<li><p>Face the patient directly and speak to him/her in first person</p></li>\n<li><p>Observe the patient, not the interpreter</p></li>\n<li><p>Speak slowly and clearly and use short sentences</p></li>\n<li><p>Explain all medical terms in simple language</p></li>\n<li><p>Use a telephone interpreter if necessary to reduce clients' anxiety about confidentiality.</p></li>\n<li><p>Remember that one word in English might require a phrase or sentence in the target language</p></li>\n<li><p>Always allow time for patient to ask questions and seek clarification</p></li>\n<li><p>Always ask the patient to repeat specific instructions you have provided to the patient to ensure that he/she understood the instructions</p></li>\n<li><p>Reminder: Do not say anything in the interpreted session that you would not say in an English-only session. The patient who understands basic English may understand any comments during the session.</p></li>\n<li><p>Document the first and last name of the interpreter in the progress notes</p></li>\n<li><p>Whenever possible, provide the interpreter with a brief summary about the patient prior to the start of the session</p></li>\n<li><p>Do not leave the patient alone with the interpreter for any length of time</p></li>\n<li><p>Remember to retrieve any notes from the interpreter, that he/she wrote during the session, before the interpreter leaves</p></li>\n<li><p>Do not provide the interpreter with any patient contact information</p></li>\n<li><p>If possible, book the same interpreter for all of a particular client's visits.</p></li>\n</ul>\n<p>During a cognitive assessment, it is important that the interpreter refrain from giving hints or extra instructions to clients that may defeat the purpose of the assessment. For example, in the “serial sevens” test of concentration and memory, the exact instruction varies, but often it is, “Take the number 100, subtract 7, and keep subtracting 7 until I say stop.” If this statement is interpreted as, “What is 100 minus 7? [wait for answer]... Please minus 7 again... minus 7 again...,” the interpreter is essentially reminding the client what to do and therefore limiting the ability of the health care provider to complete an accurate diagnosis. When administrating a cognitive assessment, plan for a briefing with the interpreter before the encounter begins to review the assessment tool(s) that will be administered.</p>\n<h2 id=\"summary-and-references\">Summary and references</h2>\n\n","words":810},{"id":"s108","mod":4,"title":"Module Recap and Key Takeaways","html":"<p>This module described how clients access or use services, how serviceproviders can effectively facilitate mental health care for newcomer clients and how to effectively work with interpreters. A variety of factors influence how immigrant and refugee clients seek mental health care, including awareness of services, language, stigma and socioeconomic status. Service providers play a leading role in connecting clients with services, as well as overcoming barriers, conveying the importance of primary care and maintaining awareness of the role of culture in treatment. This module also discussed the important role of interpreters, including how they can benefit clients and how service providers can work effectively with interpreters.</p>\n<p>Module 9 builds on how care providers can better connect clients with appropriate services through building partnerships and engaging in strategies to promote mental health.</p>\n","words":140},{"id":"s109","mod":4,"title":"References and Further Reading","html":"<h4 id=\"navigating-mental-health-services\">8.1 — Navigating mental health services</h4>\n<ul>\n<li><p>Statistics Canada. (2018). <em>Mental health care needs, 2018.</em> Retrieved from <a href=\"https://www150.statcan.gc.ca/n1/pub/82-625-x/2019001/article/00011-eng.htm\" class=\"uri\">https://www150.statcan.gc.ca/n1/pub/82-625-x/2019001/article/00011-eng.htm</a></p></li>\n<li><p>Government of Canada. (2021, March 25). <em>Just for You - Immigrants.</em> Retrieved from Health Canada: <a href=\"https://www.canada.ca/en/health-canada/services/healthy-living/just-for-you/immigrants.html\" class=\"uri\">https://www.canada.ca/en/health-canada/services/healthy-living/just-for-you/immigrants.html</a></p></li>\n<li><p>Ng, E., &amp; Zhang, H. (2021, June 16). <em>Access to mental health consultations by immigrants and refugees in Canada.</em> Retrieved from Statistics Canada: <a href=\"https://www150.statcan.gc.ca/n1/en/pub/82-003-x/2021006/article/00001-eng.pdf?st=lgpxTEVe\" class=\"uri\">https://www150.statcan.gc.ca/n1/en/pub/82-003-x/2021006/article/00001-eng.pdf?st=lgpxTEVe</a></p></li>\n</ul>\n<h4 id=\"facilitating-effective-service-use\">8.2 — Facilitating effective service use</h4>\n<ul>\n<li><p>Al Masri, H. (2018). <em>Cultural barriers in accessing mental health services and the role of cultural brokers.</em> Webinar presented for the Immigrant and Refugee Mental Health Project, April 2018.</p></li>\n<li><p>Alarcón, R.D. (2020). <em>Global Perspectives on the Teaching and Learning of Intercultural Psychotherapy.</em> In M. Schouler, &amp; M.C. Kastrup (Eds.), Intercultural Psychotherapy: For Immigrants, Refugees, Asylum Seekers and Ethnic Minority Patients (pp. 251-261). Switzerland: Springer Nature.</p></li>\n<li><p>American Psychiatric Association (APA). (2013). <em>Diagnostic and Statistical Manual of Mental Disorders, Fifth Edition.</em> Arlington, V.A.: American Psychiatric Association.</p></li>\n<li><p>Bauer A.M. &amp; Alegria, M. (2010). <em>Impact of Patient Language Proficiency and Interpreter Service use on the quality of psychiatric care: A systematic review.</em> Psychiatric Services, 61 (6),765-773.</p></li>\n<li><p>Behnia, B. (2003). <em>Refugees' convoy of social support.</em> International Journal of Mental Health, 32 (4), 6-19.</p></li>\n<li><p>Bettmann, J.E., Penney, D., Freeman, P.C., &amp; Lecy, N. (2015). <em>Somali refugees' perceptions of mental illness.</em> Social Work in Health Care, 54 (8), 738-757.</p></li>\n<li><p>Fernando, S., &amp; Keating, F. (2009). <em>Mental health in a multi-ethnic society: A multi-disciplinary handbook (2nd ed.).</em> London, UK: Routledge.</p></li>\n<li><p>Flores, G. (2005). <em>The impact of medical interpreter services on the quality of health care: A systematic review.</em> Medical Care Research and Review, 62 (3), 255-299.</p></li>\n<li><p>Hansson, E., Tuck, A., Lurie, S., &amp; McKenzie, K. for the Task Group of the Services Systems Advisory Committee, Mental Health Commission of Canada. (2010). <em>Improving mental health services for immigrant, refugee, ethno-cultural and racialized groups: Issues and options for service improvement.</em> <a href=\"https://mentalhealthcommission.ca/resource/improving-mental-health-services-for-immigrant-refugee-ethnocultural-and-racialized-groups-issues-and-options-for-service-improvement/\" class=\"uri\">https://mentalhealthcommission.ca/resource/improving-mental-health-services-for-immigrant-refugee-ethnocultural-and-racialized-groups-issues-and-options-for-service-improvement/</a></p></li>\n<li><p>Hassan, G., Kirmayer, L.J., Mekki-Berrada, A., Quosh, C., el Chammay, R., Deville-Stoetzel, et al. (2015). <em>Culture, context and the mental health and psychosocial wellbeing of Syrians: A review for mental health and psychosocial support staff working with Syrians affected by armed conflict.</em> Geneva, SW: UNHCR. Available: <a href=\"http://www.unhcr.org/55f6b90f9.pdf.\" class=\"uri\">http://www.unhcr.org/55f6b90f9.pdf.</a> Accessed May 4, 2018.</p></li>\n<li><p>Johnsdotter, S., Ingvarsdotter, K., Östman, M., &amp; Carlbom, A. (2011). <em>Koran reading and negotiation with jinn: strategies to deal with mental ill health among Swedish Somalis.</em> Mental Health, Religion &amp; Culture, 14 (8), 741-755.</p></li>\n<li><p>Karliner, L.S., Jacobs, E.A., Chen, A.H., &amp; Mutha S. (2007). <em>Do Professional Interpreters Improve Clinical care for patients with limited English proficiency? A systematic review of the Literature.</em> Health Research and Educational Trust, 42 (2), 727-754.</p></li>\n<li><p>Kirmayer, L., Narasiah, L., Munoz, M., Rashid, M., Ryder, A.G., Guzder, J., et al. (2011). <em>Common mental health problems in immigrants and refugees: General approach in primary care.</em> Canadian Medical Association Journal, 183 (12), E959-E967. Available: <a href=\"https://dx.doi.org/10.1503/cmaj.090292\" class=\"uri\">https://dx.doi.or n<li><p>Paniagua, F. (2014). <em>Assessing and Treating Culturally Diverse Clients: A Practical Guide (4th Edition).</em> Thousand Oaks, California: Sage Publications.</p></li>\n<li><p>Pottie, K., Greenaway, C., Feightner, J., Welch, V., Swinkels, H., Rashid, M., et al. (2011). <em>Evidence-based clinical guidelines for immigrants and refugees.</em> Canadian Medical Association Journal, 183 (12), e824-e925.</p></li>\n<li><p>Racin, L., &amp; Dein, S. (2020). <em>Religion and Spirituality in Intercultural Therapy.</em> In M. Schouler, &amp; M.C. Kastrup (Eds.), Intercultural Psychotherapy: For Immigrants, Refugees, Asylum Seekers and Ethnic Minority Patients (pp. 161-175). Switzerland: Springer Nature.</p></li>\n<li><p>Stewart, M.J., Anderson, J., Beiser, M., Mwakarimba, E., Neufeld, A., Simich, L., et al. (2008). <em>Multicultural meanings of social support among immigrants and refugees.</em> International Migration, 46 (3), 123-159. DOI: 10.1111/j.1468-2435.2008.00464.x.</p></li>\n<li><p>Substance Abuse and Mental Health Services Administration (SAMHSA). (2014). <em>Improving Cultural Competence.</em> Treatment Improvement Protocol (TIP) Series No. 59. HHS Publication No. (SMA) 14-4849. Rockville, MD: Substance Abuse and Mental Health Services Administration.</p></li>\n<li><p>Vasilevska, B., Madan, A., &amp; Simich, L. (2010). <em>Refugee mental health: Promising practices and partnership building resources.</em> Toronto, ON: Centre for Addiction and Mental Health. Available: <a href=\"https://www.porticonetwork.ca/documents/1388035/1388826/refugee_mental_health_prompractices.pdf/\" class=\"uri\">https://www.porticonetwork.ca/documents/1388035/1388826/refugee_mental_health_prompractices.pdf/</a> 8b5f3b0d-19e0-4816-966b-3bf818eb279a. Accessed April 25, 2018.</p></li>\n<li><p>Wintrob, R., &amp; de Figueiredo, J.M. (2020). <em>Intercultural Psychotherapy: An Historical Perspective.</em> In M. Schouler, &amp; M.C. Kastrup (Eds.), Intercultural Psychotherapy: For Immigrants, Refugees, Asylum Seekers and Ethnic Minority Patients (pp. 1-24). Switzerland: Springer Nature.</p></li>\n<li><p>World Health Organization (WHO). (2010). <em>How health systems can address health inequities linked to migration and ethnicity.</em> Copenhagen, WHO Regional Office for Europe. http://www.euro.who.int/__data/assets/pdf_file/0005/127526/e94497.pdf Accessed May, 2018.</p></li>\n<li><p>WHO. (2018). <em>Health promotion for improved refugee and migrant health (Technical guidance on refugee and migrant health).</em> Copenhagen: WHO Regional Office for Europe.</p></li>\n</ul>\n<h4 id=\"language-and-its-effects-on-access-to-care\">8.3 — Language and its effects on access to care</h4>\n<ul>\n<li><p>Betancourt, J.R., Renfrew, M.R., Green, A.R., et al. (2012). <em>Improving patient safety systems for patients with limited English proficiency: a guide for hospitals.</em> (Prepared by the Disparities Solutions Center, Mongan Institute for Health Policy at Massachusetts General Hospital and Abt Associates, Cambridge, MA, under Contract No. HHSA290200600011I). Rockville, MD: Agency for Healthcare Research and Quality; AHRQ Publication No. 12-0041. <a href=\"https://www.ahrq.gov/health-literacy/professional-training/lepguide/index.html\" class=\"uri\">https://www.ahrq.gov/health-literacy/professional-training/lepguide/index.html</a></p></li>\n<li><p>Brisset, C., Leanza, Y., Rosenberg, E., Vissandjée, B., Kirmayer, L. J., Muckle, G., et al. (2014). <em>Language barriers in mental health care: A survey of primary care practitioners.</em> Journal of Immigrant and Minority Health, 16 (6), 1238-46. doi: 10.1007/s10903-013-9971-9.</p></li>\n<li><p>Flores, G., Abreu, M., Barone, C.P., Bachur, R., &amp; Lin, H. (2012). <em>Errors of medical interpretation and their potential clinical consequences: a comparison of professional versus ad hoc versus no interpreters.</em> Annals of Emergency Medicine, 60 (5): 545-553.</p></li>\n<li><p>Healthcare Interpretation Network. (2007). <em>National Standard Guide for Community Interpreting Services.</em> Toronto, Canada: Healthcare Interpretation Network. <a href=\"https://industrie-langue.ca/en/certifications-and-standards/NSGCIS\" class=\"uri\">https://industrie-langue.ca/en/certifications-and-standards/NSGCIS</a></p></li>\n<li><p>Institute of Medicine. (2009). <em>Race, Ethnicity, and Language Data: Standardization for Health Care Quality Improvement.</em> Washington, DC: The National Academies Press. <a href=\"https://doi.org/10.17226/12696\" class=\"uri\">https://doi.org/10.17226/12696</a></p></li>\n<li><p>Nápoles, A.M., Santoyo-Olsson, J., Karliner, L.S., Gregorich, S.E., &amp; Pérez-Stable, E.J. (2015). <em>Inaccurate language interpretation and its clinical significance in the medical encounters of Spanish-speaking Latinos.</em> Medical Care, 53 (11): 940-947.</p></li>\n<li><p>Schenker, Y., Lo, B., Ettinger, K. M., &amp; Fernandez, A. (2008). <em>Navigating Language Barriers Under Difficult Circumstances.</em> Annals of Internal Medicine, 149 (4), 264-269. <a href=\"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5405855/\" class=\"uri\">https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5405855/</a></p></li>\n</ul>\n<h2 id=\"introduction\">Introduction</h2>\n\n","words":1159},{"id":"s110","mod":9,"title":"Module Overview and Learning Focus","html":"<p>As emphasized throughout this course, good mental health is a key to the successful settlement and integration of immigrants and refugees (Robert &amp; Gilkinson, 2012). Positive mental health (e.g., feeling well, functioning well and being resilient in the face of life's challenges) improves quality of life, and this is integral to overall health and well-being, even when mental health problems and illnesses cause ongoing limitations (MHCC, 2012).</p>\n<p>Module 9 focuses on mental health promotion, which refers to actions taken to improve the mental health and well-being of individuals and communities (PHAC, 2012). These actions should target those who appear to be in good mental health, as well those who are at risk or who may already be experiencing a mental problem or illness (Kisley et al., 2004). This module explores the roles played by social support, community development and partnerships in promoting mental wellness. It also considers strategies for promoting mental health and addressing issues facing those in the health care sector. In addition, this module examines social support and community partnerships for providing mental health support services.</p>\n<h5 id=\"this-module-has-three-sections\">This module has three sections:</h5>\n<ol type=\"1\">\n<li><p>Strategies for promoting mental health</p></li>\n<li><p>Social supports</p></li>\n<li><p>Community development and partnerships</p></li></ol>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to</h5>\n<ul>\n<li><p>Define mental health promotion.</p></li>\n<li><p>Describe five strategies for promoting mental health.</p></li>\n<li><p>Describe how social supports affect mental health promotion.</p></li>\n<li><p>Describe how community development and partnerships affect mental health promotion.</p></li>\n</ul>\n\n","words":244},{"id":"s111","mod":9,"title":"Approaches to Promoting Community Mental Health","html":"<p>The mental health needs of immigrant and refugee communities are diverse, and mental health promotion strategies and solutions need to account for this diversity. Growing evidence shows that the best results are achieved by initiatives that target specific groups and settings, including in the home, school, workplace and community (MHCC, 2012) (Im &amp; Rodriguez, 2019).</p>\n<h4 id=\"the-ottawa-charter-for-health-promotion-identifies-five-action-areas-that-are-essential-for-health-promotion-strategies\">The <a href=\"https://www.canada.ca/en/public-health/services/health-promotion/population-health/ottawa-charter-health-promotion-international-conference-on-health-promotion.html\">Ottawa Charter for Health Promotion</a> identifies five action areas that are essential for health promotion strategies:</h4>\n<h5 id=\"a-mental-health-promotion-strategy-should\">A mental health promotion strategy should:</h5>\n<ul>\n<li><p>Build healthy public policy</p></li>\n<li><p>Create supportive environments</p></li>\n<li><p>Strengthen community action</p></li>\n<li><p>Develop personal skills</p></li>\n<li><p>Reorient health services</p></li></ul>\n<p>(Government of Canada, 1986)</p>\n<h2 id=\"building-strong-public-policy-and-advocacy-that-promotes-equity\">Building strong public policy and advocacy that promotes equity</h2>\n<p>Advocacy and policy strategies should include a combination of individual and social actions designed to gain political commitment or support for a particular health goal or program (Nutbeam, 1998).</p>\n<p>With the exception of <a href=\"https://open.alberta.ca/dataset/9ab4e813-6731-4f6c-b517-57637ad440c3/resource/bebad5b6-5e87-4627-bef4-9589790a0aad/download/54546662011CreatingConnectionsAlbertasAddictionMentalHealthStrategy.pdf\">Alberta</a>, none of the provinces or territories currently has health promotion strategies that focus specifically on immigrants and refugees. The <a href=\"https://www.mentalhealthcommission.ca/wp-content/uploads/drupal/MHStrategy_Strategy_ENG.pdf\">Mental Health Strategy for Canada</a> (2012) offers recommendations to improve the mental health and well-being of immigrants and refugees in Canada with its Strategic Direction 4, Priority 4.2: Improve mental health services and supports by and for immigrants, refugees, ethnocultural and racialized groups.</p>\n<h4 id=\"these-recommendations-include-the-following\">These recommendations include the following:</h4>\n<ol type=\"1\">\n<li><p>Expand use of standards for cultural competency and cultural safety, including through accreditation bodies and professional associations.</p></li>\n<li><p>Increase access to information and mental health services, treatments and supports in diverse languages.</p></li>\n<li><p>Better evaluate the potential of traditional knowledge, customs and practices to address mental health problems and illnesses, and improve access to those that work.</p>\n<p>This includes examining the barriers to accessing care: stigma, family shame, fear, history of trauma, negative experience from earlier attempts of seeking help, distrust in the health system or providers, drug therapy and side effects, challenges of self-disclosure, etc.</p></li>\n<li><p>Support immigrant, refugee, ethnocultural and racialized community organizations in assessing local mental health needs and strengths and in taking action on local priorities, in collaboration with mental health and other service systems.</p></li>\n<li><p>Develop and implement mental health plans in all jurisdictions to address the mental health needs of immigrants, refugees, ethnocultural and racialized groups, with their full involvement.</p></li></ol>\n<p>(MHCC, 2012)</p>\n<p>Organizations looking to promote mental health among immigrant and refugee populations should use the five recommendations of Priority 4.2 as a guide when developing their advocacy strategies.</p>\n<h3 id=\"featured-resource\">Featured resource</h3>\n<p>The Children's Hospital of Eastern Ontario (CHEO), through their <a href=\"https://www.simplifyingthejourney.ca/Program-Requirements/#Introduction\">\"Simplifying the Journey\"</a> project, developed a framework that organizations can use to improve equity of access to services for marginalized populations. Organizations can use the framework to help determine their organization's health equity needs, and what steps they can take to address these needs.</p>\n\n<h2 id=\"creating-supportive-environments\">Creating supportive environments</h2>\n<p>The following focus on providing relevant and accessible information about mental health and mental illness, how to access mental health services and ways to address the stigma toward mental illness.</p>\n<h5 id=\"these-services-address-the-specialized-needs-of-immigrants-and-refugees\">These services address the specialized needs of immigrants and refugees:</h5>\n<ul>\n<li><p>Family counselling</p></li>\n<li><p>Other counselling and support groups</p></li>\n<li><p>Mental health organizations</p></li>\n</ul>\n<blockquote>\n<p>For example:</p>\n</blockquote>\n<ul>\n<li><p><a href=\"https://ccvt.org/\">Canadian Centre for Victims of Torture</a></p></li>\n<li><p><a href=\"https://cmha.ca/\">Canadian Mental Health Association (system navigation)</a></p></li>\n<li><p><a href=\"https://www.healthequity.ca/mental-health/\">Canadian Centre for Immigrant &amp; Refugee Healthcare</a></p></li>\n\n<li>Health programs for survivors of torture and trauma</li>\n</ul>\n<h5 id=\"these-services-help-immigrants-and-refugees-connect-to-the-societies-they-have-settled-in\">These services help immigrants and refugees connect to the societies they have settled in:</h5>\n<ul>\n<li><p>Advocacy</p></li>\n<li><p>Translation and interpretation</p></li>\n<li><p>Host programs (and training)</p></li>\n<li><p>Volunteer programs (and training) integration programs</p></li>\n</ul>\n<h3 id=\"featured-resources\">Featured resources</h3>\n<h4 id=\"b.c.-partners-for-mental-health-and-addictions-information\">B.C. Partners for Mental Health and Addictions Information</h4>\n<blockquote>\n<p>This coalition of seven agencies worked together to create the <a href=\"https://www.heretohelp.bc.ca/\">Here to Help</a> website, which provides information about mental health promotion initiatives. Although Here to Help does not focus exclusively on immigrants and refugees, a significant number of resources are dedicated to the mental health needs of these groups.</p>\n</blockquote>\n<h4 id=\"centre-for-addiction-and-mental-health\">Centre for Addiction and Mental Health</h4>\n<blockquote>\n<p><a href=\"https://nursing-informatics.com/Culture_Counts_2012.pdf\">Culture Counts: A Roadmap to Health Promotion Best Practices for Developing Health Promotion Initiatives in Mental Health and Substance Use with Ethnocultural Communities</a> aims to identify a best practices approach to health promotion in mental health and substance use with ethnocultural communities. It also considers how programs can address the needs of people from different cultural and linguistic backgrounds.</p>\n</blockquote>\n<h4 id=\"canadian-mental-health-association\">Canadian Mental Health Association:</h4>\n<blockquote>\n<p>The <a href=\"https://openingdoorsproject.wixsite.com/todp\">Opening Doors Project</a> uses unique story-telling techniques in presenting workshops to agencies and the community, which are “aimed at strengthening, fostering and cultivating healthier communities in Ontario. It is particularly beneficial to newcomers to Canada, mental health survivors and mental health professionals.”</p>\n</blockquote>\n<h4 id=\"mental-health-commission-of-canada\">Mental Health Commission of Canada</h4>\n<blockquote>\n<p><a href=\"https://mentalhealthcommission.ca/training/mhfa/\">Mental Health First Aid</a> is a training program designed to help individuals who are developing a mental health problem or illness, dealing with worsened mental health problems or illnesses, or in a mental health crisis. This first aid training is “given until appropriate support is found or until the crisis is resolved” and has multiple versions depending on the target population (e.g., seniors, youth, First Nations, veterans…etc.)</p>\n</blockquote>\n<h2 id=\"strengthening-community-action\">Strengthening community action</h2>\n<h5 id=\"supporting-mental-health-and-well-being-by-creating-culturally-responsive-social-support-groups-helps-foster-a-sense-of-engagement-and-connection.-these-support-groups-also-help-promote-mental-wellness-and-illness-prevention.\">Supporting mental health and well-being by creating culturally responsive social support groups helps foster a sense of engagement and connection. These support groups also help promote mental wellness and illness prevention.</h5>\n<h5 id=\"the-following-resources-help-communities-adapt-to-immigrants-and-refugees\">The following resources help communities adapt to immigrants and refugees:</h5>\n<ul>\n<li><p>Public education</p></li>\n<li><p>Cross-cultural and antiracism training</p></li>\n<li><p>Programs to help mainstream service providers integrate immigrant and refugee programs to promote organizational change and development (CCR, 1998) (UNHCR, n.d).</p></li></ul>\n<p>The <a href=\"https://www.reachcentre.bc.ca/mfc.php\">REACH Multicultural Family Centre</a> employs frontline workers who are trusted members of the communities they serve. The workers deliver culturally responsive programs. In addition, the centre hosts a number of culturally diverse community groups aimed at enhancing the social ties of newcomers.</p>\n\n<h2 id=\"developing-clients-personal-skills\">Developing clients' personal skills</h2>\n<h5 id=\"the-following-strategies-develop-immigrants-and-refugees-personal-skills-to-reduce-the-stressors-associated-with-integration-into-canadian-society\">The following strategies develop immigrants' and refugees' personal skills to reduce the stressors associated with integration into Canadian society:</h5>\n<ul>\n<li><p>Orientation sessions</p></li>\n<li><p>Information and referrals</p></li>\n<li><p>Language assessment, referral and training</p></li>\n<li><p>Employment and career counselling, placement, skills upgrading and certification programs</p></li>\n<li><p>Community development</p></li>\n<li><p>Citizenship programs</p></li>\n<li><p>Multicultural programs, such as:</p>\n<p>● Health services for newcomers and refugees</p>\n<p>● Housing support programs</p>\n<p>● Government benefits/income support programs</p></li></ul>\n<h2 id=\"reorienting-health-services\">Reorienting health services</h2>\n<p>Settlement and social service providers working at the community level may need training to address the needs of clients from many diverse backgrounds. It is also important to acquire an understanding of the spectrum of services available for clients, including preventative care and treatment to recovery.</p>\n<h5 id=\"the-following-organizations-provide-this-type-of-training\">The following organizations provide this type of training:</h5>\n<ul>\n<li><p>Hong Fook Mental Health Association in Scarborough, Ontario, routinely runs a workshop for community workers in the settlement services sector entitled <a href=\"https://hongfook.ca/association/wp-content/uploads/sites/3/2021/03/pdf_hf_handbook2012.pdf\">The Journey to Promote Mental Health</a>.</p></li>\n<li><p>The Ontario Council for Agencies Serving Immigrants (OCASI) provides a <a href=\"https://ocasi.org/sites/default/files/mental-health-promotion-guide-sept-28_0.pdf\">framework for mental health promotion</a> to facilitate a more standardized level of service delivery for the settlement sector.</p></li>\n</ul>\n<blockquote>\n<p>OCASI has also prepared this <a href=\"https://ocasi.org/sites/default/files/frontline-workers-sept-27-646_0.pdf\">summary and tip sheet</a> on mental health promotion guidelines for front line service providers.</p>\n</blockquote>\n\n<div class=\"wide\"><h2>Check your understanding</h2><div class=\"mcq\" data-fb=\"All of these supports help ease the stress of integration.\"><h4>Which of the following strategies help reduce stressors associated with integration into Canadian society?</h4><button class=\"opt\">Orientation sessions</button><button class=\"opt\">Language assessment and training</button><button class=\"opt\">Employment and career counselling</button><button class=\"opt\">Skills upgrading and certification programs</button><button class=\"opt\" data-ok=\"1\">All of the above</button><div class=\"fb\"></div></div></div>","words":1197},{"id":"s112","mod":9,"title":"The Role of Social Support and Connection","html":"<p>Social capital includes the connections through relationships and networks that can provide individuals access to resources and supports (Arshad, 2011) (Villalonga-Olives &amp; Kawachi, 2015). Social capital can include formal and informal aspects, which form the ecology of social supports that an individual can access when faced with challenges (Arshad, 2011) (Villalonga-Olives &amp; Kawachi, 2015). Social supports are an important factor in the successful settlement of newcomers. They have a significant effect on health outcomes, influencing physical, mental, spiritual and psychosocial health (Harandi et al, 2017); Stewart et al., 2010). Social supports reinforce coping, diminish the effect of stressors and promote health (Simich et al., 2005) (CMHA BC and Anxiety Canada, 2016). They also act as a buffer against stress and serve as a protective factor against mental health risks (Guruge et al., 2015).</p>\n<p>Immigrants to Canada have better mental health than the general population; immigrants with high levels of social supports experience lower amounts of resettlement stress as they adjust to their host country over time (Ali, 2002; Bergeron et al., 2005; Lou et al., 2005; Wu &amp; Schimmele, 2005; Puyat, 2013; (Hynie, 2017)).</p>\n<p>In contrast, individuals with low levels of social supports are at higher risk of mental disorders. This tendency is more prevalent among recent immigrants as opposed to more established immigrants and native-born Canadians (Chadwick &amp; Collins, 2015).</p>\n<p>As shown in the image below, informal networks (including families, friends, neighbours and communities of interest) and formal organizations (including governments, businesses and community organizations) interact in a mutually reinforcing dynamic. Informal networks are a source of information and resources for newcomers to access programs and services that are crucial for integration. In turn, formal organizations not only provide a range of services and programs, but are spaces where individuals can connect and develop new informal social networks. At the centre, individuals draw on their own capital, including financial, human, physical and social, in order to navigate challenges—which are strengthened by the interplay of informal networks and formal organizations. In turn, an individual can invest this capital into social networks and formal organizations.</p>\n<h3 id=\"the-interplay-of-social-support\">The interplay of social support</h3>\n<p>Informal social network</p>\n<p>Informal social networks enhance individuals' access to formal structures</p>\n<p>(social capital)<br />\n(financial capital)</p>\n<p>Need for capital</p>\n<p>(physical capital)<br />\n(human capital)</p>\n<p>Formal social networks enhance individuals' informal networks</p>\n<p>Formal organizations</p>\n<p>Adapted from Arshad, 2011</p>\n<p>For instance, language has been identified as a challenge in the post-migration context. When a newcomer arrives in a community, they may try to navigate the system in order to join an ESL class. Because the system is complex, this newcomer may not be aware of the available settlement and language supports. However, this newcomer may have access to informal networks—where a family member, for instance, provides the information needed. The newcomer is then able to approach an immigrant-serving organization to be directed to an ESL class. The formal organization, the ESL class in this instance, provides a venue whereby this newcomer has the opportunity to not only learn English, but also establish new informal social networks.</p>\n\n","words":506},{"id":"s113","mod":9,"title":"Formal Community Organizations and Their Role","html":"<p>A high level of satisfaction with the settlement experience reduces the likelihood that immigrants and refugees will transition to poor health over time (Newbold, 2009). When organizations that provide essential services for newcomers are not able to meet the needs of their clients, this lack of support creates a stressor that can lead to poorer mental health outcomes (Chadwick &amp; Collins, 2015).</p>\n<p>Inequities and challenges with accessing health and social services can factor into a poor settlement experience. For example, a lack of awareness of mental health care and services, transportation and mobility issues, lack of linguistically appropriate services and stigma contribute to the underuse of services by immigrant and refugee women (Guruge et al., 2015). Organizations need to counteract and avoid differences in service provision between populations in order to improve equity in the access to and the quality of care for immigrant populations (MHCC, 2016).</p>\n<h5 id=\"public-libraries-are-an-example-of-a-formal-organization-that-provides-social-support.\">Public libraries are an example of a formal organization that provides social support.</h5>\n<p>Libraries are set up as places to get books, resources and information, and access free internet and computers, which is important for virtual care, online applications and socializing with family and friends; however, this is a simplification of their value and purpose. The public library is an institution that provides an open and safe environment, including for vulnerable populations, to meet and socialize Libraries are friendly, familiar places that foster imagination, creativity, social cohesion and community empowerment (Aabø &amp; Audunson, 2012; Brewster, 2014). People with mental health problems and illnesses can feel calm, comfortable and empowered in libraries through reading and courses (Brewster, 2014). Libraries also often play an important role as a meeting place across cultural, ethnic and social lines (Aabø &amp; Audunson, 2012).</p>\n<h2 id=\"navigating-and-finding-services\">Navigating and finding services</h2>\n<p>Lack of awareness of available supports or where to access services influences levels of received support (Khanlou et al., 2015). Clients and health care providers can access information about nearby formal support services for new immigrants and refugees from the following sources:</p>\n<ul>\n<li><p>The Government of Canada hosts a <a href=\"https://www.cic.gc.ca/english/newcomers/services/index.asp\">publicly viewable database of support services and agencies for newcomers</a>.</p></li>\n<li><p>Kids New to Canada maintains a web page of links to <a href=\"https://kidsnewtocanada.ca/care/resources\">community resources serving immigrant and refugee families</a>.</p></li>\n<li><p>The Peel Newcomer Strategy Group (PNSG), in partnership with the Region of Peel, has created <a href=\"https://www.peelregion.ca/planning-maps/newcomers/\">interactive maps indicating the location of services across the region.</a> The services available include schools, settlement services, hospitals, faith-based institutions and early years services.</p></li>\n</ul>\n\n","words":410},{"id":"s114","mod":9,"title":"Informal Networks, Peer Support, and Connection","html":"<p>Informal social networks are important resources for immigrants and refugees for dealing with adversity, solving problems and trying to maintain a sense of control over their life [(Public Health Agency of Canada (PHAC), 2013]. It is important to recognize that problematic social support networks, where there is social conflict within the community, can be a source of stress, which is amplified in situations where there is a lack of supportive family or friends (Guruge et al., 2015).</p>\n<h2 id=\"family-and-community-support\">Family and community support</h2>\n<p>Family and community support can make an enormous difference in the settlement experience of immigrants and refugees. This is demonstrated by the relatively effective integration of privately sponsored refugees (PSRs) into Canadian society.</p>\n<ul>\n<li><p>Out of all immigration classes and groups, PSRs are the most likely (91%) to acquire Canadian citizenship 10 years after landing (IRCC, 2016). In addition, compared to other classes of refugees, PSRs earn higher incomes, are much more likely to declare earnings through their income tax filings and are less likely to require social assistance (IRCC, 2016).</p></li>\n<li><p>PSRs may have a more successful resettlement process due to the personalized local support they receive from their sponsors, which includes the presence of family—62% of PSRs have a family member involved in their sponsorship. In comparison, only 35% of Government Assisted Refugees (GARs) have a family member living in a nearby city (IRCC, 2016).</p></li>\n<li><p>The presence of family or community is an important factor as research has shown that immigrants and refugees often have smaller social networks, and therefore less social capital. They can also experience long periods of exclusion, making them more vulnerable to mental health problems and illnesses since they have fewer options for dealing with stressors (Hynie et al., 2011).</p></li>\n<li><p>Having a social support network to draw upon is an important protective factor for immigrants and refugees during the settlement process.</p></li>\n<li><p>Community support may be of particular benefit for specific vulnerable immigrant and refugee groups, such as children and youth. As described in Module 5, it is important for children to feel a sense of membership and to build connections with their own ethno-cultural communities to develop a “balanced” identity within multiple cultures and reinforce positive acculturation (Ontario Centre of Excellence for Child and Youth Mental Health, 2015) . Children's involvement in informal community activities and access to social and community resources can act as mental health protective factors (Ontario Centre of Excellence for Child and Youth Mental Health, 2015) .</p></li></ul>\n\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"A strong family network, like Sasha&#x27;s, is an important protective factor and usually lowers resettlement stress.\"><h4>Sasha is a recent newcomer from India. She has three brothers already settled here who provide her and her family a great deal of social support. Sasha will most likely experience a low amount of resettlement stress as she adjusts to her new life.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n<h2 id=\"faith-based-support\">Faith-based support</h2>\n<p>Places of worship and religious groups are potential sources of support for people with mental health problems and illnesses (Griffith et al., 2016). Religion and help-seeking are connected as many people view their problems in terms of spiritual rather than mental factors, or look to religion as a means of coping (Griffith et al., 2016). While clergy may not always be prepared and may not feel competent or wish to address mental health problems or illnesses, opportunities for collaboration and the support of religiosity can help reduce mental health problems (Griffith et al., 2016; Ronneberg et al., 2016; Williams et al., 2014).</p>\n<h4 id=\"for-example\">For example:</h4>\n<h4 id=\"muslim-food-bank-and-community-services\">Muslim Food Bank and Community Services</h4>\n<blockquote>\n<p>The <a href=\"https://muslimfoodbank.com/aspire/\">ASPIRE program</a> is a faith-based program that uses volunteer mental health case workers to address mental health and addiction issues within the Muslim community in the Greater Vancouver area (Jozaghi et al., 2016). The HOPE program helps raise awareness of mental health and broaden awareness of stigma and the need for prevention and harm reduction within the broader Muslim community. The program also encourages schools and newspapers to continue the discussion (Jazoghi et al., 2016).</p>\n</blockquote>\n<h4 id=\"muslim-childrens-aid-support-services\">Muslim Children's Aid &amp; Support Services</h4>\n<blockquote>\n<p>An Ontario-based registered not-for-profit aimed at empowering Muslim and non-Muslim children and the most vulnerable while being guided by Islamic values. The MCASS provides child protection for individuals and families in the Greater Toronto Area to improve their social and cultural well-being.<br />\n<a href=\"https://muslimchildrensaid.com/\">Learn more</a>.</p>\n</blockquote>\n<h4 id=\"communitas-supportive-care-society\">Communitas Supportive Care Society</h4>\n<blockquote>\n<p>A faith-based organization providing care for those living with disabilities in communities across British Columbia. Services range from 24-hour residential care to skills-based day programs to respite care for families. People of all abilities, regardless of faith, social standing, race or ethnicity, are welcome.<br />\n<a href=\"https://www.communitascare.com/services/\">Learn more</a>.</p>\n</blockquote>\n\n","words":757},{"id":"s115","mod":9,"title":"Building Community-Led Change","html":"<p>It is important to remember and emphasize that while mental health care services often focus on the individual, the individual is not separate from larger structures of influence and support. Social determinants of health affect individuals at and across different levels of society, often above and beyond the individual's control (Bharmal, et al, 2015; Dahlgren &amp; Whitehead, 1991). <strong>Similarly, programs for promoting mental health and preventing mental health problems and illnesses that intervene at multiple levels (i.e., individual, community and larger society) have a greater chance for success</strong> (Castillo et al, 2019; Strader et al., 2000).</p>\n<p>Promotion and prevention should consider individuals within the context of multiple levels of nested systems—an ecological framework—that affect an individual's life (Brofenbrenner, 1977) (Centers for Disease Control and Prevention, 2022). The individual is at the centre, with the other systems and agents working around them to help determine and model behaviour, understanding and development (Brofenbrenner, 1977; Strader et al., 2000) (Centers for Disease Control and Prevention, 2022).</p>\n<h5 id=\"considering-health-promotion-and-prevention-from-this-ecological-perspective-recognizes-that-an-individuals-wellness-is-a-multi-level-interconnected-system-that-includes\">Considering health promotion and prevention from this ecological perspective recognizes that an individual's wellness is a multi-level interconnected system that includes:</h5>\n<h4 id=\"microsystem\">Microsystem</h4>\n<blockquote>\n<p>The immediate setting around the individual (e.g., family, school or work).</p>\n</blockquote>\n<h4 id=\"mesosystem\">Mesosystem</h4>\n<blockquote>\n<p>Interrelations between micro systems (e.g., the service-providing organization or community).</p>\n</blockquote>\n<h4 id=\"exosystem\">Exosystem</h4>\n<blockquote>\n<p>The extension of formal and informal mesosystems (e.g., the neighbourhood one lives in, the media, government agencies or transportation facilities).</p>\n</blockquote>\n<h4 id=\"macrosystem\">Macrosystem</h4>\n<blockquote>\n<p>Overarching institutional patterns of the culture or subcultures that a person lives under (e.g., as educational, legal or political systems).</p>\n</blockquote>\n<p>These patterns can operate directly or indirectly to influence mental health development, understanding and outcomes (Brofenbrenner, 1977). As a result, <strong>working with the individual alone to promote well-being and prevent mental health problems and illnesses may be insufficient.</strong></p>\n<p>Health care systems and leaders emphasize early intervention as a means to reduce health care costs and improve treatment maintenance and recovery. Therefore, it is important to factor in the macro, meso and micro systems that affect individuals' lives. One potential way to support early intervention at a level beyond that of the individual is by developing communities and establishing community partnerships. <strong>Partnerships can help by increasi
