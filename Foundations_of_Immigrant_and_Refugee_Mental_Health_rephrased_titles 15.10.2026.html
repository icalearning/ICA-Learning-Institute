<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Foundations of Immigrant and Refugee Mental Health</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Public+Sans:wght@400;600;700&amp;family=Cormorant+Garamond:wght@600;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{--n9:#0a1b33;--n8:#0f2747;--n7:#16345f;--n5:#2b5a9b;--n2:#c9d8ee;--paper:#f3f6fb;--card:#fff;--ink:#14213a;--mute:#52627d;--brass:#b58a3a;--ok:#2f7d5b;--line:#d5deec;--ui:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--ser:'Literata',Georgia,'Times New Roman',serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=light]){}
*{box-sizing:border-box}html{scroll-padding-top:70px}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.7 var(--ser)}
a{color:var(--n5)}button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--n9);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 16px;font-family:var(--ui)}
#bar b{font-size:15px;white-space:nowrap}#menu{display:none;background:none;border:1px solid var(--n5);color:#fff;border-radius:6px;padding:6px 10px}
#q{flex:1;max-width:420px;margin-left:auto;padding:8px 12px;border-radius:6px;border:1px solid var(--n5);background:var(--n8);color:#fff;font:14px var(--ui)}#q::placeholder{color:#9fb3d3}
#pg{width:120px;height:8px;background:var(--n7);border-radius:4px;overflow:hidden}#pg i{display:block;height:100%;background:var(--brass);width:0}#pt{font-size:13px;min-width:34px}
#wrap{display:flex;min-height:calc(100vh - 54px)}
#nav{width:310px;flex:none;background:var(--n8);color:#dbe6f7;padding:14px 0 40px;font:14px/1.4 var(--ui);overflow:auto;position:sticky;top:54px;height:calc(100vh - 54px)}
#nav details{border-bottom:1px solid var(--n7)}#nav summary{padding:11px 16px;cursor:pointer;font-weight:600;color:#fff;list-style:none}#nav summary small{display:block;color:#9fb3d3;font-weight:400;margin-top:2px}
#nav a{display:flex;gap:8px;padding:7px 16px 7px 22px;color:#c9d8ee;text-decoration:none}#nav a:hover{background:var(--n7)}#nav a.on{background:var(--n7);color:#fff;box-shadow:inset 3px 0 var(--brass)}#nav a.done:before{content:"✓";color:#7fd1a8}#nav a:not(.done):before{content:"○";color:#6f87ad}
.tools{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}.tools button,.btn{background:var(--n7);color:#fff;border:1px solid var(--n5);border-radius:6px;padding:7px 12px;font:600 13px var(--ui)}
main{flex:1;min-width:0;padding:28px 24px 80px}.col{max-width:72ch;margin:0 auto}
.hero{background:var(--n9);color:#fff;border-radius:14px;padding:36px 32px;max-width:900px;margin:0 auto 24px}.hero h1{font:600 34px/1.2 var(--ser);margin:0 0 12px}.hero p{color:#c9d8ee;max-width:60ch;margin:0 0 18px}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#0a1b33}
.path{max-width:900px;margin:0 auto;display:grid;gap:12px}.mod{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--n7);border-radius:8px;padding:14px 18px;display:flex;gap:14px;align-items:center;font-family:var(--ui);text-decoration:none;color:var(--ink)}.mod:hover{border-left-color:var(--brass)}.mod h3{margin:0;font-size:16px}.mod small{color:var(--mute)}.mod .m{flex:1}.mod .bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.mod .bar i{display:block;height:100%;background:var(--ok)}
article h1{font:600 30px/1.25 var(--ser);color:var(--n8);margin:0 0 6px}.meta{font:13px var(--ui);color:var(--mute);margin-bottom:20px}
article h2{font:700 21px/1.3 var(--ui);color:var(--n7);margin:34px 0 8px;padding-top:14px;border-top:1px solid var(--line)}article h3{font:700 17px var(--ui);color:var(--n7);margin:24px 0 6px}article h4,article h5{font:700 15px var(--ui);color:var(--n5);margin:18px 0 4px}
article blockquote{margin:12px 0;padding:10px 16px;background:#e8eef8;border-left:4px solid var(--n5);border-radius:0 8px 8px 0}article blockquote p{margin:4px 0}
table{border-collapse:collapse;width:100%;font:14px/1.5 var(--ui);display:block;overflow-x:auto;margin:14px 0}td,th{border:1px solid var(--line);padding:8px 10px;vertical-align:top}th{background:var(--n7);color:#fff;text-align:left}img{max-width:100%}
.g{background:none;border:0;border-bottom:2px dotted var(--brass);padding:0;font:inherit;color:inherit}
#pop{position:fixed;z-index:30;max-width:320px;background:var(--n9);color:#fff;font:14px/1.5 var(--ui);padding:12px 14px;border-radius:8px;display:none;box-shadow:0 6px 24px #0006}
.reflect{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--brass);border-radius:8px;padding:12px 16px;margin:16px 0;font-family:var(--ui)}.reflect p{margin:6px 0;font:16px/1.6 var(--ser)}.reflect textarea,.notes textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:8px;font:15px var(--ui);resize:vertical}
.obj{list-style:none;padding:0}.obj li{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:10px 14px}.obj label{display:flex;gap:10px;cursor:pointer}.obj input{margin-top:6px;accent-color:var(--n5);width:18px;height:18px}
.notes{margin-top:36px;font-family:var(--ui)}.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:28px 0;font-family:var(--ui)}
.btn.ok{background:var(--ok);border-color:var(--ok)}.res{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:10px 0;font-family:var(--ui);text-decoration:none;display:block;color:var(--ink)}.res mark{background:#ffe9b0}
.fc{max-width:560px;margin:20px auto;min-height:220px;background:var(--n8);color:#fff;border-radius:14px;padding:30px;text-align:center;font:600 24px/1.4 var(--ser);display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;width:100%}.fc.back{background:var(--card);color:var(--ink);font:400 18px/1.6 var(--ser);border:2px solid var(--n7)}
.note{font:13px/1.5 var(--ui);color:var(--mute);margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:860px){#menu{display:block}#nav{position:fixed;left:0;top:54px;z-index:25;transform:translateX(-100%);transition:transform .2s}#nav.open{transform:none}#q{max-width:none}#pg{display:none}main{padding:18px 14px 70px}.hero{padding:24px 18px}.hero h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{#bar,#nav,.foot,.notes,.tools{display:none}body{background:#fff}}

#lg{display:block;margin-left:6px;background:#faf2e7;border-radius:6px;padding:3px 6px;line-height:0}#lg img{height:34px;width:auto;display:block}.bt{overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;font-family:var(--ui);margin:16px 0}.form input{width:100%;padding:11px 12px;border:1px solid var(--n5);border-radius:6px;font:17px var(--ser);margin:8px 0 12px}.err{color:#a3262a;font:14px var(--ui)}
.wm{max-width:900px;margin:0 auto 20px;font-family:var(--ser)}.wm h2{font:700 22px var(--ui);color:var(--n7);margin:28px 0 8px;padding:0;border:0}.wm ul{padding-left:20px}.wm li{margin:6px 0}.mod.cta{border-left-color:var(--brass)}
.cert{container-type:inline-size;width:100%;max-width:1056px;aspect-ratio:11/8.5;margin:18px auto;background:#fff;border:1.1cqw solid var(--n9);outline:.25cqw solid var(--n9);outline-offset:-2.2cqw;color:var(--n9);padding:4.2cqw 5.4cqw 3.4cqw;display:flex;flex-direction:column;position:relative;font-family:var(--ser)}
.cert .top{display:flex;justify-content:space-between;align-items:flex-start}.cert .top img{width:15cqw;border-radius:.5cqw}
.cert h2{font:700 4.3cqw/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.25cqw;margin:0;padding:0;border:0;color:var(--n9)}.cert .sub{font:600 1.3cqw var(--ui);color:var(--brass);letter-spacing:.15cqw;margin-top:.8cqw}
.cert p{margin:0;font-size:1.6cqw;line-height:1.55}.cert .nm{font:700 4cqw/1.2 'Cormorant Garamond',Georgia,serif;border-bottom:.15cqw solid var(--n9);padding:.2cqw 2cqw;margin:.6cqw auto;display:inline-block;min-width:34cqw;text-align:center;word-break:break-word}
.cert .mid{text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;gap:.8cqw}.cert .crs{font:700 2.8cqw/1.2 'Cormorant Garamond',Georgia,serif}
.cert ul{columns:2;column-gap:3cqw;text-align:left;margin:.4cqw auto;padding:0 0 0 1.4cqw;font:1.3cqw/1.5 var(--ui);max-width:84cqw}.cert li{break-inside:avoid;margin-bottom:.2cqw}
.cert .wmk{text-align:right}.cert .wmk img{width:24cqw;height:auto;display:block;border-radius:.8cqw}.cert .bot>div{flex:1}.cert .bot .sp{height:7cqw}.cert .bot .ln{margin:0 1.2cqw;text-align:center}.cert .bot .dt{text-align:left}.cert .bot .ln,.cert .bot .ln *{font-size:1.15cqw;line-height:1.45}.cert .bot .ln b{font-size:1.3cqw}.cert .org{font:1.05cqw var(--ui);color:var(--n7);text-align:center;margin-top:1.1cqw}
.cert .meta2{font:1.35cqw var(--ui)}.cert .bot{display:flex;justify-content:space-between;align-items:flex-end;font:1.3cqw/1.5 var(--ui)}.cert .bot img{height:7cqw;display:block}.cert .ln{border-top:.12cqw solid var(--n9);padding-top:.4cqw}
@media print{@page{size:landscape;margin:0}body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;margin:0;aspect-ratio:auto}}
@media(max-width:860px){.bt{display:none}}

.col:has(.wide){max-width:980px}.wide p,.wide h2,.wide h4{max-width:72ch}.wide h4{font:700 16px var(--ui);color:var(--n7);margin:18px 0 8px}
.grid{display:grid;gap:14px;margin:16px 0}.g1{grid-template-columns:1fr}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.cd{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--n5);border-radius:10px;padding:14px 16px;font-family:var(--ui)}.cd.br{border-top-color:var(--brass)}.cd h4{margin:0 0 6px;font:700 16px var(--ui);color:var(--n7)}.cd p{margin:0;font:14px/1.55 var(--ui);color:#26364f;max-width:none}
.stat{background:var(--n8);color:#fff;border-radius:10px;padding:16px;font-family:var(--ui)}.stat b{display:block;font:700 28px/1.15 var(--ser);color:#f1d9a6;margin-bottom:4px}.stat span{font:13.5px/1.45 var(--ui);color:var(--n2)}
.src{font:12.5px/1.5 var(--ui);color:var(--mute);margin:6px 0 20px;max-width:none}
.bars{margin:10px 0 4px}.bars .r{display:grid;grid-template-columns:230px 1fr 56px;gap:10px;align-items:center;margin:7px 0;font:14px var(--ui)}.bars .t{background:#e4ecf7;border-radius:4px;height:18px}.bars .t i{display:block;height:100%;background:var(--n5);border-radius:4px}.bars .r.hl .t i{background:var(--brass)}.bars .r b{text-align:right;color:var(--n7)}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.tl .st{border-top:4px solid var(--n5);padding-top:10px;font:14px/1.5 var(--ui)}.tl .st b{display:block;color:var(--n7);font-size:16px;margin-bottom:4px}
.gs{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--brass);border-radius:10px;padding:16px 18px;margin:16px 0;font-family:var(--ui)}.gs h4{margin:0 0 12px;font:600 16px/1.45 var(--ui);color:var(--n9);max-width:none}.rvb,.chk{background:var(--brass);color:#fff;border:0;border-radius:8px;padding:9px 18px;font:700 14px var(--ui);cursor:pointer}.rvbox{display:none;margin-top:14px}.gs.open .rvbox{display:block}.gs .rvbox p{font:14.5px/1.55 var(--ui)}
.pod{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.pod div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:14px/1.4 var(--ui)}.pod b{display:block;color:var(--n7);font-size:17px}.pod .rk{color:var(--brass);font:700 12px var(--ui);letter-spacing:.5px}
.mcq{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0;font-family:var(--ui)}.mcq h4{margin:0 0 8px;font:600 15.5px/1.5 var(--ui);color:var(--n9);max-width:none}.mcq .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--n5);background:#fff;border-radius:8px;font:15px var(--ui);cursor:pointer;color:var(--n9)}.mcq .opt.sel{background:#e4ecf7}.mcq .opt.ok{background:#e1f2e6;border-color:#2e7d4f}.mcq .opt.no{background:#fbe5e5;border-color:#a3262a}.mcq .chk{margin-top:8px}.fb{display:none;margin-top:8px;font:14px/1.5 var(--ui);color:var(--n7)}.fb.show{display:block}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}.chip{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:10px 12px;font:600 14px/1.35 var(--ui);color:var(--n7)}.chip small{display:block;color:var(--brass);font:700 11px var(--ui);margin-bottom:2px}
@media(max-width:760px){.g2,.g3,.g4,.tl{grid-template-columns:1fr}.chips{grid-template-columns:repeat(2,1fr)}.bars .r{grid-template-columns:110px 1fr 48px}}

/* --- v5 additions: list alignment, quiz polish --- */
#body ul,#body ol{margin:.6em 0 1em;padding-left:1.6em}
#body ul{list-style:disc}#body ol{list-style:decimal}
#body ul.obj{list-style:none;padding-left:0}
#body li{margin:.4em 0;padding-left:.2em}
#body li>p{margin:0 0 .35em}#body li>p:last-child{margin-bottom:0}
.mcq .opt{transition:background .25s ease,border-color .25s ease,transform .15s ease}
.mcq .opt:hover{background:#f1f5fb;transform:translateX(2px)}
.mcq .opt:active{transform:scale(.99)}
.fb.show{display:block;animation:fbin .35s ease}
@keyframes fbin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mcq:has(.opt.ok) .fb{color:#1f6b3e}.mcq:has(.opt.no) .fb{color:#8f1f23}
.mcq .opt.ok::after{content:"  \2713";font-weight:700;color:#2e7d4f}.mcq .opt.no::after{content:"  \2717";font-weight:700;color:#a3262a}
.reflect{background:#fff;border:1px solid var(--line);border-left:5px solid var(--brass);border-radius:10px;padding:12px 16px;margin:12px 0;font-family:var(--ui)}
.reflect textarea{width:100%;min-height:84px;margin-top:8px;font:15px var(--ui);padding:8px;border:1px solid var(--n5);border-radius:8px;box-sizing:border-box}

<script id="data" type="application/json">{"mods":["Getting Started: Course Orientation","Migration, Settlement, and Newcomer Mental Health","Recognizing Common Mental Health Conditions","Equity, Anti-Racism, and Culturally Responsive Practice","Accessing Care and Working with Interpreters in Canada","Settlement-Based Counselling and Case Management","Gender, Women, and Newcomer Mental Health","Supporting the Mental Health of Children and Youth","Mental Health Support for Diverse and Vulnerable Newcomer Populations","Community Partnerships and Community-Based Mental Health Promotion","Reflective Practice, Self-Care, and Practitioner Well-Being"],"secs":[{"id":"s0","mod":0,"title":"Course Roadmap and Learning Journey","html":"<h4>There are ten modules in this course:</h4><ol><li>Migration, Settlement, and Newcomer Mental Health</li><li>Recognizing Common Mental Health Conditions</li><li>Equity, Anti-Racism, and Culturally Responsive Practice</li><li>Accessing Care and Working with Interpreters in Canada</li><li>Settlement-Based Counselling and Case Management</li><li>Gender, Women, and Newcomer Mental Health</li><li>Supporting the Mental Health of Children and Youth</li><li>Mental Health Support for Diverse and Vulnerable Newcomer Populations</li><li>Community Partnerships and Community-Based Mental Health Promotion</li><li>Reflective Practice, Self-Care, and Practitioner Well-Being</li></ol><h2>Course contents</h2><h3>Module 1 — Migration, Settlement, and Newcomer Mental Health</h3><p>The course begins by helping you understand who you are helping and the challenges they face. This module provides general information about mental health and immigration in Canada, including relevant legislation, history, key issues and statistics. It then outlines the social determinants of health, which are fundamental to understanding and addressing mental health needs in general and in immigrants and refugees in particular.</p><h5>1.1 — Mental health in Canada today</h5><ul><li>1.1.1 — Mental illness in Canada: prevalence and impact</li></ul><h5>1.2 — Migration to and within Canada</h5><ul><li>1.2.1 — Global migration and Canada's immigration story</li><li>1.2.2 — Who counts as a temporary resident</li><li>1.2.3 — Permanent residents and refugee pathways</li><li>1.2.4 — Canada's population today</li><li>1.2.5 — Newcomer origins, destinations and languages</li></ul><h5>1.3 — Newcomer mental health and its determinants</h5><ul><li>1.3.1 — What the evidence says about newcomer mental health</li><li>1.3.2 — The healthy immigrant effect and its decline</li><li>1.3.3 — Biological, psychological and social determinants</li><li>1.3.4 — Pre-migration, migration and post-migration phases</li><li>1.3.5 — Social determinants after arrival in Canada</li><li>1.3.6 — Case study: Ibraheem's first winter in Canada</li></ul><h3>Module 2 — Recognizing Common Mental Health Conditions</h3><p>This module examines the most common mental disorders experienced by immigrants and refugees.</p><h5>2.1 — Mental health, illness and resilience</h5><ul><li>2.1.1 — Distress versus mental illness</li><li>2.1.2 — The mental health and mental illness continuums</li><li>2.1.3 — How common are mental health conditions among newcomers?</li></ul><h5>2.2 — Common conditions in newcomer populations</h5><ul><li>2.2.1 — Depression</li><li>2.2.2 — Anxiety</li><li>2.2.3 — Trauma and PTSD</li><li>2.2.4 — Psychotic disorders</li><li>2.2.5 — Substance use</li></ul><h3>Module 3 — Equity, Anti-Racism, and Culturally Responsive Practice</h3><p>This module explores the dynamics of working with immigrants and refugees from different races, cultures and ethnic backgrounds, and how to examine power and privilege in that relationship.</p><h5>3.1 — The foundations of health equity</h5><ul><li>3.1.1 — What is health equity?</li><li>3.1.2 — The case for health equity</li></ul><h5>3.2 — Racism, bias and anti-oppression</h5><ul><li>3.2.1 — Understanding racism</li><li>3.2.2 — Anti-Black racism</li><li>3.2.3 — How racism affects mental health</li><li>3.2.4 — Inclusion and exclusion in society</li><li>3.2.5 — Recognizing bias</li><li>3.2.6 — Anti-oppression frameworks</li></ul><h5>3.3 — Intersecting identities</h5><ul><li>3.3.1 — Identities that intersect</li><li>3.3.2 — Intersectionality and mental health</li></ul><h5>3.4 — Humility, unlearning and allyship</h5><ul><li>3.4.1 — Practising inclusively</li><li>3.4.2 — From cultural awareness to cultural humility</li><li>3.4.3 — Unlearning: examining our assumptions</li><li>3.4.4 — Power, privilege and allyship</li></ul><h3>Module 4 — Gender, Women, and Newcomer Mental Health</h3><p>Modules 4, 5 and 6 explore the unique mental health needs of different vulnerable immigrant and refugee groups.</p><h5>4.1 — Risks and experiences of newcomer women</h5><ul><li>4.1.1 — Gender as a social risk factor</li><li>4.1.2 — Gender-based and intimate partner violence</li><li>4.1.3 — Pregnancy and postpartum depression</li><li>4.1.4 — Factors linked to depression around pregnancy</li></ul><h5>4.2 — Barriers, services and support</h5><ul><li>4.2.1 — Why women delay or avoid seeking help</li><li>4.2.2 — Safe, sensitive service approaches</li><li>4.2.3 — Supporting survivors and trauma recovery</li></ul><h3>Module 5 — Supporting the Mental Health of Children and Youth</h3><p>This module looks at the mental health needs of immigrant and refugee children and youth.</p><h5>5.1 — Children and youth in the newcomer context</h5><ul><li>5.1.1 — Newcomer children in Canada: a snapshot</li><li>5.1.2 — Adolescence, youth and the move to adult services</li><li>5.1.3 — Mental health patterns in immigrant and refugee children</li></ul><h5>5.2 — Risk, protection and distress</h5><ul><li>5.2.1 — Early adversity: pre-migration and migration</li><li>5.2.2 — Life after arrival: social determinants for children</li><li>5.2.3 — Risk and protective factors for children</li><li>5.2.4 — Telling distress from disorder in refugee children</li></ul><h5>5.3 — Interventions for children and families</h5><ul><li>5.3.1 — Supporting children through schools, families and communities</li></ul><h3>Module 6 — Mental Health Support for Diverse and Vulnerable Newcomer Populations</h3><p>This module looks at older adults, survivors of torture, 2SLGBTQ+ newcomers and people living with disabilities.</p><h5>6.1 — Older newcomers</h5><ul><li>6.1.1 — Older newcomers: who they are</li><li>6.1.2 — Older newcomers: risk factors</li><li>6.1.3 — Older newcomers: service considerations</li><li>6.1.4 — Older newcomers: promoting wellbeing</li></ul><h5>6.2 — Survivors of torture</h5><ul><li>6.2.1 — Survivors of torture: who they are</li><li>6.2.2 — Survivors of torture: lasting effects</li><li>6.2.3 — Survivors of torture: service considerations</li><li>6.2.4 — Survivors of torture: interventions</li></ul><h5>6.3 — 2SLGBTQ+ newcomers</h5><ul><li>6.3.1 — 2SLGBTQ+ newcomers: context and experience</li><li>6.3.2 — 2SLGBTQ+ newcomers: risk factors</li><li>6.3.3 — 2SLGBTQ+ newcomers: service considerations</li><li>6.3.4 — 2SLGBTQ+ newcomers: interventions</li></ul><h5>6.4 — Newcomers with disabilities</h5><ul><li>6.4.1 — People with disabilities: context and experience</li><li>6.4.2 — People with disabilities: risk factors</li><li>6.4.3 — People with disabilities: service considerations</li><li>6.4.4 — People with disabilities: providing support</li></ul><h3>Module 7 — Settlement-Based Counselling and Case Management</h3><p>This module focuses on the treatment and support of immigrants and refugees with mental disorders, including models of treatment and treatment interventions.</p><h5>7.1 — Settlement counselling in practice</h5><ul><li>7.1.1 — Settlement counselling: scope and purpose</li><li>7.1.2 — Good practice in settlement services</li><li>7.1.3 — Linking settlement counselling and mental health</li></ul><h5>7.2 — Communication and relationship-building</h5><ul><li>7.2.1 — Communicating across language and culture</li><li>7.2.2 — Building a working alliance</li></ul><h5>7.3 — Core counselling and case-management skills</h5><ul><li>7.3.1 — Case management essentials</li><li>7.3.2 — Maintaining professional boundaries</li><li>7.3.3 — Trauma-informed practice</li><li>7.3.4 — Counselling across cultures</li><li>7.3.5 — Responding to a crisis</li></ul><h3>Module 8 — Accessing Care and Working with Interpreters in Canada</h3><p>This module outlines the factors that help and hinder whether and how newcomers seek services for mental health problems, and outlines key considerations when working with an interpreter.</p><h5>8.1 — Navigating the system</h5><ul><li>8.1.1 — Finding your way through mental health services</li><li>8.1.2 — What helps or hinders help-seeking</li></ul><h5>8.2 — Improving service use</h5><ul><li>8.2.1 — Making services easier to use</li><li>8.2.2 — Changing programs, policies and institutions</li></ul><h5>8.3 — Interpretation and language access</h5><ul><li>8.3.1 — Language and access to care</li><li>8.3.2 — Translation versus interpreting</li><li>8.3.3 — Working effectively with interpreters</li><li>8.3.4 — Interpreting in mental health settings</li></ul><h3>Module 9 — Community Partnerships and Community-Based Mental Health Promotion</h3><p>This module focuses on mental health promotion, the role social support plays in promoting mental wellness, and the related roles of community development and partnerships.</p><h5>9.1 — Promotion strategies</h5><ul><li>9.1.1 — Approaches to promoting mental health</li></ul><h5>9.2 — Social support networks</h5><ul><li>9.2.1 — The role of social support</li><li>9.2.2 — Formal community organizations</li><li>9.2.3 — Informal networks and peers</li></ul><h5>9.3 — Community development and partnership</h5><ul><li>9.3.1 — Building community-led change</li><li>9.3.2 — Starting from community strengths</li><li>9.3.3 — Working in partnership</li></ul><h3>Module 10 — Reflective Practice, Self-Care, and Practitioner Well-Being</h3><p>This module concludes by providing strategies to promote cultural competence, self-care and continuing education.</p><h5>10.1 — Sustaining yourself in the work</h5><ul><li>10.1.1 — Why self-care matters</li><li>10.1.2 — Compassion fatigue</li><li>10.1.3 — Vicarious (secondary) trauma</li><li>10.1.4 — Burnout: signs and effects</li><li>10.1.5 — Keeping boundaries healthy</li><li>10.1.6 — Knowing when and how to seek help</li></ul><p>This course does not provide clinical training. Information here should not substitute for professional clinical diagnoses; it aims only to provide essential basics.</p>","words":1072},{"id":"s1","mod":0,"title":"Essential Terms and Definitions","html":"<h4 id=\"adjustment-disorder\">Adjustment disorder</h4>\n<blockquote>\n<p>The presence of emotional or behavior symptoms that occur within three months of the onset of an identifiable stressor.</p>\n</blockquote>\n<h4 id=\"bisexual\">Bisexual</h4>\n<blockquote>\n<p>A person who is emotionally, physically, spiritually and/or sexually attracted to people of more than one gender, though not necessarily at the same time.</p>\n</blockquote>\n<h4 id=\"ciscisgender\">Cis/Cisgender</h4>\n<blockquote>\n<p>A person whose gender identity is the same as the sex they were assigned at birth. The term also includes the understanding that a person’s gender identity, role, expectations and expression conform to society’s expectations of the gender associated with their biological sex and anatomy.</p>\n</blockquote>\n<h4 id=\"client\">Client</h4>\n<blockquote>\n<p>The term “client” is used throughout this course (instead of “patient”, “consumer” or other terms).</p>\n</blockquote>\n<h4 id=\"ethnic-origin\">Ethnic Origin</h4>\n<blockquote>\n<p>Ethnic origin is generally used by the Government of Canada to refer to the ethnic or cultural origins of a person’s ancestors. Ethnic origin does not refer to citizenship, nationality, language or place of birth.</p>\n</blockquote>\n<h4 id=\"gay\">Gay</h4>\n<blockquote>\n<p>A person who is emotionally, physically, spiritually and/or sexually attracted to the same gender. The word can refer to men or women, although some women prefer “lesbian.” It is sometimes used as an umbrella term for the LBGTQ community.</p>\n</blockquote>\n<h4 id=\"gender-binary\">Gender Binary</h4>\n<blockquote>\n<p>A social system whereby people are thought to have either one of two genders: “man” or “woman.” These genders are expected to correspond to birth sex: male or female. In the gender binary system, there is no room for living between genders or for transcending the gender binary. The gender binary system is rigid and restrictive for many people whose sex assigned at birth does not match up with their gender, or whose gender is fluid and not fixed.</p>\n</blockquote>\n<h4 id=\"genderqueer\">Genderqueer</h4>\n<blockquote>\n<p>Individuals who do not follow gender stereotypes based on the sex they were assigned at birth. They may identify and express themselves as “feminine men” or “masculine women” or as androgynous, outside of the categories “boy/man” and “girl/woman.” People who are gender non-conforming may or may not identify as trans or transgender.</p>\n</blockquote>\n<h4 id=\"government-assisted-refugees-gars\">Government Assisted Refugees (GARs)</h4>\n<blockquote>\n<p>GARs arerefugees, from the Convention Refugees Abroad Class, whose initial resettlement in Canada is supported by the Government of Canada or the Government of Quebec.</p>\n</blockquote>\n<h4 id=\"high-context-culture\">High context culture</h4>\n<blockquote>\n<p>In high-context cultures, such as Chinese culture, other communicative cues such as body language, the understanding of unspoken rules and even silence have a more important role to play in communication. The message is not as much in the spoken word as it is embedded in the context. There is more emphasis on what is left unspoken and more responsibility on the listener to interpret the meaning.</p>\n</blockquote>\n<h4 id=\"immigrant\">Immigrant</h4>\n<blockquote>\n<p>The Canadian government defines immigrants as \"persons residing in Canada, who were born outside of Canada, excluding temporary foreign workers, Canadian citizens born outside Canada and those with student or working visas\". There are times when the term “immigrants” is included in the “refugee” classification and vice versa. In this course, where possible, an effort has been made to clarify the above when referencing literature.</p>\n</blockquote>\n<h4 id=\"incidence-risk-ratio\">Incidence risk ratio</h4>\n<blockquote>\n<p>Refers to the risk of a new event of psychosis occurring during the timeframe for the population in question, compared to the risk of a new case of psychosis occurring in the comparison group.</p>\n</blockquote>\n<h4 id=\"intersex\">Intersex</h4>\n<blockquote>\n<p>A person born with reproductive systems, chromosomes and/or hormones that are not easily characterized as male or female. This might include a woman with XY chromosomes or a man with ovaries instead of testes. Intersex characteristics occur in one out of every 1,500 births. Typically, intersex people are assigned one sex, male or female, at birth. Some intersex people identify with their assigned sex, while others do not, and some choose to identify as intersex. Intersex people may or may not identify as trans or transgender.</p>\n</blockquote>\n<h4 id=\"lesbian\">Lesbian</h4>\n<blockquote>\n<p>A woman who is emotionally, physically, spiritually and/or sexually attracted to women.</p>\n</blockquote>\n<h4 id=\"slgbtq\">2SLGBTQ+</h4>\n<blockquote>\n<p>This course uses the term 2SLGBTQ+ (2-spirit, lesbian, gay, bisexual, transgender, queer, plus). The use of this term is not intended to be exclusive; it is recognized that terminology for sexual orientation or gender identity (SOGI) can vary by region and community, and across time and place (Hall &amp; Sajnani, n.d.).</p>\n</blockquote>\n<h4 id=\"low-context-culture\">Low context culture</h4>\n<blockquote>\n<p>In low-context cultures, such as American culture, communication occurs predominantly through explicit statements. The message is in the spoken word. Silence and pauses are usually perceived as either signs of agreement or a lack of interest.</p>\n</blockquote>\n<h4 id=\"mental-disorder\">Mental Disorder</h4>\n<blockquote>\n<p>Mental disorders (also called mental illnesses) are characterized by alterations in thinking, mood or behaviour (or some combination thereof) associated with significant distress and impaired functioning.</p>\n</blockquote>\n<h4 id=\"mental-health\">Mental Health</h4>\n<blockquote>\n<p>The World Health Organization defines mental health as \"a state of well-being in which the individual realizes his or her own abilities, can cope with the normal stresses of life, can work productively and fruitfully, and is able to make a contribution to his or her community\".</p>\n</blockquote>\n<h4 id=\"mental-illness\">Mental Illness</h4>\n<blockquote>\n<p>Mental illnesses (also called mental disorders) are characterized by alterations in thinking, mood or behaviour (or some combination thereof) associated with significant distress and impaired functioning.</p>\n</blockquote>\n<h4 id=\"migrant\">Migrant</h4>\n<blockquote>\n<p>A migrant is a person who is outside their country of origin.</p>\n</blockquote>\n<h4 id=\"newcomer\">Newcomer</h4>\n<blockquote>\n<p>In this course, the phrase “immigrant and refugee” may be used interchangeably with the term “newcomer,” and both will refer to immigrants and refugees who have been in Canada for less than five years.</p>\n</blockquote>\n<h4 id=\"people-with-disabilities\">People with disabilities</h4>\n<blockquote>\n<p>People with disabilities include “those who have long-term physical, mental, intellectual or sensory impairments [by illness, injury or wounds] which in interaction with various barriers may hinder their full and effective participation in society on an equal basis with others” (United Nations [UN], 2006).</p>\n</blockquote>\n<h4 id=\"permanent-residents\">Permanent Residents</h4>\n<blockquote>\n<p>A permanent resident is a person who has been granted permanent resident status in Canada, but is not a Canadian citizen.</p>\n</blockquote>\n<h4 id=\"queer\">Queer</h4>\n<blockquote>\n<p>Formerly, a derogatory slang term used to identify 2SLGBTQ+ people. Some members of the 2SLGBTQ+ community have reclaimed queer as an identity and use it to describe their sexual orientation and/or gender identity.</p>\n</blockquote>\n<h4 id=\"racialized\">Racialized</h4>\n<blockquote>\n<p>The Ontario Human Rights Commission describes people as “racialized person” or “racialized group” instead of the terms “racial minority,” “visible minority,” “person of colour” or “non-White,” as “racialized” expresses race as a social construct rather than as a description based on perceived biological traits. The term “racialized” is used in this course, except when referring to sources which use different terminology (e.g., visible minority, South Asian, etc.). In those cases, the original terms from the literature are used.</p>\n</blockquote>\n<h4 id=\"refugee\">Refugee</h4>\n<blockquote>\n<p>The United Nations Convention relating to the Status of Refugees defines a refugee as someone who, \"owing to a well-founded fear or being persecuted for reasons of race, religion, nationality, membership of a particular social group, or political opinion, is outside the country of his nationality, and is unable to or, owing to such fear, is unwilling to avail himself of the protection of that country\". There are times when the term “immigrants” is included in the “refugee” classification and vice versa. In this course, where possible, an effort has been made to clarify the above when referencing literature.</p>\n</blockquote>\n<h4 id=\"temporary-resident\">Temporary Resident</h4>\n<blockquote>\n<p>A temporary resident is a person who has permission to remain in Canada on a temporary basis. The three main types of temporary residence are: (1) visitors, (2) students, and (3) workers.</p>\n</blockquote>\n<h4 id=\"transgender\">Transgender</h4>\n<blockquote>\n<p>Umbrella terms that describe people with diverse gender identities and gender expressions that do not conform to stereotypical ideas about what it means to be a girl/woman or boy/man in society. “Trans” can mean transcending beyond, existing between, or crossing over the gender spectrum. It includes but is not limited to people who identify as transgender or gender non-conforming (gender variant or gender-queer).<br />\n<br />\nTrans identities include people whose gender identity is different from the gender associated with their birth-assigned sex. Trans people may or may not undergo medically supportive treatments, such as hormone therapy and a range of surgical procedures, to align their bodies with their internally felt gender identity.</p>\n</blockquote>\n<h4 id=\"two-spirit\">Two-spirit</h4>\n<blockquote>\n<p>A term used by Indigenous Peoples to describe from a cultural perspective people who are gay, lesbian, bisexual, trans or intersex. It is used to capture a concept that exists in many different Indigenous cultures and languages. For some, the term two-spirit describes a societal and spiritual role that certain people played within traditional societies. They were often mediators, keepers of certain ceremonies and transcended accepted roles of men and women by filling a role as an established middle gender.</p>\n</blockquote>\n<h4 id=\"violence-against-women\">Violence against women</h4>\n<blockquote>\n<p>The United Nations Declaration on the Elimination of Violence against Women (1993, Article 1) defines violence against women as “any act of gender-based violence that results in, or is likely to result in, physical, sexual or psychological harm or suffering to women, including threats of such acts, coercion or arbitrary deprivations of liberty, whether occurring in public or in private life.”</p>\n</blockquote>\n<h4 id=\"visible-minority\">Visible Minority</h4>\n<blockquote>\n<p>Visible minority refers to “persons, other than Aboriginal peoples, who are non-Caucasian in race or non-white in colour”. This term is used by some researchers; however, the term “racialized” will be used throughout this course.</p>\n</blockquote>\n","words":1475},{"id":"s2","mod":0,"title":"Welcome and Course Introduction","html":"<h2 id=\"congratulations-on-beginning-the-immigrant-and-refugee-mental-health-course.\">Congratulations on beginning the Immigrant and Refugee Mental Health course.</h2>\n<p>This online course is a self-directed training program that offers a comprehensive overview of immigrant and refugee mental health, with a focus on subgroups at risk. This course provides in-depth discussion on how context and culture influence mental health and mental illness, offers sample tools and resources to use in various practice settings, and demonstrates evidence-based strategies and interventions to help you provide better services and supports to different immigrant and refugee populations. You will find practical examples of promising and innovative practices that are effective in improving outcomes for different immigrant and refugee groups.</p>\n<p>The course is designed to provide a uniquely interactive learning experience where you can consult with experts in the field, share ideas and experiences with hundreds of service providers from all over Canada, and learn strategies you would use on-the-job. Using online learning technology, the course will offer a balance of background information, current research evidence, practical information and worked examples.</p>\n<p>The Immigrant and Refugee Mental Health Project team would like to thank all course participants for participating in this initiative. Your engagement with the course material and with other service providers across Canada will make this an exceptional learning environment, and will ultimately lead to better support and care for immigrant and refugee populations.</p>\n<h4 id=\"toolkit-of-resources\">Toolkit of Resources</h4>\n<p>Resources that appear in this course, and more, are compiled in our Toolkit of Resources. This document provides an overview of essential information, tools, resources and examples of promising practices you can integrate in your daily work. The toolkit features a repository of evidence-based research, information on key models of care and frameworks and an outline of components that are pertinent to service delivery.</p>\n<p><a href=\"https://www.camh.ca/en/professionals/professionals--projects/immigrant-and-refugee-mental-health-project/toolkit\"><strong>Learn More</strong></a></p>\n<p><a href=\"https://www.camh.ca/en/professionals/professionals--projects/immigrant-and-refugee-mental-health-project\"><strong>Read more about the Immigrant and Refugee Mental Health Project</strong></a></p>\n<p>This project is funded by Immigration, Refugees and Citizenship Canada.</p>\n\n","words":311},{"id":"s3","mod":1,"title":"Module Overview and Learning Focus","html":"<p>This module begins with a brief overview of Canada's mental health system, including the prevalence of mental illness, its effects and the legislation that affects clients. This module also introduces information on mental illness among the general population compared to that of immigrants and refugees, and examines the effects of social determinants of health and migration on newcomer populations.</p>\n<p>When considering mental health problems and illnesses among immigrant and refugee populations, providers should always employ more than one approach and avoid a one-size-fits-all approach. Immigrants and refugees are not all the same; many factors contribute to creating unique situations that can influence their mental health, including their histories before coming to Canada, their journeys here and their experiences after arriving (Mental Health Commission of Canada, 2016). Providers should have a grasp of these factors to better understand their clients and how to meet their needs.</p>\n<h5 id=\"to-better-understand-the-factors-that-affect-mental-health-of-immigrants-and-refugees-we-have-divided-the-module-into-three-sections\">To better understand the factors that affect mental health of immigrants and refugees, we have divided the module into three sections:</h5>\n<ol type=\"1\">\n<li><p>Understanding mental health in Canada</p></li>\n<li><p>Understanding immigration in Canada</p></li>\n<li><p>Mental health of immigrants and refugees</p></li></ol>\n<h2 id=\"learning-objectives\">Learning objectives</h2>\n<h4 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to:</h4>\n<ul>\n<li><p>Describe the general prevalence of mental illness in Canada and its socioeconomic effects.</p></li>\n<li><p>Describe the Canadian refugee system and understand the trends in immigration and refugee demographics.</p></li>\n<li><p>Recognize key issues related to mental health of immigrants and refugees.</p></li>\n<li><p>Define the three phases of the immigrant and refugee journey.</p></li>\n<li><p>Define the formal classes of immigrants coming to Canada.</p></li>\n<li><p>Identify the social determinants of immigrant and refugee mental health.</p></li>\n</ul>\n<h2 id=\"terminology\">Terminology</h2>\n<h3 id=\"below-are-definitions-of-common-terms-that-are-used-throughout-this-module\">Below are definitions of common terms that are used throughout this module:</h3>\n<h4 id=\"immigrants\">Immigrants</h4>\n<blockquote>\n<p>Persons born outside of Canada who have been granted the right to live in Canada permanently</p>\n</blockquote>\n<h4 id=\"refugees\">Refugees</h4>\n<blockquote>\n<p>People who are unable to safely remain in their own country, or are outside their country, on account of a fear of persecution due to their ethnicity, nationality, religion or social or political affiliations.</p>\n</blockquote>\n<h4 id=\"migrants\">Migrants</h4>\n<blockquote>\n<p>People who have moved across international borders or within a country/state but away from their normal place of residence. For example, someone who moves from Ontario to Alberta would also be considered a migrant. For the purposes of the course, migrant refers to international migrants.</p>\n</blockquote>\n<ul>\n<li>In the public realm, the terms immigrant, migrant and refugee are often used interchangeably; in the academic literature, the distinctions can similarly be unclear. There are times when the term “immigrants” is included in the “refugee” classification and vice versa. In this course, where possible, an effort has been made to clarify the above when referencing literature.</li>\n</ul>\n<blockquote>\n<p>In this course, the phrase immigrant and refugee may be used interchangeably with the term newcomer, and both will refer to immigrants and refugees who have been in Canada for less than five years.</p>\n</blockquote>\n<h4 id=\"client\">Client</h4>\n<blockquote>\n<p>This course uses \"client\" instead of “patient”, “consumer” or other terms that denote healthcare recipients.</p>\n</blockquote>\n<h4 id=\"mental-health-problems-and-illnesses\">Mental health problems and illnesses</h4>\n<blockquote>\n<p>These terms refer to the full range of behaviours, thinking and emotions that bring about levels of distress, suffering and impairment in individuals. Mental disorder(s) is used to refer specifically to diagnosed illnesses.</p>\n</blockquote>\n<h4 id=\"racialized-personsgroups\">Racialized persons/groups</h4>\n<blockquote>\n<p>The Ontario Human Rights Commission describes people as racialized persons or racialized groups instead of the terms “racial minority,” “visible minority,” “person of colour” or “non-White.” “Racialized” expresses race as a social construct rather than as a description based on perceived biological traits (Ontario Human Rights Commission, 2005). The term racialized is used in this course, except when referring to sources that use different terminology (e.g., visible minority, South Asian, etc.). In those cases, the original terms from the literature are used.</p>\n</blockquote>\n<h4 id=\"ethnic-origin\">Ethnic origin</h4>\n<blockquote>\n<p>This term is generally used by the Government of Canada to refer to the ethnic or cultural origins of a person's ancestors. Ethnic origin does not refer to citizenship, nationality, language or place of birth (Statistics Canada, 2017a).</p>\n</blockquote>\n<h4 id=\"visible-minority\">Visible minority</h4>\n<blockquote>\n<p>This term refers to “persons, other than Aboriginal peoples, who are non-Caucasian in race or non-white in colour” (Statistics Canada, 2017b). This term is used by some researchers, however, the term racialized will be used throughout this course.</p>\n</blockquote>\n\n","words":692},{"id":"s4","mod":1,"title":"Mental Health Conditions in Canada: Prevalence and Impact","html":"<p>In any given year, <strong>one in five</strong> Canadians will experience a mental health problem or illness.</p>\n<p>About <strong>half of Canadians will have or have had mental health problems or disorders</strong> by the time they turn 40 years old.(Canadian Mental Health Association, 2021)</p>\n<p>By 2041, it is projected that <strong>over 8.9 million people in Canada</strong> will be living with a mental health problem or illness — and this figure does not account for COVID-19 impacts. It is estimated that this increase will apply to all age groups. The increase is primarily driven by Canada's projected population growth and aging population over the next 30 years. (Mental Health Commission of Canada, 2013)</p>\n<p>Note: mental illness here includes mood and anxiety disorders, SUD, schizophrenia, ADHD, ODD, Conduct Disorders, and Dementia.</p>\n<h3 id=\"impact-of-covid-19\">Impact of COVID-19</h3>\n<p>National surveys on COVID-19 and mental health indicate that more Canadians screened positive for symptoms of depression and anxiety a year after the pandemic began compared to the year before the pandemic. Racialized persons and those already experiencing poor mental health before COVID-19 experienced greater negative impacts (Statistics Canada, 2021; Canada, 2020).</p>\n","words":202},{"id":"s5","mod":1,"title":"Global Migration and Canada's Immigration Context","html":"<div class=\"wide\"><h2>Around the world</h2>\n<p>Migration touches every region of the world. In 2020, about one in thirty people worldwide was a migrant.</p><div class=\"grid g3\"><div class=\"stat\"><b>281 million</b><span>international migrants, meaning people living in a country other than the one they were born in</span></div><div class=\"stat\"><b>82.4 million</b><span>people forcibly displaced by persecution, conflict, generalized violence or human rights violations</span></div><div class=\"stat\"><b>169 million</b><span>labour migrants</span></div></div><div class=\"grid g2\"><div class=\"stat\"><b>26.4 million</b><span>refugees</span></div><div class=\"stat\"><b>4.1 million</b><span>asylum seekers</span></div></div><p class=\"src\">Source: International Organization for Migration, 2021.</p>\n<h2>Test your knowledge</h2><div class=\"gs\"><h4>Guess the answer: Which three countries hosted the most international migrants?</h4><button class=\"rvb\" data-l=\"Show answer\">Show answer</button><div class=\"rvbox\"><div class=\"pod\"><div><span class=\"rk\">1st</span><b>United States</b>50.6 million (2019)</div><div><span class=\"rk\">2nd</span><b>Germany</b>15.8 million (2020)</div><div><span class=\"rk\">3rd</span><b>Russian Federation</b>11.6 million (2020)</div></div><p class=\"src\">Source: United Nations Department of Economic and Social Affairs, 2021.</p></div></div><div class=\"gs\"><h4>Guess the answer: Nearly 86% of the world's refugees are hosted by developing countries. Which five countries hosted the most forcibly displaced people in 2020 to 2021?</h4><button class=\"rvb\" data-l=\"Show answer\">Show answer</button><div class=\"rvbox\"><div class=\"pod\"><div><span class=\"rk\">1st</span><b>Türkiye</b>3.7 million</div><div><span class=\"rk\">2nd</span><b>Colombia</b>1.7 million</div><div><span class=\"rk\">3rd</span><b>Pakistan</b>1.4 million</div><div><span class=\"rk\">4th</span><b>Uganda</b>1.4 million</div><div><span class=\"rk\">5th</span><b>Germany</b>1.2 million</div></div><p class=\"src\">Source: UNHCR, the UN Refugee Agency, 2021.</p></div></div>\n<h2>Immigration in Canada</h2>\n<p>Early immigration to Canada came mostly from Europe. From the 1960s onward the range of source countries widened considerably, and the share of newcomers from Europe has fallen in every decade since the 1970s.</p><div class=\"tl\"><div class=\"st\"><b>1970s</b>Refugees arrive from Chile, Bangladesh and Indochina.</div><div class=\"st\"><b>1990s to early 2000s</b>Asylum seekers and refugees arrive from Africa, Latin America, Kosovo, Hong Kong and Thailand.</div><div class=\"st\"><b>2015 onward</b>Canada resettles over 44,620 Syrian refugees (as of fall 2020), with later programs for Afghan and Ukrainian arrivals.</div><div class=\"st\"><b>Today</b>Asia is the leading source region, with 62.0% of recent immigrants admitted from 2016 to 2021.</div></div><p class=\"src\">Sources: Government of Canada, 2017a, 2020, 2022; Statistics Canada, 2016, 2022.</p><div class=\"grid g3\"><div class=\"cd br\"><h4>Afghanistan</h4><p>Canada committed to resettling 40,000 Afghan refugees and was on track to reach that target (Government of Canada, 2022).</p></div><div class=\"cd br\"><h4>Ukraine</h4><p>In the first six months of the war, about 8,700 Ukrainians arrived by land and 46,000 by air. Under the Canada-Ukraine Authorization for Emergency Travel (CUAET), Ukrainians and their family members can apply for a temporary resident visa to stay for up to three years.</p></div><div class=\"cd br\"><h4>Top source countries</h4><p>India (18.6%), the Philippines (11.4%) and China (8.9%) were the top three birthplaces of recent immigrants in 2021 (Statistics Canada, 2022).</p></div></div>\n<h2>Canada's population growth</h2>\n<p>Migration plays a growing part in Canada's population growth, because the contribution of births has declined in recent years.</p><div class=\"grid g2\"><div class=\"stat\"><b>80%+</b><span>of Canada's population growth could come from migration by 2031, according to projections (Statistics Canada, 2017e).</span></div><div class=\"cd \"><h4>Impact of COVID-19</h4><p>Travel restrictions reduced the flow of newcomers, and processing capacity fell during the first six months of the pandemic. Admissions rose again as restrictions eased (Conference Board of Canada, 2021).</p></div></div><div class=\"grid g2\"><div class=\"stat\"><b>72% and 63%</b><span>fall in refugee and family-class admissions during the pandemic, the two groups hit hardest.</span></div><div class=\"cd \"><h4>Recovery</h4><p>By mid-2022, admissions had almost returned to pre-pandemic levels. Immigration, Refugees and Citizenship Canada prioritized people already in Canada for permanent residence, since they were less exposed to COVID-19 disruptions.</p></div></div></div>","words":490},{"id":"s6","mod":1,"title":"Temporary Resident Status in Canada","html":"<div class=\"wide\"><p>Immigration, Refugees and Citizenship Canada (IRCC) sets the conditions that decide who enters and who may stay in Canada. The system is governed by the <a href=\"https://laws.justice.gc.ca/eng/acts/i-2.5/page-1.html\">Immigration and Refugee Protection Act (IRPA)</a> and its regulations. Foreign nationals who enter Canada are classified as either temporary residents or permanent residents.</p><div class=\"grid g2\"><div class=\"cd \"><h4>Temporary residents</h4><p>Allowed to stay for a limited time, for example to study, work or visit. They are not considered immigrants, so this course does not directly address their mental health needs. This overview is included to explain the wider policy context.</p></div><div class=\"cd br\"><h4>Permanent residents</h4><p>Allowed to live in Canada indefinitely and eligible for most social benefits. They are counted as immigrants and are the main focus of this course.</p></div></div>\n<h2>Who is a temporary resident?</h2><div class=\"grid g3\"><div class=\"cd \"><h4>International students</h4><p>People studying in Canada on a study permit.</p></div><div class=\"cd \"><h4>Refugee claimants*</h4><p>Most people who have asked for protection (asylum seekers) while they wait for a decision.</p></div><div class=\"cd \"><h4>Temporary foreign workers</h4><p>People employed in Canada under temporary work programs.</p></div><div class=\"cd \"><h4>Temporary resident permit holders</h4><p>People who receive permission to enter or stay for a specific reason.</p></div><div class=\"cd \"><h4>Visitors</h4><p>People who come for short stays, such as tourism or family visits.</p></div><div class=\"cd \"><h4>Work permit holders</h4><p>People authorized to work in Canada for a set period.</p></div></div><p class=\"src\">Source: Government of Canada, 2017b. *Refugee claimants who are found by the Immigration and Refugee Board (IRB) to be protected persons or Convention refugees can apply for permanent resident status (Government of Canada, 2017c).</p>\n<h2>Trends</h2><div class=\"grid g3\"><div class=\"stat\"><b>Rising</b><span>The number of temporary residents has increased steadily, with permission to work or study in Canada.</span></div><div class=\"stat\"><b>4x+</b><span>Growth in temporary foreign workers between 2000 and 2015 (Community Foundations of Canada, 2017).</span></div><div class=\"stat\"><b>2.9%</b><span>Share of total employment held by temporary foreign workers in 2017 (Lu & Hou, 2020).</span></div></div><div class=\"grid g1\"><div class=\"cd br\"><h4>Impact of COVID-19</h4><p>Temporary residents were hit hard by the pandemic through travel restrictions, government measures and fear of infection. Business closures and reduced operations led to many layoffs among temporary foreign workers (Statistics Canada, 2020). Their jobs were concentrated in sectors such as agriculture, forestry and fishing, which were heavily affected.</p></div></div></div>","words":337},{"id":"s7","mod":1,"title":"Permanent Residence and Refugee Pathways in Canada","html":"<p>Permanent residents are individuals who have been given the right to move to Canada and settle permanently. They are not Canadian citizens, but rather they are citizens of other countries. This course focuses on populations that fall within this category. This group includes <strong>economic class immigrants, family class immigrants and refugees who are resettled from overseas.</strong></p>\n<p>After residing in Canada for three of their last five years, permanent residents can apply for Canadian citizenship (Government of Canada, 2017d).</p>\n<h3 id=\"permanent-residents-by-category\">Permanent residents by category</h3>\n<ul>\n<li><p><strong>Economic class</strong></p></li>\n<li><p><strong>Refugee class</strong></p></li>\n<li><p><strong>Family class</strong></p></li>\n</ul>\n<h3 id=\"permanent-residents-admitted-in-2016-by-category\">Permanent residents admitted in 2016 by category</h3>\n<p>As demonstrated, the majority of newcomers were admitted under the economic class:</p>\n<p><strong>56%</strong><br />\nEconomic<br />\nimmigrants</p>\n<p><strong>18%</strong><br />\nResettled refugees/ protected persons</p>\n<p><strong>24%</strong><br />\nSponsored family members</p>\n<p><strong>2% </strong>Humanitarian and other</p>\n<h2 id=\"resettlement-from-outside-canada\">Resettlement from outside Canada</h2>\n<p>The <a href=\"https://www.cic.gc.ca/english/refugees/outside/index.asp\">Refugee and Humanitarian Resettlement Program</a> is for people in need of protection who are <em>outside</em> Canada. The Canadian government uses the term <strong>resettlement</strong> to describe the legal process of bringing refugees from the country where they have sought protection to Canada to live as permanent residents. Their status when they arrive is the same as that of permanent residents who immigrated under any other category.</p>\n<h5 id=\"people-who-can-be-resettled-from-outside-canada-fall-into-two-classes\">People who can be resettled from outside Canada fall into two classes:</h5>\n<ul>\n<li><p><a href=\"https://www.cic.gc.ca/english/refugees/outside/convention.asp\">Convention refugees abroad</a></p></li>\n<li><p><a href=\"https://www.cic.gc.ca/english/refugees/outside/asylum.asp\">Country of asylum</a></p></li>\n</ul>\n<h5 id=\"these-refugees-can-be-resettled-to-canada-through-three-programs\">These refugees can be resettled to Canada through three programs:</h5>\n\n<h5 id=\"government-assisted-refugee-gar-program\">Government-Assisted Refugee (GAR) program:</h5>\n<blockquote>\n<p>Initial resettlement in Canada is supported by the Government of Canada.</p>\n</blockquote>\n\n<h5 id=\"private-sponsorship-of-refugees-psr-program\">Private Sponsorship of Refugees (PSR) program:</h5>\n<blockquote>\n<p>Resettlement in Canada is supported by a group of people in Canada.</p>\n</blockquote>\n\n<h5 id=\"blended-visa-office-referred-bvor-program\">Blended Visa Office-Referred (BVOR) program:</h5>\n<blockquote>\n<p>UNHCR matches refugees with private sponsors to support their resettlement in Canada.</p>\n</blockquote>\n<p>(Government of Canada, 2017i)</p>\n<h3 id=\"refugee-resettlement-by-program\">Refugee resettlement by program</h3>\n<p>Refugee resettlement rose sharply in 2016, due to the arrival of Syrian refugees in Canada. (IRCC, 2015)</p>\n<h2 id=\"refugee-claims-from-inside-canada\">Refugee claims from inside Canada</h2>\n<h4 id=\"the-in-canada-asylum-program\">The In-Canada Asylum program</h4>\n<p>is for people seeking asylum (i.e., making a refugee protection claim) from within Canada or at one of Canada's borders. This program offers protection to individuals who have a well-founded fear of persecution or who are at risk of torture or unusual punishment if they return to their home country (Government of Canada, 2017j). Individuals can apply for refugee protection in Canada by making a claim at a port of entry or at an Immigration, Refugees and Citizenship Canada (IRCC) office. Eligible claims are sent to the Immigration and Refugee Board (IRB) for a decision.</p>\n<h4 id=\"refugee-claimants\">Refugee claimants</h4>\n<p>(also called asylum seekers) are temporary residents in Canada while their claims are being considered. Refugee claimants whose claims are accepted may apply for permanent residency in Canada. Those whose claims are rejected can apply for a <a href=\"https://www.cic.gc.ca/ENGLISH/refugees/reform-rad.asp\">judicial review of the Immigrant and Refugee Board (IRB) decision</a>. They can also apply to stay in Canada on <a href=\"https://www.cic.gc.ca/english/resources/tools/perm/hc/processing/canada/index.asp\">humanitarian or compassionate grounds</a> or they can apply for a <a href=\"https://www.cic.gc.ca/english/refugees/inside/prra.asp\">pre-removal risk assessment (PRRA)</a> (Government of Canada, 2017k).</p>\n<p><a href=\"https://www.cic.gc.ca/english/refugees/inside/index.asp\"><strong>Learn more about the In-Canada Asylum program</strong></a></p>\n<h2 id=\"situational-differences-between-immigrant-and-refugee-clients\">Situational differences between immigrant and refugee clients</h2>\n<h5 id=\"when-working-with-immigrant-and-refugee-clients-it-is-important-to-understand-key-differences-caused-by-their-migration-experiences-as-outlined-in-the-table-below.-this-will-help-service-providers-better-understand-their-clients-particular-situations-and-needs.\">When working with immigrant and refugee clients, it is important to understand key differences caused by their migration experiences as outlined in the table below. This will help service providers better understand their clients' particular situations and needs.</h5>\n\n<h2 id=\"immigrants\">Immigrants</h2>\n<ul>\n<li><p>Choose to leave their homeland and settle in a country of their choice.</p></li>\n<li><p>Pick comfortable travel method and pack the possessions they wish to take.</p></li>\n<li><p>Sell or dispose of possessions they don't wish to take.</p></li>\n<li><p>Have time to prepare emotionally for their departure and to say farewell to friends and family appropriately.</p></li>\n<li><p>Bring travel documents, passports and other documentation.</p></li>\n<li><p>Usually emigrate with their families.</p></li>\n<li><p>Depart for their new country usually with family, knowing they can return to their homeland for visits or return permanently if they cannot settle.</p></li>\n<li><p>Usually are well-prepared and well-motivated to settle in a new country; often will have found out about schools, employment and local conditions before leaving their homeland.</p></li>\n<li><p>Are less likely to encounter negative attitudes in their resettlement country due to their better levels of health, education and economic independence.</p></li>\n\n\n</ul>\n<h2 id=\"refugees\">Refugees</h2>\n<ul>\n<li><p>Do not choose to leave their homeland; they flee in response to a crisis and have little choice of destination.</p></li>\n<li><p>Have no time to pack or to distribute possessions; almost everything is left behind.</p></li>\n<li><p>Are unprepared emotionally for leaving due to their hurried, often secret departure; may not have time to say farewell to loved ones.</p></li>\n<li><p>Often flee without any documentation whatsoever.</p></li>\n<li><p>Must often leave family members behind; although they dream of returning home, they know this is unlikely to happen.</p></li>\n<li><p>Arrive in their new country ill-prepared and often traumatized.</p></li>\n<li><p>Have little in the way of possessions and financial resources.</p></li>\n<li><p>Are often debilitated by a pervading sense of loss, grief, worry and guilt about the family left behind.</p></li>\n<li><p>May experience stigma and prejudice in their resettlement country in relation to cultural differences, disease prevalence, low education levels and perceived burdening of the welfare system.</p></li>\n</ul>\n<blockquote>\n<p>(Gajardo, 2007)</p>\n</blockquote>\n<div class=\"wide\"><h2>Review questions</h2><p>Select one answer for each question to see the explanation.</p><div class=\"mcq\" data-fb=\"Sponsorship by a family member who is a citizen or permanent resident falls under the family class.\"><h4>Asheni is a newcomer from Colombo, Sri Lanka. Her son, a Canadian citizen, sponsored her and committed to supporting her basic needs. Under which category was she admitted as a permanent resident?</h4><button class=\"opt\" data-ok=\"1\">Family class</button><button class=\"opt\">Refugee claimant</button><button class=\"opt\">Economic class</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Selection by points for skills, education and work experience is part of the economic class.\"><h4>Abdi is a newcomer from Somalia. He was assessed on a points system for his education and his experience as a professional engineer. Under which category was he admitted?</h4><button class=\"opt\">Family class</button><button class=\"opt\">Refugee claimant</button><button class=\"opt\" data-ok=\"1\">Economic class</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"People who make a protection claim after arriving in Canada are handled through the in-Canada asylum program.\"><h4>Daniel has arrived in Manitoba from South America and is seeking protection because he fears persecution at home. Which program does his claim fall under?</h4><button class=\"opt\">Family class</button><button class=\"opt\">Economic class</button><button class=\"opt\" data-ok=\"1\">In-Canada asylum program</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Refugees who apply from outside Canada are considered under the refugee and humanitarian resettlement program.\"><h4>Sarah fled Syria and is living in Lebanon. She is going through the process of seeking protection in Canada while still outside the country. What is this program called?</h4><button class=\"opt\">Economic class</button><button class=\"opt\" data-ok=\"1\">Refugee and humanitarian resettlement program</button><button class=\"opt\">Refugee claimant process</button><button class=\"opt\">Family class</button><div class=\"fb\"></div></div></div><h2 id=\"refugee-specific-trends\">Refugee-specific trends</h2>\n<p>Every year, millions of people around the world are displaced due to conflict and persecution. By mid-2021, over 84 million people worldwide were forcibly uprooted, according to the United Nations High Commission on Refugees; of these, over 26.6 million were considered refugees (UNHCR, 2021). The 2016 UNHCR Global Trends report outlines the nature of the ongoing refugee crises around the world.</p>\n<h2 id=\"unhcrs-global-trends-report\">UNHCR's Global trends report</h2>\n<h3 id=\"featured-resource\">Featured resource</h3>\n<p>Read <a href=\"https://www.unhcr.ca/wp-content/uploads/2017/04/Canadian-Resettlement-Fact-Sheet-ENG-April-2017.pdf\">this fact sheet</a> developed by UNHCR for more information on the process and programs related to resettlement in Canada.</p>\n<h4 id=\"during-periods-of-intense-regional-conflict-or-human-rights-violations-a-large-number-of-refugees-may-originate-from-certain-regions-of-the-world.\">During periods of intense regional conflict or human rights violations, a large number of refugees may originate from certain regions of the world.</h4>\n<h5 id=\"in-mid-2021-for-example-the-top-five-source-countries-for-refugees-were\">In mid-2021, for example, the top five source countries for refugees were:</h5>\n<ul>\n<li><p>Syrian Arab Republic</p></li>\n<li><p>Venezuela</p></li>\n<li><p>Afghanistan</p></li>\n<li><p>South Sudan</p></li>\n<li><p>Myanmar</p></li></ul>\n<p>The leading source countries of refugees change from year to year according to global circumstances. <strong>Canada has resettled or granted asylum to refugees from more than 140 countries</strong> (CIC, 2011).</p>\n<p>In 2014, for example, the largest proportion of refugees resettled to Canada as permanent residents came from the regions of Africa and the Middle East. In contrast, the largest numbers of in-Canada refugee claimants were from China, Pakistan, Iraq, Nigeria and Colombia (CIC, 2015).</p>\n<p>In 2015, the Government of Canada notably increased the number of resettled refugees to be accepted into the country. Since November 4, 2015, over 40,000 Syrian refugees have arrived in Canada through GAR, PSR and BVOR programs (Government of Canada, 2016).</p>\n\n","words":1311},{"id":"s8","mod":1,"title":"Canada's Population and Newcomer Communities Today","html":"<div class=\"wide\"><p>Changes in immigration shape the make-up of Canada's population. They can be seen in who lives in our communities, the languages people speak, the ethnic origins people report and the share of the population that is racialized.</p>\n<h2>Canada in 2021</h2><div class=\"grid g4\"><div class=\"stat\"><b>23.0%</b><span>of the population were or had been immigrants (8.36 million people), the highest share on record</span></div><div class=\"stat\"><b>1.3 million</b><span>recent immigrants settled permanently between 2016 and 2021</span></div><div class=\"stat\"><b>26.5%</b><span>belonged to a racialized (visible minority) group, about 9.6 million people</span></div><div class=\"stat\"><b>23.2%</b><span>had a mother tongue other than English or French, about 8.5 million people</span></div></div><p class=\"src\">Sources: Statistics Canada, Census of Population, 2021 (The Daily, October 26, 2022; The Daily, January 22, 2025).</p><div class=\"gs\"><h4>Guess the answer: In 2021, what share of people in Canada were immigrants, and was it a record?</h4><button class=\"rvb\" data-l=\"Show answer\">Show answer</button><div class=\"rvbox\"><p><b>23.0%, almost one in four.</b> This was the highest proportion since Confederation, topping the previous record of 22.3% in 1921. Statistics Canada projects that immigrants could make up 29.1% to 34.0% of the population by 2041.</p></div></div>\n<h2>Where immigrants were born</h2>\n<p>Share of all immigrants living in Canada in 2021, by region of birth:</p><div class=\"bars\"><div class=\"r hl\"><span>Asia (incl. Middle East)</span><div class=\"t\"><i style=\"width:100.0%\"></i></div><b>51.4%</b></div><div class=\"r\"><span>Europe</span><div class=\"t\"><i style=\"width:43.8%\"></i></div><b>22.5%</b></div><div class=\"r\"><span>Caribbean, Central and South America</span><div class=\"t\"><i style=\"width:22.4%\"></i></div><b>11.5%</b></div><div class=\"r\"><span>Africa</span><div class=\"t\"><i style=\"width:19.3%\"></i></div><b>9.9%</b></div><div class=\"r\"><span>United States</span><div class=\"t\"><i style=\"width:7.6%\"></i></div><b>3.9%</b></div><div class=\"r\"><span>Oceania and other</span><div class=\"t\"><i style=\"width:1.6%\"></i></div><b>0.8%</b></div></div><p class=\"src\">Source: Statistics Canada, Census of Population, 2021 (Canada at a Glance, 2022).</p></div>","words":217},{"id":"s9","mod":1,"title":"Newcomer Origins, Destinations, and Languages","html":"<div class=\"wide\"><h2>Where newcomers come from</h2>\n<p>The countries and regions newcomers come from have changed dramatically in fifty years.</p><div class=\"gs\"><h4>Guess the answer: In 2021, which three countries were the top birthplaces of recent immigrants (admitted 2016 to 2021)?</h4><button class=\"rvb\" data-l=\"Show answer\">Show answer</button><div class=\"rvbox\"><div class=\"pod\"><div><span class=\"rk\">1st</span><b>India</b>18.6%</div><div><span class=\"rk\">2nd</span><b>Philippines</b>11.4%</div><div><span class=\"rk\">3rd</span><b>China</b>8.9%</div></div><p>Together these three countries accounted for about 40% of recent immigrants. India alone accounted for almost one in five.</p></div></div>\n<p>Share of recent immigrants by region of birth, 1971 compared with 2021:</p><div class=\"bars\"><div class=\"r\"><span>Europe, 1971</span><div class=\"t\"><i style=\"width:99.4%\"></i></div><b>61.6%</b></div><div class=\"r hl\"><span>Europe, 2021</span><div class=\"t\"><i style=\"width:16.3%\"></i></div><b>10.1%</b></div><div class=\"r\"><span>Asia, 1971</span><div class=\"t\"><i style=\"width:19.5%\"></i></div><b>12.1%</b></div><div class=\"r hl\"><span>Asia, 2021</span><div class=\"t\"><i style=\"width:100.0%\"></i></div><b>62.0%</b></div><div class=\"r\"><span>Africa, 1971</span><div class=\"t\"><i style=\"width:5.2%\"></i></div><b>3.2%</b></div><div class=\"r hl\"><span>Africa, 2021</span><div class=\"t\"><i style=\"width:25.2%\"></i></div><b>15.6%</b></div></div><p class=\"src\">Source: Statistics Canada, Census of Population, 1971 and 2021.</p>\n<p>By admission category, recent immigrants in 2021 were:</p><div class=\"bars\"><div class=\"r\"><span>Economic class</span><div class=\"t\"><i style=\"width:100.0%\"></i></div><b>56%</b></div><div class=\"r\"><span>Family class</span><div class=\"t\"><i style=\"width:46.4%\"></i></div><b>26%</b></div><div class=\"r\"><span>Refugees</span><div class=\"t\"><i style=\"width:28.6%\"></i></div><b>16%</b></div></div><p class=\"src\">Source: Statistics Canada, Census of Population, 2021 (recent immigrants, 2016 to 2021).</p>\n<h2>Where newcomers settle</h2>\n<p>Settlement is concentrated in a few provinces and in the largest cities.</p>\n<p>Share of recent immigrants by province, 2021:</p><div class=\"bars\"><div class=\"r hl\"><span>Ontario</span><div class=\"t\"><i style=\"width:100.0%\"></i></div><b>44.0%</b></div><div class=\"r\"><span>Quebec</span><div class=\"t\"><i style=\"width:34.8%\"></i></div><b>15.3%</b></div><div class=\"r\"><span>British Columbia</span><div class=\"t\"><i style=\"width:33.9%\"></i></div><b>14.9%</b></div><div class=\"r\"><span>Alberta</span><div class=\"t\"><i style=\"width:33.0%\"></i></div><b>14.5%</b></div></div><p class=\"src\">Source: Statistics Canada, Census of Population, 2021.</p><div class=\"grid g4\"><div class=\"stat\"><b>29.5%</b><span>settled in Toronto</span></div><div class=\"stat\"><b>12.2%</b><span>settled in Montréal</span></div><div class=\"stat\"><b>11.7%</b><span>settled in Vancouver</span></div><div class=\"stat\"><b>3.5%</b><span>settled in Atlantic Canada, up from 1.2% in 2006</span></div></div><p class=\"src\">Together, the three largest metropolitan areas received more than half of all recent immigrants. Source: Statistics Canada, 2022.</p>\n<h2>Language</h2><div class=\"grid g3\"><div class=\"stat\"><b>23.2%</b><span>of the population had a mother tongue other than English or French</span></div><div class=\"stat\"><b>98%</b><span>of people in Canada knew English or French</span></div><div class=\"stat\"><b>92.7%</b><span>of recent immigrants could conduct a conversation in English or French</span></div></div>\n<p>Languages with the most speakers in 2021, after English and French, were Spanish (1.2 million), Mandarin (987,000), Punjabi (942,000) and Arabic (838,000).</p><p class=\"src\">Source: Statistics Canada, Census of Population, 2021 (The Daily, January 22, 2025).</p>\n<p>Knowing some English or French does not always mean a person is comfortable discussing symptoms, trauma or complex medical information in that language. Many people prefer their mother tongue when seeking care (Hansson et al., 2010; MHCC, 2016).</p>\n<h2>Race and ethnic origins</h2>\n<p>In 2021, 26.5% of the population, about 9.6 million people, belonged to a racialized group. Statistics Canada uses the term \"visible minority\" for this census category. The three largest groups were South Asian, Chinese and Black.</p>\n<p>Within each group there is wide diversity in languages, religions, migration histories and length of time in Canada. Newcomers should never be treated as one community.</p>\n<h2>Reflect</h2>\n<div class=\"reflect\"><p><b>Think about the community you serve.</b> Which of these trends do you see most clearly in your own caseload, agency or neighbourhood, and what could it mean for how you offer language support?</p></div>\n<h2>Review questions</h2><div class=\"mcq\" data-ms=\"1\" data-fb=\"Ontario, Quebec, British Columbia and Alberta together received about 89% of recent immigrants.\"><h4>Select the four provinces that received the largest shares of recent immigrants in 2021. You must choose all four.</h4><button class=\"opt\" data-ok=\"1\">Alberta</button><button class=\"opt\" data-ok=\"1\">British Columbia</button><button class=\"opt\">Manitoba</button><button class=\"opt\">Nova Scotia</button><button class=\"opt\" data-ok=\"1\">Ontario</button><button class=\"opt\" data-ok=\"1\">Quebec</button><button class=\"opt\">Saskatchewan</button><button class=\"opt\">New Brunswick</button><button class=\"chk\">Check answer</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"About 56% of recent immigrants were admitted under the economic category.\"><h4>Which admission category accounted for the largest share of recent immigrants in 2021?</h4><button class=\"opt\" data-ok=\"1\">Economic class</button><button class=\"opt\">Family class</button><button class=\"opt\">Refugees</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Toronto, Montréal and Vancouver together received more than half of recent immigrants.\"><h4>Large urban centres are the main destinations for newcomers.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"It almost tripled, rising from 1.2% in 2006 to 3.5% in 2021.\"><h4>The share of recent immigrants settling in Atlantic Canada has fallen since 2006.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Comfort with everyday English does not guarantee comfort discussing health, trauma or medical details. Always offer language support.\"><h4>If a newcomer speaks some English, an interpreter is never needed.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div></div>","words":509},{"id":"s10","mod":1,"title":"Research Evidence on Newcomer Mental Health","html":"<p>It is not completely clear how many individuals living with mental health problems or illnesses are immigrants or refugees (Hansson et al., 2012). Research indicates that immigrant and refugee populations have lower or similar rates of mental health problems and illnesses when compared to the Canadian-born population cite (Hansson et al., 2012; MHCC 2016; Ng &amp; Zhang, 2020). There is great diversity in, and between, immigrant and refugee populations, however, and these populations do not necessarily experience all mental health problems and illnesses at a lower prevalence than Canadian-born individuals (MHCC, 2016; Ng &amp; Zhang, 2020).</p>\n<p>Canadian research has shown that in Ontario, the incidence rate of psychosis in first-generation immigrants is lower than in the general population, but these rates are higher in the refugee population.</p>\n<h5 id=\"compared-to-the-general-population-incidence-rates-of-psychosis-were\">Compared to the general population, incidence rates of psychosis were:</h5>\n<ul>\n<li><p>Significantly higher in immigrants from the <strong>Caribbean</strong> and <strong>Bermuda</strong> and in refugees from <strong>East Africa</strong> and <strong>South Asia</strong>.</p></li>\n<li><p>Significantly lower in immigrants from northern and southern <strong>Europe</strong> and <strong>East Asia</strong>.</p></li>\n</ul>\n<p>(Anderson et al., 2015)</p>\n<p>When considering mental health problems and illnesses in immigrant and refugee populations, it is important to recognize that these groups are not homogeneous. As a result, a one-size-fits-all approach to mental health care should not be employed. Newcomers' his
