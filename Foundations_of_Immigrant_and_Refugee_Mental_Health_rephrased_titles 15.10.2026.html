services that do not fully recognize those who have been marginalized (Hobbs, 2018).</p>\n<h2 id=\"anti-oppression-and-allyship\">.4 — Anti-oppression and allyship</h2>\n<h2 id=\"dealing-with-guilt-or-discomfort\">Dealing with guilt or discomfort</h2>\n<p>Difficult emotions can emerge on the journey to becoming more critically conscious of racism throughout society. We must acknowledge and work through these feelings. This is a lifelong journey that requires commitment. For example, guilt embraces a variety of different feelings; pain, despair, confusion, uncertainty and being overwhelmed are all reactions that may stem from learning about the persistence of racial injustices (Unitarian Universalist Association (n.d.).</p>\n<p>We must navigate these feelings to arrive at a place of allyship and solidarity. Problems can arise when we focus on guilt rather than the injustices of racism. For example, in spaces where racism is being discussed, a critical component to creating safe spaces and having constructive conversations involves being mindful of responses that may cause additional harm.</p>\n<h5 id=\"this-includes-responses-that-express-feeling\">This includes responses that express feeling:</h5>\n<ul>\n<li><p>Defensive or argumentative</p></li>\n<li><p>Innocent or without fault</p></li>\n<li><p>Unsafe or uncomfortable discussing racism</p></li></ul>\n<p>The burden of these conversations often falls on racialized communities. In working through these feelings, we must not further exhaust, traumatize or harm racialized individuals.</p>\n<h5 id=\"here-are-a-few-examples-of-responses-that-can-cause-additional-harm-or-trauma-to-racialized-people\">Here are a few examples of responses that can cause additional harm or trauma to racialized people:</h5>\n<ul>\n<li><p>The different degrees of privilege that come with whiteness have created the conditions for white people to not have to critically engage with the constructs of race and racism. As a result, when racial discomfort arises, the response is typically to blame the person or event that triggered the discomfort (usually a person of colour).</p></li>\n<li><p>Blame and self-defense results in a series of counter-moves against the perceived source of discomfort including penalization, retaliation, isolation and refusal of continued engagement. Therefore, white insistence on racial discomfort is a preservation strategy that ensures racism is not confronted and instead is continually perpetuated through the maintenance of comfort.</p></li>\n<li><p>In conversations around race and racism, comfort can be conflated with safety, so any experiences of discomfort are linked to feeling unsafe. This dismisses the histories and realities of racialized people navigating society and raises questions around what safety means from a position of privilege (DiAngelo, 2011).</p></li>\n</ul>\n<p>The moral discomfort (or guilt) we experience can lead to a sense of responsibility about facing the reality of racism and making changes in our lives and work. To address this discomfort, you can acknowledge how white people benefit from a racist system that oppresses people of colour. You can also learn about adopting an anti-racist stance and translating that into practices (Unitarian Universalist Association (n.d.).</p>\n<h5 id=\"the-anti-oppression-network-n.d.-offers-a-helpful-list-of-ways-to-act-out-of-responsibility-rather-than-guilt\">The Anti-Oppression Network <strong>(n.d.)</strong> offers a helpful list of ways to act out of responsibility rather than guilt:</h5>\n<ul>\n<li><p>Actively acknowledge your privilege and power and openly discuss them.</p></li>\n<li><p>Listen more and speak less.</p></li>\n<li><p>Do your work with integrity and direct communication.</p></li>\n<li><p>Do not expect to be educated by others.</p></li>\n<li><p>Build our capacity to receive criticism, be honest and accountable with our mistakes, and recognize that being called-out for making a mistake is a gift.</p></li>\n<li><p>Embrace the emotions that come out of the process of allyship.</p></li>\n<li><p>Recognize that your needs are secondary to the people you seek to work with.</p></li>\n<li><p>Do not expect awards or special recognition for confronting issues that people have to live with every day.</p></li></ul>\n<h5 id=\"whats-the-problem-with-being-a-so-called-not-racist-person\">What's the problem with being a so-called “not racist” person?</h5>\n<p>In his book, How to Be an Antiracist, Ibram X. Kendi (2019) writes:</p>\n<p>“It is a claim that signifies neutrality: 'I am not a racist, but neither am I aggressively against racism.' But there is no neutrality in the racism struggle. The opposite of 'racist' isn't 'not racist.' It is 'antiracist.' What's the difference? One endorses either the idea of a racial hierarchy as a racist, or racial equality as an antiracist. One either believes problems are rooted in groups of people, as a racist, or locates the roots of problems in power and policies, as an antiracist.”</p>\n<h2 id=\"summary-and-references\">Summary and references</h2>\n\n","words":1071},{"id":"s97","mod":3,"title":"Module Recap and Key Takeaways","html":"<p>Module 3 discussed the factors that contribute to health disparities for immigrants and refugees and identified approaches service providers can take to reduce health inequities. It explored why health equity matters and described the effects of racism on mental health. Other important areas covered include intersectionality, bias, social inclusion and exclusion, power and privilege. The module offered information on how to work from an anti-racist, anti-oppression approach, and discussed moving from mere cultural awareness to cultural humility. It concluded with suggestions for how to foster allyship and solidarity.</p>\n\n<ul>\n<li>Identify possible ways of adopting an anti-racist approach and following the anti-oppression framework for improving the mental health of immigrants and refugees.</li>\n</ul>\n<p>Module 4 examines the mental health needs of immigrant and refugee women, the first of three modules on key populations.</p>\n","words":146},{"id":"s98","mod":3,"title":"References and Further Reading","html":"<h4 id=\"health-equity\">7.1 — Health equity</h4>\n<ul>\n<li><p>Braveman, P.A., Kumanyika, S., Fielding, J., Laveist, T., Borrell, L.N., Manderscheid, R., et al. (2011). Health disparities and health equity: the issue is justice. American Journal of Public Health, 101(Suppl 1), S149–S155. Retrieved from: https://doi.org/10.2105/AJPH.2010.300062.</p></li>\n<li><p>Canadian Charter of Rights and Freedoms, s 7, Part 1 of the Constitution Act, 1982, being Schedule B to the Canada Act 1982 (UK), 1982, c 11.</p></li>\n<li><p>Canadian Public Health Agency. (2021). What Are the Social Determinants Of Health? Retrieved from: https://www.cpha.ca/what-are-social-determinants-health.</p></li>\n<li><p>Colour of Poverty. (2019). Fact Sheets. Retrieved from: https://colourofpoverty.ca/fact-sheets/</p></li>\n<li><p>Government of Canada.(2022).#ImmigrationMatters: Canada's immigration track record. Retrieved from:https://www.canada.ca/en/immigration-refugees-citizenship/campaigns/immigration-matters/track-record.html</p></li>\n<li><p>Lai, D. W., Shankar, J., &amp; Khalema, E. (2017). Unspoken skills and tactics: Essentials for immigrant professionals in integration to workplace culture. Journal of International Migration and Integration, 18(3), 937-959.</p></li>\n<li><p>Mental Health Commission of Canada.(2012). Changing directions, changing lives: The mental health strategy for Canada. Retrieved from: https://www.mentalhealthcommission.ca/wp-content/uploads/drupal/MHStrategy_Strategy_ENG.pdf</p></li>\n<li><p>Ministry of Health and Long-Term Care. (2012). Health Equity Impact Assessment (HEIA) Workbook.Retrieved from : https://www.health.gov.on.ca/en/pro/programs/heia/docs/workbook.pdf</p></li>\n<li><p>Ministry of Health and Long Term Care. (n.d.). Health Equity Impact Assessment. Immigrant population supplement. Retrieved from:https://www.health.gov.on.ca/en/pro/programs/heia/docs/HEIA-Immigrant-Supplement.pdf</p></li>\n<li><p>National Collaborating Centre for Determinants of Health.(2013). Let's Talk: Health equity. Retrieved from: https://nccdh.ca/resources/entry/health-equity</p></li>\n<li><p>Salami, B., Mason, A., Salma, J., Yohani, S., Amin, M., Okeke-Ihejirika, P., &amp; Ladha, T. (2020). Access to healthcare for immigrant children in Canada. International journal of environmental research and public health, 17(9), 3320.</p></li>\n<li><p>Waldron, I. R. (2010). The impact of inequality on health in Canada: A multi-dimensional framework. Diversity and Equality in Health and Care, 7(4).</p></li>\n<li><p>Whitehead, M. &amp; Dahlgren, G. (2006). Concepts and Principles for Tackling Social Inequities in Health: Levelling Up Part 1. WHO Collaborating Centre for Policy Research on Social Determinants of Health. University of Liverpool. Retrieved from: https://www.euro.who.int/__data/assets/pdf_file/0010/74737/E89383.pdf.</p></li>\n<li><p>Whitehead, M.M. (1992). The concepts and principles of equity and health. International Journal of Health Services, 22, 429-445.</p></li>\n<li><p>World Health Organization.(2017). Health is a fundamental human right. Human rights day 2017. Retrieved from: https://www.who.int/news-room/commentaries/detail/health-is-a-fundamental-human-right</p></li>\n</ul>\n<h4 id=\"intersecting-identites\">7.2 — Intersecting Identites</h4>\n<ul>\n<li><p>Government of Canada. (2022). <em>Learn about the charter.</em> Retrieved from: <a href=\"https://www.justice.gc.ca/eng/csj-sjc/rfc-dlc/ccrf-ccdl/learn-apprend.html#s1\" class=\"uri\">https://www.justice.gc.ca/eng/csj-sjc/rfc-dlc/ccrf-ccdl/learn-apprend.html#s1</a></p></li>\n<li><p><em>Canadian Charter of Rights and Freedoms, Part 1 of the Constitution Act, 1982, being Schedule B to the Canada Act 1982</em> (UK), c 11. Retrieved from: <a href=\"http://laws-lois.justice.gc.ca/eng/const/page-15.html\" class=\"uri\">http://laws-lois.justice.gc.ca/eng/const/page-15.html</a></p></li>\n</ul>\n<h4 id=\"allyship-and-solidarity\">7.4 — Allyship and solidarity</h4>\n<ul>\n<li><p>All Answers Ltd. (2018). <em>Promoting Diversity and Inclusion in Health and Social Care.</em> Retrieved from <a href=\"https://nursinganswers.net/essays/promoting-diversity-inclusion-health-social-9220.php?vref=1\" class=\"uri\">https://nursinganswers.net/essays/promoting-diversity-inclusion-health-social-9220.php?vref=1</a></p></li>\n<li><p>Allies for Change. (2003). <em>Doing Our Own Work: A Seminar for Anti-Racist White Women.</em> Retrieved from: <a href=\"https://network.pillarnonprofit.ca/wp-content/uploads/2019/10/Understanding-Privilege-and-Oppression-Handout.doc.pdf\" class=\"uri\">https://network.pillarnonprofit.ca/wp-content/uploads/2019/10/Understanding-Privilege-and-Oppression-Handout.doc.pdf</a></p></li>\n<li><p>Anti-Oppression Network [AON]. (n.d.). <em>Allyship.</em> Retrieved from: <a href=\"https://theantioppressionnetwork.com/allyship/\" class=\"uri\">https://theantioppressionnetwork.com/allyship/</a></p></li>\n<li><p>Black Health Alliance &amp; Health Commons Solutions Lab. (2020). <em>Black Experiences in Health Care Symposium: Bringing Together Community and Health Systems for Improved Health Outcomes.</em> Retrieved from: <a href=\"https://static1.squarespace.com/static/5a0d40298dd041f9a60bb3a7/t/5ea9a317983eca78fd95ee6d/1588175652047/Full+Report-+Black+Experiences+in+Health+Care+Symposium+2020.pdf\" class=\"uri\">https://static1.squarespace.com/static/5a0d40298dd041f9a60bb3a7/t/5ea9a317983eca78fd95ee6d/1588175652047/Full+Report-+Black+Experiences+in+Health+Care+Symposium+2020.pdf</a></p></li>\n<li><p>DiAngelo. R. (2011). <em>White fragility: Why it's so hard for white people to talk about racism.</em> International Journal of Critical Pedagogy, Vol 3 (3) (2011) pp 54-70. Retrieved from: <a href=\"https://libjournal.uncg.edu/ijcp/article/viewFile/249/116\" class=\"uri\">https://libjournal.uncg.edu/ijcp/article/viewFile/249/116</a></p></li>\n<li><p>First Nations Health Managers Association &amp; Canadian Foundation for Health Improvement.(2020). <em>A journey we walk together: Strengthening Indigenous cultural competency in health organizations.</em> Retrieved from: <a href=\"https://documents.pub/document/a-journey-we-walk-together-a-journey-we-walk-together-strengthening-indigenous.html?page=6\" class=\"uri\">https://documents.pub/document/a-journey-we-walk-together-a-journey-we-walk-together-strengthening-indigenous.html?page=6</a></p></li>\n<li><p>Foronda, C., Baptiste, Dl., Reinholdt, M.M. &amp; Ousman, K. 2015. <em>Cultural humility.</em> Journal Of Transcultural Nursing 27 (3): 210-217. doi:10.1177/1043659615592677</p></li>\n<li><p>Hall, J. K. &amp; Bullock, K. (2015). <em>A practicum partnership approach to addressing barriers to mental health among racially diverse older adults.</em> International Journal of Humanities and Social Science, 5,(8). Retrieved from: <a href=\"https://www.researchgate.net/publication/291246937_A_Practicum_Partnership_Approach_to_Addressing_Barriers_to_Mental_Health_among_Racially_Diverse_Older_Adults\" class=\"uri\">https://www.researchgate.net/publication/291246937_A_Practicum_Partnership_Approach_to_Addressing_Barriers_to_Mental_Health_among_Racially_Diverse_Older_Adults</a></p></li>\n<li><p>Hobbs, J. (2018). <em>White privilege in health care: Following recognition with action.</em> Annals of Family Medicine, 16(3), 197–198. <a href=\"https://doi.org/10.1370/afm.2243\" class=\"uri\">https://doi.org/10.1370/afm.2243</a></p></li>\n<li><p>Kendi, I. X. (2019). <em>How to be an Antiracist.</em> New York: One World.</p></li>\n<li><p>Rexdale Women's Centre and Centre for Research &amp; Education on Violence Against Women and Children, Western University. (n.d). <em>What does it mean to be culturally competent?</em> Retrieved from: <a href=\"http://rapworkers.com/resources/cultural-competence/\" class=\"uri\">http://rapworkers.com/resources/cultural-competence/</a></p></li>\n<li><p>Richardson, F. (2015) <em>An Introduction to Inclusive Practice.</em> Retrieved from: <a href=\"https://www.oup.com.au/media/documents/higher-education/he-samples-pages/he-health-landing-page/DAVIS_9780195593952_SC.pdf\" class=\"uri\">https://www.oup.com.au/media/documents/higher-education/he-samples-pages/he-health-landing-page/DAVIS_9780195593952_SC.pdf</a></p></li>\n<li><p>Unitarian Universalist Association (n.d.). <em>The Anatomy of White Guilt.</em> Retrieved from: <a href=\"https://www.uua.org/files/documents/gardinerwilliam/whiteness/anatomy_white_guilt.pdf\" class=\"uri\">https://www.uua.org/files/documents/gardinerwilliam/whiteness/anatomy_white_guilt.pdf</a></p></li>\n<li><p>University of Oregon. (n.d.).<em>What is cultural humility? The basics.</em> Retrieved from: <a href=\"https://inclusion.uoregon.edu/what-cultural-humility-basics\" class=\"uri\">https://inclusion.uoregon.edu/what-cultural-humility-basics</a></p></li>\n<li><p>Wheeler, M.(2018). <em>Cultural competence and cultural humility a literature review for understanding and action.</em> Retrieved from: <a href=\"http://www.tripartners.com/Downloads/Session2/CCC_Humility_032018.pdf\" class=\"uri\">http://www.tripartners.com/Downloads/Session2/CCC_Humility_032018.pdf</a></p></li>\n<li><p>Williams, C. (2001). <em>Cultural Competence Skills for Social Service Providers.</em> Classroom course offered by CAMH and the University of Toronto.</p></li>\n<li><p>World Health Organization (WHO). (2010). <em>A Conceptual Framework for Action on the Social Determinants of Health.</em> Social Determinants of Health Discussion Paper 2. Retrieved from: <a href=\"https://www.who.int/sdhconference/resources/ConceptualframeworkforactiononSDH_eng.pdf\" class=\"uri\">https://www.who.int/sdhconference/resources/ConceptualframeworkforactiononSDH_eng.pdf</a></p></li>\n</ul>\n<h2 id=\"introduction\">Introduction</h2>\n\n","words":709},{"id":"s29","mod":6,"title":"Module Overview and Learning Focus","html":"<p>As is the case with the general Canadian population, certain segments of the immigrant and refugee population require population-specific considerations in terms of mental health needs. Module 4 examines the unique mental health needs of vulnerable immigrant and refugee women.</p>\n<p>The module explores risk and protective factors, along with ways to support and help address this population's unique mental health needs.</p>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to</h5>\n<ul>\n<li><p>Describe the unique mental health vulnerabilities and needs of newcomer women.</p></li>\n<li><p>Explain the special considerations when working with immigrant and refugee women in the context of health equity.</p></li>\n</ul>\n<h2 id=\"terminology\">Terminology</h2>\n<h5 id=\"below-is-the-definition-of-a-common-term-used-throughout-this-module\">Below is the definition of a common term used throughout this module:</h5>\n<h4 id=\"violence-against-women\">Violence against women</h4>\n<blockquote>\n<p>The <em>United Nations Declaration on the Elimination of Violence against Women</em> (1993, Article 1) defines this as “any act of gender-based violence that results in, or is likely to result in, physical, sexual or psychological harm or suffering to women, including threats of such acts, coercion or arbitrary deprivations of liberty, whether occurring in public or in private life.”</p>\n</blockquote>\n\n","words":175},{"id":"s30","mod":6,"title":"Understanding Gender as a Social Determinant of Risk","html":"<p>Gender refers to “an individual's socially ascribed attributes, roles, responsibilities, and expectations in a given society based on their gender expression and how others perceive it” (Miani, Wandschneider, Niemann, Batram-Zantvoort, &amp; Razum, 2021). The differential impacts of social factors, based on gender, contribute to why gender is a determinant of mental health and mental health problems and illnesses.</p>\n<p>Gender differences in rates of common mental disorders are evident. For example, women have a higher prevalence of mood and anxiety disorders relative to men, but a later onset for schizophrenic psychoses (World Health Organization [WHO], 2010; Li, Ma, Wang, Yang, &amp; Wang, 2016; Boyd, et al., 2015). Similarly, studies of recent immigrants in Canada show that females are more likely than males to report emotional problems (Browne &amp; al, 2017). This could be because there are more female participants in these studies compared to males. It may also be a result of differential symptoms between sexes where male with depression are more likely to be irritable and angry, whereas females with depression express feelings of helplessness and worthlessness, which are more easily detectable (Immigrants, Refugees &amp; Citizenship Canada, 2012).</p>\n<h5 id=\"some-of-the-social-risk-factors-that-are-more-likely-to-affect-women-include\">Some of the social risk factors that are more likely to affect women include:</h5>\n<ul>\n<li><p>Low income</p></li>\n<li><p>Lower social status</p></li>\n<li><p>Responsibility in<br />\ncaring for others</p></li>\n<li><p>Gender-based violence</p>\n<p>(Mental Health Foundation, 2021)</p></li></ul>\n<p>This section discusses some of these risk factors, as well as strategies for mental health promotion. This gender disparity in health outcomes exists because of social and economic factors that, in turn, are influenced by cultural and political conditions in society. Examples of these reasons would be the different lifestyles, cultural expectations, different levels of chronic stressors and life events experienced by men and women.</p>\n","words":283},{"id":"s31","mod":6,"title":"Gender-Based Violence and Intimate Partner Violence","html":"<p>Women and girls face various challenges related to their position in society, their roles and their gender. In addition, gender-based violence caused by males is more likely to affect their health and well-being. Situations of conflict and displacement can change their role or position, worsen existing gender inequality and increase various forms of violence against women, often called gender-based violence.</p>\n<p>Single women, single mothers and girls are particularly vulnerable to experiencing gender-based violence. Many women and girls face daily struggles to find resources to pay the rent, buy food and basic items, and access services. As a result, they may find themselves in precarious situations that put them at risk for violence and sexual assault. This may include living in relatively unsafe neighbourhoods pre-migration. For instance, some refugee women coming from camps sometimes have to travel long distances to fetch water or firewood (United States Agency for International Development [USAID], 2015).</p>\n<p>Refugee women are more affected by gender-based violence than any other female population in the world (Vu et al , 2014). The gender-based violence that women and girls suffer takes various forms, including rape, sexual slavery, forced impregnation, trafficking and forced prostitution. Since World War II, the systemic rape of women and girls worldwide has been used as a deliberate weapon of war in ethnic cleansing (Majewski, 2020; Kivlahan &amp; Ewigman, 2010).</p>\n<h3 id=\"impact-of-covid-19\">Impact of COVID-19</h3>\n<p>The global lockdowns as a result to the COVID-19 pandemic exposed and exacerbated gender-based violence for women and girls (UN Women , 2020).</p>\n<p>The UNHCR Guidelines on Gender-Related Persecution and Canada's Immigrant and Refugee Board (IRB) Chairperson's Guidelines acknowledge that persecution can be gendered. Women refugee claimants who demonstrate a well-founded fear of gender-related persecution can be granted refugee status in Canada.</p>\n<p><a href=\"https://www.irb-cisr.gc.ca/en/legal-policy/policies/Pages/GuideDir03.aspx\"><strong>See the IRB Chairperson's Guidelines for more information.</strong></a></p>\n<p>Mental health problems and illnesses can also have a profound effect on the daily lives of individuals, often due to factors such as stigma, social isolation and discrimination.</p>\n<h5 id=\"we-will-discuss-three-types-of-gender-based-violence-in-more-detail\">We will discuss three types of gender-based violence in more detail:</h5>\n<ul>\n<li><p><strong>Sexual violence</strong></p></li>\n<li><p><strong>Corrective rape</strong></p></li>\n<li><p><strong>Intimate partner violence</strong></p></li>\n</ul>\n\n<h2 id=\"intimate-partner-violence\">Intimate partner violence</h2>\n<h4 id=\"intimate-partner-violence-ipv-is-not-unique-to-any-one-cultural-linguistic-or-ethnic-group-of-women-any-woman-can-experience-intimate-partner-violence.\">Intimate partner violence (IPV) is not unique to any one cultural, linguistic or ethnic group of women: any woman can experience intimate partner violence.</h4>\n<h5 id=\"similar-to-canadian-born-women-many-immigrant-and-refugee-women-may-believe-that\">Similar to Canadian-born women, many immigrant and refugee women may believe that:</h5>\n<ul>\n<li><p>They provoked marital conflict and did not do enough to reduce it (Godoy-Ruiz et al., 2015; Hyman et al., 2011).</p></li>\n<li><p>It is their role to keep their husband happy and avoid provocation (Ahmad et al., 2009; Godoy-Ruiz et al., 2015; Hyman et al., 2011).</p></li>\n<li><p>It is their fault if the relationship fails (Godoy-Ruiz et al., 2015).</p></li>\n\n\n\n</ul>\n<p>These myths persist regardless of immigrant or non-immigrant status.</p>\n<p>Relative lack of social support may prevent women from seeking help. Upon migrating to Canada, immigrant and refugee women may find themselves with reduced social networks. Being separated from their extended family can be difficult and isolating. In-laws, in some cases, may contribute to conflict, making it difficult for immigrant and refugee women to gain a balanced perspective in reducing marital conflict (Okeke-Ihejirika et al, 2020; Hyman et al., 2011).</p>\n<p>For some, there may be conflict around “traditional” gender roles and changes in the division and expectation of both paid and household labour (Hyman et al., 2011). In addition, failure to conform to traditional social norms or engaging in gender-inappropriate behaviour may be considered “bad,” or some groups may consider the women to be “bad mothers” (Godoy-Ruiz et al., 2015; Hyman et al., 2011). This lack of conformity could lead to further social pressure on the women from their family, friends and community.</p>\n<ul>\n<li><p>Refugee and immigrant women who experience IPV may also stay in abusive relationships for fear of being sent back to their countries of origin (Ahmad et al., 2009) (Njie-Carr, et al., 2020).</p></li></ul>\n<p>Non-status immigrant women or those in the process of applying for refugee status may fear that disclosing or reporting experiences of sexual violence will bring attention to their status or jeopardize their chances of being granted status. Abusive partners can also threaten women with deportation and they may not be aware of their legal rights or of the support services available in Canada. In addition, refugee or immigrant women may not feel comfortable asking for help from the police or social, healthcare or settlement workers due to mistrust of authority figures. The police, the military or other officials may have been perpetrators of abuse in their countries of origin.</p>\n<p>Refugee or immigrant women with permanent resident status <em>cannot</em> lose that status or be forced to leave Canada on the basis of leaving an abusive relationship.</p>\n<p>It is important to note that the safety and security of individuals experiencing intimate partner violence is crucial. These individuals can always seek services through their local health care organization. Also, the legal process can follow with resources offered by many organizations supporting IPV.</p>\n<p>Refugee women with temporary or no status who are considering leaving an abusive husband or partner should seek legal advice to understand their options. Legal issues that they are not aware of because of their immigration status may affect their situation and they should seek legal advice about their options (Community Legal Education Ontario [CLEO], 2014). In most provinces and territories, free legal clinics and legal advice for people who cannot afford to pay a lawyer can be found by contacting the local or provincial/territorial <a href=\"https://www.justice.gc.ca/eng/rp-pr/csj-sjc/jsp-sjp/rr03_la5-rr03_aj5/p00.html\">Legal Aid</a> office.</p>\n<p>Violence against women and women's rights may be controversial or sensitive subjects in some local and global communities (United Nations Entity for Gender Equality and the Empowerment of Women [UN Women], 2011). Women may find that they become isolated from their community and social circle if they assert their rights. Some women may value community life and identification above their individual rights. Offering them an appropriate level of social support may help expose them to a variety of choices and options for decision-making.</p>\n<h2 id=\"effects-of-gender-based-violence-on-mental-health\">Effects of gender-based violence on mental health</h2>\n<p>The consequences of gender-based violence are physically, mentally and socially devastating. In addition, the effects are often intensified by a lack of available treatment and support systems (Duroch et al., 2011).</p>\n<p>Rape is the most intrusive of traumatic events. Women who are raped often experience a loss of control in many areas of their lives because the violation results in a shattering of beliefs regarding invulnerability, personal safety and a fair social world (Chaudhury et al, 2017). As a result, refugee and immigrant women who have experienced rape may have overwhelming feelings of distress, fear and helplessness.</p>\n<h5 id=\"common-effects-of-sexual-trauma-include-the-following\">Common effects of sexual trauma include the following:</h5>\n<ul>\n<li><p>Depression</p></li>\n<li><p>Self-harm</p></li>\n<li><p>Memory gaps</p></li>\n<li><p>Trouble sleeping and nightmares</p></li>\n<li><p>Panic attacks and anxiety</p></li>\n<li><p>Use of alcohol or other substances</p></li>\n<li><p>Lack of a will to live</p></li>\n<li><p>Repeated experiences of sexual or physical violence</p></li>\n<li><p>Feelings of self-hate and low self-esteem</p></li>\n<li><p>Fear of people and relationships</p></li></ul>\n<p>(Chaudhury et al, 2017)</p>\n<p>The effects of trauma can make women feel that they are out of control or “going crazy.” They may feel either emotionally numb or suddenly alert and panicky. Women who have experienced trauma may not realize they are reacting to things that remind them of the abuse (Center for Substance Abuse Treatment, 2014). Because such trauma results when women are hurt by another person, it can also affect their trust in people. Furthermore, women who have experienced sexual violence may avoid sex or intimacy because these experiences may bring up negative feelings and memories connected with past abuse.</p>\n","words":1260},{"id":"s32","mod":6,"title":"Pregnancy, Postpartum Depression, and Mental Health","html":"<p>Both antenatal and postpartum depression rates seem to be higher among immigrant mothers than among Canadian-born mothers (Vigod et al , 2016; Khanlou et al, 2017). The rates vary depending on length of time in Canada and intersecting variables (Ballantyne et al., 2013; Miszkurka et al., 2012a). The rates of depressive symptoms among immigrant, postpartum women seem to range widely depending on ethnic origins; around 20% of women from Europe and over 40% of women from Maghreb, South-Asian and Caribbean regions report symptoms of depression in the postpartum period (Miszkurka et al., 2010).</p>\n<p>Canadian researchers are increasingly exploring the reasons for the higher rates of depression in pregnancy among immigrant and refugee mothers.</p>\n<h2 id=\"postpartum-depression\">Postpartum depression</h2>\n<h4 id=\"description\">Description</h4>\n<blockquote>\n<p>Postpartum depression is a depressive disorder that goes beyond the “baby blues.” It can impair a woman's ability to function both during pregnancy and after giving birth.</p>\n</blockquote>\n<h4 id=\"symptoms\">Symptoms</h4>\n<blockquote>\n<p>The DSM-5 does not recognize peripartum (formerly postpartum) depression as a separate diagnosis from other depressive disorders. Rather, clients need to meet the criteria for a major depressive episode and the criteria for the peripartum-onset specifier. Peripartum depression is a major depressive episode with an onset in pregnancy or within four weeks of delivery (APA, 2013).</p>\n</blockquote>\n<h4 id=\"rates-similarities-and-differences\">Rates: Similarities and differences</h4>\n<blockquote>\n<p>Available evidence suggests that recent immigrant women have significantly higher rates of depressive symptoms at 16 weeks of pregnancy compared to Canadian-born women (12.2% vs. 25.6%, respectively) (Daoud &amp; al, 2019). Another study showed that among immigrant women, asylum seekers have the highest rate of postpartum depression (14.3%), followed by refugee (11.5%) and immigrant women (5.1%) (Dennis et al., 2017). In addition, the prevalence of postpartum depression is higher for immigrant women compared to Canadian-born women, particularly in South-Asian immigrants (Close et al., 2016).</p>\n</blockquote>\n<h4 id=\"assessment\">Assessment</h4>\n<blockquote>\n<p>The Edinburgh Postnatal Depression Scale is the most widely used screening measure for women in the postpartum period across cultures (Kirmayer et al., 2011). The Patient Health Questionnaire-9 has also been validated as a screening tool for postpartum depression (Kirmayer et al., 2011).</p>\n</blockquote>\n","words":355},{"id":"s33","mod":6,"title":"Factors Associated with Depression During and After Pregnancy","html":"<h2 id=\"factors-associated-with-depressive-symptoms-around-pregnancy\">Factors associated with depressive symptoms around pregnancy</h2>\n<h5 id=\"the-two-overarching-themes-related-to-depression-during-pregnancy-for-immigrants-and-refugees-are\">The two overarching themes related to depression during pregnancy for immigrants and refugees are:</h5>\n<h4 id=\"migration-factors\">Migration factors</h4>\n<h4 id=\"cultural-influences\">Cultural influences</h4>\n<p>(Wittkowski et al., 2017)</p>\n<h4 id=\"more-specific-factors-include\">More specific factors include:</h4>\n<h4 id=\"isolation\">Isolation</h4>\n<blockquote>\n<p>Migrating (forcibly or by choice) often results in new mothers having little to no social support, leading to feelings of loneliness and isolation (Ballantyne et al., 2013; O'Mahony &amp; Donnelly, 2010; Wittkowski et al., 2017). Many women arrive to their migration destination alone and sustain pregnancies on their own. Additionally, mothers who do not come alone may experience conflict with their husbands, lack necessary supports (as fathers may need to work long hours) and lack knowledge of depression. They are also often solely responsible for child-related issues, which may not be seen as a man's role (Wittkowski et al., 2017).</p>\n</blockquote>\n<h4 id=\"violence\">Violence</h4>\n<blockquote>\n<p>Research has shown that the rates of intimate partner violence (IPV) during pregnancy are higher and it could have detrimental effects on the mother and the newborn. In addition, new migrants may face social and material issues such as deprivation and poverty, dangerous housing and unemployment or underemployment (Picot &amp; Hou, 2019); Wittkowski et al., 2017). Violence of any type (IPV or by strangers) during pregnancy is a strong indicator of prenatal depression in immigrant women (Miszkurka et al., 2012b).</p>\n</blockquote>\n<h4 id=\"gender-roles\">Gender roles</h4>\n<blockquote>\n<p>Some researchers assert that cultural factors among some immigrant and refugee women, as with women in general, may be associated with the increased rates of depression during pregnancy. This includes views around traditional gender roles, adherence to childbirth rituals, and cultural beliefs and values around depression (O'Mahony &amp; Donnelly, 2010; Wittkowksi et al., 2017). As in many families, migrant or not, women may have multiple roles expected of them as mother and wife, with often uneven responsibilities and an expectation that they can cope with caring for their children, husbands and households (Ibid.).</p>\n</blockquote>\n<h4 id=\"cultural-rituals\">Cultural rituals</h4>\n<blockquote>\n<p>Some cultures may perform expected rituals and practices around childbirth to ensure the future health of the baby. These rituals and practices may be difficult to adhere to in Western cultures (Wittkowski et al., 2017). As mentioned earlier, these rituals may act as a risk factor; however, if performed, these rituals and practices may help alleviate factors of postpartum depression (O'Mahony &amp; Donnelly, 2010). The most common rituals are resting for a period of time after giving birth, observing a diet and other restrictions, and receiving support from the extended family. These rituals have been found to help the woman's perceived support and feeling that her needs are being met (Bina, 2008).</p>\n</blockquote>\n<h4 id=\"privacy\">Privacy</h4>\n<blockquote>\n<p>Depression during pregnancy is not always recognized or it is minimized in order to prevent damaging the image others may have of how “strong” a mother is (Wittkowski et al., 2017). Some cultures also have codes of privacy in which talking about concerns or issues is seen as a sign of weakness or may make it worse (Ibid.).</p>\n</blockquote>\n<p>Despite these risk factors, there is great variation within immigrant and refugee families that come to Canada, and many are highly resilient. Providing new and expecting mothers with information about local support centres or programs that can provide employment opportunities, English or French classes, or childcare will give them access to a network of people that can provide support to help reduce depression around pregnancy.</p>\n<p>Resources may include public health departments, early years centres, prenatal classes or community recreation centres.</p>\n<h4 id=\"for-example\">For example:</h4>\n<ul>\n<li><p>Family resource centres in Manitoba</p>\n<p><a href=\"https://www.familydynamics.ca/communities/family-resource-centres/\"><strong>▶︎   learn more</strong></a></p></li>\n<li><p>Calgary Immigrant Women's Association</p>\n<p><a href=\"https://www.ciwa-online.com/\"><strong>▶︎   learn more</strong></a></p></li>\n<li><p>Newcomer Centre of Peel</p>\n<p><a href=\"https://www.ncpeel.ca/\"><strong>▶︎   learn more</strong></a></p></li>\n<li><p>Just4Women Supports at International Women of Saskatoon</p>\n<p><a href=\"https://iwssaskatoon.org/just4women/\"><strong>▶︎   learn more</strong></a></p></li></ul>\n<div class=\"wide\"><h2>Review questions</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"IPV affects women of every cultural, linguistic and ethnic group.\"><h4>Intimate partner violence is not unique to any one cultural, linguistic or ethnic group of women; any woman can experience it.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Migration often separates new mothers from family and friends, leading to loneliness and isolation.\"><h4>Migrating often results in new mothers having little to no social support leading to feelings of loneliness and isolation.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n","words":678},{"id":"s34","mod":6,"title":"Why Women May Delay or Avoid Seeking Help","html":"<p>Beyond the social determinants common to immigrants and refugees in general, a number of barriers affect women's access to care and assistance with postpartum depression and sexual violence. Most refugee survivors of sexual violence do not receive the help they need (Yohani &amp; Hagen, 2010). Psychological trauma, combined with sociocultural factors, limited awareness of available services and language challenges create barriers to seeking help.</p>\n<h4 id=\"common-barriers-include\">Common barriers include:</h4>\n<h4 id=\"recognition\">Recognition</h4>\n<blockquote>\n<p>A major barrier for pregnant immigrant and refugee women is recognizing symptoms of depression and seeking help.<br />\n<br />\nMany immigrant and refugee women report not knowing or recognizing the symptoms of postpartum or prenatal depression (O'Mahony et al., 2012; Wittkowksi et al., 2017). Also, health service providers may not recognize depressive symptoms or may minimize the concerns that immigrant and refugee women face. The result is that clients may not seek or receive care (O'Mahony et al., 2012).</p>\n</blockquote>\n<h4 id=\"cultural-norms\">Cultural norms</h4>\n<blockquote>\n<p>Cultural norms influence how survivors and their communities perceive and respond to sexual violence. In many societies including within a North American context, women who have been sexually assaulted are often stigmatized by their community and considered unsuitable for marriage or motherhood (Ahmad et al., 2009; Yohani &amp; Hagen, 2010). In some cases, they may even be rejected by family members or perceived to bring suffering and a loss of respect to their family. Similarly, in cultures where sexuality is not openly discussed, disclosing sexual violence breaks social taboos. Survivors are therefore often reluctant to reveal sexual violence for fear of experiencing rejection, isolation or humiliation.</p>\n</blockquote>\n<h4 id=\"gender-norms\">Gender norms</h4>\n<blockquote>\n<p>Immigrant women, as compared to non-immigrant women in Canada, are more likely to support patriarchal gender norms and agree that their husband has power and rights that supersede their own. As a result, they may be less likely to report victimization or seek help or problems (Alvi et al., 2012). Thus, silence becomes a habit many develop for self-protection—one they find difficult to break even to get help. Importantly, many Canadian women who are victims of domestic violence also live in silence, which leaves them with physical and psychological scars.</p>\n</blockquote>\n<h4 id=\"language\">Language</h4>\n<blockquote>\n<p>Language can be a significant barrier to accessing services, as discussed in Module 1. Programs that help women overcome language barriers have a significant impact on their ability to access health and social services, realize their rights and leave abusive relationships.</p>\n</blockquote>\n<h3 id=\"featured-resource\">Featured resource</h3>\n<p>The Department of Justice of Canada developed the booklet <a href=\"https://www.justice.gc.ca/eng/rp-pr/cj-jp/fv-vf/fe-fa/index.html\">Abuse is Wrong in any Language</a> for immigrant and refugee families experiencing any type of family violence.</p>\n<p>To learn more about the impact of violence against immigrant and refugee women and how to help, see <a href=\"https://ocasi.org/gender-based-violence#:~:text=OCASI&#39;s%20Initiative%20to%20End%20GBV,for%20%20survivors%20with%20%20intersectional%20%20identities.\">these self-directed online courses</a> offered by the Ontario Council of Agencies Serving Immigrants (OCASI).</p>\n","words":447},{"id":"s35","mod":6,"title":"Safe, Sensitive, and Responsive Service Approaches","html":"<p>Refugee women seen in clinics may have high rates of PTSD caused by gender-based violence, and often this trauma has not been previously addressed in a clinical setting. As discussed earlier in this module, rates of depression among immigrant women are comparable to Canadian women, but may be higher in pregnant or postpartum immigrant and refugee women (Pottie et al., 2011). It is important for providers to keep in mind that exploring the history or consequences of sexual violence requires great clinical sensitivity and should always be guided by the client's needs and comfort (Kirmayer et al., 2011).</p>\n<p>The evidence-based Canadian Guidelines for Immigrant Health indicate that routine screening for depression should be done in integrated treatment programs; however, <strong>routine screening for PTSD or IPV is not recommended</strong> (Pottie et al., 2011). Rather, providers should be alert for potential signs and symptoms related to such violence, as with all clients, and should perform more in-depth assessments if a reasonable suspicion develops or if a client discloses an incident. Being open and empathic is essential, but pushing for disclosure of traumatic events may result in more harm than good (Ibid.).</p>\n<h3 id=\"it-is-important-to-keep-the-following-in-mind\">It is important to keep the following in mind:</h3>\n<ul>\n<li><p>Women will rarely identify themselves as a survivor of sexual trauma.</p></li>\n<li><p>Information about the country of origin will contextualize and help establish the likelihood of exposure to sexual trauma.</p></li>\n<li><p>Sociocultural factors strongly influence women's responses and their willingness to talk about sexual health; what is taboo for some may not be so for others.</p></li>\n<li><p>Cultural and language factors may influence how a woman speaks about her symptoms and experiences, and traditional assessments may not provide accurate information. It is important to use culturally appropriate assessments intended for specific populations.(Bartelson &amp; Sutherland, 2018)</p></li>\n<li><p>Linking immigrant and refugee women with services, resources and support networks can help them reconstruct healthy relationships with others, increase social connections and gain social support.(Salt, Costantino, Dotson, &amp; Paper, 2017)</p></li>\n<li><p>Here are some organizations throughout Canada that offer services to immigrant and refugee women:</p>\n<p>Ontario: <a href=\"https://www.newcomerwomen.org/\">Newcomer Women's Services Toronto</a></p>\n<p>Manitoba: <a href=\"https://lipw.ca/women-and-family/\">Immigration Partnership Winnipeg</a></p>\n<p>British Columbia: <a href=\"https://pirs.bc.ca/programs-services/\">Pacific Immigrant Resources Society</a></p></li>\n<li><p>When working with pregnant immigrant and refugee women, provide information about depression numerous times throughout pregnancy and postpartum.(Iliadou, et al., 2019)</p></li>\n<li><p>Engagement in the labour force and financial independence are important facilitators of improved mental health.(Alvi et al., 2012; Hyman et al., 2011)</p></li></ul>\n","words":416},{"id":"s36","mod":6,"title":"Supporting Survivors and Recovery from Trauma","html":"<p>Survivors of sexual violence are at high risk of developing mental health problems due to their pre-migration experiences and limited psychosocial supports within resettlement contexts (Yohani &amp; Hagen, 2010). Understanding the unique challenges and needs of women survivors of sexual trauma will help health service providers prevent re-traumatization and provide appropriate support to refugee women. Social support can moderate the impact of trauma, reduce the severity of symptoms and facilitate the recovery process (Pottie et al., 2016; Sippel et al, 2015).</p>\n<h4 id=\"many-situations-can-make-a-womans-trauma-worse.-for-example\">Many situations can make a woman's trauma worse. For example:</h4>\n<h4 id=\"silencing\">Silencing</h4>\n<blockquote>\n<p>If women try to talk about the abuse and are told to “just forget it and get on with your life,” they may feel isolated and silenced.</p>\n</blockquote>\n<h4 id=\"abusive-relationships\">Abusive relationships</h4>\n<blockquote>\n<p>If women engage in a new relationship or are in an existing relationship with someone who is emotionally, physically or sexually abusive, it worsens the effects of the original trauma. It also doesn't allow them the safety they need for healing.</p>\n</blockquote>\n<h4 id=\"discrimination\">Discrimination</h4>\n<blockquote>\n<p>For many refugee women, discrimination is an everyday experience. Discrimination causes stress, which is especially hard on women who are already traumatized. For racialized women and lesbians, racism and homophobia add to the lack of safety.</p>\n</blockquote>\n<h4 id=\"poverty\">Poverty</h4>\n<blockquote>\n<p>Economic disadvantage often limits women's life choices, adding to the problems.</p>\n</blockquote>\n<h4 id=\"blame-and-shame\">Blame and shame</h4>\n<blockquote>\n<p>Without support and understanding, women continue to feel guilty and ashamed. This can lead to isolation, depression and a risk of self-harm.</p>\n</blockquote>\n<p>With adequate social and emotional support, many survivors of sexual trauma learn to cope and their distress usually decreases over time (Ford-Gilboe et al., 2009; Yohani &amp; Okeke-Ihejirika, 2018). Trauma-informed care is a promising approach that health and social service providers can use to help immigrant and refugee women without pathologizing them.</p>\n<h2 id=\"discussing-intimate-partner-violence\">Discussing intimate partner violence</h2>\n<p>Refugee and immigrant women who are survivors of gender-based violence can be vulnerable to further exploitation and victimization in Canada. Migrant women experiencing IPV may be apprehensive about discussing domestic abuse.</p>\n<p>A provider who builds trust, uses a friendly approach without judgment and is aware or open to cross-cultural understandings can help facilitate open discussions with immigrant and refugee women around issues of gender-based violence and IPV (Ahmad et al., 2009; Godoy-Ruiz et al., 2015).</p>\n<div class=\"wide\"><h2>Review questions</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Many newcomers have experienced abuse by police, military or officials, so mistrust of authority is understandable.\"><h4>Refugee or immigrant women may not feel comfortable seeking help due to mistrust of authority figures, military, police or other officials who may have been perpetrators of abuse in their country of origin.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Be open and empathic, but let clients share when they are ready. Pushing for disclosure can do more harm than good.\"><h4>Pushing for disclosure of traumatic events, such as intimate partner violence, may result in more harm than good.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Gender shapes how much influence people have over the social and economic determinants of their lives and mental health.\"><h4>Gender is a determinant of mental health and mental illness due to the different levels of influence that “…men and women have over the socioeconomic determinants of their mental health and lives, their social position, status and treatment in society.\"</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Women have a higher prevalence of mood and anxiety disorders than men, so gender differences are evident.\"><h4>Gender differences in rates of common mental disorders are not evident; for example, unipolar depression is as common in women as in men.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Studies of recent immigrants in Canada show that females, not males, are more likely to report emotional problems.\"><h4>Studies of recent immigrants in Canada show that males are more likely than females to report emotional problems.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Refugee women are more affected by gender-based violence than any other female population in the world.\"><h4>Refugee women are more affected by gender-based violence than any other female population in the world.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"IPV is not unique to any cultural, linguistic or ethnic group. Any woman can experience it.\"><h4>Intimate partner violence (IPV) is more prevalent in women who belong to a cultural, linguistic or ethnic group.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Women with permanent resident status cannot lose that status or be forced to leave Canada for leaving an abusive relationship.\"><h4>Refugee or immigrant women with permanent resident status can lose that status or be forced to leave Canada on the basis of leaving an abusive relationship.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Providers may miss or minimize depressive symptoms, so clients may not receive care.\"><h4>Health service providers may not recognize depressive symptoms or may minimize the concerns that immigrant and refugee women face.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Pre-migration experiences and limited psychosocial support after arrival raise the risk of mental health problems.\"><h4>Survivors of sexual violence are at high risk of developing mental health problems due to their pre-migration experiences and limited psychosocial supports within resettlement contexts.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Migration factors and cultural influences are the two overarching themes related to depression in pregnancy.\"><h4>Factors associated with depressive symptoms around pregnancy for immigrants and refugees are migration factors and cultural influences.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n\n","words":669},{"id":"s37","mod":6,"title":"Module Recap and Key Takeaways","html":"<p>Module 4 described the challenges faced among immigrant and refugee women in their settlement or resettlement in Canada, and how these challenges can affect their mental health. This module further emphasized how various factors can affect a woman's mental health . Developing knowledge and awareness of these risk factors can promote understanding of the needs of immigrant and refugee women and how to provide effective assessment and treatment practices related to counselling and case management.</p>\n<p><a href=\"https://www.camh.ca/en/professionals/professionals--projects/immigrant-and-refugee-mental-health-project/courses/course-resources#3\"><strong>Visit our Course Resources page to access the tools and resources featured in this module.</strong></a></p>\n<p>Module 5 will cover the mental health needs of immigrant and refugee children.</p>\n","words":109},{"id":"s38","mod":6,"title":"References and Further Reading","html":"<ul>\n<li><p>Ahmad, F., Driver, N., McNally, M. J., &amp; Stewart, D. E. 2009. “Why doesn’t she seek help for partner abuse?” An exploratory study with South Asian immigrant women. Social Science &amp; Medicine 1982, 694, 613–622. https://doi.org/10.1016/j.socscimed.2009.06.011</p></li>\n<li><p>Alvi, S., Zaidi, A., Ammar, N., &amp; Culbert, L. 2012. A Comparative and Exploratory Analysis of Socio-cultural Factors and Immigrant Women’s Mental Health within a Canadian Context. Journal of Immigrant and Minority Health, 143, 420–432. https://doi.org/10.1007/s10903-011-9567-1</p></li>\n<li><p>Ballantyne, M., Benzies, K. M., &amp; Trute, B. 2013. Depressive symptoms among immigrant and Canadian born mothers of preterm infants at neonatal intensive care discharge: a cross sectional study. BMC Pregnancy and Childbirth, 13Suppl 1, S11–S11. https://doi.org/10.1186/1471-2393-13-s1-s11</p></li>\n<li><p>Bartelson, A. R., &amp; Sutherland, M. A. 2018. Experiences of Trauma and Implications for Nurses Caring for Undocumented Immigrant Women and Refugee Women. Nursing for women's health, 225, 411-416.</p></li>\n<li><p>Bina. 2008. The Impact of Cultural Factors Upon Postpartum Depression: A Literature Review. Health Care for Women International.</p></li>\n<li><p>Bosch. 2019. The Impact of Sexual Violence in the Democratic Republic of the Congo: Implications for the Care of Congolese Refugees.</p></li>\n<li><p>Boyd, A., Velde, S. V., Vilagut, G., Graaf, R. D., Florescu, S., Alonso, ... Investigators, Gender differences in mental disorders and suicidality in Europe: results from a large cross-sectional population-based study. Journal of affective disorders, 173, 245-254.</p></li>\n<li><p>Browne, D. T., &amp; al. 2017. Emotional Problems among recent immigrants and parenting status: Findings from a national longitudinal study of immigrants in Canada. PloS One, e0175023.</p></li>\n<li><p>Canadian Mental Health Association.(2014). Stigma and Discrimination Around Mental Health and Substance Use Problems. Available:https://www.heretohelp.bc.ca/infosheet/stigma-and-discrimination-around-mental-health-and-substance-use-problems</p></li>\n<li><p>Center for Substance Abuse Treatment. 2014. Chapter 3, Understanding the Impact of Trauma. In Trauma-Informed Care in Behavioral Health Services. Rockville.</p></li>\n<li><p>Chabalala, O. L., &amp; Roelofse, C. J. 2015. A phenomenological description of corrective rape and a new terminological perspective of the phenomenon. Acta Criminologica: African Journal of Criminology and Victimology, 283.</p></li>\n<li><p>Chaudhury et al. 2017. Psychological aspects of rape and its consequences. Psychol Behav Sci Int J, 1-7.</p></li>\n<li><p>Close, C., Kouvonen, A., Bosqui, T., Patel, K., O’Reilly, D., &amp; Donnelly, M. 2016. The mental health and wellbeing of first generation migrants: A systematic-narrative review of reviews. Globalization and Health, 121, 47–47. https://doi.org/10.1186/s12992-016-0187-3</p></li>\n<li><p>Community Legal Education Ontario (CLEO). (2014). If a woman is not a Canadian citizen, will she be forced to leave Canada if she leaves her spouse or partner?. Available: http://www.cleo.on.ca/en/publications/famvio/if-woman-not-canadian-citizen-will-she-be-forced-leave-canada-if-she-leaves-her.</p></li>\n<li><p>Daoud, N., O’Brien, K., O’Campo, P., Harney, S., Harney, E., Bebee, K., Bourgeois, C., &amp; Smylie, J. 2019. Postpartum depression prevalence and risk factors among Indigenous, non-Indigenous and immigrant women in Canada. Canadian Journal of Public Health, 1104, 440–452. https://doi.org/10.17269/s41997-019-00182-8</p></li>\n<li><p>Dennis, C.-L., Merry, L., &amp; Gagnon, A. J. 2017. Postpartum depression risk factors among recent refugee, asylum-seeking, non-refugee immigrant, and Canadian-born women: results from a prospective cohort study. SOCIAL PSYCHIATRY AND PSYCHIATRIC EPIDEMIOLOGY, 524, 411–422. https://doi.org/10.1007/s00127-017-1353-5</p></li>\n<li><p>Di Silvio, L. 2011. Correcting corrective rape: “Carmichele” and developing South Africa’s affirmative obligations to prevent violence against women. The Georgetown Law Journal, 995, 1469–1515.</p></li>\n<li><p>Doan-Minh, S. 2019. Corrective Rape: An Extreme Manifestation of Discrimination and the State's Complicity in Sexual Violence. Hastings Women's Law Journal, 167-196.</p></li>\n<li><p>Duroch, F., McRae, M., &amp; Grais, R. F. 2011. Description and consequences of sexual violence in Ituri province, Democratic Republic of Congo. BMC International Health and Human Rights, 111, 5–5. https://doi.org/10.1186/1472-698X-11-5</p></li>\n<li><p>Ford-Gilboe, M., Merritt-Gray, M., Varcoe, C., &amp; Wuest, J. 2011. A theory-based primary health care intervention for women who have left abusive partners. Advances in Nursing Science, 343, 198–214. https://doi.org/10.1097/ANS.0b013e3182228cdc</p></li>\n<li><p>Godoy-Ruiz, P., Toner, B., Mason, R., Vidal, C., &amp; McKenzie, K. 2015. Intimate Partner Violence and Depression Among Latin American Women in Toronto. Journal of Immigrant and Minority Health, 176, 1771–1780. https://doi.org/10.1007/s10903-014-0145-1</p></li>\n<li><p>Hyman, I., Mason, R., Guruge, S., Berman, H., Kanagaratnam, P., &amp; Manuel, L. 2011. Perceptions of Factors Contributing to Intimate Partner Violence Among Sri Lankan Tamil Immigrant Women in Canada. Health Care for Women International, 329, 779–794. https://doi.org/10.1080/07399332.2011.569220</p></li>\n<li><p>Iliadou, M., Papadakaki, M., Sioti, E., Giaxi, P., Leontitsi, E., Petelos, E., . . . Vivilaki, V. 2019. Addressing mental health issues among migrant and refugee pregnant women: A call for action. European journal of midwifery, 3, 9.</p></li>\n<li><p>Immigrants, Refugees &amp; Citizenship Canada. 2012. Mental health and well-being of recent immigrants in Canada: Evidence from the Longitudinal Survey of Immigrants to Canada.</p></li>\n<li><p>Khanlou, N., Haque, N., Skinner, A., Mantini, A., &amp; Kurtz Landy, C. 2017. Scoping Review on Maternal Health among Immigrant and Refugee Women in Canada: Prenatal, Intrapartum, and Postnatal Care. Journal of Pregnancy, 2017, 8783294–14. https://doi.org/10.1155/2017/8783294</p></li>\n<li><p>Kirmayer, L. J., Narasiah, L., Munoz, M., Rashid, M., Ryder, A. G., Guzder, J., Hassan, G., Rousseau, C., &amp; Pottie, K. 2011. Common mental health problems in immigrants and refugees: general approach in primary care. Canadian Medical Association Journal, 18312, E959–E967. https://doi.org/10.1503/cmaj.090291</p></li>\n<li><p>Kivlahan, C., &amp; Ewigman, N. 2010. Rape as a weapon of war in modern conflicts. BMJ, 3407771, 468–c3270. https://doi.org/10.1136/bmj.c3270</p></li>\n<li><p>Li, R., Ma, X., Wang, G., Yang, J., &amp; Wang, C. 2016. Why sex differences in schizophrenia? Journal of translational neuroscience, 11, 37.</p></li>\n<li><p>Mental Health Foundation. 2021, October 12. Women and mental health. Retrieved from Mental Health Foundation:https://www.mentalhealth.org.uk/a-to-z/w/women-and-mental-health.</p></li>\n<li><p>Miani, C., Wandschneider, L., Niemann, J., Batram-Zantvoort, S., &amp; Razum, O. 2021. Measurement of gender as a social determinant of health in epidemiology—A scoping review. PLoS ONE, 1611.</p></li>\n<li><p>Miszkurka, M., Goulet, L., &amp; Zunzunegui, M. V. 2012. Antenatal depressive symptoms among Canadian-born and immigrant women in Quebec: differential exposure and vulnerability to contextual risk factors. SOCIAL PSYCHIATRY AND PSYCHIATRIC EPIDEMIOLOGY, 4710, 1639–1648. https://doi.org/10.1007/s00127-011-0469-2</p></li>\n<li><p>Miszkurka, M., Zunzunegui, M. V., &amp; Goulet, L. 2012. Immigrant status, antenatal depressive symptoms, and frequency and source of violence: what’s the relationship? Archives of Women’s Mental Health, 155, 387–396. https://doi.org/10.1007/s00737-012-0298-7</p></li>\n<li><p>Njie-Carr, V. P., Sabri, B., Messing, J. T., Suarez, C., Ward-Lasher, A., Wachter, K., . . . Campbell, J. 2020. Understanding Intimate Partner Violence among Immigrant and Refugee Women: A Grounded Theory Analysis. Journal of Aggression, Maltreatment &amp; Trauma, 306, 792-810.</p></li>\n<li><p>O’MAHONY, J., &amp; DONNELLY, T. 2010. Immigrant and refugee women’s post-partum depression help-seeking experiences and access to care: a review and analysis of the literature. Journal of Psychiatric and Mental Health Nursing, 1710, 917–928. https://doi.org/10.1111/j.1365-2850.2010.01625.x</p></li>\n<li><p>Okeke-Ihejirika et al. 2020. A scoping review on intimate partner violence in Canada's immigrant communities. Trauma, Violence and Abuse, 788-810.</p></li>\n<li><p>Picot &amp; Hou. 2109. Immigration, Poverty and Income Inequality in Canada. Retrieved from Intitute of Research on Public Policy: https://irpp.org/research-studies/immigration-poverty-and-income-inequality-in-canada/</p></li>\n<li><p>Pottie, K., Greenaway, C., Feightner, J., Welch, V., Swinkels, H., Rashid, M., Narasiah, L., Kirmayer, L. J., Ueffing, E., MacDonald, N. E., Hassan, G., McNally, M., Khan, K., Buhrmann, R., Dunn, S., Dominic, A., McCarthy, A. E., Gagnon, A. J., Rousseau, C., … Blake, J. 2011. Evidence-based clinical guidelines for immigrants and refugees. Canadian Medical Association Journal CMAJ, 18312, E824–E925. https://doi.org/10.1503/cmaj.090313</p></li>\n<li><p>Pottie, K., Greenaway, C., Hassan, G., Hui, C., &amp; Kirmayer, L. J. 2016. Caring for a newly arrived Syrian refugee family. Canadian Medical Association Journal CMAJ, 1883, 207–211. https://doi.org/10.1503/cmaj.151422</p></li>\n<li><p>Salt, R. J., Costantino, M. E., Dotson, E. L., &amp; Paper, B. M. 2017. \"You Are Not Alone\" Strategies for Addressing Mental Health and Health Promotion with a Refugee Women's Sewing Group. Issues in mental health nursing, 337-343.</p></li>\n<li><p>Sippel, L. M., Jones, R. E., Bordieri, M. J., Dixon, L. J., May, A. C., Malkin, M. L., Schumacher, J. A., &amp; Coffey, S. F. 2015. Interactive Effects of Anxiety Sensitivity and Difficulties in Emotion Regulation: An Examination Among Individuals in Residential Substance Use Treatment with Comorbid Posttraumatic Stress Disorder. Cognitive Therapy and Research, 392, 245–252. https://doi.org/10.1007/s10608-014-9648-2</p></li>\n<li><p>UN Women . 2020, April. Infographic: The Shadow Pandemic - Violence Against Women and Girls and COVID-19 Retrieved from https://www.unwomen.org/en/digital-library/multimedia/2020/4/infographic-covid19-violence-against-women-and-girls</p></li>\n<li><p>United Nations Entity for Gender Equality and the Empowerment of Women (UN Women). (2011.) Community mobilization, outreach and mass media. Available: http://www.endvawnow.org/en/articles/219-community-mobilization-outreach-and-mass-media-.html.</p></li>\n<li><p>United States Agency for International Development (USAID). Gender and extreme poverty. (2015). Available: https://www.usaid.gov/sites/default/files/documents/1870/Gender_Extreme_Poverty_Discussion_Paper.pdf.</p></li>\n<li><p>Vigod, S. N., Wilson, C. A., &amp; Howard, L. M. 2016. Depression in pregnancy. BMJ Online, 3528050, i1547–i1547. https://doi.org/10.1136/bmj.i1547</p></li>\n<li><p>Vu et al . 2014. The Prevalence of Sexual Violence among Female Refugees in Complex Humanitarian Emergencies: a Systematic Review and Meta-analysis. PloS Curr.</p></li>\n<li><p>What is Peripartum Depression (formerly Postpartum)? (2022). https://www.psychiatry.org/patients-families/peripartum-depression/what-is-peripartum-depression</p></li>\n<li><p>Wittkowski, A., Patel, S., &amp; Fox, J. R. 2017. The Experience of Postnatal Depression in Immigrant Mothers Living in Western Countries: A Meta‐Synthesis. Clinical Psychology and Psychotherapy, 242, 411–427. https://doi.org/10.1002/cpp.2010</p></li>\n<li><p>World Health Organization (WHO). (2010). Gender and women’s mental health: Gender disparities and mental health: The Facts. Available: http://www.who.int/mental_health/prevention/genderwomen/en/.</p></li>\n<li><p>Yohani, S. C., &amp; Hagen, K. 2010. Refugee women survivors of war related sexualised violence: a multicultural framework for service provision in resettlement countries. Intervention Amstelveen, Netherlands, 83, 207–222. https://doi.org/10.1097/WTF.0b013e328341665c</p></li>\n<li><p>Yohani, S., &amp; Okeke-Ihejirika, P. 2018. Pathways to Help-Seeking and Mental Health Service Provision for African Female Survivors of Conflict-Related Sexualized Gender-Based Violence. Women &amp; Therapy, 413-4, 380–405. https://doi.org/10.1080/02703149.2018.1434302</p></li>\n</ul>\n","words":1540},{"id":"s39","mod":7,"title":"Module Overview and Learning Focus","html":"<p>As is the case with the general Canadian population, certain segments of the immigrant and refugee population require population-specific considerations in terms of mental health problems and illnesses. Module 5 examines the unique mental health needs of immigrant and refugee children.</p>\n<p>The module explores risk and protective factors, along with ways to support and help address this population's unique mental health needs. It also examines service considerations related to these needs, as well as potential mental health interventions.</p>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to</h5>\n<ul>\n<li><p>Describe the unique mental health vulnerabilities and needs of immigrant and refugee children.</p></li>\n<li><p>Discuss the different factors affecting the mental health of children pre- and post-immigration.</p></li>\n<li><p>Identify the risk and protective factors related to the unique mental health needs of immigrant and refugee children.</p></li>\n</ul>\n","words":133},{"id":"s40","mod":7,"title":"Newcomer Children in Canada: An Overview","html":"<div class=\"wide\"><h2>Guess the answer</h2><div class=\"mcq\" data-fb=\"In 2015, 20% of permanent residents who migrated to Canada were 14 years of age or under.\"><h4>In 2015, what percent of permanent residents who migrated to Canada were aged 14 or under?</h4><button class=\"opt\">1%</button><button class=\"opt\">10%</button><button class=\"opt\" data-ok=\"1\">20%</button><div class=\"fb\"></div></div></div><h5 id=\"immigrant-and-refugee-children-make-up-a-significant-proportion-of-canadas-incoming-newcomer-population-each-year.\">Immigrant and refugee children make up a significant proportion of Canada's incoming newcomer population each year.</h5>\n<p>In 2015, <strong>20%</strong> of permanent residents who migrated to Canada were <strong>14 years of age or under.</strong></p>\n<p>(Government of Canada, 2015)</p>\n<p>In 2016, permanent residents age 14 or under made up<strong> 8%</strong> of the total existing newcomer population in Canada.</p>\n<p>(Statistics Canada, 2017a)</p>\n<p>In 2011, <strong>945,130</strong> children and youth under the age of 25 were immigrants or refugees, representing <strong>9.5%</strong> of Canada's population in this age group.</p>\n<p>In 2015, of the 271,847 permanent residents admitted to Canada, <strong>87,468 or 32%</strong> were under age 24. Of those, <strong>nearly two-thirds (63%)</strong> were admitted under the Economic Immigration class, <strong>18%</strong> were among the Family Class and <strong>18%</strong> were refugees (CIC, 2015).</p>\n<h2 id=\"proportion-of-immigrants-among-children-by-census-metropolitan-areas\">Proportion of immigrants among children by census metropolitan areas</h2>\n<p>Newly-arrived immigrant and refugee children attend daycares and schools across Canada, diversifying the ethnocultural population of the community.</p>\n<p>In Canada's two largest census metropolitan areas, Toronto and Vancouver, newcomer children made up more than 25 per cent of the school-aged population in 2001, according to Statistics Canada.</p>\n<p>(Statistics Canada 2004, 2017b)</p>\n<p>Immigrant and refugee children—as with all children—require particular attention to their needs as they are vulnerable, dependent on adults and still developing. Children are physically vulnerable as they are more susceptible to some diseases, malnutrition and physical injury. In addition, they need the support of adults for physical survival and for their psychological and social well-being, particularly in the early years of childhood.</p>\n<p>Because children develop in a general sequential order where each stage depends on the one before it, any serious delays or interruptions in these sequences can severely disrupt their development (Schutzenhofer, 2018). Violence and insecurity prevent children from engaging in and mastering age-appropriate tasks such as learning how to regulate bodily functions or emotions, or learning social skills (Mueller &amp; Tronick, 2019).</p>\n","words":336},{"id":"s41","mod":7,"title":"Adolescence, Youth, and Transition to Adult Services","html":"<p>Within Canada, the age at which a child is considered to be an adult varies. Age 18 or 19 is commonly referred to as the “age of majority” according to different provinces and territories, but government services may have different cut-off ages (Government of Canada, 2017).</p>\n<p>Adolescents and youth go through important stages of development that often present additional needs or challenges. Adolescence begins with the normal, physiological onset of puberty and ends once adult behaviour and identity are accepted. Adolescence generally ranges from age 10 to 19 years of age (Canadian Paediatric Society, 2003) (World Health Organization, n.d.). <strong>These years are known to be a crucial period of development where exposure to trauma can greatly influence mental health</strong> (World Health Organization, 2021) (World Health Organization, n.d.). As a result, we encourage health service providers to show flexibility in defining the adolescent stage to include the special situations where young people require support (Farley, 2020; Canadian Paediatric Society, 2003).</p>\n<p>Youth (or transitional aged youth) warrant discussion as a subgroup as they occupy a unique “in-between” stage where they are about to enter adulthood but may not have the emotional maturity and experience of adults. What constitutes “youth” can be difficult as this stage of transitioning from childhood to adulthood can be fluid and varied. For example, the United Nations often refers to “youth” as the stage at which a person leaves compulsory education for first employment, usually between the ages of 15 and 24 (United Nations, n.d.). Canadian federal programs use varied age categorizations for youth, beginning as young as age 15 to 19, and ending at age 23 to 35 (United Way of Calgary and Area, 2010). When providing services to youth, it is important to ensure coordination and integration of services during this transition period as regional and agency definitions differ.</p>\n<p>The transition years from children-centred to adult-centred services is recognized as an issue in the provision of mental health services for youth. It is often a stressful period for youth and their family (Toronto Central Local Health Integration Network, 2015).</p>\n<p>It is important to start planning the transition to the adult mental health system before the youth turns 18 years of age. This transition may include receiving care at a new facility or department, interacting with new staff, having a new treatment plan and being eligible for adult healthcare programs. Youth usually receive more responsibilities and independence when transitioning to the adult mental health system. It is therefore important to have support from family and caregivers to prepare (Canadian Mental Health Association, 2023).</p>\n<p>Many youth also experience particular struggles related to language barriers, cultural conflict with parents or barriers to the Canadian educational system or entering the labour market. All of these struggles and barriers can be sources of stress.</p>\n<p>As transitioning mental health systems has been flagged as an area of high need, different organizations have launched programs to help youth navigate the mental health system. For example, Youth Wellness Hubs provide youth aged 12-25 with one-stop access to mental health services, including assessments, treatment for addictions and substance use, therapy and counselling, peer and family support and referrals to psychiatrists, as well as education, employment and housing services (Henderson et. al., 2022).</p>\n","words":537},{"id":"s42","mod":7,"title":"Mental Health Patterns Among Immigrant and Refugee Children","html":"<p>Mental health problems often emerge in childhood and adolescence and track into adulthood (Kessler et al., 2005; Merikangas &amp; Avenevoli, 2002). <strong>Immigrant and refugee children, like their adult counterparts, are less likely than non-immigrant groups to access mental health services</strong> (Mental Health Commission of Canada [MHCC], 2016). We know this because immigrant youth are more likely than non-immigrant youth to present with their first mental health crisis at an emergency department, indicating underuse of appropriate mental health services (Saunders, et al., 2018).</p>\n<p>Immigrant families often face barriers to accessing good-quality mental health support for their children suffering from mental health problems and illnesses or neurodevelopmental disorders such as autism. These barriers include difficulties navigating the new health, education and social systems without guidance, fragmented and dispersed services, and long wait times (Khanlou et al, 2017). As a result, this can delay diagnosis and timely delivery of critical interventions.</p>\n<p>In addition, there is great variation in child and youth health and mental health experiences in Canada. The unique migration history and trajectory of individual newcomer children have to be understood and taken into account (Saunders, et al., 2018).</p>\n<h5 id=\"a-number-of-factors-can-affect-the-mental-health-of-child-and-youth-immigrants-including\">A number of factors can affect the mental health of child and youth immigrants, including:</h5>\n<ul>\n<li><p>Country of birth</p></li>\n<li><p>Age at arrival</p></li>\n<li><p>Length of time in Canada</p></li>\n<li><p>Gender</p></li>\n<li><p>Socioeconomic status</p></li>\n<li><p>Immigration status</p></li>\n<li><p>Circumstances surrounding migration</p></li></ul>\n<h5 id=\"the-examples-below-illustrate-differing-circumstances-that-may-impact-the-mental-health-of-immigrant-and-refugee-children\">The examples below illustrate differing circumstances that may impact the mental health of immigrant and refugee children:</h5>\n<ul>\n<li><p>Two sisters migrate with their family to Canada from a large, cosmopolitan city in Estonia. Their parents, one a doctor and the other a lawyer, organized and financed the immigration process. The family emigrated as the parents aimed to provide a better life to their children.</p></li>\n<li><p>A brother and sister arrive to Canada from rural Burma. They were forced into hiding with their mother after having to watch their father being beaten to death. The family subsequently fled to a refugee camp on the Thai border. The family speaks Chin. Their mother is illiterate. The brother and sister have not attended school since they fled their home in Burma.</p></li></ul>\n<p>(Adapted from Hui &amp; Barozzino, 2013)</p>\n<h2 id=\"immigrant-children\">Immigrant children</h2>\n<p>Immigrant children generally experience the “healthy immigrant effect,” although to a lesser extent than immigrant adults. This means they arrive in Canada healthier than their Canadian-born peers (Vang, Sigouin, Flenon, &amp; Gagnon, 2017).</p>\n<p>Immigrant children tend to have similar or lower rates of mental disorders and lower rates of substance use than native-born children, despite generally living in greater levels of poverty and economic stress (Gadermann, et al., 2022) (Kwak &amp; Rudmin, 2014) (Kwak, 2016) (Hamilton, van der Maas, Boak, &amp; Mann, 2013). It is important to keep in mind that there can be significant variation between immigrant children, however, as many factors can influence their mental health.</p>\n<p><strong>Large-scale community surveys show that the rates of psychiatric disorders among immigrant youth are not higher than those of Canadian-born children </strong>(Kirmayer et al., 2011). Family cohesion, different parenting strategies, higher parental expectations and greater supervision and monitoring of youth may contribute to these findings. Nevertheless, immigrant children's mental health can be affected by similar factors to those that affect children in general (Beiser, 2010).</p>\n<h3 id=\"for-example\">For example:</h3>\n<ul>\n<li><p>Boys are more likely than girls and younger children more likely than older children to display behavioural problems (Beiser et al., 2002; Beiser, 2010).</p></li>\n<li><p>As is the case for children in general, maternal depression increases the likelihood of immigrant children experiencing emotional problems (Beiser, 2010).</p></li>\n<li><p>Substance use rates are statistically lower among immigrant youth than their Canadian-born peers (Hamilton, van der Maas, Boak, &amp; Mann, 2013).</p></li>\n<li><p>The risk of developing a substance use disorder appears to increase with time spent in Canada and with level of acculturation (Korczak, 2015).</p></li></ul>\n\n<p>Immigrant youth may feel overwhelmed when trying to fit in with a new culture while maintaining components of their own ethnic background. As youth acculturate, they may come into conflict with parents and relatives who hold ideals and values that differ from their own. Children, as well as their parents, who participate in both Canadian and home-country cultural practices and traditions, tend to do better than those who have a weaker ethnic identity or who have completely assimilated (Costigan et al., 2010).</p>\n<h2 id=\"refugee-children\">Refugee children</h2>\n<h5 id=\"children-make-up-a-significant-proportion-of-the-general-refugee-population.-in-2015-half-of-the-worlds-refugees-were-children-and-adolescents-unhcr-2021.\">Children make up a significant proportion of the general refugee population. In 2015, half of the world's refugees were children and adolescents <strong>(UNHCR, 2021)</strong>.</h5>\n<p>Compared to other children, refugee children may have increased rat
