h. (2015). Taking action on health equity and diversity: Responding to the metnal health needs of children, youth and families new to Canada. Available: http://www.excellenceforchildandyouth.ca/sites/default/files/resource/policy_newcomer_cymh.pdf. Accessed April 22, 2018.</p></li>\n<li><p>Ontario Health. 2022. Transitions From Youth to Adult Health Care Services: Care for Young People Aged 15 to 24 Years. Queen’s Printer for Ontario. https://www.hqontario.ca/Portals/0/documents/evidence/quality-standards/qs-transitions-from-youth-to-adult-health-care-services-quality-standard-en.pdf</p></li>\n<li><p>Oxman-Martinez, J., &amp; Choi, Y. R. 2014. Newcomer Children: Experiences of Inclusion and Exclusion, and Their Outcomes. Social Inclusion, 24, 23–37. https://doi.org/10.17645/si.v2i4.133</p></li>\n<li><p>Patterson, B., Kyu, H. H., &amp; Georgiades, K. 2013. Age at Immigration to Canada and the Occurrence of Mood, Anxiety, and Substance Use Disorders. The Canadian Journal of Psychiatry, 584, 210–217. https://doi.org/10.1177/070674371305800406</p></li>\n<li><p>Pieloch, K. A., McCullough, M. B., &amp; Marks, A. K. 2016. Resilience of children with refugee statuses: A research review. Canadian Psychology/Psychologie Canadienne, 574, 330-339. doi:https://doi.org/10.1037/cap0000073</p></li>\n<li><p>Pottie, K., Greenaway, C., Hassan, G., Hui, C., &amp; Kirmayer, L. J. 2016. Caring for a newly arrived Syrian refugee family. Canadian Medical Association Journal, 1883, 207–211. https://doi.org/10.1503/cmaj.151422</p></li>\n<li><p>Resilience &amp; Recovery After War: Refugee Children and Families. 2010. In American Psychological Association. American Psychological Association. https://www.apa.org/pubs/reports/refugees-full-report.pdf</p></li>\n<li><p>Rousseau, C., Drapeau, A., &amp; Rahimi, S. 2003. The complexity of trauma response: a 4-year follow-up of adolescent Cambodian refugees. Child Abuse &amp; Neglect, 2711, 1277–1290. https://doi.org/10.1016/j.chiabu.2003.07.001</p></li>\n<li><p>Saunders, N., Gill, P., Holder, L., Vigod, S. N., Kurdyak, P., Gandhi, S., &amp; Guttmann, A. 2018. Use of the emergency department as a first point of contact for mental health care by immigrant youth in Canada: a population-based study. Canadian Medical Association Journal, 19040, E1183–E1191. https://doi.org/10.1503/cmaj.180278</p></li>\n<li><p>Schutzenhofer, E. 2018. Evaluating the Effects of Refugee Experiences on Cognitive and Social-Emotional Development in Refugee Children in the Primary Care Setting. Incomplete reference</p></li>\n<li><p>Shakya, Y., Guruge, S., Hynie, M., Akbari, A., Malik, M., Htoo, S., Khogali, A., Mona, S. A., Murtaza, R., &amp; Alley, S. 2012. Aspirations for Higher Education among Newcomer Refugee Youth in Toronto: Expectations, Challenges, and Strategies. Refuge: Canada’s Journal on Refugees, 272, 65–78. https://doi.org/10.25071/1920-7336.34723</p></li>\n<li><p>Smith, A., Poon, C., Stewart, D., Hoogeveen, C., Saewyc, E., and the McCreary Centre Society 2011. Making the right connections: Promoting positive mental health among BC youth. Vancouver, BC: McCreary Centre Society</p></li>\n<li><p>Tardif, C. Y., &amp; Geva, E. 2006. The Link between Acculturation Disparity and Conflict among Chinese Canadian Immigrant Mother-Adolescent Dyads. Journal of Cross-Cultural Psychology, 372, 191–211. https://doi.org/10.1177/0022022105284496</p></li>\n<li><p>The Case for Diversity. 2016. Mental Health Commission of Canada. https://www.mentalhealthcommission.ca/wp-content/uploads/drupal/2016-10/case_for_diversity_oct_2016_eng.pdf</p></li>\n<li><p>UNHCR - The UN Refugee Agency. n.d.. Figures at a glance | UNHCR. UNHCR. https://www.unhcr.org/about-unhcr/who-we-are/figures-glance</p></li>\n<li><p>United Nations. n.d.. DEFINITION OF YOUTH. https://www.un.org/esa/socdev/documents/youth/fact-sheets/youth-definition.pdf</p></li>\n<li><p>United Way of Calgary and Area. (2010). Environmental Scan: Extended Age Definition for Youth 15-24. Available: http://www.youthpolicy.org/library/wp-content/uploads/library/2010_Environmental_Scan_Extended_Age_Definition_for_Youth_Eng.pdf. Accessed April 22, 2018.</p></li>\n<li><p>Van Der Kolk, B, &amp; Bessel A. (2005). Developmental Trauma Disorder:</p></li>\n<li><p>Van Ee, E., Kleber, R. J., Jongmans, M. J., Mooren, T., &amp; Out, D. 2016. Parental PTSD, adverse parenting and child attachment in a refugee sample. Attachment &amp; Human Development, 183, 273–291. https://doi.org/10.1080/14616734.2016.1148748</p></li>\n<li><p>Vang, Z. M., Sigouin, J., Flenon, A., &amp; Gagnon, A. 2017. Are immigrants healthier than native-born Canadians? A systematic review of the healthy immigrant effect in Canada. Ethnicity &amp; Health, 223, 209–241. https://doi.org/10.1080/13557858.2016.1246518</p></li>\n<li><p>World Health Organization (WHO). (n.d.). Adolescents and mental health [web page]. Available: http://www.who.int/maternal_child_adolescent/topics/adolescence/menta</p></li>\n<li><p>World Health Organization: WHO. 2021. Mental health of adolescents. www.who.int. https://www.who.int/news-room/fact-sheets/detail/adolescent-mental-health</p></li>\n</ul>\n\n","words":1822},{"id":"s50","mod":8,"title":"Module Overview and Learning Focus","html":"<p>As is the case with the general Canadian population, certain cohorts of the immigrant and refugee population require population-specific considerations in terms of mental health problems and illnesses. Module 6 examines the unique mental health needs of a number of vulnerable immigrant and refugee populations, like older adults, survivors of torture, 2SLGBTQ+ people and persons with disabilities.</p>\n<p>The module explores risk and protective factors, along with ways to support and help address these populations' unique mental health needs. It also examines service considerations related to these needs, as well as potential for mental health interventions.</p>\n<h5 id=\"this-module-has-four-sections\">This module has four sections:</h5>\n<ol type=\"1\">\n<li><p>Older adults</p></li>\n<li><p>Survivors of torture</p></li>\n<li><p>2SLGBTQ+ immigrants and refugees</p></li>\n<li><p>People living with disabilities</p></li></ol>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to</h5>\n<ul>\n<li><p>Describe the unique mental health vulnerabilities and needs of immigrant and refugee older adults, survivors of torture, 2SLGBTQ+ people and persons living with disabilities.</p></li>\n<li><p>Identify the risk and protective factors related to the unique mental health needs of specific immigrant and refugee populations.</p></li>\n<li><p>Explain service considerations related to the unique mental health needs of specific immigrant and refugee populations.</p></li>\n</ul>\n<h2 id=\"terminology\">Terminology</h2>\n<h5 id=\"below-are-definitions-of-common-terms-that-are-used-throughout-this-module\">Below are definitions of common terms that are used throughout this module:</h5>\n<h4 id=\"older\">Older</h4>\n<blockquote>\n<p>The United Nations High Commissioner for Refugees (UNHCR) defines older refugees according to life expectancy in the region in which they originate, allowing for enormous variation between countries in the developing and developed world (Bartolomei et al., 2003).</p>\n</blockquote>\n<h4 id=\"torture\">Torture</h4>\n<blockquote>\n<p>The UN Convention against Torture and Other Cruel, Inhuman or Degrading Treatment or Punishment provides this commonly-used definition of torture: “Any act by which severe pain or suffering, whether physical or mental, is intentionally inflicted on a person for such purposes as obtaining from [them] or a third person information or a confession, punishing [them] for an act [they] or a third person has committed or is suspected of having committed, or intimidating or coercing [them] or a third person, or for any reason based on discrimination of any kind, when such pain or suffering is inflicted by or at the instigation of or with the consent or acquiescence of a public official or other person acting in an official capacity. It does not include pain or suffering arising only from, inherent in or incidental to lawful sanctions” (UN, 1984).</p>\n</blockquote>\n<h4 id=\"slgbtq\">2SLGBTQ+</h4>\n<blockquote>\n<p>This course uses the term 2SLGBTQ+ (lesbian, gay, bisexual, transgender, queer, two-spirit and others). The use of this term is not intended to be exclusive. These terms express different embodiments, trajectories and expressions of gender and are products of time, place and language. Thus, it is recognized that terminology for sexual orientation or gender identity (SOGI) can vary by region and community, and across time and place (Hall &amp; Sajnani, n.d.).</p>\n</blockquote>\n<h4 id=\"people-with-disabilities\">People with disabilities</h4>\n<blockquote>\n<p>This includes “those who have long-term physical, mental, intellectual or sensory impairments [by illness, injury or wounds] which in interaction with various barriers may hinder their effective participation in society on an equal basis with others” (UN, 2006).</p>\n</blockquote>\n","words":493},{"id":"s51","mod":8,"title":"Older Newcomers: Background and Experiences","html":"<p>The United Nations defines “older” persons as those over the age of 60 years. However, sociocultural referents are also used to define age, including factors such as family status (grandparents), physical appearance and life expectancy in the region in which they originate. This allows for variation in definitions between countries in the developing and developed world (UNHCR, 2022).</p>\n<p>Newcomer older adults make up a small proportion <strong>(3.3%)</strong> of new immigrants and refugees and may arrive later to join their families (Government of Canada, 2021).</p>\n<p>Older recent immigrants to Canada typically come under the sponsored family class (<strong>88%</strong> in 2017), usually sponsored by their adult children, or the resettled refugee and protected person class (<strong>9%</strong> in 2017), (Government of Canada, 2019c). These numbers have been increasing over the past few years because of the new Parent and Grandparent Immigration Program.</p>\n<p>The effects of trauma, experiences of forced and/or long periods of displacement, exposure to diseases, poor nutrition and lack of adequate health care have serious implications for the physical and mental health of older refugees. Mental health problems and illnesses can be serious issues for older immigrants within their first few years after arrival due to lack of access to care or exacerbated chronic diseases.</p>\n<p>Recent older immigrants are less likely than Canadian-born older adults to report excellent or very good self-rated health (Gee et al., 2004; Um &amp; Lightman, 2017), and they may experience an inverse “healthy immigrant effect” (Gee et al., 2004). Recent older immigrants report worse health, but the longer they reside in Canada, the more likely they are to perceive their health as better (Gee et al., 2004).</p>\n<h5 id=\"as-with-all-groups-of-newcomers-there-are-differences-among-older-immigrants.\">As with all groups of newcomers, there are differences among older immigrants.</h5>\n<ul>\n<li><p>Older, racialized immigrant men are <strong>more</strong> likely to report poorer health than older Canadian-born men.<br />\nOlder, racialized, recent immigrant women are <strong>less</strong> likely to report poorer health than older Canadian-born women (Kobayashi &amp; Prus, 2012).</p></li>\n<li><p>When other factors are considered, this health difference remains for older, racialized, recent immigrant men; older, racialized immigrant women become comparable to Canadian-born women (Kobayashi &amp; Prus, 2012).</p></li></ul>\n<p>Health service providers may overlook or misdiagnose the symptoms associated with mental health problems and illnesses as part of the normal aging process. This decreases quality of life and can lead to more serious consequences in older populations, such as suicide (Fiske et al., 2009).</p>\n","words":393},{"id":"s52","mod":8,"title":"Older Newcomers: Mental Health Risks and Challenges","html":"<p>One out of five Canadian older adults surveyed experienced emotional distress that they found difficult to cope with on their own. This is slightly higher than in the other Commonwealth countries (Canadian Institute for Health Information, 2017). Immigrant and refugee older adults are at high risk of developing mental health problems and illnesses due to a number of unique challenges that affect their mental health and well-being, as outlined below (Neilson, 2010; Spence &amp; Koehn, 2010).</p>\n<p>Loss of social status</p>\n<p>+</p>\n<p>Chronic physical health problems</p>\n<p>+</p>\n<p>Social isolation</p>\n<p>+</p>\n<p>Language barriers</p>\n<p>+</p>\n<p>Feeling of “aging in the wrong place”</p>\n<p>+</p>\n<p>Loss of independence</p>\n<p>+</p>\n<p>Elder abuse/neglect</p>\n<p>+</p>\n<h3 id=\"impact-of-covid-19\">Impact of COVID-19</h3>\n<p>COVID-19 has had a serious health impact and has resulted in higher mortality rate for older adults. In addition, it has had detrimental impacts on the social and emotional well-being of this age group. These effects are also true for older adult immigrants and refugees.</p>\n<p>Unique risk factors such as racism, discrimination, language barriers, weak social networks and separation from friends and family predispose immigrant and refugee older adults to a higher risk of social isolation. The pandemic and fear of the virus have exacerbated the effects of social isolation for this population, leading to deterioration in their mental health (Johnson et al., 2021).</p>\n","words":214},{"id":"s53","mod":8,"title":"Older Newcomers: Considerations for Service Providers","html":"<h5 id=\"in-canada-the-most-common-mental-health-problems-and-illnesses-for-the-general-population-age-65-and-older-in-order-of-prevalence-are\">In Canada, the most common mental health problems and illnesses for the general population age 65 and older, in order of prevalence, are:</h5>\n<ul>\n<li><p>Mood and anxiety disorders</p></li>\n<li><p>Cognitive and mental disorders due to a medical condition (including dementia)</p></li>\n<li><p>Substance misuse</p></li>\n<li><p>Psychotic disorders</p></li></ul>\n<p>(MacCourt et al., 2011)</p>\n<h5 id=\"this-may-indicate-the-prevalence-for-older-refugees-and-immigrants-as-well.-common-mental-health-problems-and-illnesses-for-this-population-include\">This may indicate the prevalence for older refugees and immigrants as well. Common mental health problems and illnesses for this population include:</h5>\n<ul>\n<li><p>Dementia</p></li>\n<li><p>Anxiety</p></li>\n<li><p>Depression</p></li>\n<li><p>PTSD</p></li></ul>\n<p>Providers are often unaware of the particular problems and obstacles that older refugees and immigrants face in accessing care. Further, factors such as sadness, agitation and cognitive symptoms are frequently attributed to “normal aging.” These are common symptoms among the aging population regardless of immigration status.</p>\n<p>Older adults often lack knowledge and understanding of how to interpret mental health problems and illnesses (McCleary et al., 2013; Tieu et al., 2010). They may not recognize symptoms and, in cases such as dementia, they may view it as part of the normal aging process since they are unfamiliar with it (McCleary et al., 2013). In addition, clients sometimes mistake symptoms of common mental disorders, including depression and PTSD, for dementia. In some cultures and communities, mental health problems and illnesses manifest as physical issues (such as high blood pressure, high cholesterol and insomnia), and there is a belief the illness will go away on its own. There is also often stigma around mental problems and illnesses being contagious, especially among older immigrants (Chen et al., 2013).</p>\n<p>As a result of misdiagnosis or a failure to recognize the connections between physical health problems and mental health problems, illnesses may be untreated, potentially leading to the development of serious mental health disorders, critical impairment and even death (McCleary et al., 2013). In people who do have dementia, depression and anxiety disorders can exacerbate the condition. Unrecognized or misdiagnosed problems can lower quality of life, leading to more serious consequences in older populations, such as suicide (Fiske et al., 2009).</p>\n<p>Cultural beliefs and stigma can be extremely important in terms of recognizing a problem and seeking care (McCleary et al., 2013; Tieu &amp; Konnert, 2014). For example, older Chinese immigrants often see the use of psychiatric services as a loss of respect or humiliation (loss of face). As a result, they are more likely to take care of problems themselves or seek help from a general practitioner rather than seeking help from close friends or psychologists (Tieu &amp; Konnert, 2014). This could be a good alternative if the health care provider is well connected and versed in the health of aging for this specific population, but it cannot be a substitute to specialized care.</p>\n<p>When people from different backgrounds do ask for help, providers should attempt to assess cultural beliefs related to the illness. When appropriate and available, they should use this knowledge to educate and promote mental health literacy. Consideration of cultural beliefs and potentially cultural treatments can also help support engagement and adherence to recommended treatment plans.</p>\n<h4 id=\"resources-on-alzheimers-disease\">Resources on Alzheimer's disease:</h4>\n<p><strong><a href=\"https://alzheimer.ca/en/help-support\">Alzheimer Society - Help and support</a><a href=\"https://alzheimer.ca/bc/en/help-support/programs-services/dementia-resources-bc/resources-other-languages\">Alzheimer Society - Resources in other languages</a><a href=\"https://alzheimer.ca/on/en/help-support/programs-services/finding-your-way\">Finding Your Way</a></strong></p>\n","words":516},{"id":"s54","mod":8,"title":"Older Newcomers: Promoting Mental Well-Being","html":"<p>The Mental Health Commission of Canada (MHCC) has identified both older adults and diverse (immigrants, refugees, ethnocultural and racialized) communities as strategic priority populations that require greater attention for promotion of mental health and the prevention of mental illness (MHCC, 2012). The MHCC calls for promotion of mental health across the lifespan and recommends actions on countering ageism, promoting active participation, fostering meaningful relationships and maintaining good physical health (MacCourt et al., 2011; MHCC, 2012).</p>\n<p>A key to this focus on promoting mental health and preventing mental health problems and illnesses is a service delivery model that supports an integrated mental health system.</p>\n<h5 id=\"this-type-of-system-would-include-the-following-values\">This type of system would include the following values:</h5>\n<ul>\n<li><p>Respect and dignity</p></li>\n<li><p>Self-determination, independence and choice</p></li>\n<li><p>Participation, relationships and social inclusion</p></li>\n<li><p>Fairness and equity</p></li>\n<li><p>Security</p></li></ul>\n<p>(MacCourt et al., 2011)</p>\n<p>Providers should translate these principles into concrete action and apply them with consideration of language and cultural factors. An integrated system of care consists of a full range of health, mental health and social services to meet the needs of older adults. These services should include establishing and maintaining contact with people from similar and different cultural backgrounds and religious affiliations, and being aware of recreational opportunities and other activities to stimulate older adults mentally, physically and socially (Mental Health Commission of Canada, 2021) (Mental Health Commission of Canada with Tourigny-Rivard, M-F, 2019; MacCourt et al., 2011).</p>\n<p>Flexibility in service delivery and recognition of the central role of family and community are the best approaches to meet the needs of this population (Refugee Health Research Centre, 2005). It is important to take into consideration what older clients prefer and, if desired, involve their family as a way to build rapport with the client.</p>\n\n<p>Health service providers should encourage immigrant and refugee older adults to participate in recreational or community events, as well as in as many meaningful social activities as possible. Because religion is a crucial factor in maintaining a sense of community, continuity and stability for many older immigrants and refugees, places of worship are often important sources of support for this group, providing a sense of belonging (Refugee Health Research Centre, 2005).</p>\n<p>Older immigrants and refugees who are new to Canada are more likely to report high levels of loneliness than other generations of Canadians (Wu &amp; Penning, 2015). Getting them involved in religious gatherings and senior centres that offer activities such as employment or volunteering, arts and crafts, woodworking, cards and other social outings can help build social networks and reduce isolation.</p>\n<p>When possible, provide older immigrants and refugees with information and knowledge about alternative transportation to reduce isolation and promote greater independence. In some communities these are available at a low or no cost, however the information may not be available or well-known among these populations.</p>\n<h4 id=\"resources-for-alternative-transportation\">Resources for alternative transportation:</h4>\n<p><a href=\"https://211ontario.ca/\"><strong>Ontario: 2-1-1</strong>(or dial 2-1-1)</a><strong><a href=\"https://www.seniorsonthemove.org/\">British Columbia: Seniors on the Move</a><a href=\"https://amainsider.com/transportation-alternatives-for-alberta-seniors/\">Alberta: Transportation Alternatives for Alberta Seniors</a></strong></p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Contact with people who share culture, values and language is a key protective factor for older refugees.\"><h4>Opportunities to establish and maintain contact with people from similar cultural backgrounds who share their values and speak their language is critical to promoting mental health among older refugees.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n","words":535},{"id":"s55","mod":8,"title":"Survivors of Torture: Background and Experiences","html":"<p>Torture can have an immense impact on a person's physical and mental health. Human rights abuse and cases of torture and other ill-treatment have been documented in at least 141 countries (Amnesty International, n.d). Torture can occur in prisons in the country of origin or abroad, among societies experiencing war or conflict, or among those under state oppression (Mpande et al., 2013).</p>\n<h5 id=\"the-un-convention-against-torture-and-other-cruel-inhuman-or-degrading-treatment-or-punishment-provides-this-commonly-used-definition-of-torture\">The UN Convention against Torture and Other Cruel, Inhuman or Degrading Treatment or Punishment provides this commonly-used definition of torture:</h5>\n<p>“...any act by which severe pain or suffering, whether physical or mental, is intentionally inflicted on a person for such purposes as obtaining from him or a third person information or a confession, punishing him for an act he or a third person has committed or is suspected of having committed, or intimidating or coercing him or a third person, or for any reason based on discrimination of any kind, when such pain or suffering is inflicted by or at the instigation of or with the consent or acquiescence of a public official or other person acting in an official capacity. It does not include pain or suffering arising only from, inherent in or incidental to lawful sanctions.” (UN, 1984)</p>\n<p>Torture can include many different acts, such as beating, burning, electric shocks, sleep deprivation, rape, mutilation, suffocation in water, mock execution, sensory deprivation and the forced observation of the torture of friends or family. No matter the method, torture takes a severe toll on survivors, their families and whole communities (UN, 1998; CCVT, n.d.).</p>\n<p>The aim of torture is to humiliate victims and establish extreme power over them so they become powerless—in effect, dehumanizing the individual. This produces profound feelings of guilt, destruction of mental and psychological capabilities, and loss of dignity in victims (Vorbrüggen &amp; Baer, 2007).</p>\n<p>Torture victims can be almost any member of society—people from all social classes, age groups and sexual orientations. Although survivors of torture can be from immigrant or refugee populations, <strong>historically torture survivors have been more represented among refugees and asylum-seekers than other groups</strong>. In 2019, an estimated 30% of all refugees resettled in Canada were survivors of torture or violence (UNHCR, n.d.).</p>\n<p>During refugee status determination hearings, refugee claimants who are victims of torture may find the proceedings particularly stressful, even when the discussion does not involve their experiences of torture. For this reason, the Immigration and Refugee Board of Canada recognizes, in its <em>Training Manual on Victims of Torture</em>, that the experience of torture will negatively affect an individual's ability to testify and that special measures should be taken during the questioning of these claimants (IRB, 2004).</p>\n<p><a href=\"https://www.amnesty.org/en/get-involved/stop-torture/\"><strong>Learn more at Amnesty International's Stop Torture initiative</strong></a></p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"The course cites an estimated 30% of refugees resettled in Canada in 2019 as survivors of torture or violence.\"><h4>An estimated 20% of all refugees are believed to be either survivors of torture or personally close to a survivor.</h4><button class=\"opt\">True</button><button class=\"opt\" data-ok=\"1\">False</button><div class=\"fb\"></div></div></div>\n","words":475},{"id":"s56","mod":8,"title":"Survivors of Torture: Potential Long-Term Effects","html":"<h5 id=\"given-the-extreme-trauma-they-have-endured-survivors-of-torture-may-suffer-from-a-number-of-physical-emotional-and-psychological-consequences-in-both-the-short--and-long-term.\">Given the extreme trauma they have endured, survivors of torture may suffer from a number of physical, emotional and psychological consequences in both the short- and long-term.</h5>\n<p>The psychological and emotional consequences of torture are considered to be the most devastating and the most difficult to repair (UN, 1998). Survivors of torture are at high risk of depression, anxiety and PTSD, which may be manifested in recurring and intrusive memories, sleep problems, difficulty in concentrating, impaired memory, fear, anger, sadness and psychosomatic complaints (de C Williams &amp; van der Merwe, 2013) (Kienzler &amp; Sapkota, 2019) (The Center for Victims of Torture, 2015). Panic attacks and substance use are also reported as concerns. Research evidence indicates that torture is the strongest pre-migration predictor of PTSD (Wilson et al., 2010).</p>\n<h5 id=\"the-physical-health-effects-of-torture-may-include\">The physical health effects of torture may include:</h5>\n<ul>\n<li><p>Long-term injuries</p></li>\n<li><p>Physical impairment</p></li>\n<li><p>Traumatic brain injury</p></li>\n<li><p>Chronic pain</p></li></ul>\n<p>(Rasmussen, 1990; Weiss et al, 2016)</p>\n<p>Survivors of torture may not feel understood by family members, leaving them emotionally isolated. Meanwhile, friends and family members may struggle with undisclosed guilt for not having successfully protected the survivor (Hassan et al., 2016).</p>\n<p>Some of the psychological effects that survivors of torture may experience can lead to a breakdown in family and personal relationships (Berdichevsky, n.d.; FASSTT, n.d.). Among those who flee their country, family separation, language barriers, legal status and social isolation can then become post-migration stressors (Chu et al., 2013). The negative effects of experiencing torture can make survivors feel wary of seeking the help they need. In addition, survivors and their families may have difficulty trusting people and may be suspicious of strangers (Berdichevsky, n.d.).</p>\n<p>When they do access help, survivors of torture are often reluctant to disclose information about their experiences. Survivors of any trauma often avoid situations and topics that might bring back painful memories—memories that can be very unsettling, and even overwhelming. Triggering such memories sometimes provokes an emotional intensity similar to what was experienced at the time of the trauma.</p>\n<h3 id=\"impact-of-covid-19\">Impact of COVID-19</h3>\n<p>The COVID-19 pandemic lead to an increase in torture and ill-treatment in some areas of the world because of the use of excessive power to enforce curfews and social distancing, especially in detention centers (United Nations, 2020). In addition, torture survivors are more at risk of being infected by the lethal virus because of their vulnerable situation and living conditions, which led many of them to die from the COVID-19 virus (United Nations, 2020). Other impacts of the COVID-19 pandemic include lack of access to medical, psychological and social support, as well as delays in processing of asylum claims (Pérez-Sales, 2020).</p>\n","words":434},{"id":"s57","mod":8,"title":"Survivors of Torture: Considerations for Service Providers","html":"<h2 id=\"trigger-situations\">Trigger situations</h2>\n<h5 id=\"providers-should-be-aware-of-potential-situations-that-can-trigger-traumatic-memories.-the-following-situations-may-bring-back-feelings-of-terror-for-torture-survivors-reid-strong-1987\">Providers should be aware of potential situations that can trigger traumatic memories. The following situations may bring back feelings of terror for torture survivors <strong>(Reid &amp; Strong, 1987):</strong></h5>\n<h4 id=\"encounters-with-officials\">Encounters with officials</h4>\n<blockquote>\n<p>Especially those in uniform, such as hospital staff, police, immigration officials, etc.</p>\n</blockquote>\n<h4 id=\"signing-forms\">Signing forms</h4>\n<blockquote>\n<p>Especially if they state that false declarations may result in prosecution, fines or imprisonment, cautions that survivors cannot take lightly.</p>\n</blockquote>\n<h4 id=\"disclosing-personal-or-family-details\">Disclosing personal or family details</h4>\n<blockquote>\n<p>Including date of birth, residential address, etc.</p>\n</blockquote>\n<h4 id=\"admission-to-hospitals\">Admission to hospitals</h4>\n<blockquote>\n<p>especially psychiatric hospitals, which may resemble prisons</p>\n</blockquote>\n<h4 id=\"doctors\">Doctors</h4>\n<blockquote>\n<p>Doctors in prison may have advised the torturers about how much abuse the victim could endure or how to cause maximum pain without killing the victim.</p>\n</blockquote>\n<h4 id=\"staff-of-government-agencies\">Staff of government agencies</h4>\n<blockquote>\n<p>Fear that staff will report their activities to government security agencies that will pass the information on to representatives of the governments from which they fled.</p>\n</blockquote>\n<p>Providers may fail to consider the possibility that their clients may have been tortured. They also may feel helpless or over-identify with the client and, as a result, avoid investigation of traumatic material, or even deny that torture occurred. Providers need to be aware of the effects of torture and develop skills to respond appropriately using the principles of trauma-informed care. They should also be aware that torture is a widespread practice and consider torture and related trauma as possible causes of health problems.</p>\n<h4 id=\"there-are-a-number-of-issues-to-consider-when-obtaining-a-history-of-torture\">There are a number of issues to consider when obtaining a history of torture:</h4>\n<h3 id=\"the-setting\">The setting</h3>\n<ul>\n<li><p>Create a comfortable setting that is not cell-like in any way.</p></li>\n<li><p>Ensure all objects are in view (no screens).</p></li>\n<li><p>Be aware that seemingly innocent objects can be triggering.</p></li>\n</ul>\n<h3 id=\"the-process\">The process</h3>\n<ul>\n<li><p>Be aware that waiting or appointments can be triggering of memories of waiting for torture.</p></li>\n<li><p>Explain who you are, your role and the interview and examination process to reduce anxiety.</p></li>\n<li><p>Allow clients a sense of control by taking washroom or other breaks.</p></li>\n<li><p>Question gently.</p></li>\n<li><p>Question tactfully but directly. For example: “People with memory problems or bad dreams have often been tortured or traumatized. Is this something that has happened to you?”</p></li>\n<li><p>Acknowledge the difficulty of disclosing.</p></li>\n<li><p>Educate clients regarding symptoms and reassure them that these symptoms are “normal reactions to abnormal events.”</p></li>\n<li><p>Address misperceptions about torture.</p></li>\n</ul>\n<p>(Weinstein et al, 1996) (Madrid, 2021) (International Rehabilitation Council for Torture Victims, 2009)</p>\n<p>Adding to the challenge of identifying torture survivors is the fact that many avoid volunteering information about a history of torture due to common emotional responses such as guilt, shame, fear of not being believed or a generalized mistrust of others (Eisenman et al., 2000) (United Nations, 2017). Survivors may also be unaware that retelling their story and sharing their difficult experience could be a key component of them enjoying certain rights and benefiting positively from therapeutic experiences. Finally, language and cultural misalignment with providers can prevent torture survivors from speaking fully about their experiences (United Nations, 2017).</p>\n<p>Although torture is intended to destroy victims' personalities, sense of identity, confidence and ability to function socially, some experts maintain that the psychological effects of torture should be seen as “meaningful conditional reactions for a sound and forceful constitution that makes survival possible in a very pathological situation” (Somnier et al., 1992). In other words, the psychological symptoms resulting from torture are indicators of the individual's strength and ability to survive horrific experiences.Indeed, many PTSD symptoms, such as numbing, hypervigilance, social withdrawal, grief and loss, can be appropriate means of coping with profoundly abnormal circumstances. These symptoms are rendered even more psychologically harmful, however, due to their perpetration into the future, being aggravated by new stressors (Gorman, 2001).</p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Providers may fail to consider that clients have been tortured, and survivors often do not volunteer this history.\"><h4>Evidence suggests that providers often fail to identify a history of torture in a patient simply because they do not consider the possibility that their patients have been tortured.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n<h2 id=\"signs-and-symptoms-of-mental-health-problems-and-illnesses\">Signs and symptoms of mental health problems and illnesses</h2>\n<p>The most common mental disorders among torture survivors include PTSD, depression, generalized anxiety disorder and somatic disorders (C de C Williams &amp; van der Merwe, 2013).</p>\n<h5 id=\"common-signs-and-symptoms-resulting-from-torture-include-but-are-not-limited-to\">Common signs and symptoms resulting from torture include but are not limited to:</h5>\n<ul>\n<li><p>Extreme anxiety</p></li>\n<li><p>Impaired memory</p></li>\n<li><p>Insomnia and nightmares</p></li>\n<li><p>Emotional disturbance</p></li>\n<li><p>Intrusive thoughts and impaired concentration</p></li>\n<li><p>Sexual dysfunction</p></li>\n<li><p>Occupational and social impairment</p></li>\n<li><p>Somatic symptoms</p></li>\n<li><p>Substance abuse</p></li>\n<li><p>Learned hopelessness</p></li>\n<li><p>Fear of intimacy</p></li>\n<li><p>Depersonalization and dissociation</p></li>\n<li><p>Changes in identity</p></li></ul>\n<p>(Somnier et al., 1992)</p>\n<p>Survivors' symptoms can vary according to learned patterns of coping and the individual's particular ethnic, political and spiritual perspectives through which experiences are viewed.</p>\n<p>When using standardized instruments such as screening questionnaires or psychological tests, providers should exercise extra caution as these tools may be triggering (as discussed earlier in the module).</p>\n<h2 id=\"providing-effective-service\">Providing effective service</h2>\n<h5 id=\"the-canadian-centre-for-victims-of-torture-ccvt-has-prepared-general-recommendations-for-those-who-provide-services-to-survivors-of-torture\">The Canadian Centre for Victims of Torture (CCVT) has prepared general recommendations for those who provide services to survivors of torture:</h5>\n<h3 id=\"maintaining-positive-practices\">Maintaining positive practices:</h3>\n<ul>\n<li><p>Inform yourself and become knowledgeable about general issues connected with torture.</p></li>\n<li><p>Inform yourself and become knowledgeable about the specific realities in particular countries.</p></li>\n<li><p>Validate the survivor's story and allow for testimonial ventilation, regardless of the time elapsed since the torture took place.</p></li>\n<li><p>Understand the person and put the torture experience within the context of this individual.</p></li>\n<li><p>Identify possible symptoms of illness or disorder and refer the survivor to appropriate professionals.</p></li>\n<li><p>Extend the evaluation to the survivor's spouse, children and other family members.</p></li>\n</ul>\n<h3 id=\"avoiding-harmful-practices\">Avoiding harmful practices:</h3>\n<ul>\n<li><p>Be careful about making assumptions or applying personal biases. Be aware that your first line of defense may be to simplify things so that you won't be disturbed or frightened by the discovery that phenomena associated with torture are the norm rather than the exception.</p></li>\n<li><p>Don't feel that because the survivor appears to be functioning well and not having any special problems that they have fully recovered. In fact, the reintegration process can wax and wane. The fluctuating nature of the process allows for the survivor to achieve adaptation and ability functioning in some areas, while at the same time leaving other areas untouched.</p></li>\n<li><p>Don't rush things or jump to conclusions, and don't offer more help than what is strictly necessary. Be available through empathetic understanding and in time, your availability will be greatly appreciated.</p></li>\n<li><p>Don't consider the basic needs of a person who has been tortured as being different from the basic needs of any individual. However, do identify the special needs that arise out of the extreme situation survivors have lived through, as well as needs connected with being exiled as a refugee to another, unfamiliar, country.</p></li>\n</ul>\n<p>(Berdichevsky, n.d.)</p>\n","words":1099},{"id":"s58","mod":8,"title":"Survivors of Torture: Support and Intervention Approaches","html":"<p>As mentioned in Module 1, emotional and social support can act as a buffer to mental health problems and illnesses. For survivors of torture, such support is very important because common resettlement stressors such as financial difficulties or social isolation have been found to exacerbate symptoms of PTSD and depression (Gorst-Unsworth &amp; Goldenberg, 1998). Providing appropriate, accessible services can help reduce the compounding impact of the psychological effects of torture, forced displacement and settlement stress.</p>\n<h5 id=\"effective-support-programs-have-the-following-features\">Effective support programs have the following features:</h5>\n<ul>\n<li><p>Acknowledge and validate the person's experience of torture.</p></li>\n<li><p>Provide safety.</p></li>\n<li><p>Recognize that individuals may need specialized assistance.</p></li>\n<li><p>Help survivors deal with practical resettlement issues.</p>\n<p>(Simalchik, n.d.)</p></li></ul>\n<p>A variety of interventions have been found to produce improvements in mental illness symptoms for survivors of torture, though much of the research involves PTSD symptoms (McFarlane &amp; Kaplan, 2012). Depression and anxiety in survivors has also been studied, though to a lesser extent.</p>\n<p><strong>Narrative Exposure Therapy (NET)</strong> can significantly reduce PTSD symptoms (Hensel-Dittmann et al., 2010). The use of <strong>CBT with trauma exposure components</strong> has been shown to be effective in treating the symptoms of PTSD, depression and anxiety in survivors of torture (Weiss et al., 2016). In terms of sense of connection, <strong>group treatment</strong> may be well-suited to some of the vulnerabilities that survivors of torture experience to respond to post-trauma symptoms, minimize isolation, share support and regain a feeling of community (Bunn et al., 2016).</p>\n<p>The settlement process can be very traumatic for survivors of torture, especially due to the need to overcome various settlement challenges (CCVT, n.d.). In post-migration, these individuals attempt to recover from their trauma “…essentially in a place of exile where systems, language, culture and identity all need to be renegotiated” (FASSTT, 2014). As with any client, establishing trust is important; however, this may take time as survivors of torture may be reluctant to trust strangers (CCVT, n.d.(b)).</p>\n<h2 id=\"language-classes\">Language classes</h2>\n<h5 id=\"one-particularly-useful-and-relatively-accessible-service-that-can-be-offered-to-survivors-of-torture-is-learning-or-improving-their-english-or-french-skills.-enrolment-in-language-classes-provides-a-number-of-practical-benefits-including\">One particularly useful and relatively accessible service that can be offered to survivors of torture is learning or improving their English or French skills. Enrolment in language classes provides a number of practical benefits, including:</h5>\n<ul>\n<li><p>Engagement with others</p></li>\n<li><p>Distraction from suffering</p></li>\n<li><p>Grounding in the present</p></li>\n<li><p>Possibility of low-key socializing with others</p></li>\n<li><p>An opportunity to improve a sense of self-esteem</p></li></ul>\n<p>Language classes also improve the survivors' ability to build a life in Canada in which they can fully participate. It is important to keep in mind, however, that some of the consequences of torture, such as lack of concentration, distrust of strangers and fear of groups and authority figures, are barriers to learning a new language. Survivors of torture may benefit from smaller classes and a curriculum adapted to meet their needs (CCVT, n.d.).</p>\n<p>Social denial of the practice of torture can extend into the host community. As a result, victims of torture can remain socially isolated in “bystander” societies. Promoting awareness among survivors about the resources that can provide a support network in their new community can help build their social ties and help meet their needs (Simalchik, n.d.).</p>\n<h4 id=\"featured-resources\">Featured resources:</h4>\n<ul>\n<li><p><a href=\"http://www.bmj.com/content/bmj/355/bmj.i5019.full.pdf\">“When your patient is a survivor of torture” </a>provides firsthand recommendations from a survivor of torture (Haoussou, 2016).</p></li>\n<li><p>The <a href=\"https://ccvt.org/\">Canadian Centre for Victims of Torture (CCVT)</a> provides services to survivors of torture and their families in the Greater Toronto Area and links to other services.</p></li>\n<li><p>The United Nations Human Rights Commission's 2017 report, <a href=\"https://www.ohchr.org/sites/default/files/Documents/Issues/Torture/UNVFVT/UNVFVT_ExpertWorkshop2017.pdf\">Torture Victims in the Context of Migration: Identification, Redress and Rehabilitation</a></p></li>\n<li><p>The <a href=\"https://ccvt.org/ccvt-volunteer-program\">Volunteer Befriending Program</a> is a promising practice that supports survivors' ability to establish social ties, leading to community-building and promoting settlement and integration (Chambon et al., 2001).</p></li>\n<li><p>The <a href=\"https://www.vastbc.ca/\">Vancouver Association for Survivors of Torture (VAST)</a> provides counselling, documentation and referral services for refugees, as well as province-wide education, information, referrals and case consultation for health and social service providers working with refugees in British Columbia. VAST offers an integrated approach in which settlement workers and trauma counsellors collaborate to provide services informed by their respective approaches.</p></li>\n</ul>\n\n\n<p><strong>5.2 — Survivors of torture</strong></p>\n\n\n\n","words":699},{"id":"s59","mod":8,"title":"2SLGBTQ+ Newcomers: Context and Lived Experiences","html":"<p>Lesbian, gay, bisexual, transgender, queer/questioning and other non-cisgender and non-straight identities that are not included in the acronym (2SLGBTQ+) individuals often experience discrimination and prejudice due to intolerance, ignorance and myths about human differences in terms of gender and sexual identity. Meaningful participation in society is severely impaired when the fear of persecution, discrimination and constant stigmatization compromise an individual's mental well-being.</p>\n<p>This is a significant problem globally, as 2SLGBTQ+ individuals continue to be persecuted in many countries around the world. As of 2019, Sixty-nine countries criminalize same-sex relations, and same-sex sexual activity is punishable by death in 11 countries (International Lesbian, Gay, Bisexual, Trans and Intersex Association, 2019) (Government of Canada, 2020). In several other countries, people found to be 2SLGBTQ+ can be killed for the honour of the family, executed without legal authority or hurt in many other ways.</p>\n<p>Canada offers refugee protection to people who demonstrate a well-founded fear of persecution based on their sexual orientation (CIC, 2012) (Government of Canada, 2020) (Immigration and Refugee Board of Canada, 2021). From 2013 to 2015, about 2,400 individuals were approved for asylum to Canada on the basis of sexual and gender minority status; this group has a higher successful rate than other types of refugee claims (Molnar, 2018). In addition, in 2019 Canada established the Rainbow Refugee Assistance Partnership, designed to support Canadian privately-sponsored 2SLGBTQ+ refugees who are fleeing violence and persecution (Immigration, Refugees and Citizenship Canada, 2019).</p>\n<h2 id=\"terminology\">Terminology</h2>\n<h4 id=\"gay\">Gay</h4>\n<blockquote>\n<p>refers to a boy/man whose primary sexual orientation is toward other boys/men.</p>\n</blockquote>\n<h4 id=\"lesbian\">Lesbian</h4>\n<blockquote>\n<p>A girl/woman whose primary sexual orientation is toward other girls/women.</p>\n</blockquote>\n<h4 id=\"bisexual\">Bisexual</h4>\n<blockquote>\n<p>Someone whose sexual orientation is toward men and women.</p>\n</blockquote>\n<h4 id=\"transgender\">Transgender</h4>\n<blockquote>\n<p>Refers to someone who does not conform to society's gender norms of masculine/feminine.</p>\n</blockquote>\n<h4 id=\"trans-and-transpeople\">Trans and transpeople</h4>\n<blockquote>\n<p>are non-clinical terms that usually include transgender and other gender-variant people.</p>\n</blockquote>\n<h4 id=\"two-spirit\">Two-spirit</h4>\n<blockquote>\n<p>is an English word used by First Nation and other Indigenous peoples for those in their cultures who are gay or lesbian, intersex, transsexual or transgender or who have multiple gender identities.</p>\n</blockquote>\n<h4 id=\"intersex-people\">Intersex people</h4>\n<blockquote>\n<p>possess some blend of male and female physical sex characteristics.</p>\n</blockquote>\n<h4 id=\"queer\">Queer</h4>\n<blockquote>\n<p>is a formerly derogatory slang term used to identify 2SLGBTQ+ people. Some members of the 2SLGBTQ+ community have embraced and reinvented this term as a positive and proud political identifier when speaking among and about themselves.</p>\n<p>(Barbara et al., 2007)</p>\n</blockquote>\n<p>Service providers may want to be flexible in their language use, allowing clients to “name themselves” and affirm those identities named (Abramovich &amp; Shelton, 2017; Heartland Alliance for Human Needs &amp; Human Rights, 2012; Heartland Alliance for Human Needs &amp; Human Rights, 2013).</p>\n","words":431},{"id":"s60","mod":8,"title":"2SLGBTQ+ Newcomers: Mental Health Risks and Challenges","html":"<p>While current knowledge of mental health problems and illness in 2SLGBTQ+ immigrants and refugees is limited due to a lack of dedicated studies, some conclusions and considerations can be drawn from general studies of immigrant 2SLGBTQ+ populations and studies of mental health in non-immigrant 2SLGBTQ+ populations.</p>\n<p>In general, 2SLGBTQ+ individuals are at a higher risk for mental health problems and illnesses such as depression, anxiety, suicide or thoughts about suicide, and substance use problems in some pre-migration contexts or during the refugee journey.</p>\n<h5 id=\"this-higher-risk-is-due-to-specific-life-factors-including\">This higher risk is due to specific life factors, including:</h5>\n<ul>\n<li><p>The “coming out” process</p></li>\n<li><p>Gender transition</p></li>\n<li><p>Internalized oppression</p></li>\n<li><p>Loss of family support</p></li>\n<li><p>Societal oppression (e.g., homophobia, biphobia, transphobia)</p></li>\n<li><p>Threats to socioeconomic security (e.g., housing, employment) because of discrimination</p></li></ul>\n<p>(Nematy et al, 2022; Barbara et al., 2007)</p>\n<p>For 2SLGBTQ+ newcomers, uncertainty about the future can interact with post-migration difficulties including poverty, unemployment and social exclusion in Canadian society. The homophobia, persecution, abuse and forms of violence 2SLGBTQ+ individuals faced in their countries of origin on the basis of gender or sexual identity can worsen mental health problems.</p>\n<p>2SLGBTQ+ refugees have reported past emotional and physical abuse, shunning, assault, forced heterosexual marriage, blackmail and “corrective” rape (Shidlo &amp; Ahola, 2013). Such abuse can begin as early as childhood at the hands of family members, peers or school officials (Alessi et al., 2016). Given the prolonged experiences of violence, 2SLGBTQ+ refugees may suffer from depression, anxiety, complex trauma and/or PTSD (Alessi et al., 2016; Messih, 2016).</p>\n<p>In addition to dealing with past trauma, 2SLGBTQ+ refugees or other 2SLGBTQ+ newcomers who migrated from countries where 2SLGBTQ+ status is highly-stigmatized or criminalized must also deal with settlement stressors without necessarily benefiting from the support of their ethnocultural diaspora communities. Those individuals could be fearful to engage with their communities due to past experiences and bias toward stigmatization of 2SLGBTQ+ individuals. 2SLGBTQ+ refugees may also fear homophobia or transphobia from members of their ethnocultural communities and may therefore lack access to the support these groups can offer (Alessi, 2016; Kahn, 2015; Lee &amp; Brotman, 2011).</p>\n<p>2SLGBTQ+ refugees and immigrants may also feel uncomfortable about associating with 2SLGBTQ+-oriented organizations, which could prevent them from accessing support for both their trauma and their adaptation to Canada (Kahn, 2015). Social isolation may be even more of a problem for 2SLGBTQ+ immigrants and refugees who also experience marginalization due to race or ethnicity, which can negatively affect mental health (Logie, 2012). Furthermore, the 2SLGBTQ+ community, as with any community, may exhibit inequalities along with racism, classism, biphobia, transphobia or other exclusions, which can prevent members from benefiting from community resilience (Meyer, 2015).</p>\n<p>During the refugee determination process, claimants may feel pressured to come out publicly or to express their 2SLGBTQ+ identity in a way that would be expected in Western society. How can providers support them when dealing with having to share their identity in a Western way?</p>\n<p>2SLGBTQ+ refugee claimants arriving in Canada must navigate a complex claims process, which can be highly intrusive and traumatizing. Refugee claimants must prove they have a true fear of persecution based on their “membership” in a sexual and/or gender minority group (LaViolette, 2009) (Immigration and Refugee Board of Canada, 2020). As a result, claimants may feel pressured to come out publicly or to express their 2SLGBTQ+ identities in a way that would be expected in Western society (Kahn et al., 2017; Fernando, 2019). Ultimately, 2SLGBTQ+ refugee claimants are at higher risk of mental health problems and illnesses as a result of exposure to multiple sources of stress (Reading &amp; Rubin, 2011) (Messih, 2017). Nevertheless, many 2SLGBTQ+ newcomers exhibit exceptional strength and resilience, dealing with the daily challenges of victimization along with symptoms of mental health problems and illnesses (Alessi, 2016).</p>\n<h4 id=\"more-information-about-mental-health-among-2slgbtq-people\">More information about mental health among 2SLGBTQ+ people:</h4>\n<p><strong><a href=\"https://ontario.cmha.ca/documents/lesbian-gay-bisexual-trans-queer-identified-people-and-mental-health/\">Canadian Mental Health Association: LGBTQ identified People and Mental Health</a><a href=\"https://www.rainbowhealthontario.ca/\">Rainbow Health Ontario</a><a href=\"https://www.rainbowhealthontario.ca/wp-content/uploads/2015/01/Envisioning-Mental-Health-Sheet.pdf\">Mental Health Challenges for LGBT Asylum Seekers in Canada</a></strong></p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Comfort with 2SLGBTQ+-oriented organizations varies, and some migrants may avoid them.\"><h4>2SLGBTQ+ migrants may feel uncomfortable about associating with 2SLGBTQ+-oriented organizations.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n","words":668},{"id":"s61","mod":8,"title":"2SLGBTQ+ Newcomers: Considerations for Service Providers","html":"<p>2SLGBTQ+ individuals may delay or avoid seeking services because of their experiences of past discrimination or perceived homophobia in the health care system. Because 2SLGBTQ+ immigrants and refugees may have come to expect rejection in their lives, it may be helpful for providers to build an accepting, empowering and compassionate relationship with clients (Kahn et al., 2017).</p>\n<p>Awareness of a client's sexual orientation and gender identity is key to providing effective service. Some mental health concerns may be related to sexual orientation and/or gender identity issues, particularly those aspects linked to stigma, isolation, harassment and discrimination—all problems that are compounded for those who also have refugee status. However, 2SLGBTQ+ newcomers are often uncomfortable coming out about their gender and sexual identities when accessing services, and clinicians may be uncomfortable asking questions that would help clients disclose such information (Logie et al, 2016). As a result, these clients are often poorly served, with adverse consequences for their health.</p>\n<p>Some 2SLGBTQ+ clients may not want to disclose their sexual orientation with their health care provider as it might be something they don't see as important in identifying with the provider. However, they may still feel comfortable in the provider's presence.</p>\n<h4 id=\"factors-that-can-make-the-client-feel-comfortable-include\">Factors that can make the client feel comfortable include:</h4>\n<ul>\n<li><p>Feelings of safety</p></li>\n<li><p>Advertising of services in 2SLGBTQ+ publications and communities</p></li>\n<li><p>Attitudes among staff and other clients that are non-judgmental, non-heterosexist and non-genderist</p></li>\n<li><p>2SLGBTQ+-positive stickers and posters</p></li>\n<li><p>Use of non-biased, inclusive language</p></li>\n<li><p>Confidentiality</p></li>\n<li><p>Staff who are knowledgeable of 2SLGBTQ+-specific issues</p></li></ul>\n","words":263},{"id":"s62","mod":8,"title":"2SLGBTQ+ Newcomers: Support and Intervention Approaches","html":"<p>Emerging research shows that formal and informal support may help promote the well-being of 2SLGBTQ+ newcomers. Support groups for African and Caribbean 2SLGBTQ+ immigrants and refugees, for example, help reduce self-reported stigma about their sexual orientation, reduce social isolation, contribute to self-acceptance and provide strategies to deal with settlement challenges such as those related to housing, employment and health (Logie et al., 2016). Other studies show that social support is especially important for 2SLGBTQ+ refugees' sense of belonging because they may not receive support from their families or ethnocultural communities (Kahn, 2015).</p>\n<p>Social support that also helps meet 2SLGBTQ+ newcomers' concrete settlement needs such as housing, food or clothing, or with the refugee claims process, is recommended (Alessi, 2016). Without social ties, 2SLGBTQ+ newcomers may not achieve the stability and security or the knowledge of Canadian culture that helps with integration (Nematy et al, 2022; Ager &amp; Strang, 2008).</p>\n<p>2SLGBTQ+ persons may delay or avoid seeking services because of their experiences of past discrimination or perceived homophobia. Because 2SLGBTQ+ migrants may have come to expect rejection in their lives, it may be helpful for service providers, including settlement workers, to build an accepting, empowering and compassionate relationship with clients (Kahn et al., 2017).</p>\n<h5 id=\"we-encourage-service-providers-to-follow-these-recommendations-when-working-with-2slgbtq-refugees\">We encourage service providers to follow these recommendations when working with 2SLGBTQ+ refugees:</h5>\n<ul>\n<li><p>Avoid assumptions and develop a clear understanding of the individual's issues.</p></li>\n<li><p>Avoid imposing personal values and ideas on clients.</p></li>\n<li><p>Encourage clients to find community support.</p></li>\n<li><p>Advocate on clients' behalf as needed.</p></li>\n<li><p>Offer clients the same quality of services provided to anyone else, including access to services in multiple languages.</p></li>\n<li><p>Ensure confidentiality.</p></li>\n<li><p>Refer individuals to appropriate community organizations.</p></li></ul>\n<p>(Heartland Alliance, 2012; Canadian Council for Refugees [CCR], 2006)</p>\n<p>It is important to recognize that it takes time to establish a rapport with clients and that not all clients are motivated to fully engage with their provider.</p>\n<p>Increasing sources of resilience for 2SLGBTQ+ immigrants and refugees may include encouraging clients' connections with community organizations, relationships with significant others, reliance on religion and spirituality, and giving back to others (Alessi, 2016). Encouraging clients' affiliations with community organizations has been found to help improve their sources of resilience.</p>\n<h3 id=\"featured-resource\">Featured resource</h3>\n<p>The APA's practice guidelines include <a href=\"https://www.apa.org/about/policy/psychological-sexual-minority-persons.pdf\">Guidelines for Psychological Practice with Lesbian, Gay and Bisexual Clients.</a></p>\n","words":390},{"id":"s63","mod":8,"title":"Newcomers with Disabilities: Context and Lived Experiences","html":"<h5 id=\"often-invisible-overlooked-and-forgotten-people-with-disabilities-are-among-the-most-socially-excluded-isolated-and-marginalized-of-all-displaced-populations.\">Often invisible, overlooked and forgotten, people with disabilities are among the most socially excluded, isolated and marginalized of all displaced populations.</h5>\n<p>People with disabilities include <strong>“those who have long-term physical, mental, intellectual or sensory impairments which in interaction with various barriers may hinder their full and effective participation in society on an equal basis with others”</strong> (UN, 2006).</p>\n<h4 id=\"people-with-disabilities-face-several-categories-of-barriers\">People with disabilities face several categories of barriers:</h4>\n<h4 id=\"attitudinal\">Attitudinal</h4>\n<blockquote>\n<p>Behaviours, perceptions, and assumptions that discriminate against persons with disabilities</p>\n</blockquote>\n<h4 id=\"organizational-or-systemic\">Organizational or systemic</h4>\n<blockquote>\n<p>Policies, procedures, or practices that unfairly discriminate and can prevent individuals from participating fully in a situation</p>\n</blockquote>\n<h4 id=\"architectural-or-physical\">Architectural or physical</h4>\n<blockquote>\n<p>Elements of buildings or outdoor spaces that create barriers to persons with disabilities (e.g., the design of a building's stairs or doorways, or the width of halls and sidewalks)</p>\n</blockquote>\n<h4 id=\"information-or-communications\">Information or communications</h4>\n<blockquote>\n<p>When sensory disabilities, such as hearing, seeing or learning disabilities, have not been considered</p>\n</blockquote>\n<h4 id=\"technological\">Technological</h4>\n<blockquote>\n<p>When a device or technological platform is not accessible to its intended audience and cannot be used with an assistive device</p>\n<p>(Council of Ontario Universities, 2013) (Reid, 2020)</p>\n</blockquote>\n<p>In addition to these barriers, refugees living with disabilities are often worse off because their traditional support systems (i.e., extended family, neighbours and other caregivers) disintegrate during displacement. The loss of these caregivers, due to separation during the displacement journey, puts persons with disabilities at high risk of abuse and neglect. All too often, they experience stigma and discrimination and have limited or no access to health care and psychosocial support, leading to greater levels of isolation than other refugees' experience. Immigrant individuals with disabilities or families with children who have a disability also deal with a loss of social ties as result of migration to another country (Khanlou et al., 2015, 2017).</p>\n<p>While immigrants may generally have a greater support system than refugees, in some communities people attempt to hide their disabilities so they do not have a feeling of “otherness” or experience abuse or discrimination (Hansen et al., 2017). Support within the home is also sometimes not present as some immigrant parents of children with disabilities report a lack of support from their partners who withdraw from responsibilities as they deal with their own financial or emotional concerns (Khanlou et al., 2017).</p>\n<h5 id=\"some-disabilities-in-refugees-are-pre-existing-where-the-refugee-had-the-disability-prior-to-the-conflict-that-led-to-migration.-other-disabilities-are-directly-caused-or-exacerbated-by-the-refugee-experience-often-due-to\">Some disabilities in refugees are pre-existing, where the refugee had the disability prior to the conflict that led to migration. Other disabilities are directly caused or exacerbated by the refugee experience, often due to:</h5>\n<ul>\n<li><p>injury or trauma before or during the migration</p></li>\n<li><p>lack of access to quality medical services</p></li>\n<li><p>new barriers in the environment</p></li></ul>\n<p>(CDC, 2012) (Hameed, Sadiq, &amp; Din, 2018)</p>\n<p>Amendments to the Canadian Immigration and Refugee Protection Act in 2018 resulted in the increase of threshold cost amount (to three times the average Canadian per capita cost) for pre-existing medical conditions placing excessive demand on Canada's health and social services (Government of Canada, 2018). The grounds for inadmissibility do not apply to people being sponsored by their family, refugees and their dependents, or protected persons (Government of Canada, 2018). These temporary changes were made permanent in 2022 (Government of Canada, 2022).</p>\n<p>In 2017, the percentage of immigrant women aged 15 or older were more likely than immigrant men to report disabilities<br />\n<strong>(15.9% vs. 11.5%, respectively)</strong>.</p>\n<p>In addition, <strong>21.4%</strong> of recent immigrants in 2017 were persons with a disability (Statistics Canada, 2018).</p>\n<p>The percentage of immigrant men aged 15 and older in Canada, living with a disability was lower <strong>(17.7%)</strong> than that of non-immigrant men of the same age group living with a disability <strong>(21.4%)</strong>.</p>\n<p>Among recent immigrants, only <strong>6.8%</strong> of men were persons with a disability in 2017 (Statistics Canada, 2018).</p>\n<p>These extremely vulnerable refugees and immigrants need special attention as pressures around migration, acculturation and social relations may be more likely to affect their lives.</p>\n","words":629},{"id":"s64","mod":8,"title":"Newcomers with Disabilities: Mental Health Risks and Barriers","html":"<p>Resettlement is an especially difficult process for individuals living with disabilities. However, their access to resettlement resources is often particularly limited because of attitudinal barriers by society including service providers, as well as physical and social barriers. With limited awareness of disability rights and resources available to them in their new country, they often find their disability-related needs go unmet (Mirza &amp; Heinemann, 2012) (Tam, Smith-Carrier, Kwok, Kerr, &amp; Wang, 2021).</p>\n<p>Relocation to communities in Canada brings unique barriers, especially in terms of transportation requirements. Living in sprawling suburban areas where public transportation is limited or not accessible, and where alternative forms of transportation may be costly, can add further stress to their lives and increase isolation and mental health problems and illnesses (Hansen et al., 2017).</p>\n<p>Weather is also a factor, as many immigrants and refugees come from regions of the world where winter, snow and sleet are not a concern. Dealing with winter weather in Canada is difficult, especially when visually or physically impaired (Hansen et al., 2017).</p>\n<p>In addition to the barriers that all refugees and immigrants experience in finding employment, those with disabilities also faced huge social and attitudinal barriers to being hired: “Disabled persons' potential to contribute and participate is seldom recognized: they are more often seen as a problem than a resource” (Women's Commission for Refugee Women and Children [WCRWC], 2008) (Tam, Smith-Carrier, Kwok, Kerr, &amp; Wang, 2021).</p>\n","words":253},{"id":"s65","mod":8,"title":"Newcomers with Disabilities: Considerations for Service Providers","html":"<p>When screening and assessing refugees with disabilities, it is important to consider the perspective of the client, the family and the culture. In some countries, the labels “handicapped,” “differently-abled,” “crippled” and “victim” carry a great deal of stigma, so people may not feel comfortable identifying themselves or a family member as having a disability (Women's Commission for Refugee Women and Children, 2008). It is therefore important to consider the terminology used.</p>\n<p>Refugees and immigrants with disabilities often present with complex physical and mental health needs that are likely to cause significant dysfunction, like further isolation, physical health requirements and emotional distress, if proper medical care is not provided.</p>\n<p>Providing appropriate and timely information to refugees or immigrants about disabilities and the supports available to them in Canada for themselves or their children can help reduce delays in accessing services (Khanlou et al., 2015, 2017; Lindsay et al., 2012). By examining the unique values and beliefs of clients and their families and helping individuals to understand and cope with their disabilities, professionals can support better outcomes and increase mental well-being (Daudji et al., 2011).</p>\n<p>Where possible, providers should connect clients with local community-based agencies that can reduce social isolation. Providers should also provide access to other services such as vocational counselling and rehabilitation planning, job training, recreation and education. They can support their clients by being aware of local disability and rehabilitation services in their area.</p>\n<h5 id=\"here-are-some-categories-of-the-types-of-services-offered-to-people-with-disabilities\">Here are some categories of the types of services offered to people with disabilities:</h5>\n<ul>\n<li><p>Advocacy</p></li>\n<li><p>Financial assistance</p></li>\n<li><p>Youth with disabilities services</p></li>\n<li><p>Health and developmental disabilities</p></li>\n<li><p>Home support programs</p></li>\n<li><p>Disability associations</p></li>\n<li><p>Learning disabilities programs</p></li>\n<li><p>Transportation for people with disabilities</p></li>\n<li><p>Meals for people with disabilities</p></li></ul>\n<h3 id=\"disability-andor-rehabilitation-services-by-province-and-territory.\">Disability and/or rehabilitation services by province and territory.</h3>\n<p><a href=\"https://www2.gov.bc.ca/gov/content/family-social-supports/services-for-people-with-disabilities\">BC</a><a href=\"https://yukon.ca/en/health-and-wellness/care-services/find-services-if-you-have-disability\">YK</a><a href=\"https://www.hss.gov.nt.ca/en/services/services-persons-disabilities#:~:text=The%20Inventory%20of%20Programs%20and%20Services%20for%20Persons%20with%20Disabilities\">NWT</a><a href=\"https://www.saskatchewan.ca/residents/family-and-social-support/people-with-disabilities\">SK</a><a href=\"https://www.gov.mb.ca/fs/manitobasupports/index.html\">MB</a><a href=\"https://www.alberta.ca/disability-supports.aspx\">AB</a><a href=\"https://www.ontario.ca/page/people-disabilities\">ON</a><a href=\"https://www2.gnb.ca/content/gnb/en/departments/social_development/persons_disabilities.html\">NB</a><a href=\"https://novascotia.ca/coms/disabilities/\">NS</a><a href=\"https://nuability.ca/\">NT</a><a href=\"https://www.princeedwardisland.ca/en/topic/support-for-people-with-disabilities\">PEI</a><a href=\"https://www.gov.nl.ca/hcs/rewrite.php?rewrite_uri=health/personsdisabilities/\">NL</a></p>\n","words":298},{"id":"s66","mod":8,"title":"Providing Appropriate Support to Newcomers with Disabilities","html":"<h5 id=\"literature-on-the-mental-health-needs-of-refugees-and-immigrants-with-disabilities-is-limited.-what-we-can-recommend-from-the-available-information-is-that-service-providers-working-with-these-groups-should\">Literature on the mental health needs of refugees and immigrants with disabilities is limited. What we can recommend from the available information is that service providers working with these groups should:</h5>\n<ul>\n<li><p>Promote greater respect and understanding of the needs of refugees and immigrants living with disabilities</p></li>\n<li><p>Facilitate full and equal access to services</p></li>\n<li><p>Provide programs and services, such as support groups and case management, which are targeted and culturally appropriate or safe for individuals</p></li>\n<li><p>Work to improve access to information</p></li></ul>\n<p>(Women's Commission for Refugee Women and Children, 2008)</p>\n<p>It is important for providers who assist immigrant and refugees who are living with disabilities or their family members to recognize and support the rights of these individuals (Lindsay et al., 2012). Many newcomers are unfamiliar with the system and may not feel they can obtain the support they need on their own. Service providers may need to collaborate with other agencies and connect immigrants and refugees living with disabilities to other resources to support their rights and help them access, navigate and understand these services (Lindsay et al., 2012).</p>\n","words":203},{"id":"s67","mod":8,"title":"Module Recap and Key Takeaways","html":"<p>Module 6 described the challenges particular populations of immigrants and refugees face in their settlement or resettlement in Canada, and how these challenges can affect their mental health. This module further emphasized how various factors can affect the mental health of immigrant and refugee older adults, survivors of torture, 2SLGBTQ+ and persons living with disabilities, and explored service considerations related to newcomers' needs, as well as potential interventions. Developing knowledge and awareness of these risk factors can promote understanding of the needs of newcomers and how to provide effective assessment and treatment practices related to counselling and case management.</p>\n","words":105},{"id":"s68","mod":8,"title":"References and Further Reading","html":"<h3 id=\"older-adults\">5.1 - Older adults</h3>\n<ul>\n<li><p>Canadian Institute for Health Information. Canadian seniors and mental health (video). Accessed April 25, 2023.</p></li>\n<li><p>Chen, F., Lai, G. Y., &amp; Yang  L., Horne, J., MacMillan, H. L., &amp; Lai, D. W. L. 2007. Violence Across the Lifespan: Interconnections Among Forms of Abuse as Described by Marginalized Canadian Elders and their Care-givers. British Journal of Social Work, 373, 491–514. https://doi.org/10.1093/bjsw/bcm022</p></li>\n<li><p>Wu, Z., &amp; Penning, M. J. 2015. Immigration and loneliness in later life. Ageing &amp; Society, 351, 64–95. https://doi.org/10.1017/s0144686x13000470</p></li>\n</ul>\n<h3 id=\"survivors-of-torture\">5.2 — Survivors of torture</h3>\n<ul>\n<li><p>de C Williams, A. C., &amp; van der Merwe, J. (2013). <em>The psychological impact of torture.</em> British journal of pain, 7(2), 101-106.</p></li>\n<li><p>International Rehabilitation Council for Torture Victims. (2009). <em>Psychological Evaluation of Torture Allegations: A practical guide to the Istanbul Protocol - for psychologists.</em> Copenhagen: International Rehabilitation Council for Torture Victims (IRCT). Retrieved from <a href=\"https://irct.org/assets/uploads/pdf_20161120165022.pdf\" class=\"uri\">https://irct.org/assets/uploads/pdf_20161120165022.pdf</a></p></li>\n<li><p>Kienzler, H., &amp; Sapkota, R. P. (2019). <em>The Long-Term Mental Health Consequences of Torture, Loss, and Insecurity: A Qualitative Study Among Survivors of Armed Conflict in the Dang District of Nepal.</em> Frontiers in psychiatry, 10, 941-941.</p></li>\n<li><p>Madrid, P. A. (2021, March 15). <em>Torture Survivors: A Mental Health Provider's Guide to Conducting Evaluations.</em> Retrieved from Psycom Pro: <a href=\"https://pro.psycom.net/special_reports/trauma-survivors-ptsd-treatment-approaches/evaluating-victims-of-torture\" class=\"uri\">https://pro.psycom.net/special_reports/trauma-survivors-ptsd-treatment-approaches/evaluating-victims-of-torture</a></p></li>\n<li><p>Pérez-Sales. (2020). <em>Impact of the COVID-19 pandemic on work with torture survivors: Clinical and community perspectives.</em> Journal on Rehabilitation of Torture Victims an ights_lgbti-droits_lgbti.aspx?lang=eng</a></p></li>\n<li><p>Heartland Alliance for Human Needs &amp; Human Rights. (2012). <em>Rainbow Response: A Practical Guide to Resettling LGBT Refugees and Asylees.</em> Chicago: Heartland Alliance.</p></li>\n<li><p>Heartland Alliance for Human Needs &amp; Human Rights. (2013). <em>A Rainbow Retrospective: Reflection on Best Practices and Successes From the Field.</em> Chicago: Heartland Alliance.</p></li>\n<li><p>Immigration and Refugee Board of Canada. (2020, December 30). <em>Interpretation of Convention Refugee and Person in Need of Protection in the Case Law: Chapter 5 - Well-founded fear.</em> Retrieved from Immigration and Refugee Board of Canada: https://irb.gc.ca/en/legal-policy/legal-concepts/Pages/RefDef05.aspx</p></li>\n<li><p>Immigration and Refugee Board of Canada. (2021, December 17). <em>Guideline 9: Proceedings Before the IRB Involving Sexual Orientation, Gender Identity and Expression, and Sex Characteristics.</em> Retrieved from Immigration and Refugee Board of Canada: https://irb-cisr.gc.ca/en/legal-policy/policies/Pages/GuideDir09.aspx</p></li>\n<li><p>Immigration, Refugees and Citizenship Canada. (2019, June 01). <em>Canada announces new initiative to support LGBTQ2 refugees.</em> Retrieved from Government of Canada: <a href=\"https://www.canada.ca/en/immigration-refugees-citizenship/news/2019/06/canada-announces-new-initiative-to-support-lgbtq2-refugees.html\" class=\"uri\">https://www.canada.ca/en/immigration-refugees-citizenship/news/2019/06/canada-announces-new-initiative-to-support-lgbtq2-refugees.html</a></p></li>\n<li><p>International Lesbian, Gay, Bisexual, Trans and Intersex Association. (2019). <em>State-Sponsored Homophobia.</em> Geneva: ILGA.</p></li>\n<li><p>Logie et al. (2016). <em>“It's for us - newcomers, LGBTQ persons, and HIV-positive persons. You feel free to be”: a qualitative study exploring social support group participation among African and Caribbean lesbian, gay, bisexual and transgender newcomers and refugees in Toronto, .</em> BMC Int Health Hum Rights.</p></li>\n<li><p>Messih, M. (2017). <em>Mental Health in LGBT Refugee Populations.</em> The American Journal of Psychiatry Residents' Journal, 11(7), 5-7.</p></li>\n<li><p>Molnar. (2018). <em>LGBTQ2+ refugees in Canada.</em> The Canadian Encyclopedia.</p></li>\n</ul>\n<h3 id=\"people-living-with-disabilities\">5.4 — People living with disabilities</h3>\n<ul>\n<li><p>Hameed, S., Sadiq, A., &amp; Din, A. U. (2018). <em>The Increased Vulnerability of Refugee Populations to Mental Health Disorders.</em> Kansas journal of medicine, 11(1), 20.</p></li>\n<li><p>Reid, B. E. (2020). <em>Internet architecture and disability.</em> Indiana Law Journal, 95, 591.</p></li>\n<li><p>Tam, D. M., Smith-Carrier, T., Kwok, S. M., Kerr, D., &amp; Wang, J. (2021). <em>Challenges Encountered by Newcomers with Disabilities in Canada: An Illustration of the Ontario Disability Support Program.</em> Canadian journal of disability studies, 10(3), 119-146.</p></li>\n<li><p>Government of Canada. (2018). <em>Temporary Public Policy Excessive Demand on Health and Social Services.</em> Ottawa, June 1, 2018. Retrieved from: <a href=\"https://www.canada.ca/en/immigration-refugees-citizenship/corporate/mandate/policies-operational-instructions-agreements/excessive-demand-june-2018.html\" class=\"uri\">https://www.canada.ca/en/immigration-refugees-citizenship/corporate/mandate/policies-operational-instructions-agreements/excessive-demand-june-2018.html</a></p></li>\n<li><p>Government of Canada. (2022). <em>Regulations Amending the Immigration and Refugee Protection Regulations (Excessive Demand): SOR/2022-39.</em> Canadian Gazette, Part II, 156(6). Retrieved from: <a href=\"https://www.gazette.gc.ca/rp-pr/p2/2022/2022-03-16/html/sor-dors39-eng.html\" class=\"uri\">https://www.gazette.gc.ca/rp-pr/p2/2022/2022-03-16/html/sor-dors39-eng.html</a></p></li>\n<li><p>Hansen, S., Wilton, R.D., &amp; Newbold, K.B. (2017). <em>'There is al
