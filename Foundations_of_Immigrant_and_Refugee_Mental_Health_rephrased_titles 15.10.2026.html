4; Nishimura et al., 2005; Broman et al., 2006; Duff et al, 2011; Lui &amp; Zamboanga, 2019). White youth report higher levels of substance use compared to other ethnocultural groups, with Chinese-born youth exhibiting the lowest level of consumption (Duff et al., 2011).</p>\n<p>In general, Canadian-born youth report higher substance use than foreign-born youth (Ibid.), however the risk of developing substance use disorders increases with time spent in Canada and level of acculturation. The risk for substance use is lower for first-generation immigrant youth compared to second-and third-generation immigrant youth (Korczak, 2015).</p>\n<div class=\"wide\"><h2>Match the description to the concept</h2><p>Choose the term that fits each description.</p><div class=\"mcq\" data-fb=\"Depression that starts in pregnancy or after birth is postpartum (peripartum) depression.\"><h4>A depression that may start during pregnancy or at any time up to a year after the birth of a child.</h4><button class=\"opt\" data-ok=\"1\">Postpartum depression</button><button class=\"opt\">PTSD</button><button class=\"opt\">Schizophrenia</button><button class=\"opt\">Anxiety disorder</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"This describes posttraumatic stress disorder (PTSD).\"><h4>A trauma- and stressor-related disorder that occurs after a person has been exposed to actual or threatened death, serious injury or sexual violence.</h4><button class=\"opt\">Postpartum depression</button><button class=\"opt\" data-ok=\"1\">PTSD</button><button class=\"opt\">Schizophrenia</button><button class=\"opt\">Anxiety disorder</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Hallucinations and delusions are core features of schizophrenia and other psychotic disorders.\"><h4>A complex mental illness that affects how a person thinks, feels, behaves and relates to others. A person may experience hallucinations and delusions.</h4><button class=\"opt\">Postpartum depression</button><button class=\"opt\">PTSD</button><button class=\"opt\" data-ok=\"1\">Schizophrenia</button><button class=\"opt\">Anxiety disorder</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"Anxiety disorders are a group of conditions that share excessive fear and anxiety.\"><h4>Several disorders that share features of excessive fear and anxiety.</h4><button class=\"opt\">Postpartum depression</button><button class=\"opt\">PTSD</button><button class=\"opt\">Schizophrenia</button><button class=\"opt\" data-ok=\"1\">Anxiety disorder</button><div class=\"fb\"></div></div></div>","words":406},{"id":"s27","mod":2,"title":"Module Recap and Key Takeaways","html":"<p>This module provided a brief introduction to the six most common mental disorders experienced by immigrants and refugees, including the symptoms and prevalence rates among the general and newcomer populations. The module also explored best practices and tools for assessing the disorders.</p>\n<p>Immigrants and refugees have higher incidence rates than the general population for some mental disorders, while for other disorders there is no significant difference in rates between newcomers and the general population. Deeper analysis shows that specific immigrant subgroups have higher incidence rates of certain disorders (e.g., schizophrenia) than both fellow migrants from other regions and the general population. Such variability demonstrates the need to consider the differences within the immigrant and refugee population and their experiences of mental health problems and illness. This further emphasizes how a one-size-fits-all approach to mental health care and support cannot work.</p>\n<p>The next module looks at health equity, anti-racism and anti-oppression, which underpin the population-focused modules that follow.</p>\n","words":163},{"id":"s28","mod":2,"title":"References and Further Reading","html":"<h4 id=\"understanding-mental-health-and-mental-illness\">2.1 — Understanding mental health and mental illness</h4>\n<ul>\n<li><p>American Psychiatric Association (APA). (2000). Diagnostic and Statistical Manual of Mental Disorders, 4th ed.,DSM-IV-TR. Washington, DC: American Psychiatric Association.</p></li>\n<li><p>American Psychiatric Association APA. 2013a. Diagnostic and statistical manual of mental disorders 5th ed. DSM-5. Washington, DC: Author.</p></li>\n<li><p>Anderson, K. K., Cheng, J., Susser, E., McKenzie, K. J., &amp; Kurdyak, P. 2015. Incidence of psychotic disorders among first-generation immigrants and refugees in Ontario. Canadian Medical Association Journal CMAJ, 1879, E279–E286. https://doi.org/10.1503/cmaj.141420</p></li>\n<li><p>Blackmore, R., Boyle, J. A., Fazel, M., Ranasinha, S., Gray, K. M., Fitzgerald, G., Misso, M., &amp; Gibson-Helm, M. 2020. The prevalence of mental illness in refugees and asylum seekers: A systematic review and meta-analysis. PLoS Medicine, 179, e1003337–e1003337. https://doi.org/10.1371/journal.pmed.1003337</p></li>\n<li><p>Brandt, L., Henssler, J., Müller, M., Wall, S., Gabel, D., &amp; Heinz, A. 2019. Risk of Psychosis Among Refugees: A Systematic Review and Meta-analysis. JAMA Psychiatry, 7611, 1133 - 1140.</p></li>\n<li><p>Ciaramella, M., Monacelli, N., &amp; Cocimano, L. C. E. 2022. Promotion of Resilience in Migrants: A Systematic Review of Study and Psychosocial Intervention. Journal of Immigrant and Minority Health, 245, 1328–1344. https://doi.org/10.1007/s10903-021-01247-y</p></li>\n<li><p>CMHA. 2020, January 13. Mental health: What is it, really? Retrieved from Canadian Mental Health Association, National: https://cmha.ca/mental-health-what-is-it-really/</p></li>\n<li><p>Durbin , A., Lin, E., Taylor, L., &amp; Callaghan, R. C. 2011. First-generation immigrants and hospital admission rates for psychosis and affective disorders: an ecological study in Ontario. Canadian Journal of Psychiatry, 567, 418-426.</p></li>\n<li><p>Hollander, A.-C., Dal, H., Lewis, G., Magnusson, C., Kirkbride, J. B., &amp; Dalman, C. 2016. Refugee migration and risk of schizophrenia and other non-affective psychoses: cohort study of 1.3 million people in Sweden. BMJ Online, 352, i1030–i1030. https://doi.org/10.1136/bmj.i1030</p></li>\n<li><p>Kirmayer, L. J., Narasiah, L., Munoz, M., Rashid, M., Ryder, A. G., Guzder, J., Hassan, G., Rousseau, C., &amp; Pottie, K. 2011. Common mental health problems in immigrants and refugees: general approach in primary care. Canadian Medical Association Journal, 18312, E959–E967. https://doi.org/10.1503/cmaj.090294</p></li>\n<li><p>Kroll, J., Yusuf, A. I., &amp; Fujiwara, K. 2011. Psychoses, PTSD, and depression in Somali refugees in Minnesota. Social Psychiatry and Psychiatric Epidemiology, 466, 481–493. https://doi.org/10.1007/s00127-010-0216-0</p></li>\n<li><p>Parrett, N. S., &amp; Mason, O. J. 2010. Refugees and psychosis: A review of the literature. Psychosis, 22, 111–121. https://doi.org/10.1080/17522430903219196</p></li>\n<li><p>Pashang, S., Biazar, B., Payne, D. E., &amp; Kaya, Z. 2018. Teaching English as an Additional Language EAL to Refugees: Trauma and Resilience. In Today’s Youth and Mental Health pp. 359–378. Springer International Publishing. https://doi.org/10.1007/978-3-319-64838-5_20</p></li>\n<li><p>Public Health Agency of Canada. 2022, June 3. Mental Illness. Canada.ca. https://www.canada.ca/en/public-health/services/chronic-diseases/mental-illness.html</p></li>\n<li><p>Satici, S. A. 2016. Psychological vulnerability, resilience, and subjective well-being: The mediating role of hope. Personality and Individual Differences, 102, 68–73. https://doi.org/10.1016/j.paid.2016.06.057</p></li>\n<li><p>Shapiro, E., Valdez, F. A., Bailey, Y., Furtado, G., Lamothe, D., Mohammad, K., Pierre, M., &amp; Wood, N. 2019. Teaching health and human rights in a psychology capstone: Cultivating connections between rights, personal wellness, and social justice. In Interdisciplinary Approaches to Human Rights 1st ed., pp. 312–330. Routledge. https://doi.org/10.4324/9781351058438-20</p></li>\n<li><p>Turrini, G., Purgato, M., Ballette, F., Nosè, M., Ostuzzi, G., &amp; Barbui, C. 2017. Common mental disorders in asylum seekers and refugees: Umbrella review of prevalence and intervention studies. International Journal of Mental Health Systems, 111, 51–51. https://doi.org/10.1186/s13033-017-0156-0</p></li>\n<li><p>WHO. 2018, March 30. Mental health: strengthening our response. Retrieved from World Health Organization: https://www.who.int/news-room/fact-sheets/detail/mental-health-strengthening-our-respons</p></li>\n</ul>\n<h4 id=\"common-mental-disorders\">2.2 — Common mental disorders</h4>\n<ul>\n<li><p>Agic, B., Mann, R. E., Tuck, A., Ialomiteanu, A., Bondy, S., Simich, L., &amp; Ilie, G. 2016. Alcohol use among immigrants in Ontario, Canada. Drug and Alcohol Review, 352, 196–205. https://doi.org/10.1111/dar.12250</p></li>\n<li><p>Aglipay M, Colman I, Chen Y. Does the healthy immigrant effect extend to anxiety disorders? Evidence from a nationally representative study. J Immigr Minor Health. 2013 Oct;155:851-7. doi: 10.1007/s10903-012-9677-4. PMID: 22797950.</p></li>\n<li><p>American Psychiatric Association (APA). (2013). Diagnostic and Statistical Manual of Mental Disorders, Fifth Edition. Arlington, V.A: American Psychiatric Association.</p></li>\n<li><p>American Psychiatric Association (APA). (2017a). What are anxiety disorders? Available: www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders.</p></li>\n<li><p>American Psychiatric Association. 2013. Cultural Formulation Interview CFI: Supplementary modules used to expand each CFI subtopic are noted in parentheses. Retrieved from American Psychiatric Association: https://www.psychiatry.org/File%20Library/Psychiatrists/Practice/DSM/APA_DSM5_Cultural-Formulation-Interview.pdf</p></li>\n<li><p>Anjara, S. G., Bonetto, C., Van Bortel, T., &amp; Brayne, C. 2020. Using the GHQ-12 to screen for mental health problems among primary care patients: Psychometrics and practical considerations. International Journal of Mental Health Systems, 141, 62–62. https://doi.org/10.1186/s13033-020-00397-0</p></li>\n<li><p>Bogic, M., Njoku, A., &amp; Priebe, S. 2015. Long-term mental health of war-refugees: a systematic literature review. BMC International Health and Human Rights, 151, 29–29. https://doi.org/10.1186/s12914-015-0064-9</p></li>\n<li><p>Broman, C. L., Reckase, M. D., &amp; Freedman-Doan, C. R. 2006. The Role of Parenting in Drug Use Among Black, Latino and White Adolescents. Journal of Ethnicity in Substance Abuse, 51, 39–50. https://doi.org/10.1300/J233v05n01_03</p></li>\n<li><p>Canadian Mental Health Association . n.d.. Understanding Anxiety . Retrieved from https://windsoressex.cmha.ca/wp-content/uploads/2016/11/CMHA-Understanding-Anxiety-handout.pdf.</p></li>\n<li><p>Caring for Kids New to Canada - Substance Use and Immigrant Youth. n.d.. https://kidsnewtocanada.ca/mental-health/substance-use</p></li>\n<li><p>Cécile Rousseau, Kevin Pottie, Brett D. Thombs, Marie Munoz, Tomas Jurcik.(2011).Post traumatic stress disorder: evidence review for newly arriving immigrants and refugees . Available: https://www.cmaj.ca/content/suppl/2010/06/07/cmaj.090313.DC1/imm-ptsd-11-at.pdf</p></li>\n<li><p>Close, C., Kouvonen, A., Bosqui, T., Patel, K., O’Reilly, D., &amp; Donnelly, M. 2016. The mental health and wellbeing of first generation migrants: A systematic-narrative review of reviews. Globalization and Health, 121, 47–47. https://doi.org/10.1186/s12992-016-0187-2</p></li>\n<li><p>Duff, C., Puri, A. K., &amp; Chow, C. 2011. Ethno-Cultural Differences in the Use of Alcohol and Other Drugs: Evidence from the Vancouver Youth Drug Reporting System. Journal of Ethnicity in Substance Abuse, 101, 2–23. https://doi.org/10.1080/15332640.2011.547791</p></li>\n<li><p>Edward, N., &amp; Haozhen, Z. 2020. The mental health of immigrants and refugees: Canadian evidence from a nationally linked database. Retrieved from The mental health of immigrants and refugees: Canadian evidence from a nationally linked database: https://www150.statcan.gc.ca/n1/pub/82-003-x/2020008/article/00001-eng.htm</p></li>\n<li><p>Ellickson, P. L., Martino, S. C., &amp; Collins, R. L. 2004. Marijuana Use From Adolescence to Young Adulthood: Multiple Developmental Trajectories and Their Associated Outcomes. Health Psychology, 233, 299–307. https://doi.org/10.1037/0278-6133.23.3.299</p></li>\n<li><p>Evra, R., &amp; Mongrain, E. 2020, July 14. Mental Health Status of Canadian Immigrants During the COVID-19 Pandemic. Retrieved from Mental Health Status of Canadian Immigrants During the COVID-19 Pandemic: https://www150.statcan.gc.ca/n1/pub/45-28-0001/2020001/article/00050-eng.htm</p></li>\n<li><p>Goldberg, D. P. 1988. User's guide to the General Health Questionnaire. Windsor.</p></li>\n<li><p>Goldberg, D. P., &amp; Hillier, V. F. 1979. A scaled version of the General Health Questionnaire. Psychological medicine, 91, 139-145.</p></li>\n<li><p>Henkelmann et al. 2020. Anxiety, depression and post-traumatic stress disorder in refugees resettling in high-income countries: systematic review and meta-analysis. BJPsych .</p></li>\n<li><p>Hinton DE, Lewis-Fernández R. The cross-cultural validity of posttraumatic stress disorder: implications for DSM-5. Depress Anxiety. 2011 Sep;28(9):783-801. Kirmayer LJ, Ryder AG. Culture and psychopathology. Curr Opin Psychol. 2016 Apr;8:143-148. doi: 10.1016/j.copsyc.2015.10.020. Epub 2015 Dec 17. PMID: 29506790.</p></li>\n<li><p>Hinton, D. E., &amp; Lewis-Fernández, R. 2010. Idioms of Distress Among Trauma Survivors: Subtypes and Clinical Utility. Culture, Medicine and Psychiatry, 342, 209–218. https://doi.org/10.1007/s11013-010-9175-x</p></li>\n<li><p>Hofmann, S. G., &amp; Hinton, D. E. 2014. Cross-Cultural Aspects of Anxiety Disorders. Current Psychiatry Reports, 166. https://doi.org/10.1007/s11920-014-0450-3</p></li>\n<li><p>Islam, F., Khanlou, N., &amp; Tamim, H. 2014. South Asian populations in Canada: Migration and mental health. BMC Psychiatry, 141, 154–154. https://doi.org/10.1186/1471-244X-14-154</p></li>\n<li><p>J.L. Rodriguez, E.A. Meadows. 2012. Anxiety Disorder. Encyclopedia of Human Behavior (Second Edition). Available: https://www.sciencedirect.com/topics/pharmacology-toxicology-and-pharmaceutical-science/anxiety-disorder</p></li>\n<li><p>Kirmayer, L. J., &amp; Ryder, A. G. 2016. Culture and psychopathology. Current Opinion in Psychology, 8, 143–148. https://doi.org/10.1016/j.copsyc.2015.10.020</p></li>\n<li><p>Kirmayer, L. J., Narasiah, L., Munoz, M., Rashid, M., Ryder, A. G., Guzder, J., Hassan, G., Rousseau, C., &amp; Pottie, K. 2011. Common mental health problems in immigrants and refugees: general approach in primary care. Canadian Medical Association Journal, 18312, E959–E967. https://doi.org/10.1503/cmaj.090295</p></li>\n<li><p>Lindert, J., Ehrenstein, O. S. von, Priebe, S., Mielck, A., &amp; Brähler, E. 2009. Depression and anxiety in labor migrants and refugees – A systematic review and meta-analysis. Social Science &amp; Medicine 1982, 692, 246–257. https://doi.org/10.1016/j.socscimed.2009.04.032</p></li>\n<li><p>Lui, P. P., &amp; Zamboanga, B. L. 2019. Ethnocultural Diversity in Alcohol Use and Misuse. American Journal of Orthopsychiatry, 895, 543–548. https://doi.org/10.1037/ort0000422</p></li>\n<li><p>McKenzie, K., Hansson, E., Tuck, A., &amp; Lurie, S. (2010). IMPROVING MENTAL HEALTH SERVICES FOR IMMIGRANT, REFUGEE, ETHNO-CULTURAL AND RACIALIZED GROUPS. Canadian Issues (Association for Canadian Studies : 1999), 65–.</p></li>\n<li><p>National Institute of Mental Health. 2019. Post-Traumatic Stress Disorder. Retrieved from Post-Traumatic Stress Disorder: https://www.nimh.nih.gov/health/topics/post-traumatic-stress-disorder-ptsd</p></li>\n<li><p>Nishimura, S. T., Hishinuma, E. S., Else, ’Iwalani R. N, Goebert, D. A., &amp; Andrade, N. N. 2005. Ethnicity and Adolescent Substance Use. Cultural Diversity &amp; Ethnic Minority Psychology, 113, 239–258. https://doi.org/10.1037/1099-9809.11.3.239</p></li>\n<li><p>Perreira, K. M., &amp; Ornelas, I. 2013. Painful Passages: Traumatic Experiences and Post-Traumatic Stress among U.S. Immigrant Latino Adolescents and their Primary Caregivers. The International Migration Review, 474, 976–1005. https://doi.org/10.1111/imre.12050</p></li>\n<li><p>Porter, M., &amp; Haslam, N. 2005. Predisplacement and Postdisplacement Factors Associated With Mental Health of Refugees and Internally Displaced Persons: A Meta-analysis. JAMA : the Journal of the American Medical Association, 2945, 602–612. https://doi.org/10.1001/jama.294.5.602</p></li>\n<li><p>Pottie, K., Greenaway, C., Feightner, J., Welch, V., Swinkels, H., Rashid, M., Narasiah, L., Kirmayer, L. J., Ueffing, E., MacDonald, N. E., Hassan, G., McNally, M., Khan, K., Buhrmann, R., Dunn, S., Dominic, A., McCarthy, A. E., Gagnon, A. J., Rousseau, C., … Blake, J. 2011. Evidence-based clinical guidelines for immigrants and refugees. Canadian Medical Association Journal CMAJ, 18312, E824–E925. https://doi.org/10.1503/cmaj.090313</p></li>\n<li><p>Ru, S., &amp; Li, Y. 2021. Differences in Substance Use Among Immigrants and the Canadian-Born Population. Canadian Studies in Population, 335-359.</p></li>\n<li><p>Ryder , A. G., &amp; Kirmayer , L. J. 2016. Culture and psychopathology. Current Opinion in Psychology, 143-148.</p></li>\n<li><p>Salas-Wright, C., &amp; Vaughn, M. G. 2014. A \"Refugee Paradox\" for substance use disorders? Drug and Alcohol Depedence, 345-349.</p></li>\n<li><p>Werneke, U., Goldberg, D. P., Yalcin, I., &amp; Üstün, B. T. 2000. The stability of the factor structure of the General Health Questionnaire. Psychological medicine, 4, 823-829.</p></li>\n<li><p>What are Anxiety Disorders? (2023). https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders</p></li>\n<li><p>What is Posttraumatic Stress Disorder (PTSD)? (2022). https://www.psychiatry.org/patients-families/ptsd/what-is-ptsd</p></li>\n</ul>\n\n","words":1560},{"id":"s82","mod":3,"title":"Module Overview and Learning Focus","html":"<p>The Canadian population will continue to change due to immigration. Service providers will keep working with immigrants and refugees from different races, cultures and ethnic backgrounds. Newcomers rely on care providers to connect them to essential social services and meet their health needs. However, there is an inherent power differential between immigrant and refugee service users and care providers. In this relationship, the care provider is often seen as the expert with authority. Module 3 explores how working with different populations requires those offering services to be reflective about their work and examine their power and privilege in the relationship (Clarke &amp; Wan, 2019) so they can deliver care and support in a way that further enhances the settlement and integration of newcomers to Canada.</p>\n<h5 id=\"this-module-has-four-sections\">This module has four sections:</h5>\n<ol type=\"1\">\n<li><p>Health equity</p></li>\n<li><p>Anti-racism</p></li>\n<li><p>Intersecting identities</p></li>\n<li><p>Allyship and solidarity</p></li></ol>\n<h5 id=\"at-the-end-of-this-module-you-will-be-able-to\">At the end of this module you will be able to</h5>\n<ul>\n<li><p>Define health equity and explain the importance of recognizing the diverse needs of immigrants and refugees to reduce health inequities.</p></li>\n<li><p>Discuss the different levels and forms of racism and its effect on mental health for new immigrants and refugees.</p></li>\n<li><p>Explain anti-Black racism and its impacts on mental health.</p></li>\n<li><p>Define bias and the role of implicit bias in racism.</p></li>\n<li><p>Identify possible ways of adopting an anti-racist approach and following the anti-oppression framework for improvising the mental health of immigrants and refugees.</p></li>\n<li><p>Define intersectionality and explain how intersecting identities can contribute to multiple levels of oppression for immigrants and refugees.</p></li>\n<li><p>Explain why the intersectional model is important for improving the mental health of immigrants and refugees.</p></li>\n<li><p>Describe cultural humility and discuss the key elements care providers need to focus on while treating people from different cultures.</p></li>\n<li><p>Define allyship and explain how care providers can use it to dismantle racism.</p></li>\n</ul>\n","words":300},{"id":"s83","mod":3,"title":"Understanding Health Equity","html":"<p>Health equity means all people have the opportunity to reach their fullest health potential and are not deprived from achieving it because of their race, religion, social class, age, socioeconomic status or other socially determined circumstances (National Collaborating Centre for Determinants of Health, 2013; Whitehead &amp; Dahlgren, 2006).</p>\n<p>At the core of health equity are the principles of ethics, human rights and social justice (Braveman et al., 2011; Ministry of Health and Long Term Care [MOHLTC], 2012). “It involves the fair distribution of resources needed for health, fair access to the opportunities available, and fairness in the support offered to people when ill”(Whitehead &amp; Dahlgren, 2006 p.5).</p>\n<p>Health inequities are differences in health status or in the distribution of health resources between different population groups, arising from the social conditions in which people are born, grow, live, work and age (Whitehead &amp; Dahlgren, 2006; Canadian Public Health Association, 2021). These differences in health are “systemic, patterned, unfair, unjust, and actionable, as opposed to random or caused by those who become ill” (Whitehead, 1992).</p>\n<p>Uneven access to the social determinants of health are the contributing factors to health inequities among sub-populations. Reducing disparities in health requires an understanding of what causes these disparities along with what immigrants and refugees need to settle, integrate and thrive effectively.</p>\n<p>When delivering mental health or settlement programs for newcomers, it is essential that they do not exacerbate inequities. Programs can have a positive or negative effect on the health of vulnerable or marginalized communities.</p>\n<h5 id=\"health-care-providers-should-ask-these-important-questions\">Health care providers should ask these important questions:</h5>\n<ul>\n<li><p>How does the social service or intervention I am providing affect health equity for immigrants and refugees?</p></li>\n<li><p>Will there be differential impacts? Will some clients have different access to care, or overall health outcomes, than others?</p></li>\n<li><p>Will other marginalized communities or segments of newcomers experience unintended impacts of this program or intervention?</p></li></ul>\n<p>(MOHLTC, 2012)</p>\n<h5 id=\"some-key-considerations-for-ensuring-that-programs-and-policies-are-equitable-include\">Some key considerations for ensuring that programs and policies are equitable include:</h5>\n<ul>\n<li><p>Gather sociodemographic data and characteristics about immigrants and refugees in the region or target population you are serving.</p></li>\n<li><p>Recognize that newcomers from the same country and different countries will differ on a number of characteristics, such as religion, ethnic origin, class, gender, socioeconomic status, language proficiency and time in Canada.</p></li>\n<li><p>Consult and collaborate with immigrants and refugees to identify the possible impact of a program or intervention for the potentially affected group.</p></li>\n<li><p>Deliver messages in the client's preferred language and in a culturally relevant manner for each group.</p></li>\n<li><p>Recognize that different groups will prefer different channels. Determine the best way to reach the intended audience. Carefully consider the message and messenger.</p></li>\n<li><p>Offer culturally relevant programs and services to increase the satisfaction of users, increase adherence, retention and improved health outcomes.</p></li>\n<li><p>Provide interpretation services, which are essential for expanding the reach of services and reducing disparities in health outcomes for individuals who are not proficient in Canada's official languages.</p></li></ul>\n<p>(MOHLTC, n.d.)</p>\n","words":483},{"id":"s84","mod":3,"title":"Why Health Equity Matters","html":"<h4 id=\"health-equity-matters-from-three-different-perspectives-ethical-economic-and-legal.\">Health equity matters from three different perspectives: ethical, economic and legal.</h4>\n<p> Each perspective is described below. </p>\n<ul>\n<li><p><strong>Ethical</strong></p></li>\n<li><p><strong>Economic</strong></p></li>\n<li><p><strong>Legal</strong></p></li>\n</ul>\n<div class=\"wide\"><h2>Check your understanding</h2><div class=\"mcq\" data-fb=\"Inequities appear across income, housing, employment and social connections.\"><h4>Immigrants and refugees experience greater health inequities than non-immigrants based on which of these factors?</h4><button class=\"opt\">Financial</button><button class=\"opt\">Residential</button><button class=\"opt\">Employment</button><button class=\"opt\">Social connections</button><button class=\"opt\" data-ok=\"1\">All of the above</button><div class=\"fb\"></div></div></div><p>“Several Canadian studies have shown that the main determinants of health are not rooted in medical or behavioural factors, but rather in a host of social, economic and environmental factors that expose individuals to various health risks and barriers and produce health disparities between more and less advantaged groups (Waldron, 2010, p.263)”</p>\n<h5 id=\"several-factors-contribute-to-inequities-for-the-immigrant-and-refugee-populations-including-but-not-limited-to-the-following\">Several factors contribute to inequities for the immigrant and refugee populations, including but not limited to the following:</h5>\n<h4 id=\"poverty-economic-and-financial-challenges\">Poverty, economic and financial challenges</h4>\n<blockquote>\n<p>Immigrants and refugees are over-represented in poverty and they tend to experience higher rates of unemployment/underemployment because of their inability to have credentials recognized and transferred in Canada (e.g., education, professional training) (Colour of Poverty, 2019; Lai, Shankar, &amp; Khalema, 2017). Moreover, these populations often are confused about and unfamiliar with Canadian job market standards, the job application process and the cultural elements of networking (Lai, Shankar, &amp; Khalema, 2017).</p>\n</blockquote>\n<h4 id=\"discrimination-in-health-care-access-use-and-quality-of-care\">Discrimination in health care access, use, and quality of care</h4>\n<blockquote>\n<p>Immigrants and refugees experience a number of systemic barriers to health care, such as long wait times to receive health care services and lack of familiarity with the health care system. Some immigrants and refugees also have low English/French language proficiencies and some health facilities lack interpreter services, causing more barriers to adequate health and mental health services (Salami et al., 2020). In addition, provincial/territorial insurance plans do not cover some of the health services that low-income immigrant and refugee families require.</p>\n</blockquote>\n<h4 id=\"immigration-status\">Immigration status</h4>\n<blockquote>\n<p>Depending on their status, some immigrants and refugees (i.e., refugee claimants, migrant workers and undocumented individuals) are not eligible for federally funded settlement services that will help them improve their language skills and integration experiences. Another form of inaccessibility to support is the exclusion of those with precarious immigration status from receiving the Canada Child Benefit program, which was designed to prevent poverty (Colour of Poverty, 2019).</p>\n</blockquote>\n","words":364},{"id":"s85","mod":3,"title":"Understanding Racism and Its Effects","html":"<h4 id=\"race-is-a-social-construct.\">Race is a social construct.</h4>\n<h5 id=\"it-is-not-based-on-genetics-biology-or-science-ontario-human-rights-commission-ohrc-2005.\">It is not based on genetics, biology or science <strong>(Ontario Human Rights Commission [OHRC], 2005).</strong></h5>\n<h5 id=\"people-created-this-concept-to-divide-humans-into-categories-according-to-a-set-of-common-visible-traits-e.g.-skin-colour-or-the-shape-of-the-eyes-nose-or-face.\">People created this concept to divide humans into categories according to a set of common visible traits (e.g., skin colour or the shape of the eyes, nose or face).</h5>\n<p>Research shows more genetic differences within individual racial groups than between different racial groups. Racial categories are social and political devices used, both historically and currently, to exert power and control over others. This is visible in the effects of racism, health inequities, racial disparities and the social determinants of health (OHRC, 2005).</p>\n<p>Canada's past colonial behaviours, which included racism and oppression toward Indigenous Peoples and slavery of Black people, continue to influence public attitudes, beliefs and practices. Prejudice and discrimination toward these populations still produce harms in all spheres of their lives (CAMH, 2021b).</p>\n<p>Before World War II, Canada explicitly developed racist immigration policies that were in alignment with scientific racism. This period, called the building of “White Canada” or the “Keep Canada White” era, gave preference to British and Northern European immigration. These policies were designed to maintain the culture and white British “character” of Canada. Over the years, immigration policies were instituted to exclude most racialized peoples, continental Europeans and Jews (Immigration, Refugees and Citizenship Canada, 2021).</p>\n<p>The legacy of this history affects Black, Indigenous and other racialized groups by maintaining the advantages and institutional power of the dominant group (i.e., white individuals with higher socioeconomic status). The negative effects of this history are compounded over time and pass on through intergenerational trauma (CAMH, 2021b).</p>\n<h2 id=\"the-levels-of-racism\">The levels of racism</h2>\n<h5 id=\"racism-operates-at-multiple-levels-within-canadian-society.-the-most-commonly-discussed-ones-are-individual-microaggression-systemic-institutional-and-structural.\">Racism operates at multiple levels within Canadian society. The most commonly discussed ones are individual, microaggression, systemic, institutional, and structural.</h5>\n<p> Each level is described below. </p>\n<ul>\n<li><p><strong>Individual</strong></p></li>\n<li><p><strong>Microaggression</strong></p></li>\n<li><p><strong>Systemic</strong></p></li>\n<li><p><strong>Institutional</strong></p></li>\n<li><p><strong>Structural</strong></p></li>\n</ul>\n<div class=\"wide\"><h2>Match the example to the concept</h2><p>Choose the category of racism that fits each scenario.</p><div class=\"mcq\" data-fb=\"Repeatedly getting a colleague&#x27;s name wrong is a subtle, everyday slight, a microaggression.\"><h4>A team leader, Natalie, persistently gets the name of a team member, Mohcene, wrong.</h4><button class=\"opt\" data-ok=\"1\">Microaggression</button><button class=\"opt\">Institutional racism</button><button class=\"opt\">Individual racism</button><button class=\"opt\">Systemic racism</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"A personal prejudiced choice by one person is individual racism.\"><h4>A White client does not want to work with an Asian-American therapist because \"she will not understand my problem.\"</h4><button class=\"opt\">Microaggression</button><button class=\"opt\">Institutional racism</button><button class=\"opt\" data-ok=\"1\">Individual racism</button><button class=\"opt\">Systemic racism</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"A hiring decision made inside an organization on the basis of race reflects institutional racism.\"><h4>Brenda is deciding between two equally qualified candidates, Sam and Junaid. She chooses Sam because there are no other Asians on the team and she thinks Junaid will feel left out.</h4><button class=\"opt\">Microaggression</button><button class=\"opt\" data-ok=\"1\">Institutional racism</button><button class=\"opt\">Individual racism</button><button class=\"opt\">Systemic racism</button><div class=\"fb\"></div></div><div class=\"mcq\" data-fb=\"A pattern built into how the organization operates is systemic racism.\"><h4>A company routinely offers better opportunities for advancement only to its non-racialized employees.</h4><button class=\"opt\">Microaggression</button><button class=\"opt\">Institutional racism</button><button class=\"opt\">Individual racism</button><button class=\"opt\" data-ok=\"1\">Systemic racism</button><div class=\"fb\"></div></div></div>","words":408},{"id":"s86","mod":3,"title":"Recognizing and Addressing Anti-Black Racism","html":"<h4 id=\"it-is-important-to-touch-on-anti-black-racism-because-history-requires-us-to-recognize-black-experiences-with-racism-as-uniquely-different-from-other-experiences-with-racismcamh-2021a-p.8.\">It is important to touch on anti-Black racism because “history requires us to recognize Black experiences with racism as uniquely different from other experiences with racism”<strong><em>(CAMH, 2021a, p.8).</em></strong></h4>\n<p>Anti-Black racism is a systemic form of prejudice, discrimination or antagonism that intentionally or unintentionally harms people of African origin through systems and structures that exclude, silence, devalue and marginalize Black experiences. Anti-Black racism is rooted in the history and legacies of slavery and colonization. It continues to uphold narratives of white superiority and Black inferiority, thereby creating and reproducing prejudices, stereotypes and disadvantages for Black people (Black Health Alliance, n.d.).</p>\n<p>Significant systemic racial disparities exist in a number of social determinants because of anti-Black racism and discrimination. These include income, education, social inclusion, employment and food security (CAMH, 2021a). Anti-Black racism also increases the risk of mental illness because Black populations are more likely to be exposed to negative social circumstances, which lead to stress (CAMH, 2021a)</p>\n<p>People of African descent are not a homogenous group. There are differences in generation status, ethnic and cultural origins, immigration, geography, language, and more (CAMH, 2021b). These differences mean that one size does not fit all when delivering programs and services.</p>\n<h3 id=\"featured-resource\">Featured resource</h3>\n<p>The Centre for Addiction and Mental Health and the Anti-Black Racism and Mental Health Advisory Committee created the “Dismantling Anti-Black Racism Strategy.” It identifies key priority areas at the organizational, staff and clinical level, and includes 22 actions that aim to decrease anti-Black racism at CAMH.</p>\n<p><a href=\"https://www.camh.ca/-/media/files/camh-dismantling-anti-black-racism-pdf.pdf\"><strong>Read this strategy</strong></a></p>\n","words":249},{"id":"s87","mod":3,"title":"How Racism Affects Mental Health","html":"<h2 id=\"stress-response-and-racism-racism-and-cumulative-stress\">Stress response and racism: Racism and cumulative stress</h2>\n<p>The effect of experiencing racism throughout a lifetime is a type of stressor, where there is an awareness of being treated and responded to in an unfair way based on race. This can include being feared, avoided or disadvantaged. It can also lead to experiences of trauma. These subtle influences can result in feelings of hopelessness and difficulties adjusting and recovering from trauma. Chronic stress and trauma affect mental and physical health, and these effects can be felt by individuals, families and communities across generations (PHAC, 2020).</p>\n<p>Some believe that experiencing everyday minor incidents or slights (i.e., microaggressions) and the perception that society is discriminatory may have a greater effect on a person's health than overt discriminatory acts such as racist attacks (Laveist, 1996).</p>\n<h2 id=\"impact-of-racism-on-mental-health\">Impact of racism on mental health</h2>\n<p>Racism intersects with other forms of discrimination based on culture, language, gender identity, sexual orientation, ability or socioeconomic status. These intersecting factors directly affect the lives and well-being experienced by Indigenous and immigrant, refugee, ethnocultural and racialized groups (IRER).</p>\n<p>Experiences of discrimination—and corresponding responses of resistance and resilience—can look different across racialized communities. Racialized populations in Canada are diverse, and different kinds of discrimination intersect to shape the experiences of individuals and groups with different histories and identities. For some, resilience builds from the experience of being Indigenous or belonging to an IRER group. For others, the way they are perceived in the broader society (and the resulting racism and discrimination they experience) undermines their mental health (MHCC &amp; CAMH, 2009).</p>\n<p>A large body of evidence illustrates how racism leads to mental illnesses, especially depression and extended periods of adjustment such as long-standing grief or difficulty coping with and adapting to severe events (MHCC &amp; CAMH, 2009; Szaflarski &amp; Bauldry, 2019). Racism often leads to mental health problems and disorders (e.g., depression, anxiety, posttraumatic stress disorder (PTSD) and psychosis) that persist as people get older with continued exposure (Synergi Collaborative Centre, 2018).</p>\n<h2 id=\"imagine-this-scenario\">Imagine this scenario</h2>\n<p>Anti-Asian racism and discrimination were amplified during the COVID-19 pandemic due to Asians being blamed for COVID-19. Hate and racism were even extended to Asian youth 18 years and under. Reports of discrimination by children and adolescents increased by 286% in 2021 compared to 2020, making up 29% of reports (CCNCTC &amp;Project 1907, 2022).</p>\n<p>These two, short, real-life scenarios highlight the experiences of some young people.</p>\n<h4 id=\"case-1\">Case 1</h4>\n<blockquote>\n<p>“A young East Asian (EA) youth is in the hospital recovering from injuries inflicted upon him by his school mates. This EA youth is being targeted for further harm once discharged from the hospital.”</p>\n</blockquote>\n<h4 id=\"case-2\">Case 2</h4>\n<blockquote>\n<p>“A young EA girl prefers to wear her face mask for the entire school day as a way to protect herself from not being identified as Asian.”</p>\n</blockquote>\n<p>To support young people, researchers from the Factor-Inwentash Faculty of Social Work, University of Toronto, the Asian Canadian Living Archive and Hong Fook Mental Health Association initiated a project entitled My Script, My Voice.</p>\n<p>The project, which included focus group discussions and photo story (photography and visual arts), was designed to better understand the following:</p>\n<ul>\n<li><p>What is anti-Asian racism (AAR) and how it is formed?</p></li>\n<li><p>What are youth experiences with AAR and the impacts?</p></li>\n<li><p>What is the link between AAR and identity?</p></li></ul>\n<h5 id=\"ea-youth-identified-the-following-stressors\">EA youth identified the following stressors:</h5>\n<ul>\n<li><p>Difficulties identifying and calling out for help</p></li>\n<li><p>Ignoring and pretending the issue doesn't exist</p></li>\n<li><p>Redirecting their focus to academics or socially unacceptable behaviour (vandalism, self-harm or harming/bullying others)</p></li>\n<li><p>Substance use</p></li></ul>\n<h5 id=\"due-to-cultural-and-language-barriers-the-youth-found-that-their-parents\">Due to cultural and language barriers, the youth found that their parents:</h5>\n<ul>\n<li><p>Did not understand the challenges</p></li>\n<li><p>Responded passively (e.g., “stay away from trouble”)</p></li>\n<li><p>Redirected their children's energy to focus on academics</p></li></ul>\n<p><a href=\"https://www.myscriptmyvoice.com/\"><strong>Learn more about the project</strong></a></p>\n<h5 id=\"hong-fook-mental-health-association-provided-the-following-interventions\">Hong Fook Mental Health Association provided the following interventions:</h5>\n<h4 id=\"psycho-education-for-youths-who-sought-help\">Psycho-education for youths who sought help:</h4>\n<ul>\n<li><p>Train youth ambassadors in school to talk about their experience.</p></li>\n<li><p>Share strategies to address AAR so it does not affect their mental health.</p></li>\n</ul>\n<h4 id=\"support-parents\">Support parents:</h4>\n<ul>\n<li><p>Help parents understand the impact of AAR on themselves and their youth.</p></li>\n<li><p>Improve parents' communication skills with youth.</p></li>\n</ul>\n<h4 id=\"education-system\">Education system:</h4>\n<ul>\n<li>Convene meetings with educators so they can understand the context of AAR and be an ally for EA children and youth in the classroom.</li>\n</ul>\n<p>“Racism and discrimination constitute pervasive stressors in the daily lives of many racial and ethnic minority individuals and our Asian youth is not immune. Racial discrimination has become a contributory factor in the occurrence of physical and mental health conditions. At Hong Fook, we hear from Asian youth that they feel ashamed of their social identities, i.e., being Asian. They find it difficult to share these experiences with their parents. This can cause more feelings of isolation, anxiety and depression and prevent them from social participation in the Canadian society.”</p>\n<p>Bonnie Wong, Executive Director of Hong Fook Mental Health Association (published by Chinese Canadian National Council Toronto Chapter in the “Another Year: Anti-Asian Racism across Canada, Two Years into the COVID-19 Pandemic document.”</p>\n<h2 id=\"activity-racism-and-mental-health\">Activity: Racism and mental health</h2>\n<p>Describe at least three factors related to racism that contribute to mental health problems for immigrants and refugees.</p>\n<p>Submit</p>\n","words":850},{"id":"s88","mod":3,"title":"Inclusion and Exclusion in Society","html":"<p>Inclusion means providing equal opportunities so all people can fully engage in creating an environment and a cultural attitude whereby everyone and every group fits in, feels accepted, has value and is supported by a foundation built on trust and mutual respect (Wright, 2019).</p>\n<p>Social inclusion (or connectedness) involves making all groups of people feel included and valued within their society or community (Royal College of Nursing [RCN], 2021). Groups or individuals who are excluded (or who experience life on the margins of society) often have poorer health outcomes. Certain illnesses, disabilities, beliefs and values can also lead to individuals or groups facing related challenges, such as stigma, discrimination and other barriers (RCN, 2021).</p>\n<p>Social exclusion involves the lack or denial of resources, rights, goods and services. It describes the inability to participate in the relationships and activities available to the majority of people in a society, whether in economic, social, cultural or political arenas (RCN, 2021).</p>\n<h5 id=\"the-reasons-for-people-being-excluded-are-layered-and-complex.-they-can-result-from-the-following-factors\">The reasons for people being excluded are layered and complex. They can result from the following factors:</h5>\n<ul>\n<li><p>Age</p></li>\n<li><p>Ethnicity</p></li>\n<li><p>Homelessness</p></li>\n<li><p>Ill health (physical or mental)</p></li>\n<li><p>Poverty and financial hardship</p></li>\n<li><p>Race/racism</p></li>\n<li><p>Sexual orientation</p></li>\n<li><p>Unemployment</p></li>\n<li><p>Challenges understanding and navigating the system (e.g., because they do not speak English, have learning disabilities or live with a mental health problem or illness)</p></li></ul>\n<p>(RCN, 2021)</p>\n<p>Exclusion can also affect specific demographic groups, such as refugees, asylum seekers and immigrants, and people who are incarcerated or navigating the criminal justice system (RCN, 2021).</p>\n","words":244},{"id":"s89","mod":3,"title":"Recognizing Personal and Systemic Bias","html":"<h5 id=\"the-term-bias-also-referred-to-as-implicit-bias-and-unconscious-bias-refers-to-assumptions-beliefs-attitudes-and-stereotypes-regarding-different-groups-of-people.-these-learned-mental-shortcuts-affect-how-we-perceive-and-respond-to-people-haselton-et-al.-2005.\">The term “bias” (also referred to as “implicit bias” and “unconscious bias”) refers to assumptions, beliefs, attitudes and stereotypes regarding different groups of people. These learned mental shortcuts affect how we perceive and respond to people <strong>(Haselton et al., 2005).</strong></h5>\n<h5 id=\"bias-can-be-based-on-various-social-identities-such-as\">Bias can be based on various social identities, such as:</h5>\n<ul>\n<li><p>Culture</p></li>\n<li><p>Ethnicity</p></li>\n<li><p>Gender identity</p></li>\n<li><p>Political and philosophical worldviews</p></li>\n<li><p>Religion</p></li>\n<li><p>Sexual orientation</p></li>\n<li><p>Socioeconomic status</p></li></ul>\n<p>“Biases are learned through social context within families, cultures, religions, spiritualities, secularism, ideologies and societal contexts” (Haselton et al., 2005).</p>\n<p>Bias leads to stereotypes that are often conveyed through ordinary, subtle and unconscious processes. Even the most well-meaning and intentionally egalitarian person who holds a harmful stereotype of a social group will likely discriminate against someone from that group. They are “universal processes and all people are capable of them” (Williams, 2018; American Psychological Association[APA], n.d).</p>\n<p>One sign of persistent racism in a society is the high level of harmful stereotypes held by the population. Cultural racism can prompt unconscious bias against Black clients, families and communities, which can result in fewer opportunities to access services and resources that enhance health. This has been well-documented in the case of medical care, including mental health care (Williams, 2018; APA, n.d.).</p>\n\n<h3 id=\"featured-resource\">Featured resource</h3>\n<p>Project Implicit, delivered from Harvard University, is a non-profit organization and international collaborative of researchers who are interested in implicit social cognition. Its “implicit association test” allows you to assess your unconscious bias.</p>\n<p><a href=\"https://implicit.harvard.edu/implicit/\"><strong>Take the implicit association test</strong></a></p>\n<h2 id=\"imagine-this-scenario\">Imagine this scenario</h2>\n<h3 id=\"anti-black-racism-and-bias-toward-clients\">Anti-Black racism and bias toward clients</h3>\n<p>David is a 35. He is a Black forensic patient who has come to the hospital due to feeling and expressing increased paranoia while in his community. Historically, he would have been admitted briefly until he stabilized, and then he would be discharged.</p>\n<p>During this admission, his outpatient team recommends detaining him for longer than usual. They say this is because of “ongoing challenges in David's community.” As they discuss these challenges, it becomes clear to David that they are making assumptions about how Black people should receive care, about the perceived dangers of working with his community and about the frequent use of restraints and over-surveillance when providing care. David expresses his frustration about this with his team and the organization. Later, staff observe him venting loudly in the unit's common areas, and then returning to his bedroom.</p>\n<p>The nursing staff encourage their leadership to transfer David to a more secure unit. They say he is a potential safety concern, and they do not feel comfortable, but do not explain further. Staff are reluctant to engage with him and say they “do not feel safe.”</p>\n<p>Staff who know David say this is his common presentation. Nursing staff are still reluctant to support him (e.g., by going out with him for fresh air) or advocate on his behalf. They describe him as “threatening.”</p>\n<p>He spends the next week mainly in his bedroom or pacing the unit and rapping loudly. This aligns with his previous presentations in the hospital and the community. The staff make few attempts to engage him throughout his stay.</p>\n<h2 id=\"reflection\">Reflection</h2>\n<ol type=\"1\">\n<li><p>Assuming that stereotypes and implicit bias affect David's care, what steps would you take to improve his experience?</p></li>\n<li><p>What actionable steps would you take to facilitate a team conversation on their discomfort about David?</p></li>\n<li><p>How might your assumptions and stereotypes influence your perception of safety around David?</p></li></ol>\n<h2 id=\"anti-oppression-and-anti-racism-practice\">Anti-oppression and anti-racism practice</h2>\n<p>Anti-oppression means actively dismantling the inequalities associated with a lack of dignity, human rights, social resources and power (Dominelli, 2008). It seeks to promote and maintain rights, equity, well-being and independence. This can be done at micro and macro levels. Anti-oppression includes empowerment, education, alliance building, language, alternative healing strategies, advocacy, social justice/activism and fostering reflexivity (Corneau &amp; Stergiopoulos, 2012).</p>\n<p>Anti-oppressive practice encourages open and clear communication. It seeks to identify strategies to construct power in a way that addresses systemic inequalities operating at individual, group and institutional levels, as opposed to producing and reproducing oppression (Yee et al., 2006).</p>\n<h3 id=\"how-do-we-do-this\">How do we do this?</h3>\n<h4 id=\"consider-the-following\">Consider the following:</h4>\n<h5 id=\"actions-and-words-matter\">Actions and words matter</h5>\n<blockquote>\n<p>Challenge and critique words and actions that dehumanize, marginalize or exclude others.</p>\n</blockquote>\n<h5 id=\"commit-to-lifelong-anti-oppression-work\">Commit to lifelong anti-oppression work</h5>\n<blockquote>\n<p>No single book, workshop or e-learning course will be enough to unlearn socialization within a culture of multiple overlapping oppressions.</p>\n</blockquote>\n<h5 id=\"dialogue-discussion-and-reflection\">Dialogue, discussion and reflection</h5>\n<blockquote>\n<p>Encourage and conduct honest, critical and generative group discussions to help recognize your power and privilege and overcome oppressive attitudes, behaviours and situations. This work requires active listening, non-defensiveness and respectful communication.</p>\n</blockquote>\n<p>(Canadian Observatory on Homelessness, n.d.)</p>\n<p>It can also help to reflect on your experiences around racial and health inequities (e.g., situations involving shared decision-making between patients and staff).</p>\n<h2 id=\"reflection-1\">Reflection</h2>\n<ol type=\"1\">\n<li><p>Do you think you play a role in perpetuating systemic oppression within your organizations? If so, how? If not, why not?</p></li>\n<li><p>Do you see it as your role to engage and educate staff, service users, clients and families regarding issues of race and oppression? Why or why not?</p></li>\n<li><p>What inequalities would you identify at your organizations, and what active steps can you (and others) take to dismantle them?</p></li></ol>\n<h2 id=\"critical-self-reflection-and-adopting-an-anti-racist-approach\">Critical self-reflection and adopting an anti-racist approach</h2>\n<h4 id=\"acknowledge-that-modern-day-racism-exists-and-learn-with-humility.\">Acknowledge that modern day racism exists and learn with humility.</h4>\n<p>Canada's “multicultural heritage” is written into the Constitution of 1982 yet, in actuality, this nation is not multicultural (Roberts &amp; Doob, 1997). This law has been in effect for more than 40 years. Racialized people have lived under conditions of racism that have been unchanged since post-World War II and have intensified from the 1990s to present (Roberts &amp; Doob, 1997; Walcott, 2019).</p>\n<p>Try to practise active listening by listening to understand rather than listening to respond. When you choose to engage, do not assume you know or understand the experiences of marginalized communities, especially those you do not identify with. If people share their experiences with you, be sure to affirm and validate their experiences while being cautious of the space you are occupying.</p>\n<h4 id=\"avoid-usage-of-stereotypical-and-normalized-microaggressive-comments.\">Avoid usage of stereotypical and normalized, microaggressive comments.</h4>\n<blockquote>\n<p>Examples include:</p>\n</blockquote>\n<ul>\n<li><p>“Where are you really from?”</p></li>\n<li><p>“You sound white” or “You're really well-spoken.”</p></li>\n<li><p>“I don't really see you as Indian.”</p></li>\n<li><p>“You have really big eyes for an Asian person.”</p></li>\n</ul>\n<h4 id=\"hold-your-friends-and-family-accountable.\">Hold your friends and family accountable.</h4>\n<blockquote>\n<p>Challenge yourself to engage in respectful conversation with people close to you when they make problematic comments by:</p>\n</blockquote>\n<ul>\n<li><p>Actively listening</p></li>\n<li><p>Exploring and asking questions(s)</p></li>\n<li><p>Acknowledging their feelings</p></li>\n<li><p>Restating what they said to check for accuracy</p></li>\n<li><p>Exploring solutions together</p></li>\n</ul>\n<h4 id=\"understand-the-impact-of-white-supremacy-in-your-everyday-life-and-support-the-work-art-and-businesses-of-racialized-folks.\">Understand the impact of white supremacy in your everyday life and support the work, art and businesses of racialized folks.</h4>\n<p>Although race is a social construct, it has material consequences that continue to reproduce and maintain material and structural consequences. The social realities of race dictate who gets what kind of health, when, and how much, and on what terms. Racialization itself is a cycle of expansion and reproduction. The process of racialization changes and transforms over time, and there is a specific continuity. When looking macroscopically, a network of forces and barriers is hierarchically entangled with how health happens to intentionally immobilize and reduce racialized people.</p>\n<h4 id=\"acknowledge-racial-trauma-and-critically-self-reflect-on-how-racism-shapes-our-institutions-language-values-and-beliefs.\">Acknowledge racial trauma and critically self-reflect on how racism shapes our institutions, language, values and beliefs.</h4>\n<p>The chattel enslavement of Africans continues to serve as a source of traumatic stress for Black people today. Additionally, historical trauma inflicted on First Nations, Inuit and Métis people, including boarding schools, massacres and forced violent removal from their tribal lands, represents a severe communal loss and source of traumatic stress.</p>\n<h4 id=\"ask-yourself\">Ask yourself:</h4>\n<ul>\n<li><p>What are the intersections of my own power and privilege with the locations of my disadvantage? How am I accountable for unearned privileges? How do I resist positioning myself in my locations of disadvantage when serving suffering others? From the power position of therapist, how do I resist positioning myself as the oppressed person in the relationship due to some other site of disadvantage? How do I get my own sites of disadvantage out of the way if they are not useful?</p></li>\n<li><p>Who is in solidarity to shoulder me/us/our organizations up in making space for discomfort, accountability and repair of power relations? What ideas, practices and lived experience helps me/us in doing this?</p></li>\n<li><p>How I hold myself as a professional, as well as hold my team, organization and profession to account for transgressions of power? How do I invite clients in safe and trustworthy enough ways to name transgressions? What structures and practices are in place to make this naming possible and useful consistently and predictably across time?</p></li>\n<li>How am I responding to power both moment to moment and contextually in this interaction? How am I resisting righteousness, posturing and the double comfort of naming privilege righteously, but doing nothing to mitigate it—such as naming white privilege and then dominating the space? How can I invite, embrace and hold the discomfort required to accountably address my access to power?</li>\n</ul>\n<h4 id=\"develop-skills\">Develop skills</h4>\n<blockquote>\n<p>Continuously adopt culturally responsive skills when completing case conceptualizations, implementing interventions, creating treatment plans and determining appropriate healing practices.</p>\n</blockquote>\n<h4 id=\"become-involved-in-organizations-that-support-racial-justice-issues.\">Become involved in organizations that support racial justice issues.</h4>\n<blockquote>\n<p>Locate organizations that are working within communities to enhance the lives of those disproportionately affected by racism.</p>\n</blockquote>\n<ul>\n<li>Support them by donating money, volunteering time or spreading awareness of their mission.</li>\n</ul>\n","words":1558},{"id":"s90","mod":3,"title":"Anti-Oppression Frameworks in Practice","html":"<h4 id=\"anti-oppression-is-a-widely-debated-concept-that-can-be-difficult-to-understand.\">Anti-oppression is a widely debated concept that can be difficult to understand.</h4>\n<h5 id=\"in-general-an-anti-oppression-framework-is-based-on-the-following-premises\">In general, an anti-oppression framework is based on the following premises</h5>\n<ul>\n<li><p>Promoting egalitarianism and power sharing</p></li>\n<li><p>Understanding one's social location and how it informs relations and practice behaviours</p></li>\n<li><p>Challenging existing social relationships</p></li>\n<li><p>Participating in practice behaviours that minimize power imbalances and promote equity and empowerment for service users</p></li></ul>\n<p>(Larson, 2008)</p>\n<p>It is important for service providers to be aware of what it means to work within this framework, and how this framework translates into mental health and service delivery for immigrant and refugee populations (Corneau &amp; Stergiopoulos, 2012). Sakamoto's (2007) anti-oppressive framework (see below) is particularly relevant to working with immigrant and refugee populations. This framework outlines six domains in which anti-oppressive approaches differ from traditional service delivery.</p>\n<h4 id=\"traditional-approach\">Traditional approach</h4>\n<h4 id=\"anti-oppressive-approach\">Anti-oppressive approach</h4>\n<h4 id=\"social-worker\">Social worker</h4>\n<ul>\n<li><p>Assumed to be from or have assumptions of culturally dominant group (e.g., middle-class, White)</p></li>\n<li><p>Can be from any background and have intersecting identities</p></li>\n</ul>\n<h4 id=\"immigrants-clientsservice-users\">Immigrants clients/service users</h4>\n<ul>\n<li><p>Cultural and/or dissimilar other, who may be traumatized</p></li>\n<li><p>Service users with multiple identities, who may have transnational ties</p></li>\n</ul>\n<h4 id=\"immigrant-acculturation\">Immigrant acculturation</h4>\n<ul>\n<li><p>Needed and promoted through information, education, and training</p></li>\n<li><p>Goals of acculturation are discussed with immigrants, who are referred to corresponding services</p></li>\n</ul>\n<h4 id=\"cultural-competence\">Cultural competence</h4>\n<ul>\n<li><p>Dominant worker learning about the cultures of cultural minorities</p></li>\n<li><p>Focus on intersecting identities and oppression. Culturally dominant service providers as well as cultural minorities need to raise consciousness, avoid “race to innocence”</p></li>\n</ul>\n<h4 id=\"relationship-between-service-provider-and-service-user\">Relationship between service provider and service user</h4>\n<ul>\n<li><p>Expert helping novice in the society. Reminiscent of the charity model</p></li>\n<li><p>Service provider strives to become co-learner, catalyst, and ally in the process, while acknowledging that power differences between service providers and service users can be oppressive</p></li>\n</ul>\n<h4 id=\"structural-change\">Structural change</h4>\n<ul>\n<li><p>Not addressed</p></li>\n<li><p>Advocacy and social action toward systemic changes to society in integrating immigrants</p></li>\n</ul>\n<p>In the traditional approach to settlement work, clients are viewed as different “others” who may be traumatized (Sakamoto, 2007). In contrast, rather than focusing primarily on the barriers, challenges, risks and vulnerabilities of immigrants and refugees, the anti-oppression framework challenges negative assumptions about these populations and the view that being different is a negative characteristic (Clarke &amp; Wan, 2011). Instead, clients are seen as individuals with control who can use their strengths to transform society (Clarke &amp; Wan, 2011). As a result, an anti-oppression framework challenges health care providers to critically assess the goals of assimilation of clients. This involves participating in regular consultations and open discussions, which in turn empower clients to identify the services that best meet their needs (Clarke &amp; Wan, 2011).</p>\n<p>In the traditional approach to service delivery, cultural competence involves health care providers from the dominant culture trying to learn about the cultures of marginalized populations (Sakamoto, 2007). Although it is becoming more common for front-line service providers to be a part of an ethnocultural group, the discussion of cultural competence continues to persist, and diversity training remains a common need in many agencies (Clarke &amp; Wan, 2011). An anti-oppression framework challenges this tradition by encouraging health care providers to look closer at clients’ intersecting identities (e.g., class, race, sexual orientation, age, disability and gender, etc.) and multiple sources of oppression or marginalization (Sakamoto, 2007).</p>\n<p>In addition, a traditional approach to service delivery assigns the role of “expert” to the health care provider. The anti-oppression framework highlights the importance of health care providers engaging in an ongoing examination of their own subjective identity and power (Clarke &amp; Wan, 2011). Critical self-knowledge and self-examination are essential for care providers to understand their role in the system of oppression/privilege, and to acknowledge their values, histories, feelings and inner thoughts in relation to their interactions with people from other cultures (Corneau &amp; Stergiopoulos, 2012).</p>\n<p>Finally, an anti-oppression framework acknowledges that the mental health needs of immigrants and refugees are rooted in broader systems of oppression. Rather than only focusing on immediate needs, the role of care providers expands to include advocacy and social action for systemic changes (Clarke &amp; Wan, 2011).</p>\n<div class=\"wide\"><h2>Check your understanding</h2><div class=\"mcq\" data-fb=\"The service provider as expert is the traditional approach. Anti-oppression practice makes the provider a co-learner and ally.\" data-ms=\"1\"><h4>An anti-oppression framework is based on which of the following premises? Select all that apply.</h4><button class=\"opt\" data-ok=\"1\">Promoting egalitarianism and power sharing</button><button class=\"opt\" data-ok=\"1\">Understanding one's social location</button><button class=\"opt\" data-ok=\"1\">Challenging existing social relationships</button><button class=\"opt\" data-ok=\"1\">Participating in practice behaviours that minimize power imbalances and promote equity and empowerment for service users</button><button class=\"opt\">Treating the service provider as the expert and the service user as the novice</button><button class=\"chk\">Check answer</button><div class=\"fb\"></div></div></div>","words":720},{"id":"s91","mod":3,"title":"Understanding Intersecting Identities","html":"<p>Everyone has multiple identities. These include race, age, language, gender, sexual orientation and national origin. These identities intersect and interact in complex ways, affect our lived experiences and can produce health inequities (MOHLTC, 2012; Caiola et al., 2014; CAMH, 2021).</p>\n<p>Intersectionality allows us to consider multiple factors of advantage and disadvantage that are consistently shifting depending on time, space and setting. Our intersecting social identities contribute to the ways we all navigate and experience the world around us (Crenshaw, 1989).</p>\n","words":96},{"id":"s92","mod":3,"title":"Intersectionality and Mental Health","html":"<p>Significant intersecting identities and experiences between and within populations affect mental health. In Canada, rates of mental health problems, illnesses and disorders vary significantly between and within different immigrant groups, suggesting important intersections between immigration, race, country of origin, age at arrival, gender, income and mental health (Hyman, 2009; MHCC, 2016). Multiple layers of intersectionality need to be considered, including a person's unique circumstances, aspects of a person's identity, types of discrimination that a person may be subjected to and larger forces and structures that work together to reinforce exclusion.</p>\n<h5 id=\"the-diagram-below-represents-these-multiple-layers-of-intersecitonality\">The diagram below represents these multiple layers of intersecitonality</h5>\n<p>StructuresDiscriminationIdentityCircumstances</p>\n<p>(Simpson, 2009)</p>\n<p>Service providers should acknowledge the intersections that affect the mental health of the service user, as well be aware of the relationship between themselves and the service user, and the social location of both (MHCC, 2016). In addition, it should be acknowledged that people do not fit neatly into one identity, and that service provision, support and treatment should not be generalized (MHCC, 2016).</p>\n<h2 id=\"the-intersectional-model\">The intersectional model</h2>\n<h5 id=\"the-key-assumptions-of-the-intersectional-model-include\">The key assumptions of the intersectional model include:</h5>\n<h4 id=\"points-of-privilege-and-points-of-oppression\">Points of privilege and points of oppression</h4>\n<blockquote>\n<p>An immigrant or refugee may experience oppression based on certain aspects of their identity or social group, and may experience privilege based on other aspects of their identity or social group.</p>\n</blockquote>\n<h4 id=\"diversity-within-diversity\">Diversity within diversity</h4>\n<blockquote>\n<p>Although it is important to consider what groups an immigrant or refugee may identity with, it is important to not homogenize the experiences of this group.</p>\n</blockquote>\n<h4 id=\"systems-and-structures-of-discrimination-and-oppression-are-linked\">Systems and structures of discrimination and oppression are linked</h4>\n<blockquote>\n<p>In order to overcome barriers that immigrants and refugees face, it is important to recognize that multiple parts of their identity may impact their experiences (AMSSA, 2017).</p>\n</blockquote>\n<h2 id=\"developing-an-intersectional-approach\">Developing an intersectional approach</h2>\n<h5 id=\"strategies-for-developing-an-intersectional-approach-include\">Strategies for developing an intersectional approach include:</h5>\n<h4 id=\"build-intersectional-policies-into-organizational-structures\">Build intersectional policies into organizational structures</h4>\n<blockquote>\n<p>This can mean expanding an organization’s accessibility policy to include not only clients with disabilities, for example, but transgender clients as well.</p>\n</blockquote>\n<h4 id=\"form-partnerships-or-coalitions-with-organizations-that-serve-distinct-communities\">Form partnerships or coalitions with organizations that serve distinct communities</h4>\n<blockquote>\n<p>It is important to partner with agencies that provide services to distinct communities in order to properly facilitate appropriate care and support.</p>\n</blockquote>\n<h4 id=\"collect-data-about-client-diversity\">Collect data about client diversity</h4>\n<blockquote>\n<p>Ensure that data is collected on client diversity, and that it can be manipulated in various ways to see the relationships between intersections and health outcomes</p>\n<p>(MHCC &amp; CAMH 2009; AMSSA, 2017)</p>\n</blockquote>\n<h3 id=\"featured-resources\">Featured resources</h3>\n<p>The <a href=\"https://www.criaw-icref.ca/publications/\">Canadian Research Institute for the Advancement of Women</a> provides several downloadable resources on specific intersections such as women and poverty, race and gender, and a discussion of intersectional feminist frameworks.</p>\n<p><a href=\"https://newtobc.ca/settlement-information-for-newcomers/immigrant-demographics-by-community/\">NewtoBC: Community Immigrant Demographic Profiles</a></p>\n<p><a href=\"https://www.cawi-ivtf.org/wp-content/uploads/advancing-equity-inclusion-en.pdf\">City for All Women Initiative: Advancing Equity and Inclusion: A Guide for Municipalities (AMSSA 2017).</a></p>\n","words":441},{"id":"s93","mod":3,"title":"Putting Inclusive Practice into Action","html":"<p>Inclusive practice is an emergent process that seeks to build on best practices and develop different actions that eventually transform culture. Inclusive practice promotes equality and supports diversity so individuals often end up with a better quality of life. Crucially, practice needs to become flexible and person-centred so it respects and responds to individual needs.</p>\n<p>Working inclusively is not just about taking people's differences into account when providing services. It means being able and willing to engage authentically and genuinely with people in any situation (Richardson, 2015). For example, this could mean asking certain participants for their viewpoint, and not just the people you are more comfortable with.</p>\n<p>To promote equity and diversity, we must treat people as individuals as well as members of broader communities. To avoid exclusion, a person's differences must be valued and the full potential of their needs and wants should be affirmed (All Answers Ltd, 2018).</p>\n<h5 id=\"how-you-can-demonstrate-inclusive-practices-in-your-professional-and-personal-lives\">How you can demonstrate inclusive practices in your professional and personal lives?</h5>\n<p>Provide two examples of how your services could be made more inclusive. Explain how these practices can foster allyship and solidarity.</p>\n<p>See discussion</p>\n\n","words":191},{"id":"s94","mod":3,"title":"Moving from Cultural Awareness toward Cultural Humility","html":"<p>In order to offer equitable service to people from different cultural backgrounds and to be accountable for how these services are delivered, it is important that health care providers move from cultural awareness to cultural humility. The pathway from awareness to humility is called the cultural spectrum, which individuals and organizations can follow (First Nations Health Managers Association and Canadian Foundation for Healthcare Improvement, n.d).</p>\n<p>At the beginning of the spectrum is cultural awareness, where differences are acknowledged, but there are no active attempts to change behaviour. At the other end is cultural humility, where providers engage in reflective practice to ensure they are creating and building meaningful and respectful relationships based on mutual trust and understanding (First Nations Health Managers Association and Canadian Foundation for Healthcare Improvement, n.d.).</p>\n<p>Below is an explanation of the terms along the spectrum.</p>\n<h2 id=\"the-cultural-spectrum\">The cultural spectrum</h2>\n<h4 id=\"section\">● ○ ○ ○</h4>\n<h4 id=\"cultural-awareness\">Cultural awareness</h4>\n<ul>\n<li><p>Acknowledges differences</p></li>\n<li><p>Doesn't seek broader context or understanding</p></li>\n<li><p>Very limited behaviour change</p></li>\n</ul>\n<h4 id=\"section-1\">● ● ○ ○</h4>\n<h4 id=\"cultural-sensitivity\">Cultural sensitivity</h4>\n<ul>\n<li><p>Acknowledges different ways of seeing the world</p></li>\n<li><p>Integrates some changes in practices or behaviour</p></li>\n</ul>\n<h4 id=\"section-2\">● ● ● ○</h4>\n<h4 id=\"cultural-competency\">Cultural competency</h4>\n<ul>\n<li><p>System elements are aligned with and respect other cultures</p></li>\n<li><p>Represents action on the part of an individual or organization</p></li>\n</ul>\n<h4 id=\"section-3\">● ● ● ●</h4>\n<h4 id=\"cultural-humility\">Cultural humility</h4>\n<blockquote>\n<p>“…involves an ongoing process of self-exploration and self-critique combined with a willingness to learn from others. It means entering a relationship with another person with the intention of honoring their beliefs, customs, and values. It means acknowledging differences and accepting that person for who they are.”(University of Oregon, n.d.)</p>\n</blockquote>\n<h4 id=\"key-elements-of-cultural-humility-are\">Key elements of cultural humility are:</h4>\n<ul>\n<li><p>Openness</p></li>\n<li><p>Self-reflection/awareness</p></li>\n<li><p>Lifelong learning</p></li>\n<li><p>Institutional accountability</p></li>\n<li><p>Empathy and compassion</p></li>\n<li><p>Being “other-oriented”</p></li>\n<li><p>Acknowledging power imbalances and balancing power imbalances</p></li></ul>\n<h4 id=\"cultural-humility-is-not...\">Cultural humility is <em>not</em>...</h4>\n<ul>\n<li><p>“prejudice,</p></li>\n<li><p>oppression,</p></li>\n<li><p>intolerance,</p></li>\n<li><p>discrimination,</p></li>\n<li><p>stereotyping,</p></li>\n<li><p>exclusion,</p></li>\n<li><p>stigma,</p></li>\n<li><p>inequity,</p></li>\n<li><p>marginalization,</p></li>\n<li><p>misconceptions,</p></li>\n<li><p>labeling,</p></li>\n<li><p>mistrust,</p></li>\n<li><p>hostility,</p></li>\n<li><p>misunderstandings,</p></li>\n<li><p>cultural imposition,</p></li>\n<li><p>judgmental,</p></li>\n<li><p>undermining,</p></li>\n<li><p>and bullying”</p></li>\n</ul>\n<p>(Fonda, Baptiste, Reinholdt &amp; Ousman, 2015).</p>\n<p>Another component of the spectrum is cultural safety. Safety is determined by the recipient of the service and not the provider. This is a shift away from what happens in the other points of the spectrum, which are mostly about the provider or the organization. Cultural safety is the voice of the client (First Nations Health Managers Association and Canadian Foundation for Healthcare Improvement, n.d)</p>\n","words":401},{"id":"s95","mod":3,"title":"Unlearning and Examining Our Assumptions","html":"<p>Due to the culture and society within which we operate, stereotypes, stigma, racism and prejudice have become normalized. Unlearning is the process of discarding something that we learned earlier through societal norms and even through the education system. Unlearning requires you to be self-aware about your thoughts, beliefs, habits and actions that reinforce racism, prejudice or discrimination.</p>\n<p>How do you unlearn something? Begin by questioning your daily practices and responses, and where you receive knowledge. Ask yourself whether any of these seem contradictory to equity, diversity and inclusion.</p>\n<p>For example, consider how you have been socialized and taught to recognize and value only the opinions of those with particular credentials, degrees and roles when it comes to health. As a result, we often fail to see the expertise within racialized communities and reproduce the harms of top-down systems that reinforce power imbalances. The process of unlearning requires reframing racialized communities as the experts, particularly when it comes to conversations and decisions about their health (Black Health Alliance, 2020).</p>\n\n","words":173},{"id":"s96","mod":3,"title":"Power, Privilege, and Allyship","html":"<h4 id=\"power-and-privilege-are-dynamic-and-constantly-changing-across-society.\">Power and privilege are dynamic and constantly changing across society.</h4>\n<h2 id=\"power\">Power</h2>\n<p>is a complex concept that describes the ability to act or not act in the context of a broader environment linked with control, relationships and outcomes. Power (or lack of power) can affect people's circumstances and health. For example, power can correspond to social inequalities that shape health inequities within populations; power, income and wealth lead to varying advantages within society. Power also influences and governs other aspects of life connected to health, such as housing, education and employment.</p>\n<h5 id=\"in-their-conceptual-framework-for-action-on-the-social-determinants-of-health-the-world-health-organization-identifies-four-types-of-power\">In their Conceptual Framework for Action on the Social Determinants of Health, the World Health Organization identifies four types of power:</h5>\n<h4 id=\"power-over\">Power over</h4>\n<blockquote>\n<p>Where some are able to influence or coerce others</p>\n</blockquote>\n<h4 id=\"power-to\">Power to</h4>\n<blockquote>\n<p>Where individuals are broadly able to organize and change existing hierarchies</p>\n</blockquote>\n<h4 id=\"power-with\">Power with</h4>\n<blockquote>\n<p>The collective power of communities or organizations</p>\n</blockquote>\n<h4 id=\"power-within\">Power within</h4>\n<blockquote>\n<p>Individual capacity to exercise power</p>\n<p>(WHO, 2010)</p>\n</blockquote>\n<h2 id=\"privilege\">Privilege</h2>\n<p>operates on personal, interpersonal, cultural and institutional levels. It gives advantages, access, favours and benefits to members of dominant groups at the expense of those who have been marginalized (Allies for Change, 2003).</p>\n<p>Privilege is characteristically described as being invisible to those in dominant groups. This is because the belief (or underlying assumption) is that much of what is enjoyed through privilege has been earned or is easily accessible to others. In fact, privilege is unearned and granted to people in dominant groups whether they want privileges or not and regardless of their stated intent. The absence of privilege often triggers more awareness than its presence. These privileges are granted and maintained through the intersections of many factors (e.g., race, gender, age, language, class, socioeconomic status) (Allies for Change, 2003).</p>\n<p>A similar concept is white privilege, which describes the personal privileges in everyday life, afforded specifically to white people that contribute to a racial privilege gap and racism.</p>\n<h5 id=\"across-society-the-depersonalization-of-white-privilege-e.g.-using-words-such-as-invisible-to-describe-it-collectively\">Across society, the depersonalization of white privilege (e.g., using words such as “invisible” to describe it) collectively:</h5>\n<ul>\n<li><p>Obscures the recognition of the painful effects of racism</p></li>\n<li><p>Diminishes personal responsibility that people should or can change their perceptions of racial privilege</p></li></ul>\n<h5 id=\"privilege-in-health-care-or-social-services-involves-merging-personal-and-institutional-privilege-and-power-which-leads-to\">Privilege in health care or social services involves merging personal and institutional privilege and power, which leads to:</h5>\n<ul>\n<li><p>Differential care experiences</p></li>\n<li><p>Poorer health outcomes</p></li>\n<li><p>More frequent experiences of discrimination for racialized and marginalized communities</p></li></ul>\n<p>Although tasked to serve all people, individuals of privilege most frequently occupy leadership positions in both settlement and health care. The system has the tendency to project values and provide
