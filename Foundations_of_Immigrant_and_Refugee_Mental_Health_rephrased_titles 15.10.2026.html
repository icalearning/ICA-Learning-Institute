es of mental health problems and illnesses. Studies have consistently found increased rates of PTSD, anxiety disorders, depression, somatic complaints, sleep problems and behavioural problems in refugee children (APA, 2019; Fazel &amp; Stein, 2002; National Child Traumatic Stress Network [NCTSN], 2005). PTSD in particular can be common among refugees in general (Caring for Kids New to Canada, 2018).</p>\n<p>Refugee children are often exposed to trauma-related experiences that have profound consequences, resulting in behavioural and mental health problems and illnesses. The most commonly reported traumas are traumatic loss, bereavement or separation, forced displacement, and community and domestic violence (Betancourt et al, 2012).</p>\n<h5 id=\"as-a-result-this-population-demonstrates-high-levels-of-behavioural-problems-in-a-range-of-settings-such-as\">As a result, this population demonstrates high levels of behavioural problems in a range of settings, such as:</h5>\n<ul>\n<li><p>At school (e.g., getting in trouble, suspension)</p></li>\n<li><p>At home (e.g., problems with parents and caregivers)</p></li>\n<li><p>In their community (e.g., breaking rules, fighting)</p></li></ul>\n<p>Although trauma-affected refugee youth experience high exposure to diverse types of trauma and behaviour problems, they tend to demonstrate less risk-taking behaviour, criminal activity, alcohol/drug use and self-harm (Betancourt et al, 2012).</p>\n<p>Complex trauma profiles, comorbid conditions and behavioural problems are important factors to consider in providing mental health services for refugee children and adolescents.</p>\n","words":958},{"id":"s43","mod":7,"title":"Early Adversity Before and During Migration","html":"<p>Refugee children are more likely than immigrant children to experience adversity in the pre-migration and migration periods, increasing their risk for mental health problems and illnesses post-migration. These pre-migration, migration and post-migration factors do not act in isolation; rather, they are closely intertwined, often interacting with one another (APA, 2010).</p>\n<p>During pre-migration, refugee children usually encounter interruptions to or the ending of their social and educational lives. The experience of armed conflict or organized violence has additional negative effects, including the breakdown of families and communities, the destruction of trust among people and the interruption of education and health services. All these effects are destabilizing to children's lives, creating stress and hardship that can increase their risk of developing mental health problems and illnesses. In turn, this affects their emotional, cognitive and social development (APA, 2010; Fazel &amp; Stein, 2002).</p>\n<p>In addition, in the process of migration, youth can become separated from parents and no longer have the buffer of physical, financial and emotional support from relatives. Unaccompanied children and youth, as well as those with unstable living conditions, are at an increased risk for mental health problems and illnesses (Kahn et al, 2020).</p>\n<p>Displaced children can also be exposed to peri-immigration traumatic experiences where they experience victimization and violence in transient spaces, such as in refugee camps or while being smuggled across borders or detained away from their families (Mares, 2021).</p>\n<p>Still, studies also reveal that many children coping with a history of exposure to war and political violence manage to have relatively good mental health (Betancourt, 2008; Rousseau et al., 2003). <strong>Even with a greater vulnerability to mental health problems and illnesses, refugee children demonstrate profound strength and resilience in their ability to overcome difficult situations and adapt to new environments</strong> (Ellis et al, 2019).</p>\n<p>Recognizing that children have different requirements from adult refugees when they are seeking refugee status, the Immigration &amp; Refugee Board (IRB) of Canada has issued Guidelines on Child Refugee Claimants.</p>\n<p><a href=\"https://irb.gc.ca/en/legal-policy/policies/Pages/chairperson-guideline.aspx\"><strong>For more information, visit the IRB Chairperson's Guidelines</strong></a></p>\n","words":335},{"id":"s44","mod":7,"title":"Life After Arrival: Social Determinants for Children","html":"<p>Differences in pre-migration and migration experiences may disproportionately affect refugees' vulnerability to mental health problems and illnesses. However, post-migration factors are fundamental in influencing the mental health of both immigrants and refugees.</p>\n<p>These determinants or risk factors affect the mental health of foreign-born children in Canada (Beiser et al., 2002). Variations in the rates of mental disorders among immigrant and refugee children reflect differences in exposure to these risk factors, many of which are social determinants, as discussed in Module 1.</p>\n<p>The way immigrant groups are welcomed into a country, whether they are considered permanent residents, and their access to education, training and initiatives fostering social inclusion (e.g., language classes and resettlement services) help promote mental health post-migration (MHCC, 2016).</p>\n<h5 id=\"research-shows-that-several-factors-influence-the-mental-health-of-newcomer-children-and-families-in-canada\">Research shows that several factors influence the mental health of newcomer children and families in Canada</h5>\n<ul>\n<li><p>Settlement-related stress</p></li>\n<li><p>Language or communication barriers</p></li>\n<li><p>Discrimination or exclusion</p></li>\n<li><p>Barriers to employment</p></li></ul>\n<p>(Hansson et al., 2010; Shakya et al., 2010)</p>\n<p>Although immigrant and refugee children are remarkably resilient—owing to other mediating factors such as less family dysfunction and fewer single-parent families—income can still have a negative effect (Pieloch et al, 2016). <strong>Children who were born outside of Canada are more than twice as likely as Canadian-born children to live in poverty.</strong> Low income can lead to other pressures such as housing issues or food insecurity. In addition, factors such as poverty can worsen the developmental challenges that children often experience at this life stage, such as low self-esteem, worry and sadness (Doi et al, 2019; Anisef &amp; Kilbride, 2008; Georgiades et al., 2007).</p>\n<p>Feelings of exclusion, social isolation and discrimination are other critical determinants affecting the developmental outcomes of immigrant and refugee children. These determinants, in turn, influence their eventual inclusion and participation in other social, economic and political settings in the host country (Oxman &amp; Choi, 2014).</p>\n<p>As discussed in the next section, variables such as age of migration, cultural identity, family support and perceived discrimination or exclusion contribute to newcomer children's mental health and well-being.</p>\n","words":333},{"id":"s45","mod":7,"title":"Risk and Protective Factors Affecting Children","html":"<p>Many factors can influence the mental health of newcomer children and youth, which are referred to as risk and protective factors for mental disorder. Evidence shows that as the number of risk factors increases, the likelihood that children will develop mental health problems significantly increases (APA, 2010). For example, the process of immigration and resettlement can result in stressors that contribute to depressive episodes in vulnerable populations (Caring for Kids New to Canada, 2016).</p>\n<h5 id=\"risk-factors-for-depression-in-young-newcomers-to-canada-include\">Risk factors for depression in young newcomers to Canada include:</h5>\n<ul>\n<li><p>Loss of family and friends to separation or death</p></li>\n<li><p>Parental difficulties speaking English or French</p></li>\n<li><p>Discrimination</p></li>\n<li><p>Poor home-school relationships</p></li>\n<li><p>Living in a poor-quality neighbourhood</p></li></ul>\n<p>Although immigrant and refugee children may encounter many risk factors potentially affecting their mental health, it is important to remember that many factors can also enhance their mental health. Newcomer children are incredibly resilient and many will not experience mental health problems. Some individual-level protective factors, such as coping strategies and cultural values and practices, are noted below. Other factors that can protect or enhance mental health include the family stability generally found in immigrant families i.e., intact, cohesive families), safe neighbourhoods and a large surrounding community of the same ethnicity.</p>\n<h2 id=\"individual-factors\">Individual factors</h2>\n<p>The sections below outline some of the major risk and protective factors for mental disorders in children. These factors can be seen as operating at the level of the individual child, family, school and/or community. These factors do not act in isolation; rather, they are closely intertwined, often interacting with one another (APA, 2010).</p>\n<h3 id=\"developmental-factors\">Developmental factors</h3>\n<ul>\n<li><p><strong>Infants and toddlers</strong></p></li>\n<li><p><strong>Young children</strong></p></li>\n<li><p><strong>School-aged children</strong></p></li>\n<li><p><strong>Older children and adolescents</strong></p></li>\n</ul>\n<h3 id=\"other-factors\">Other factors</h3>\n<ul>\n<li><p><strong>Age</strong></p></li>\n<li><p><strong>Pre-existing mental health problems</strong></p></li>\n<li><p><strong>Gender</strong></p></li>\n<li><p><strong>Adaptation and cultural identity</strong></p></li>\n<li><p><strong>Resilience and coping skills</strong></p></li>\n<li><p><strong>Language proficiency</strong></p></li>\n<li><p><strong>Physical health</strong></p></li>\n</ul>\n<h2 id=\"family-factors\">Family factors</h2>\n<p>A cohesive, intact family is one of the most important determinants of children's well-being. For young children, secure attachments to parents or caregivers are central to healthy development. Parents and caregivers play a critical role in acting as a secure base for children as they grow.</p>\n<p>A supportive and connected relationship with family members is associated with lower emotional distress (Hilario et al., 2014). In contrast, poor, non-supportive family relationships can act as a mental health risk factor for problems such as suicidal ideation (Smith et al., 2011).</p>\n<h4 id=\"a-number-of-factors-can-disrupt-patterns-of-healthy-attachment\">A number of factors can disrupt patterns of healthy attachment:</h4>\n<ul>\n<li><p>Forced displacement among refugee families and separation from caregivers can be highly stressful, in particular for young children. Separation from one or both parents can also deprive children of important role models. Parental traumatic experiences can lead to disrupted (i.e., disorganized) attachment relationships with their children, which can severely impair a child's attachment security. As a result, children are exposed to vulnerabilities and poor coping to mental distress.(Ee et al , 2016)</p></li>\n<li><p>Parents with symptoms of PTSD can be less emotionally available to their children, less sensitive and responsive, and more avoidant. These factors can have negative implications for children's behavioural problems.(Ee et al , 2016)</p></li>\n<li><p>The mental health of parents and other family members has a bearing on children's mental health. Stressors experienced by parents, such as unemployment, put considerable pressure on families and leave parents less able to care for their children appropriately, affecting newcomer children's mental health (Khanlou &amp; Crawford, 2006). Witnessing parents panic or show helplessness is also a risk factor for poor mental health outcomes for children.(Crowley, 2009)</p></li>\n<li><p>As children naturally tend to try to conform to a new environment, they may learn English and acculturate faster than their parents. This difference in the rate of adapting can lead to changes in family roles, which may cause a loss of parental authority and lead to intergenerational conflicts. In addition, cultural differences between parents and children may develop, becoming a stressor between them and affecting children's mental health.(Islam, 2015)</p></li>\n<li><p>Differing attitudes and behaviours toward maintaining the values and beliefs of the parents versus adopting of those of the host country can be a source of conflict between immigrant children and their parents, resulting in a loss of resilience for children.(Tardiff &amp; Geva, 2006)</p></li></ul>\n<h2 id=\"school-factors\">School factors</h2>\n<h5 id=\"gaps-in-formal-schooling-or-in-some-cases-the-lack-of-formal-schooling-can-create-challenges-for-newcomer-children-in-canadian-schools.\">Gaps in formal schooling, or in some cases the lack of formal schooling, can create challenges for newcomer children in Canadian schools.</h5>\n<p>This is especially the case for refugee children who may have had large gaps in their education during periods of violent conflict and/or forced displacement. In addition, limited literacy and numeracy in the first language can create difficulties in acquiring those skills post-migration.</p>\n<h2 id=\"community-factors\">Community factors</h2>\n<h5 id=\"in-the-post-migration-phase-the-level-of-acceptance-and-social-support-that-refugee-children-perceive-in-their-host-community-play-an-important-role-in-their-psychological-adjustment-and-well-being.\">In the post-migration phase, the level of acceptance and social support that refugee children perceive in their host community play an important role in their psychological adjustment and well-being.</h5>\n<p>Higher levels of social support are linked to fewer mental health problems, while lack of support is related to PTSD, depression and other mental health problems and illnesses (Betancourt &amp; Khan, 2008). Experiences of racism and discrimination pose additional risks to the mental health and well-being of refugee children and youth.</p>\n<p>Another risk factor is the lack of connection children may feel with members of their own ethnocultural communities. As discussed regarding adaptation and cultural identity, developing a “balanced” identity within multiple cultures may be beneficial; creating social connections or embracing cultural practices within an individual's own ethnic community can reinforce positive acculturation (Ontario Centre of Excellence for Child and Youth Mental Health [OCECYMH], 2015).</p>\n<p>Undergoing many changes in residence during post-migration can also be a risk factor as it can be destabilizing for children (OCECYMH, 2015).</p>\n<p>Protective factors at the community level are children's involvement in community activities, access to social and community resources, and participation in volunteer work and leadership roles within the community (OCECYMH, 2015).</p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"In the first months, many refugee families focus on immediate needs such as housing, work and schooling before dealing with past experiences.\"><h4>During the first few months after arrival to Canada, refugee families are often more focused on meeting their immediate needs and planning for the future than dealing with their past experiences.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n","words":982},{"id":"s46","mod":7,"title":"Distinguishing Distress from Mental Health Disorders in Refugee Children","html":"<p>Mental distress is a normal reaction to upsetting and stressful events. When distress is due to circumstances such as forced displacement and difficult living circumstances, it is not a mental disorder (Hassan, et al., 2015). It is important to differentiate mental distress from a mental disorder, or a level of distress that interferes with a child's or youth's daily activities.</p>\n<p>When differentiating between expected mental distress in response to a stressor and the possibility of a mental disorder, it is important to pay attention to the child's level of functioning in their significant relationships, school and play.</p>\n<p>The decision to refer to a mental health professional such as a psychiatrist is an important one. Not all refugee children and youth experiencing mental health problems or illnesses require this level of assessment and intervention. The warning signs below indicate that a child or youth might have a mental health condition requiring referral to a psychiatrist.</p>\n<h5 id=\"signs-of-potential-mental-health-problems-in-children-and-youth-include\">Signs of potential mental health problems in children and youth include:</h5>\n<ul>\n<li><p>Persisting anxiety or fear that interferes with daily functioning</p></li>\n<li><p>Frequent crying and weepiness</p></li>\n<li><p>Significant loss of interest in their usual activities</p></li>\n<li><p>Significant shifts in school performance</p></li>\n<li><p>Significant changes in energy level, sleep or eating habits</p></li></ul>\n<p>To avoid over-diagnosis in refugee populations, evidence of impaired social functioning and/or a high level or long duration of suffering are necessary for the diagnosis of mental disorders such as PTSD or depression (Pottie et al., 2016).</p>\n<h2 id=\"trauma\">Trauma</h2>\n<p>Immigrant and refugee children and youth have often experienced traumatic events. In the case of refugee children, these events may have occurred during times of war and forced displacement. The effects of traumatic experiences may manifest in a range of emotional, cognitive and behavioural symptoms that are different from those seen in adults.</p>\n<h4 id=\"these-may-include\">These may include:</h4>\n<h4 id=\"emotional-manifestations\">Emotional manifestations</h4>\n<blockquote>\n<p>Feelings of sadness, grief, fear, frustration, nervousness, anger, despair, boredom and irritability</p>\n</blockquote>\n<h4 id=\"cognitive-manifestations\">Cognitive manifestations</h4>\n<blockquote>\n<p>A sense of loss of control, helplessness, hopelessness, difficulty concentrating in school, intrusive thoughts and anxious or depressive ruminations</p>\n</blockquote>\n<h4 id=\"physical-manifestations\">Physical manifestations</h4>\n<blockquote>\n<p>Fatigue, problems sleeping, episodes of bedwetting, loss of appetite and medically-unexplained physical symptoms</p>\n</blockquote>\n<h4 id=\"behavioural-manifestations\">Behavioural manifestations</h4>\n<blockquote>\n<p>Social withdrawal, isolation from peers, disinterest in play, aggressive behaviour and interpersonal problems</p>\n</blockquote>\n<p>The child's developmental stage affects the way they understand and react to a traumatic event (NCTSN, 2005; Shakya et al., 2010). The most common trauma-related symptoms in children vary based on their age group, with considerable overlap existing between all age groups. The most notable symptoms are outlined below.</p>\n<ul>\n<li><p><strong>Younger children</strong></p></li>\n<li><p><strong>Older children</strong></p></li>\n<li><p><strong>Youth</strong></p></li>\n</ul>\n","words":418},{"id":"s47","mod":7,"title":"Supporting Children Through Schools, Families, and Communities","html":"<p>The lives of refugee and other newcomer children are often upended by organized violence and forced displacement. They need to restore their sense of emotional and physical safety and security, increase their self-confidence and positive coping skills, and rebuild their ability to trust.</p>\n<h5 id=\"helping-children-overcome-highly-stressful-experiences-involves-two-main-areas-of-focus\">Helping children overcome highly stressful experiences involves two main areas of focus:</h5>\n<ul>\n<li><p>Enhancing the factors that promote children's mental health and well-being.</p></li>\n<li><p>Providing appropriate help to those children who are experiencing severe mental health problems and illnesses to ensure a full recovery.</p>\n<p>(Fazel &amp; Stein, 2002)</p></li></ul>\n<h2 id=\"school-based-interventions\">School-based interventions</h2>\n<p>A positive school environment and support from peers can be protective factors for newcomer children (Ontario Centre of Excellence for Child and Youth Mental Health, 2015). Schools offer an effective framework for enhancing resilient behaviours and promoting child and youth mental health, and play an essential role in supporting children's mental health (Fazel &amp; Stein, 2002).</p>\n<h5 id=\"for-example-schools\">For example, schools:</h5>\n<ul>\n<li><p>Provide a place to learn and play</p></li>\n<li><p>Enhance resilient behaviours</p></li>\n<li><p>Facilitate social adaptation and peer relationships</p></li>\n<li><p>Provide a sense of identity</p></li></ul>\n<p>To meet the psychosocial needs of refugee children, programs should promote the expression of feelings, provide individual support and increase children's understanding of their past experiences (Rousseau &amp; Guzder, 2008). Schools also play a key role by serving both as mediators in helping children and youth adapt to their host country and as the main access point to prevention and treatment services for mental health problems and illnesses (Rousseau &amp; Guzder, 2008).</p>\n<p>Schools are well-positioned to provide mental health services for refugee children with emotional and behavioural problems. Countries with high proportions of immigrant and refugee children, such as the United Kingdom and the United States, effectively deliver secondary prevention group programs that aim to improve children's social and academic development, reduce stress and improve well-being. Such programs seem to be well-accepted among refugee parents (Rousseau &amp; Guzder, 2008).</p>\n<h2 id=\"family-based-interventions\">Family-based interventions</h2>\n<p>Promoting the psychosocial well-being of children includes providing support for their families, helping parents and other caregivers to meet the emotional and developmental needs of their children, as well as recognizing the parents' own needs. Appropriate support includes referring the parents, foster parents and/or other caregivers of children who have mental health problems and illnesses to specialized services.</p>\n<p>Since parental mental health influences the well-being of refugee children, interventions focusing on improving the emotional functioning of refugee parents and family members will have a positive effect on the mental health and well-being of children. Studies of family-based interventions for refugee families, however, are limited (APA, 2010).</p>\n<h2 id=\"community-based-interventions\">Community-based interventions</h2>\n<p>Given the fact that the majority of refugees come from countries with more “collective” orientations, the role of community is very important. Living in a cohesive community may have a protective effect on refugee mental health.</p>\n<p>Available evidence suggests that comprehensive, community-based interventions that facilitate personal and community growth help improve the mental health and well-being of refugee children and their families (Crowley, 2009). Child-friendly spaces that give children safe places to play, socialize, learn and express themselves are considered an important intervention for younger age groups (Alastair et al., 2013; Save the Children, 2008; UNICEF, 2009). Such spaces could include playgroups, community centres or other extracurricular activities.</p>\n<h3 id=\"promising-practice\">Promising practice</h3>\n<p>A community-based promising practice is the Dialectical Behaviour Therapy (DBT) group program. It allows youth aged 16-18 who are experiencing mental health difficulties to receive proper mental health services in a small group setting, allowing for facilitated accessibility and less financial burden. The program provides teaching and peer support in self-regulation and coping skills to help youth living with distress better manage these challenges.</p>\n<p>It is a collaboration among the Flemingdon/Thorncliffe Park community through, Health Access Thorncliffe Park and the Garry Hurvitz Centre for Community Mental Health.</p>\n<h2 id=\"promoting-mental-health\">Promoting mental health</h2>\n\n<h5 id=\"note-module-6-will-cover-general-strategies-on-mental-health-promotion.\">Note: Module 9 will cover general strategies on mental health promotion.</h5>\n<p>Interventions to promote the well-being of immigrant and refugee children should reduce the risk factors negatively affecting their mental health. These risk factors include structural discrimination and social exclusion or bullying, as well as social and contextual risk factors like poverty and limited literacy.</p>\n<h4 id=\"interventions-can-include\">Interventions can include:</h4>\n<h4 id=\"health-promotion\">Health promotion</h4>\n<blockquote>\n<p>Health promotion interventions are enhanced when they focus on multiple settings that influence children's well-being, including the home and the community.</p>\n</blockquote>\n<h4 id=\"school\">School</h4>\n<blockquote>\n<p>Schools, as part of the community, are key settings for intervention with children and youth. Interventions should also strengthen protective factors that are known to enhance children's mental health, including the facilitation of supportive environments, high-quality preschool education, safe play areas and meaningful extracurricular activities.</p>\n</blockquote>\n<h4 id=\"family\">Family</h4>\n<blockquote>\n<p>As family stressors have been shown to affect newcomer children's mental health, promoting the psychosocial well-being of children should include providing support for their families (Khanlou &amp; Crawford, 2006). This may involve helping parents meet their children's emotional and developmental needs, as well as helping parents recognize their own needs. Parents, foster parents or other caregivers of children who have mental health problems and illnesses may require referral to specialized services.</p>\n</blockquote>\n<p>By addressing resilience-challenging factors and applying resilience-promoting factors (i.e., protective or preventive factors), service providers can help mediate the challenges that immigrant and refugee children and youth face. At the same time, this population can build on their own strengths and resilience to ease the acculturation process (Khanlou &amp; Wray, 2014).</p>\n<p>With supportive families and communities, refugee children and other newcomer children affected by war or trauma will be supported in their healing and in becoming competent young adults.</p>\n<div class=\"wide\"><h2>Review question</h2><p>Choose True or False for each statement. You will see the explanation straight away.</p><div class=\"mcq\" data-fb=\"Even with greater vulnerability, refugee children show profound strength and resilience.\"><h4>Despite a greater vulnerability to mental health problems, refugee children demonstrate profound strength and resilience in their ability to overcome difficult situations and adaptation to new environments.</h4><button class=\"opt\" data-ok=\"1\">True</button><button class=\"opt\">False</button><div class=\"fb\"></div></div></div>\n\n\n\n\n\n\n\n","words":983},{"id":"s48","mod":7,"title":"Module Recap and Key Takeaways","html":"<p>Module 5 described the challenges immigrant and refugee children face in their settlement or resettlement in Canada, and how these challenges can affect their mental health. This module further emphasized how various factors can affect children's mental health and explored service considerations related to newcomers' needs, as well as potential interventions.</p>\n<p>Module 6 examines the mental health needs of other specific immigrant and refugee populations, such as older adults, survivors of torture, LGBTQ2S+ people and people with disabilities.</p>\n","words":84},{"id":"s49","mod":7,"title":"References and Further Reading","html":"<ul>\n<li><p>2019 APA Immigration and Refugee Policy Statement. 2019. American Psychological Association. https://www.apa.org/about/policy/immigration-refugee-policy.pdf</p></li>\n<li><p>A Practical Guide for Developing Child Friendly Spaces. 2009. In UNICEF. United Nations International Children’s Emergency Fund. https://resourcecentre.savethechildren.net/document/unicef-child-friendly-spaces-cfs-training-package/</p></li>\n<li><p>Ager, A., Metzler, J., Vojta, M., &amp; Savage, K. 2013. Child friendly spaces. Intervention, 112, 133–147. https://doi.org/10.1097/01.wtf.0000431120.01602.e2</p></li>\n<li><p>Anisef &amp; Kilbride 2008 - No references for the year 2008. Reference for a book written in 2003 below: Anisef, P., &amp; Kilbride, K. M. 2003. Managing Two Worlds: The Experiences and Concerns of Immigrant Youth in Ontario. Canadian Scholars Press.</p></li>\n<li><p>Beiser, M. 2010. The Mental Health of Immigrant and Refugee Children in Canada: A Description and Selected Findings from the New Canadian Children and Youth Study NCCYS. Canadian Issues, , 103-107. Retrieved from http://myaccess.library.utoronto.ca/login?qurl=https%3A%2F%2Fwww.proquest.com%2Fscholarly-journals%2Fmental-health-immigrant-refugee-children-canada%2Fdocview%2F763161578%2Fse-2%3Faccountid%3D14771</p></li>\n<li><p>Beiser, M., Hou, F., Hyman, I., &amp; Tousignant, M. 2002. Poverty, Family Process, and the Mental Health of Immigrant Children in Canada. American Journal of Public Health, 922, 220–227. https://doi.org/10.2105/ajph.92.2.220</p></li>\n<li><p>Betancourt, T. S., &amp; Khan, K. A. 2008. The mental health of children affected by armed conflict: Protective processes and pathways to resilience. International Review of Psychiatry, 203, 317–328. https://doi.org/10.1080/09540260802090363</p></li>\n<li><p>Betancourt, T. S., Newnham, E. A., Layne, C. M., Kim, S., Steinberg, A. M., Ellis, H. J., &amp; Birman, D. 2012. Trauma History and Psychopathology in War-Affected Refugee Children Referred for Trauma-Related Mental Health Services in the United States. Journal of Traumatic Stress, 256, 682–690. https://doi.org/10.1002/jts.21749</p></li>\n<li><p>Canadian Paediatric Society. (2003). Age limits and adolescents. Pediatrics &amp; Child Health. 8 (9) 577. Available: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2794325/.</p></li>\n<li><p>Caring for Kids New to Canada. (2016). Depression in Children and Youth. Available: https://www.kidsnewtocanada.ca/mental-health/depression.</p></li>\n<li><p>Child Friendly Spaces in Emergencies: A Handbook for Save the Children Staff. 2008. In Save the Children. Save the Children. https://resourcecentre.savethechildren.net/document/child-friendly-spaces-emergencies-handbook-save-children-staff/</p></li>\n<li><p>Citizenship and Immigration Canada (CIC). (2015). Facts and Figures 2014—Immigration overview: Permanent and temporary residents. Available: http://www.cic.gc.ca/english/resources/statistics/menu-fact.asp Accessed April 2018.</p></li>\n<li><p>Costigan, C. L., Koryzma, C., Hua, J. M., &amp; Chance, L. J. 2010. Ethnic identity, achievement, and psychological adjustment: Examining risk and resilience among youth from immigrant chinese families in canada. Cultural Diversity and Ethnic Minority Psychology, 162, 264-273. doi:https://doi.org/10.1037/a0017275</p></li>\n<li><p>Islam, F., Sultana, A., Qasim, S., Kozak, M., Tamim, H., &amp; Khanlou, N. 2021. “Children are going on a Different Path”: Youth Identity from the Bangladeshi Immigrant Parents’ Perspective. International Journal of Mental Health and Addiction, 191, 143–154. https://doi.org/10.1007/s11469-019-00148-4</p></li>\n<li><p>Crowley, C. 2009. The mental health needs of refugee children: A review of literature and implications for nurse practitioners. Journal of the American Academy of Nurse Practitioners, 216, 322–331. https:/
